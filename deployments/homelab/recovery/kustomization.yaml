apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../cluster
patches:
# Ceph and stateful stages carry homelab.fahrican.com/recovery=hold in
# cluster/waves/stages.yaml; they stay suspended until restored data is checked.
- target:
    group: kustomize.toolkit.fluxcd.io
    version: v1
    kind: Kustomization
    labelSelector: homelab.fahrican.com/recovery=hold
  patch: '[{"op":"add","path":"/spec/suspend","value":true}]'
- target:
    group: kustomize.toolkit.fluxcd.io
    version: v1
    kind: Kustomization
    name: flux-system
  patch: '[{"op": "replace", "path": "/spec/path", "value": "./deployments/homelab/recovery"}]'
