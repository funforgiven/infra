apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../cluster
patches:
# Ceph and stateful stages carry homelab.fahrican.com/recovery=hold in
# cluster/waves/stages.yaml. They are created suspended, and IfNotPresent keeps
# Flux from re-suspending a stage after an operator resumes it.
- target:
    group: kustomize.toolkit.fluxcd.io
    version: v1
    kind: Kustomization
    labelSelector: homelab.fahrican.com/recovery=hold
  patch: |
    apiVersion: kustomize.toolkit.fluxcd.io/v1
    kind: Kustomization
    metadata:
      name: held
      annotations:
        kustomize.toolkit.fluxcd.io/ssa: IfNotPresent
    spec:
      suspend: true
- target:
    group: kustomize.toolkit.fluxcd.io
    version: v1
    kind: Kustomization
    name: flux-system
  patch: '[{"op": "replace", "path": "/spec/path", "value": "./deployments/homelab/recovery"}]'
