apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../cluster
patches:
- target:
    group: kustomize.toolkit.fluxcd.io
    version: v1
    kind: Kustomization
    name: ceph|observability|identity-database|identity|unifi|home-automation|media|forge|matrix|factorio|valheim|netbird|netbird-operator|netbird-access|synthetic-monitoring
  patch: '[{"op":"add","path":"/spec/suspend","value":true}]'
- target:
    group: kustomize.toolkit.fluxcd.io
    version: v1
    kind: Kustomization
    name: flux-system
  patch: '[{"op": "replace", "path": "/spec/path", "value": "./deployments/homelab/recovery"}]'
