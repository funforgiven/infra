apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../cluster
patches:
- target:
    group: kustomize.toolkit.fluxcd.io
    version: v1
    kind: Kustomization
    name: ceph
  patch: '[{"op":"add","path":"/spec/suspend","value":true}]'
- target:
    group: kustomize.toolkit.fluxcd.io
    version: v1
    kind: Kustomization
    name: observability
  patch: '[{"op":"add","path":"/spec/suspend","value":true}]'
- target:
    group: kustomize.toolkit.fluxcd.io
    version: v1
