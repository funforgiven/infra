apiVersion: v1
kind: Namespace
metadata:
  name: undercloud-backup
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: etcd-backup
  namespace: undercloud-backup
spec:
  schedule: "17 */6 * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  suspend: false
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 900
      backoffLimit: 2
      ttlSecondsAfterFinished: 604800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: etcd-backup
            app.kubernetes.io/part-of: undercloud-recovery
        spec:
          automountServiceAccountToken: false
          restartPolicy: Never
          nodeSelector:
            node-role.kubernetes.io/control-plane: ""
          tolerations:
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
              effect: NoSchedule
          securityContext:
            fsGroup: 65532
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            - name: snapshot-and-encrypt
              image: ghcr.io/getsops/sops@sha256:72c9964902e93643d7f52e86a854ce3c088e0c8aa0c37ad7b2b74f8d8d591429
              command:
                - /bin/sh
                - -ec
              args:
                - |
                  umask 027
                  trap 'rm -f /snapshot/snapshot.db' EXIT HUP INT TERM
                  etcdctl version | grep -qx 'etcdctl version: 3.6.10'
                  etcdutl version | grep -qx 'etcdutl version: 3.6.10'
                  etcdctl \
                    --endpoints="https://${HOST_IP}:2379" \
                    --cacert=/etc/etcd/ca.pem \
                    --cert=/etc/etcd/admin.pem \
                    --key=/etc/etcd/admin-key.pem \
                    --dial-timeout=15s \
                    --command-timeout=5m \
                    snapshot save /snapshot/snapshot.db
                  etcdutl snapshot status \
                    --write-out=json \
                    /snapshot/snapshot.db
                  sops \
                    --config /dev/null \
                    encrypt \
                    --input-type binary \
                    --output-type binary \
                    --output /encrypted/snapshot.db.sops.json \
                    /snapshot/snapshot.db
                  chmod 0444 /encrypted/snapshot.db.sops.json
              env:
                - name: HOST_IP
                  valueFrom:
                    fieldRef:
                      fieldPath: status.hostIP
                - name: NODE_NAME
                  valueFrom:
                    fieldRef:
                      fieldPath: spec.nodeName
                - name: SOPS_AGE_RECIPIENTS
                  value: age1z0l8kk9mnr8arupzn7j0tu4kznqnup96jymeey5xkzggzne4df0qjcym75
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: "1"
                  memory: 1Gi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                readOnlyRootFilesystem: true
                runAsGroup: 0
                runAsNonRoot: false
                runAsUser: 0
              volumeMounts:
                - name: snapshot
                  mountPath: /snapshot
                - name: encrypted
                  mountPath: /encrypted
                - name: etcdctl
                  mountPath: /usr/local/bin/etcdctl
                  readOnly: true
                - name: etcdutl
                  mountPath: /usr/local/bin/etcdutl
                  readOnly: true
                - name: etcd-certs
                  mountPath: /etc/etcd/ca.pem
                  subPath: ca.pem
                  readOnly: true
                - name: etcd-certs
                  mountPath: /etc/etcd/admin.pem
                  subPathExpr: admin-$(NODE_NAME).pem
                  readOnly: true
                - name: etcd-certs
                  mountPath: /etc/etcd/admin-key.pem
                  subPathExpr: admin-$(NODE_NAME)-key.pem
                  readOnly: true
          containers:
            - name: upload
              image: public.ecr.aws/aws-cli/aws-cli@sha256:aaa7c2e17bace2c0cad977a85b64022248018148f7a936b44315afe2c61dfa91
              command:
                - /bin/sh
                - -ec
              args:
                - |
                  test -s /encrypted/snapshot.db.sops.json
                  ciphertext_sha256="$(sha256sum /encrypted/snapshot.db.sops.json | awk '{print $1}')"
                  exec aws s3api put-object \
                    --endpoint-url https://s3.us-west-004.backblazeb2.com \
                    --region us-west-004 \
                    --bucket fahrican-cloud-recovery \
                    --key undercloud/etcd/snapshot.db.sops.json \
                    --body /encrypted/snapshot.db.sops.json \
                    --content-type application/json \
                    --server-side-encryption AES256 \
                    --metadata "ciphertext-sha256=${ciphertext_sha256}" \
                    --no-cli-pager >/dev/null
              env:
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: b2-undercloud-backup-writer
                      key: AWS_ACCESS_KEY_ID
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: b2-undercloud-backup-writer
                      key: AWS_SECRET_ACCESS_KEY
                - name: AWS_CONFIG_FILE
                  value: /dev/null
                - name: AWS_SHARED_CREDENTIALS_FILE
                  value: /dev/null
                - name: AWS_EC2_METADATA_DISABLED
                  value: "true"
                - name: AWS_REQUEST_CHECKSUM_CALCULATION
                  value: when_required
                - name: AWS_RETRY_MODE
                  value: standard
                - name: AWS_MAX_ATTEMPTS
                  value: "5"
                - name: HOME
                  value: /tmp
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                readOnlyRootFilesystem: true
                runAsGroup: 65532
                runAsNonRoot: true
                runAsUser: 65532
              volumeMounts:
                - name: encrypted
                  mountPath: /encrypted
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: snapshot
              emptyDir:
                medium: Memory
                sizeLimit: 1Gi
            - name: encrypted
              emptyDir:
                sizeLimit: 1Gi
            - name: tmp
              emptyDir:
                sizeLimit: 64Mi
            - name: etcdctl
              hostPath:
                path: /usr/local/bin/etcdctl
                type: File
            - name: etcdutl
              hostPath:
                path: /usr/local/bin/etcdutl
                type: File
            - name: etcd-certs
              hostPath:
                path: /etc/ssl/etcd/ssl
                type: Directory
