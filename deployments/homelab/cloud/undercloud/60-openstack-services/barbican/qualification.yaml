apiVersion: batch/v1
kind: Job
metadata:
  name: barbican-public-qualification-v1
  namespace: openstack
spec:
  backoffLimit: 6
  completions: 3
  parallelism: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: barbican-public-qualification
    spec:
      automountServiceAccountToken: false
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      restartPolicy: Never
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: barbican-public-qualification
      securityContext:
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: qualify
          image: quay.io/airshipit/openstack-client:2026.1-ubuntu_noble@sha256:f38785f22b3b2c42ed28beacd927e194f4e14c2a721debe8d43e4752b7270676
          env:
            - name: HOME
              value: /tmp
          envFrom:
            - secretRef:
                name: nova-keystone-admin
          command:
            - /bin/sh
            - -ec
            - |
              name="wave63-${HOSTNAME}"
              href=""
              cleanup() {
                if [ -n "${href}" ]; then
                  openstack --os-interface public secret delete "${href}" || true
                fi
              }
              trap cleanup EXIT HUP INT TERM

              payload="$(head -c 32 /dev/urandom | base64 | tr -d '\n')"
              href="$(openstack --os-interface public secret store \
                --name "${name}" \
                --payload "${payload}" \
                --payload-content-type text/plain \
                -f value -c 'Secret href')"
              received="$(openstack --os-interface public secret get \
                "${href}" --payload -f value -c Payload)"
              test "${received}" = "${payload}"
              openstack --os-interface public secret delete "${href}"
              href=""
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
