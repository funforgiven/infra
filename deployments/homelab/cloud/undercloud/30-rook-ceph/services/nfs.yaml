apiVersion: batch/v1
kind: Job
metadata:
  name: rook-orchestrator-configure-v1
  namespace: rook-ceph
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rook-orchestrator-configure
        app.kubernetes.io/part-of: rook-ceph
    spec:
      serviceAccountName: rook-ceph-default
      restartPolicy: OnFailure
      securityContext:
        runAsGroup: 2016
        runAsNonRoot: true
        runAsUser: 2016
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: configure
          image: docker.io/rook/ceph@sha256:da3c5046074ddc01bd2d162f7da3c3098e2f117fa5093df827e55f7e35899add
          command:
            - /bin/bash
            - -ec
          args:
            - |
              /usr/local/bin/toolbox.sh --skip-watch
              ceph mgr module enable rook
              ceph orch set backend rook
              ceph orch status
          env:
            - name: HOME
              value: /tmp
            - name: ROOK_CEPH_USERNAME
              valueFrom:
                secretKeyRef:
                  name: rook-ceph-mon
                  key: ceph-username
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: ceph-config
              mountPath: /etc/ceph
            - name: mon-endpoints
              mountPath: /etc/rook
            - name: ceph-admin-secret
              mountPath: /var/lib/rook-ceph-mon
              readOnly: true
            - name: config-override
              mountPath: /etc/rook-config-override
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: ceph-admin-secret
          secret:
            secretName: rook-ceph-mon
            items:
              - key: ceph-secret
                path: secret.keyring
        - name: mon-endpoints
          configMap:
            name: rook-ceph-mon-endpoints
            items:
              - key: data
                path: mon-endpoints
        - name: config-override
          configMap:
            name: rook-config-override
            optional: true
        - name: ceph-config
          emptyDir:
            sizeLimit: 16Mi
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
---
apiVersion: ceph.rook.io/v1
kind: CephNFS
metadata:
  name: manila-nfs
  namespace: rook-ceph
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  server:
    active: 3
    logLevel: NIV_INFO
    placement:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app: rook-ceph-nfs
                ceph_nfs: manila-nfs
            topologyKey: kubernetes.io/hostname
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        memory: 2Gi
---
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: manila-nfs
  namespace: metallb-system
spec:
  addresses:
    - 10.21.33.129/32
  autoAssign: false
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: manila-nfs-vlan33
  namespace: metallb-system
spec:
  ipAddressPools:
    - manila-nfs
  interfaces:
    - br-manila
  nodeSelectors:
    - matchExpressions:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
---
apiVersion: v1
kind: Service
metadata:
  name: manila-nfs
  namespace: rook-ceph
  annotations:
    metallb.io/address-pool: manila-nfs
    metallb.io/loadBalancerIPs: 10.21.33.129
  labels:
    app.kubernetes.io/name: manila-nfs
    app.kubernetes.io/part-of: openstack
spec:
  type: LoadBalancer
  loadBalancerClass: metallb.io/metallb
  allocateLoadBalancerNodePorts: false
  externalTrafficPolicy: Local
  selector:
    app: rook-ceph-nfs
    ceph_nfs: manila-nfs
  ports:
    - name: nfs
      port: 2049
      targetPort: 2049
      protocol: TCP
