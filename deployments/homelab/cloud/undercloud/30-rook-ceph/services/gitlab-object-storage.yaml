apiVersion: ceph.rook.io/v1
kind: CephObjectStore
metadata:
  name: gitlab
  namespace: rook-ceph
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  metadataPool:
    failureDomain: host
    replicated:
      size: 3
      requireSafeReplicaSize: true
    parameters:
      min_size: '2'
      pg_autoscale_mode: 'on'
  dataPool:
    failureDomain: host
    replicated:
      size: 3
      requireSafeReplicaSize: true
    parameters:
      min_size: '2'
      pg_autoscale_mode: 'on'
  preservePoolsOnDelete: true
  gateway:
    port: 80
    instances: 2
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 1Gi
    placement:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            topologyKey: kubernetes.io/hostname
            labelSelector:
              matchLabels:
                rook_object_store: gitlab
---
apiVersion: ceph.rook.io/v1
kind: CephObjectStoreUser
metadata:
  name: gitlab
  namespace: rook-ceph
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  store: gitlab
  displayName: GitLab private object storage
  quotas:
    maxBuckets: 16
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gitlab-s3
  namespace: rook-ceph
spec:
  parentRefs:
  - name: private
    namespace: network-services
    sectionName: https
  hostnames:
  - gitlab-s3.cloud.fahrican.com
  rules:
  - backendRefs:
    - name: rook-ceph-rgw-gitlab
      port: 80
    timeouts:
      request: 0s
      backendRequest: 0s
