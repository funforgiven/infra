apiVersion: ceph.rook.io/v1
kind: CephCluster
metadata:
  name: rook-ceph
  namespace: rook-ceph
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  cephVersion:
    image: quay.io/ceph/ceph:v20.2.2@sha256:6b4b5ae33acd3d736eb26d2a19238bce71a22f9cfb99cca887ba6312d0957644
    allowUnsupported: false
  dataDirHostPath: /var/lib/rook
  skipUpgradeChecks: false
  continueUpgradeAfterChecksEvenIfNotHealthy: false
  upgradeOSDRequiresHealthyPGs: true
  waitTimeoutForHealthyOSDInMinutes: 10
  mon:
    count: 3
    allowMultiplePerNode: false
  mgr:
    count: 2
    allowMultiplePerNode: false
    modules:
      - name: rook
        enabled: true
  dashboard:
    enabled: false
  network:
    provider: host
    addressRanges:
      public:
        - 10.21.30.0/24
    connections:
      requireMsgr2: true
  resources:
    mon:
      requests:
        cpu: 200m
        memory: 1Gi
      limits:
        memory: 2Gi
    mgr:
      requests:
        cpu: 200m
        memory: 1Gi
      limits:
        memory: 2Gi
    osd:
      requests:
        cpu: 500m
        memory: 4Gi
      limits:
        memory: 6Gi
    prepareosd:
      requests:
        cpu: 100m
        memory: 512Mi
  removeOSDsIfOutAndSafeToRemove: false
  disruptionManagement:
    managePodBudgets: true
    osdMaintenanceTimeout: 30
  storage:
    useAllNodes: false
    useAllDevices: false
    config:
      osdsPerDevice: "1"
    nodes:
      - name: pecorino
        devices:
          - name: /dev/disk/by-path/pci-0000:02:00.0-nvme-1
          - name: /dev/disk/by-path/pci-0000:04:00.0-nvme-1
      - name: taleggio
        devices:
          - name: /dev/disk/by-path/pci-0000:02:00.0-nvme-1
          - name: /dev/disk/by-path/pci-0000:03:00.0-nvme-1
      - name: asiago
        devices:
          - name: /dev/disk/by-path/pci-0000:02:00.0-nvme-1
          - name: /dev/disk/by-path/pci-0000:10:00.0-nvme-1
