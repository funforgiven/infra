apiVersion: v1
kind: ConfigMap
metadata:
  name: magnum-capi-manila-values-v1
  namespace: openstack
data:
  transform.py: |
    import hashlib
    from pathlib import Path

    source = Path("/var/lib/openstack/lib/python3.12/site-packages/magnum_capi_helm/driver.py")
    target = Path("/patched/driver.py")
    content = source.read_bytes()
    expected = "3b628d200e29d422b09183d2a3089bd7cf1c25e76f4543a855bb29f9bcc5df1c"
    assert hashlib.sha256(content).hexdigest() == expected
    text = content.decode()

    packages = '            "etcd": self._get_etcd_config(cluster),'
    assert text.count(packages) == 1
    text = text.replace(
        packages,
        '            "additionalPackages": ["nfs-common"],\n' + packages,
    )

    # OVN needs up to 30 seconds to exclude a new, not-yet-ready API member.
    control_plane = (
        '            "controlPlane": {\n'
        '                "machineFlavor": cluster.master_flavor_id,\n'
        '                "machineCount": cluster.master_count,\n'
    )
    assert text.count(control_plane) == 1
    text = text.replace(
        control_plane,
        control_plane
        + '                "kubeadmConfigSpec": {\n'
        + '                    "preKubeadmCommands": ["sleep 40"],\n'
        + '                },\n',
    )

    cinder = (
        '                    "csiCinder": self._storageclass_definitions(\n'
        '                        context, cluster\n'
        '                    ),'
    )
    assert text.count(cinder) == 1
    manila = (
        '\n                    "csiManila": {\n'
        '                        "enabled": True,\n'
        '                        "chart": {\n'
        '                            "repo": "https://kubernetes.github.io/cloud-provider-openstack",\n'
        '                            "name": "openstack-manila-csi",\n'
        '                            "version": "2.35.0",\n'
        '                        },\n'
        '                        "values": {"fsGroupPolicy": "File"},\n'
        '                        "defaultStorageClass": {\n'
        '                            "enabled": True,\n'
        '                            "name": "manila-nfs",\n'
        '                            "provisioner": "nfs.manila.csi.openstack.org",\n'
        '                            "reclaimPolicy": "Delete",\n'
        '                            "allowVolumeExpansion": True,\n'
        '                            "volumeBindingMode": "WaitForFirstConsumer",\n'
        '                            "parameters": {"type": "default"},\n'
        '                        },\n'
        '                    },'
    )
    text = text.replace(cinder, cinder + manila)

    monitoring = '                "monitoring": {'
    assert text.count(monitoring) == 1
    nfs = (
        '                "custom": {\n'
        '                    "csi-nfs": {\n'
        '                        "kind": "HelmRelease",\n'
        '                        "spec": {\n'
        '                            "namespace": "openstack-system",\n'
        '                            "chart": {\n'
        '                                "repo": "https://raw.githubusercontent.com/kubernetes-csi/csi-driver-nfs/master/charts",\n'
        '                                "name": "csi-driver-nfs",\n'
        '                                "version": "4.13.4",\n'
        '                            },\n'
        '                            "values": {},\n'
        '                        },\n'
        '                    },\n'
        '                },\n'
    )
    target.write_text(text.replace(monitoring, nfs + monitoring))
