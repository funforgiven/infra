apiVersion: v1
kind: ServiceAccount
metadata:
  name: internal-coredns
  namespace: network-services
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: internal-coredns
  namespace: network-services
data:
  Corefile: |
    cloud.fahrican.com:53 {
        errors
        health :8080
        ready :8181
        prometheus :9153
        cache 30
        file /etc/coredns/cloud.fahrican.com.zone {
            reload 30s
        }
    }
  cloud.fahrican.com.zone: |
    $ORIGIN cloud.fahrican.com.
    $TTL 60
    @ IN SOA ns1.cloud.fahrican.com. hostmaster.cloud.fahrican.com. (
        2026080602 3600 600 86400 60
    )
    @   IN NS ns1.cloud.fahrican.com.
    ns1 IN A  10.21.20.129
    identity IN A 10.21.20.130
    image IN A 10.21.20.130
    volume IN A 10.21.20.130
    placement IN A 10.21.20.130
    compute IN A 10.21.20.130
    console IN A 10.21.20.130
    network IN A 10.21.20.130
    orchestration IN A 10.21.20.130
    cloudformation IN A 10.21.20.130
    load-balancer IN A 10.21.20.130
    share IN A 10.21.20.130
    key-manager IN A 10.21.20.130
    capi-management IN A 10.21.40.100
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: internal-coredns
  namespace: network-services
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: internal-coredns
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: internal-coredns
    spec:
      serviceAccountName: internal-coredns
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: internal-coredns
      containers:
        - name: coredns
          image: registry.k8s.io/coredns/coredns:v1.12.4@sha256:986f04c2e15e147d00bdd51e8c51bcef3644b13ff806be7d2ff1b261d6dfbae1
          args:
            - -conf
            - /etc/coredns/Corefile
          ports:
            - name: dns
              containerPort: 53
              protocol: UDP
            - name: dns-tcp
              containerPort: 53
              protocol: TCP
            - name: metrics
              containerPort: 9153
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              add:
                - NET_BIND_SERVICE
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /ready
              port: 8181
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 10
          volumeMounts:
            - name: configuration
              mountPath: /etc/coredns
              readOnly: true
      volumes:
        - name: configuration
          configMap:
            name: internal-coredns
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: internal-coredns
  namespace: network-services
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: internal-coredns
---
apiVersion: v1
kind: Service
metadata:
  name: internal-coredns
  namespace: network-services
  labels:
    app.kubernetes.io/name: internal-coredns
    infra.fahrican.com/l2-announcement: vlan20
    infra.fahrican.com/vip-purpose: internal-dns
  annotations:
    lbipam.cilium.io/ips: 10.21.20.129
spec:
  type: LoadBalancer
  loadBalancerClass: io.cilium/l2-announcer
  externalTrafficPolicy: Cluster
  selector:
    app.kubernetes.io/name: internal-coredns
  ports:
    - name: dns
      port: 53
      targetPort: dns
      protocol: UDP
    - name: dns-tcp
      port: 53
      targetPort: dns-tcp
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: internal-coredns-metrics
  namespace: network-services
  labels:
    app.kubernetes.io/name: internal-coredns
    monitoring.fahrican.com/target: internal-coredns
spec:
  selector:
    app.kubernetes.io/name: internal-coredns
  ports:
    - name: metrics
      port: 9153
      targetPort: metrics
      protocol: TCP
