apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: netbird-policy
  namespace: tofu-system
spec:
  interval: 10m
  url: https://github.com/funforgiven/infra.git
  ref:
    branch: main
---
apiVersion: infra.contrib.fluxcd.io/v1alpha2
kind: Terraform
metadata:
  name: netbird-policy
  namespace: tofu-system
spec:
  suspend: false
  interval: 10m
  approvePlan: auto
  path: ./components/cloud/services/netbird/tofu
  sourceRef:
    kind: GitRepository
    name: netbird-policy
  varsFrom:
    - kind: Secret
      name: netbird-policy-credentials
    - kind: Secret
      name: netbird-identity
  remediation:
    retries: 3
