  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 30m
  path: ./deployments/homelab/cloud/undercloud/72-management-uis
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  dependsOn:
    - name: wave50-identity
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: skyline
      namespace: openstack
    - apiVersion: apps/v1
      kind: Deployment
      name: skyline
      namespace: openstack
    - apiVersion: gateway.networking.k8s.io/v1
      kind: HTTPRoute
      name: skyline
      namespace: openstack
    - apiVersion: gateway.networking.k8s.io/v1
      kind: HTTPRoute
      name: grafana
      namespace: observability
  healthCheckExprs:
    - apiVersion: gateway.networking.k8s.io/v1
      kind: HTTPRoute
      current: >-
        has(status.parents) &&
        status.parents.exists(parent,
          parent.conditions.exists(condition,
            condition.type == 'Accepted' && condition.status == 'True' &&
            condition.observedGeneration == metadata.generation) &&
          parent.conditions.exists(condition,
            condition.type == 'ResolvedRefs' && condition.status == 'True' &&
            condition.observedGeneration == metadata.generation))
