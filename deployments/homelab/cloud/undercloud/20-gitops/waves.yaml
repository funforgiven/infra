apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: wave20-backup
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 15m
  path: ./deployments/homelab/cloud/undercloud/20-backup
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  healthChecks:
    - apiVersion: batch/v1
      kind: CronJob
      name: etcd-backup
      namespace: undercloud-backup
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: wave30-rook-operator
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 15m
  path: ./deployments/homelab/cloud/undercloud/30-rook-ceph/operator
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: wave20-backup
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: rook-ceph
      namespace: rook-ceph
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: ceph-csi-drivers
      namespace: rook-ceph
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: wave30-ceph-cluster
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 15m
  path: ./deployments/homelab/cloud/undercloud/30-rook-ceph/cluster
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: wave30-rook-operator
  healthChecks:
    - apiVersion: ceph.rook.io/v1
      kind: CephCluster
      name: rook-ceph
      namespace: rook-ceph
  healthCheckExprs:
    - apiVersion: ceph.rook.io/v1
      kind: CephCluster
      failed: >-
        has(status.ceph) && has(status.ceph.health) &&
        status.ceph.health == 'HEALTH_ERR'
      current: >-
        has(status.observedGeneration) &&
        status.observedGeneration == metadata.generation &&
        has(status.ceph) && has(status.ceph.health) &&
        status.ceph.health == 'HEALTH_OK'
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: wave30-ceph-services
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 15m
  path: ./deployments/homelab/cloud/undercloud/30-rook-ceph/services
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: wave30-ceph-cluster
  healthChecks:
    - apiVersion: ceph.rook.io/v1
      kind: CephBlockPool
      name: glance.images
      namespace: rook-ceph
    - apiVersion: ceph.rook.io/v1
      kind: CephBlockPool
      name: cinder.volumes
      namespace: rook-ceph
    - apiVersion: ceph.rook.io/v1
      kind: CephBlockPool
      name: vms
      namespace: rook-ceph
    - apiVersion: ceph.rook.io/v1
      kind: CephBlockPool
      name: cinder.backups
      namespace: rook-ceph
    - apiVersion: ceph.rook.io/v1
      kind: CephBlockPool
      name: undercloud
      namespace: rook-ceph
    - apiVersion: ceph.rook.io/v1
      kind: CephFilesystem
      name: manila-cephfs
      namespace: rook-ceph
  healthCheckExprs:
    - apiVersion: ceph.rook.io/v1
      kind: CephBlockPool
      current: >-
        has(status.observedGeneration) &&
        status.observedGeneration == metadata.generation &&
        has(status.phase) && status.phase == 'Ready'
    - apiVersion: ceph.rook.io/v1
      kind: CephFilesystem
      current: >-
        has(status.observedGeneration) &&
        status.observedGeneration == metadata.generation &&
        has(status.phase) && status.phase == 'Ready'
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: wave35-observability
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 20m
  path: ./deployments/homelab/cloud/undercloud/35-observability
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  dependsOn:
    - name: wave30-ceph-services
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: kube-prometheus-stack
      namespace: observability
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: loki
      namespace: observability
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: fluent-bit-collector
      namespace: observability
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: wave36-observability-integrations
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 10m
  path: ./deployments/homelab/cloud/undercloud/36-observability-integrations
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: wave35-observability
  healthChecks:
    - apiVersion: monitoring.coreos.com/v1
      kind: ServiceMonitor
      name: rook-ceph-mgr
      namespace: rook-ceph
    - apiVersion: monitoring.coreos.com/v1
      kind: ServiceMonitor
      name: rook-ceph-exporter
      namespace: rook-ceph
    - apiVersion: monitoring.coreos.com/v1
      kind: PrometheusRule
      name: ceph-alerts
      namespace: rook-ceph
  healthCheckExprs:
    - apiVersion: monitoring.coreos.com/v1
      kind: ServiceMonitor
      current: "true"
    - apiVersion: monitoring.coreos.com/v1
      kind: PrometheusRule
      current: "true"
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: wave37-service-network
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 10m
  path: ./deployments/homelab/cloud/undercloud/37-service-network
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: wave36-observability-integrations
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: internal-coredns
      namespace: network-services
    - apiVersion: v1
      kind: Service
      name: internal-coredns
      namespace: network-services
    - apiVersion: monitoring.coreos.com/v1
      kind: ServiceMonitor
      name: internal-coredns
      namespace: observability
    - apiVersion: monitoring.coreos.com/v1
      kind: PrometheusRule
      name: internal-coredns
      namespace: observability
  healthCheckExprs:
    - apiVersion: v1
      kind: Service
      failed: >-
        has(status.loadBalancer.ingress) &&
        size(status.loadBalancer.ingress) > 0 &&
        status.loadBalancer.ingress[0].ip != '10.21.20.129'
      current: >-
        has(status.loadBalancer.ingress) &&
        size(status.loadBalancer.ingress) == 1 &&
        status.loadBalancer.ingress[0].ip == '10.21.20.129'
    - apiVersion: monitoring.coreos.com/v1
      kind: ServiceMonitor
      current: "true"
    - apiVersion: monitoring.coreos.com/v1
      kind: PrometheusRule
      current: "true"
