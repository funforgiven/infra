    secretRef:
      name: sops-age
  dependsOn:
    - name: wave32-identity-controllers
  healthChecks:
    - apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      name: zitadel-postgres
      namespace: identity
  healthCheckExprs:
    - apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      failed: >-
        has(status.phase) && status.phase == 'Unrecoverable'
      current: >-
        has(status.conditions) &&
        status.conditions.exists(condition,
          condition.type == 'Ready' && condition.status == 'True') &&
        has(status.phase) && status.phase == 'Cluster in healthy state' &&
        has(status.readyInstances) && status.readyInstances == 3
