apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: wave38-private-gateway
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 10m
  path: ./deployments/homelab/cloud/undercloud/38-service-api-foundation/private-gateway
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: wave38-private-gateway-config
    - name: wave34-identity-qualification
  healthChecks:
    - apiVersion: gateway.networking.k8s.io/v1
      kind: Gateway
      name: private
      namespace: network-services
    - apiVersion: gateway.networking.k8s.io/v1
      kind: Gateway
      name: management
      namespace: network-services
    - apiVersion: cert-manager.io/v1
      kind: Certificate
      name: private-api
      namespace: network-services
    - apiVersion: cert-manager.io/v1
      kind: Certificate
      name: management
      namespace: network-services
  healthCheckExprs:
    - apiVersion: gateway.networking.k8s.io/v1
      kind: Gateway
      current: >-
        has(status.conditions) &&
        status.conditions.exists(condition,
          condition.type == 'Accepted' && condition.status == 'True' &&
          condition.observedGeneration == metadata.generation) &&
        status.conditions.exists(condition,
          condition.type == 'Programmed' && condition.status == 'True' &&
          condition.observedGeneration == metadata.generation) &&
        has(status.addresses) &&
        ((metadata.name == 'private' && status.addresses.exists(address,
          address.type == 'IPAddress' && address.value == '10.21.20.130')) ||
        (metadata.name == 'management' && status.addresses.exists(address,
          address.type == 'IPAddress' && address.value == '10.21.20.131')))
    - apiVersion: cert-manager.io/v1
      kind: Certificate
      current: >-
        has(status.conditions) &&
        status.conditions.exists(condition,
          condition.type == 'Ready' && condition.status == 'True' &&
          condition.observedGeneration == metadata.generation)
---
