apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: wave30-ceph-cluster
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 15m
  path: ./deployments/homelab/cloud/undercloud/30-rook-ceph/cluster
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: wave30-rook-operator
  healthChecks:
    - apiVersion: ceph.rook.io/v1
      kind: CephCluster
      name: rook-ceph
      namespace: rook-ceph
    - apiVersion: apps/v1
      kind: Deployment
      name: rook-ceph-tools
      namespace: rook-ceph
  healthCheckExprs:
    - apiVersion: ceph.rook.io/v1
      kind: CephCluster
      failed: >-
        has(status.ceph) && has(status.ceph.health) &&
        status.ceph.health == 'HEALTH_ERR'
      current: >-
        has(status.observedGeneration) &&
        status.observedGeneration == metadata.generation &&
        has(status.ceph) && has(status.ceph.health) &&
        status.ceph.health == 'HEALTH_OK'
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: wave30-ceph-services
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 15m
  path: ./deployments/homelab/cloud/undercloud/30-rook-ceph/services
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: wave30-ceph-cluster
  healthChecks:
    - apiVersion: ceph.rook.io/v1
      kind: CephBlockPool
      name: glance.images
      namespace: rook-ceph
    - apiVersion: ceph.rook.io/v1
      kind: CephBlockPool
      name: cinder.volumes
      namespace: rook-ceph
    - apiVersion: ceph.rook.io/v1
      kind: CephBlockPool
      name: vms
      namespace: rook-ceph
    - apiVersion: ceph.rook.io/v1
      kind: CephBlockPool
      name: cinder.backups
      namespace: rook-ceph
    - apiVersion: ceph.rook.io/v1
      kind: CephBlockPool
      name: undercloud
      namespace: rook-ceph
    - apiVersion: ceph.rook.io/v1
      kind: CephBlockPool
      name: builtin-nfs
      namespace: rook-ceph
    - apiVersion: ceph.rook.io/v1
      kind: CephFilesystem
      name: manila-cephfs
      namespace: rook-ceph
    - apiVersion: ceph.rook.io/v1
      kind: CephNFS
      name: manila-nfs
      namespace: rook-ceph
    - apiVersion: batch/v1
      kind: Job
      name: rook-orchestrator-configure-v1
      namespace: rook-ceph
    - apiVersion: v1
      kind: Service
      name: manila-nfs
      namespace: rook-ceph
  healthCheckExprs:
    - apiVersion: ceph.rook.io/v1
      kind: CephBlockPool
      current: >-
        has(status.observedGeneration) &&
        status.observedGeneration == metadata.generation &&
        has(status.phase) && status.phase == 'Ready'
    - apiVersion: ceph.rook.io/v1
      kind: CephFilesystem
      current: >-
        has(status.observedGeneration) &&
        status.observedGeneration == metadata.generation &&
        has(status.phase) && status.phase == 'Ready'
    - apiVersion: ceph.rook.io/v1
      kind: CephNFS
      current: >-
        has(status.observedGeneration) &&
        status.observedGeneration == metadata.generation &&
        has(status.phase) && status.phase == 'Ready'
    - apiVersion: v1
      kind: Service
      failed: >-
        has(status.loadBalancer.ingress) &&
        size(status.loadBalancer.ingress) > 0 &&
        status.loadBalancer.ingress[0].ip != '10.21.33.20'
      current: >-
        has(status.loadBalancer.ingress) &&
        size(status.loadBalancer.ingress) == 1 &&
        status.loadBalancer.ingress[0].ip == '10.21.33.20'
---
