apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: wave20-backup
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 15m
  path: ./deployments/homelab/cloud/undercloud/20-backup
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  healthChecks:
    - apiVersion: batch/v1
      kind: CronJob
      name: etcd-backup
      namespace: undercloud-backup
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: wave30-rook-operator
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 15m
  path: ./deployments/homelab/cloud/undercloud/30-rook-ceph/operator
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: wave20-backup
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: rook-ceph
      namespace: rook-ceph
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: ceph-csi-drivers
      namespace: rook-ceph
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: wave30-ceph-cluster
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 15m
  path: ./deployments/homelab/cloud/undercloud/30-rook-ceph/cluster
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: wave30-rook-operator
  healthChecks:
    - apiVersion: ceph.rook.io/v1
      kind: CephCluster
      name: rook-ceph
      namespace: rook-ceph
  healthCheckExprs:
    - apiVersion: ceph.rook.io/v1
      kind: CephCluster
      failed: >-
        has(status.ceph) && has(status.ceph.health) &&
        status.ceph.health == 'HEALTH_ERR'
      current: >-
        has(status.observedGeneration) &&
        status.observedGeneration == metadata.generation &&
        has(status.ceph) && has(status.ceph.health) &&
        status.ceph.health == 'HEALTH_OK'
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: wave30-ceph-services
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 15m
  path: ./deployments/homelab/cloud/undercloud/30-rook-ceph/services
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: wave30-ceph-cluster
  healthChecks:
    - apiVersion: ceph.rook.io/v1
      kind: CephBlockPool
      name: glance.images
      namespace: rook-ceph
    - apiVersion: ceph.rook.io/v1
      kind: CephBlockPool
      name: cinder.volumes
      namespace: rook-ceph
    - apiVersion: ceph.rook.io/v1
      kind: CephBlockPool
      name: vms
      namespace: rook-ceph
    - apiVersion: ceph.rook.io/v1
      kind: CephBlockPool
      name: cinder.backups
      namespace: rook-ceph
    - apiVersion: ceph.rook.io/v1
      kind: CephBlockPool
      name: undercloud
      namespace: rook-ceph
    - apiVersion: ceph.rook.io/v1
      kind: CephFilesystem
      name: manila-cephfs
      namespace: rook-ceph
  healthCheckExprs:
    - apiVersion: ceph.rook.io/v1
      kind: CephBlockPool
      current: >-
        has(status.observedGeneration) &&
        status.observedGeneration == metadata.generation &&
        has(status.phase) && status.phase == 'Ready'
    - apiVersion: ceph.rook.io/v1
      kind: CephFilesystem
      current: >-
        has(status.observedGeneration) &&
        status.observedGeneration == metadata.generation &&
        has(status.phase) && status.phase == 'Ready'
