apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: zitadel-login
  namespace: identity
spec:
  parentRefs:
    - name: management
      namespace: network-services
      sectionName: https
  hostnames:
    - auth.cloud.fahrican.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /ui/v2/login
      backendRefs:
        - name: zitadel-login
          port: 3000
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: zitadel
  namespace: identity
spec:
  parentRefs:
    - name: management
      namespace: network-services
      sectionName: https
  hostnames:
    - auth.cloud.fahrican.com
  rules:
    - backendRefs:
        - name: zitadel
          port: 8080
