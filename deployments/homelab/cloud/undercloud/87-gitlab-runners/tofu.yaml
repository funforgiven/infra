apiVersion: infra.contrib.fluxcd.io/v1alpha2
kind: Terraform
metadata:
  name: gitlab-runners
  namespace: openstack
spec:
  interval: 10m
  retryInterval: 1m
  approvePlan: auto
  destroyResourcesOnDeletion: false
  path: ./components/cloud/services/gitlab/runners-tofu
  sourceRef:
    kind: GitRepository
    name: services-tofu-source
  varsFrom:
    - kind: ConfigMap
      name: gitlab-runner-image-promotion
      varsKeys: [image_revision, windows_image_name]
  runnerPodTemplate:
    spec:
      envFrom:
        - secretRef:
            name: magnum-keystone-admin
  writeOutputsToSecret:
    name: gitlab-runner-infrastructure-outputs
  remediation:
    retries: 3
