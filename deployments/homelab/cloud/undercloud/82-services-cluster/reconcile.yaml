apiVersion: v1
kind: ConfigMap
metadata:
  name: services-cluster-reconcile-v1
  namespace: openstack
data:
  signing-key.pub: |
    ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIL1nHHxNA1YUl+89HhieA+YOyOLYJaSRBmutEOVxVQeB github-funforgiven-2026-07-18
  reconcile-resend.py: |
    #!/usr/bin/env python3
    import json
    import pathlib
    import re
    import sys
    import time
    import urllib.error
    import urllib.request

    api_base = "https://api.resend.com"
    domain_name = "fahrican.com"
    token = pathlib.Path(sys.argv[1]).read_text(encoding="utf-8").strip()
    output_path = pathlib.Path(sys.argv[2])
    records_path = pathlib.Path(sys.argv[3])
    if not re.fullmatch(r"re_[A-Za-z0-9_-]{20,}", token):
        raise SystemExit("Resend administration key does not match the required format")

    def request(method, path, payload=None):
        body = None if payload is None else json.dumps(payload).encode()
        for attempt in range(5):
            api_request = urllib.request.Request(
                api_base + path,
                data=body,
                method=method,
                headers={
                    "Authorization": "Bearer " + token,
                    "Content-Type": "application/json",
                    "User-Agent": "fahrican-infra-resend-reconciler/1.0",
                },
            )
            try:
                with urllib.request.urlopen(api_request, timeout=30) as response:
                    return json.load(response)
            except urllib.error.HTTPError as error:
                retryable = error.code == 429 or error.code >= 500
                if not retryable or attempt == 4:
                    raise SystemExit(
                        f"Resend API {method} {path} returned HTTP {error.code}"
                    ) from None
                time.sleep(2**attempt)

    domains = request("GET", "/domains")
    matches = [item for item in domains.get("data", []) if item.get("name") == domain_name]
    if len(matches) > 1:
        raise SystemExit("More than one Resend domain matches fahrican.com")
    if matches:
        domain_id = matches[0]["id"]
    else:
        created = request(
            "POST",
            "/domains",
            {
                "name": domain_name,
                "region": "eu-west-1",
                "tls": "enforced",
                "capabilities": {"sending": "enabled", "receiving": "disabled"},
            },
        )
        domain_id = created["id"]

    if not re.fullmatch(r"[0-9a-f-]{36}", domain_id):
        raise SystemExit("Resend returned an invalid domain identifier")
    request(
        "PATCH",
        f"/domains/{domain_id}",
        {"open_tracking": False, "click_tracking": False, "tls": "enforced"},
    )
    request("POST", f"/domains/{domain_id}/verify")
    domain = request("GET", f"/domains/{domain_id}")
    if domain.get("name") != domain_name:
        raise SystemExit("Resend returned an unexpected domain")

    records = domain.get("records")
    if not isinstance(records, list) or not records:
        raise SystemExit("Resend returned no DNS verification records")
    for record in records:
        if record.get("type") not in {"CNAME", "MX", "TXT"}:
            raise SystemExit("Resend returned an unsupported DNS record type")
        if not all(isinstance(record.get(key), str) and record[key] for key in ("name", "value")):
            raise SystemExit("Resend returned an incomplete DNS record")

    public_output = {
        "domain_id": domain_id,
        "name": domain_name,
        "region": domain.get("region"),
        "status": domain.get("status"),
        "records": records,
    }
    output_path.write_text(json.dumps(public_output, sort_keys=True), encoding="utf-8")
    records_path.write_text(json.dumps(records, sort_keys=True), encoding="utf-8")
  sync.yaml: |
    apiVersion: source.toolkit.fluxcd.io/v1
    kind: GitRepository
    metadata:
      name: flux-system
      namespace: flux-system
    spec:
      interval: 5m
      url: https://github.com/funforgiven/infra.git
      ref:
        branch: main
      verify:
        mode: HEAD
        secretRef:
          name: flux-system-signing-key
    ---
    apiVersion: kustomize.toolkit.fluxcd.io/v1
    kind: Kustomization
    metadata:
      name: flux-system
      namespace: flux-system
    spec:
      interval: 10m
      retryInterval: 1m
      timeout: 20m
      path: ./deployments/homelab/cloud/services
      prune: true
      sourceRef:
        kind: GitRepository
        name: flux-system
      decryption:
        provider: sops
        secretRef:
          name: sops-age
  reconcile.sh: |
    #!/bin/sh
    set -eu

    cluster=services-v1
    template=services-kubernetes-v1.36.2-v1
    undercloud_kubeconfig=/tmp/undercloud-kubeconfig
    kubeconfig=/tmp/kube/config
    kubectl=/tmp/bin/kubectl
    flux=/tmp/bin/flux

    require_file() {
      path="/runtime-bootstrap/$1"
      pattern="$2"
      minimum="$3"
      maximum="$4"

      test -r "$path"
      length="$(wc -c < "$path" | tr -d ' ')"
      test "$length" -ge "$minimum"
      test "$length" -le "$maximum"
      LC_ALL=C grep -Eq "$pattern" "$path"
    }

    require_file INFRA_TELEGRAM_BOT_TOKEN '^[0-9]+:[A-Za-z0-9_-]+$' 32 256
    require_file INFRA_TELEGRAM_CHAT_ID '^-?[0-9]+$' 1 32
    require_file B2_APPLICATION_KEY_ID '^[A-Za-z0-9]+$' 12 64
    require_file B2_APPLICATION_KEY '^[A-Za-z0-9/+_-]+={0,2}$' 20 128
    require_file ND_LASTFM_APIKEY '^[A-Za-z0-9_-]+$' 16 256
    require_file ND_LASTFM_SECRET '^[A-Za-z0-9_-]+$' 16 256
    require_file ND_PASSWORDENCRYPTIONKEY '^[A-Za-z0-9_-]+$' 32 256
    require_file SFTPGO_ADMIN_PASSWORD '^[A-Za-z0-9_-]+$' 32 256
    require_file SFTPGO_USER_PASSWORD '^[A-Za-z0-9_-]+$' 32 256
    require_file HCLOUD_TOKEN '^[A-Za-z0-9._-]+$' 32 512
    require_file MAIL_MANAGEMENT_CIDRS_JSON '^\[[^]]+\]$' 9 1024
    require_file RESEND_ADMIN_API_KEY '^re_[A-Za-z0-9_-]+$' 23 512

    export OS_PROJECT_NAME=services
    export OS_PROJECT_DOMAIN_NAME=Default
    unset OS_PROJECT_ID OS_TENANT_ID OS_TENANT_NAME || true

    project_id="$(openstack project show services -f value -c id)"
    openstack token issue -f value -c project_id | grep -Fx "$project_id" >/dev/null

    if ! openstack coe cluster template show "$template" >/dev/null 2>&1; then
      openstack coe cluster template create "$template" \
        --coe kubernetes \
        --image ubuntu-jammy-kube-v1.36.2-260705-1940 \
        --external-network public \
        --fixed-network services \
        --fixed-subnet services-v4 \
        --network-driver calico \
        --volume-driver cinder \
        --flavor services.worker \
        --master-flavor services.master \
        --dns-nameserver 10.21.40.1 \
        --master-lb-enabled \
        --floating-ip-enabled \
        --labels capi_helm_chart_version=0.27.0
    fi

    if ! openstack coe cluster show "$cluster" >/dev/null 2>&1; then
      openstack coe cluster create "$cluster" \
        --cluster-template "$template" \
        --master-count 3 \
        --node-count 2 \
        --timeout 90
    fi

    for attempt in $(seq 1 720); do
      status="$(openstack coe cluster show "$cluster" -f value -c status)"
      case "$status" in
        CREATE_COMPLETE|UPDATE_COMPLETE) break ;;
        *_FAILED)
          echo "$cluster entered terminal status $status" >&2
          exit 1
          ;;
      esac
      test "$attempt" -lt 720
      sleep 10
    done

    test "$(openstack coe cluster show "$cluster" -f value -c master_count)" -eq 3
    node_count="$(openstack coe cluster show "$cluster" -f value -c node_count)"
    if test "$node_count" -lt 2; then
      openstack coe cluster resize "$cluster" 2
    elif test "$node_count" -gt 2; then
      echo "$cluster has $node_count workers; refusing a destructive scale-down" >&2
      exit 1
    fi

    mkdir -p /tmp/bin /tmp/kube
    curl -fsSL -o "$kubectl" \
      https://dl.k8s.io/release/v1.36.2/bin/linux/amd64/kubectl
    printf '%s  %s\n' \
      1e9045ec32bea85da43de85f0065358529ea7c7a152eca78154fba5b58c27d82 \
      "$kubectl" | sha256sum -c -
    chmod 0500 "$kubectl"

    curl -fsSL -o /tmp/flux.tar.gz \
      https://github.com/fluxcd/flux2/releases/download/v2.9.3/flux_2.9.3_linux_amd64.tar.gz
    printf '%s  %s\n' \
      eae4e8608c0ade2bf4e8dec1669dbb6b0c28b5822b252d97feccfb4fb1181fd2 \
      /tmp/flux.tar.gz | sha256sum -c -
    tar -xzf /tmp/flux.tar.gz -C /tmp/bin flux
    chmod 0500 "$flux"

    service_account=/var/run/secrets/kubernetes.io/serviceaccount
    service_account_token="$(cat "$service_account/token")"
    {
      printf '%s\n' \
        'apiVersion: v1' \
        'kind: Config' \
        'clusters:' \
        '- name: undercloud' \
        '  cluster:' \
        "    certificate-authority: $service_account/ca.crt" \
        "    server: https://$KUBERNETES_SERVICE_HOST:$KUBERNETES_SERVICE_PORT_HTTPS" \
        'contexts:' \
        '- name: undercloud' \
        '  context:' \
        '    cluster: undercloud' \
        '    user: services-cluster-reconcile' \
        'current-context: undercloud' \
        'users:' \
        '- name: services-cluster-reconcile' \
        '  user:'
      printf '    token: %s\n' "$service_account_token"
    } > "$undercloud_kubeconfig"
    chmod 0600 "$undercloud_kubeconfig"
    unset service_account_token

    KUBECONFIG="$undercloud_kubeconfig" \
      "$kubectl" -n cert-manager get secret cloudflare-dns01 \
      -o jsonpath='{.data.api-token}' | \
      base64 -d > /tmp/cloudflare-api-token
    for key in bucket_name endpoint region prefix; do
      KUBECONFIG="$undercloud_kubeconfig" \
        "$kubectl" -n openstack get configmap services-backup-destination \
        -o "jsonpath={.data.$key}" > "/tmp/$key"
    done

    grep -Fx fahrican-cloud-recovery /tmp/bucket_name >/dev/null
    grep -Fx https://s3.us-west-004.backblazeb2.com /tmp/endpoint >/dev/null
    grep -Fx us-west-004 /tmp/region >/dev/null
    grep -Fx services/kubernetes /tmp/prefix >/dev/null

    /config/reconcile-resend.py \
      /runtime-bootstrap/RESEND_ADMIN_API_KEY \
      /tmp/resend-domain.json \
      /tmp/resend-records.json
    KUBECONFIG="$undercloud_kubeconfig" \
      "$kubectl" -n openstack create secret generic resend-domain-outputs \
      --from-file=domain.json=/tmp/resend-domain.json \
      --dry-run=client -o yaml | \
      KUBECONFIG="$undercloud_kubeconfig" \
        "$kubectl" -n openstack apply -f -

    KUBECONFIG="$undercloud_kubeconfig" \
      "$kubectl" -n openstack create secret generic mail-edge-tofu-inputs \
      --from-file=management_cidrs_json=/runtime-bootstrap/MAIL_MANAGEMENT_CIDRS_JSON \
      --dry-run=client -o yaml | \
      KUBECONFIG="$undercloud_kubeconfig" \
        "$kubectl" -n openstack apply -f -

    if KUBECONFIG="$undercloud_kubeconfig" \
      "$kubectl" -n openstack get secret mail-edge-outputs >/dev/null 2>&1; then
      KUBECONFIG="$undercloud_kubeconfig" \
        "$kubectl" -n openstack get secret mail-edge-outputs \
        -o jsonpath='{.data.ipv4_address}' | base64 -d > /tmp/mail_ipv4_address
      grep -Eq '^([0-9]{1,3}\.){3}[0-9]{1,3}$' /tmp/mail_ipv4_address
      KUBECONFIG="$undercloud_kubeconfig" \
        "$kubectl" -n cert-manager create secret generic service-dns-inputs \
        --from-file=mail_ipv4_address=/tmp/mail_ipv4_address \
        --from-file=resend_records_json=/tmp/resend-records.json \
        --dry-run=client -o yaml | \
        KUBECONFIG="$undercloud_kubeconfig" \
          "$kubectl" -n cert-manager apply -f -
    else
      KUBECONFIG="$undercloud_kubeconfig" \
        "$kubectl" -n cert-manager create secret generic service-dns-inputs \
        --from-file=resend_records_json=/tmp/resend-records.json \
        --dry-run=client -o yaml | \
        KUBECONFIG="$undercloud_kubeconfig" \
          "$kubectl" -n cert-manager apply -f -
    fi

    openstack coe cluster config "$cluster" --dir /tmp/kube --force
    export KUBECONFIG="$kubeconfig"

    for attempt in $(seq 1 240); do
      nodes="$($kubectl get nodes --no-headers 2>/dev/null || true)"
      total="$(printf '%s\n' "$nodes" | awk 'NF { count++ } END { print count + 0 }')"
      ready="$(printf '%s\n' "$nodes" | awk '$2 == "Ready" { count++ } END { print count + 0 }')"
      if test "$total" -eq 5 && test "$ready" -eq 5; then
        break
      fi
      test "$attempt" -lt 240
      sleep 5
    done

    "$flux" install --namespace=flux-system
    "$kubectl" -n flux-system create secret generic sops-age \
      --from-file=age.agekey=/bootstrap/age.agekey \
      --dry-run=client -o yaml | "$kubectl" apply -f -
    "$kubectl" -n flux-system create secret generic flux-system-signing-key \
      --from-file=trusted-signing-key.sshpub=/config/signing-key.pub \
      --dry-run=client -o yaml | "$kubectl" apply -f -
    "$kubectl" create namespace cert-manager \
      --dry-run=client -o yaml | "$kubectl" apply -f -
    "$kubectl" -n cert-manager create secret generic cloudflare-dns01 \
      --from-file=api-token=/tmp/cloudflare-api-token \
      --dry-run=client -o yaml | "$kubectl" apply -f -
    "$kubectl" create namespace media \
      --dry-run=client -o yaml | "$kubectl" apply -f -
    "$kubectl" create namespace services-observability \
      --dry-run=client -o yaml | "$kubectl" apply -f -
    "$kubectl" create namespace velero \
      --dry-run=client -o yaml | "$kubectl" apply -f -
    "$kubectl" -n services-observability create secret generic infrastructure-telegram \
      --from-file=bot-token=/runtime-bootstrap/INFRA_TELEGRAM_BOT_TOKEN \
      --dry-run=client -o yaml | "$kubectl" apply -f -
    infra_chat_id="$(cat /runtime-bootstrap/INFRA_TELEGRAM_CHAT_ID)"
    {
      printf '%s\n' \
        'alertmanager:' \
        '  config:' \
        '    global:' \
        '      resolve_timeout: 5m' \
        '    route:' \
        '      receiver: infrastructure-telegram' \
        '      group_by: [alertname, namespace, severity]' \
        '      group_wait: 30s' \
        '      group_interval: 5m' \
        '      repeat_interval: 6h' \
        '      routes:' \
        '        - receiver: "null"' \
        '          matchers:' \
        '            - alertname = "Watchdog"' \
        '    receivers:' \
        '      - name: "null"' \
        '      - name: infrastructure-telegram' \
        '        telegram_configs:' \
        '          - bot_token_file: /etc/alertmanager/secrets/infrastructure-telegram/bot-token'
      printf '            chat_id: %s\n' "$infra_chat_id"
      printf '%s\n' \
        '            send_resolved: true' \
        '            parse_mode: HTML'
    } > /tmp/alertmanager-values.yaml
    unset infra_chat_id
    "$kubectl" -n services-observability create secret generic alertmanager-runtime-values \
      --from-file=values.yaml=/tmp/alertmanager-values.yaml \
      --dry-run=client -o yaml | "$kubectl" apply -f -

    b2_application_key_id="$(cat /runtime-bootstrap/B2_APPLICATION_KEY_ID)"
    b2_application_key="$(cat /runtime-bootstrap/B2_APPLICATION_KEY)"
    {
      printf '%s\n' '[default]'
      printf 'aws_access_key_id=%s\n' "$b2_application_key_id"
      printf 'aws_secret_access_key=%s\n' "$b2_application_key"
    } > /tmp/velero-cloud
    chmod 0600 /tmp/velero-cloud
    unset b2_application_key_id b2_application_key
    "$kubectl" -n velero create secret generic velero-object-storage \
      --from-file=cloud=/tmp/velero-cloud \
      --dry-run=client -o yaml | "$kubectl" apply -f -
    bucket_name="$(cat /tmp/bucket_name)"
    endpoint="$(cat /tmp/endpoint)"
    region="$(cat /tmp/region)"
    prefix="$(cat /tmp/prefix)"
    {
      printf '%s\n' \
        'configuration:' \
        '  backupStorageLocation:' \
        '    - name: default' \
        '      provider: aws'
      printf '      bucket: %s\n' "$bucket_name"
      printf '      prefix: %s\n' "$prefix"
      printf '%s\n' \
        '      default: true' \
        '      accessMode: ReadWrite' \
        '      credential:' \
        '        name: velero-object-storage' \
        '        key: cloud' \
        '      config:'
      printf '        region: %s\n' "$region"
      printf '%s\n' \
        '        checksumAlgorithm: ""' \
        '        s3ForcePathStyle: "true"'
      printf '        s3Url: %s\n' "$endpoint"
    } > /tmp/velero-values.yaml
    unset bucket_name endpoint region prefix
    "$kubectl" -n velero create configmap velero-runtime-values \
      --from-file=values.yaml=/tmp/velero-values.yaml \
      --dry-run=client -o yaml | "$kubectl" apply -f -

    "$kubectl" -n media create secret generic media-runtime \
      --from-file=ND_LASTFM_APIKEY=/runtime-bootstrap/ND_LASTFM_APIKEY \
      --from-file=ND_LASTFM_SECRET=/runtime-bootstrap/ND_LASTFM_SECRET \
      --from-file=ND_PASSWORDENCRYPTIONKEY=/runtime-bootstrap/ND_PASSWORDENCRYPTIONKEY \
      --from-file=SFTPGO_ADMIN_PASSWORD=/runtime-bootstrap/SFTPGO_ADMIN_PASSWORD \
      --from-file=SFTPGO_USER_PASSWORD=/runtime-bootstrap/SFTPGO_USER_PASSWORD \
      --dry-run=client -o yaml | "$kubectl" apply -f -
    "$kubectl" apply -f /config/sync.yaml
    "$flux" reconcile source git flux-system --timeout=5m
    "$flux" reconcile kustomization flux-system --with-source --timeout=20m

    test "$($kubectl get nodes --no-headers | wc -l)" -eq 5
    echo "$cluster is ready and reconciled from signed Git"
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: services-cluster-reconcile-v1
  namespace: openstack
spec:
  schedule: "17 */2 * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 9000
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: services-cluster-reconcile
            app.kubernetes.io/part-of: self-hosted-platform
        spec:
          automountServiceAccountToken: true
          serviceAccountName: services-cluster-reconcile
          restartPolicy: Never
          nodeSelector:
            openstack-control-plane: enabled
          securityContext:
            fsGroup: 65532
            fsGroupChangePolicy: OnRootMismatch
            runAsGroup: 65532
            runAsNonRoot: true
            runAsUser: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: reconcile
              image: quay.io/airshipit/openstack-client:2026.1-ubuntu_noble@sha256:f38785f22b3b2c42ed28beacd927e194f4e14c2a721debe8d43e4752b7270676
              command:
                - /config/reconcile.sh
              envFrom:
                - secretRef:
                    name: magnum-keystone-admin
              env:
                - name: HOME
                  value: /tmp
                - name: SHELL
                  value: /bin/sh
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: "1"
                  memory: 768Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                readOnlyRootFilesystem: true
              volumeMounts:
                - name: bootstrap
                  mountPath: /bootstrap
                  readOnly: true
                - name: config
                  mountPath: /config
                  readOnly: true
                - name: runtime-bootstrap
                  mountPath: /runtime-bootstrap
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: bootstrap
              secret:
                secretName: services-flux-bootstrap
                defaultMode: 0440
            - name: config
              configMap:
                name: services-cluster-reconcile-v1
                defaultMode: 0555
            - name: runtime-bootstrap
              secret:
                secretName: services-runtime-bootstrap
                defaultMode: 0440
            - name: tmp
              emptyDir:
                medium: Memory
                sizeLimit: 512Mi
