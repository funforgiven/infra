metadata:
  name: services-provisioning-output-reader
  namespace: openstack
subjects:
  - kind: ServiceAccount
    name: services-cluster-reconcile
    namespace: openstack
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: services-provisioning-output-reader
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: service-dns-input-writer
