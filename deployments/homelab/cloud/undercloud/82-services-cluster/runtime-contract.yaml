apiVersion: v1
kind: ConfigMap
metadata:
  name: services-runtime-contract-v1
  namespace: openstack
data:
  required-keys.yaml: |
    schemaVersion: 11
    secret: services-runtime-bootstrap
    secretFile: deployments/homelab/cloud/undercloud/81-services-foundation/runtime.sops.yaml
    credentials:
      infrastructure:
        - INFRA_TELEGRAM_BOT_TOKEN
      media:
        - ND_LASTFM_APIKEY
        - ND_LASTFM_SECRET
      discordMusic:
        - DISCORD_MUSIC_BOT_TOKEN
        - DISCORD_MUSIC_YOUTUBE_API_KEY
      games:
        - FACTORIO_USERNAME
        - FACTORIO_TOKEN
        - FACTORIO_GAME_PASSWORD
      mailProvisioning:
        - RESEND_ADMIN_API_KEY
    generatedSecrets:
      services-cluster:
        secretFile: deployments/homelab/cloud/undercloud/81-services-foundation/runtime.sops.yaml
        keys:
          - ND_PASSWORDENCRYPTIONKEY
          - SFTPGO_ADMIN_PASSWORD
          - AUDIOMUSE_NAVIDROME_PASSWORD
          - AUDIOMUSE_POSTGRES_PASSWORD
          - NAVIDROME_OAUTH2_COOKIE_SECRET
          - AUDIOMUSE_OAUTH2_COOKIE_SECRET
          - FACTORIO_RCON_PASSWORD
      service-hosts:
        secretFile: deployments/homelab/cloud/host-runtime/generated.sops.yaml
        keys:
          - HOME_ASSISTANT_BACKUP_RESTIC_PASSWORD
          - GITLAB_BACKUP_RESTIC_PASSWORD
          - GITLAB_ROOT_PASSWORD
    provisionedSecrets:
      backblaze-services:
        provisioner: reconcile-services-backblaze
        secretFile: deployments/homelab/cloud/undercloud/81-services-foundation/runtime.sops.yaml
        keys:
          - B2_APPLICATION_KEY_ID
          - B2_APPLICATION_KEY
      backblaze-hosts:
        provisioner: reconcile-services-backblaze
        secretFile: deployments/homelab/cloud/host-runtime/backups.sops.yaml
        keys:
          - HOME_ASSISTANT_BACKUP_B2_APPLICATION_KEY_ID
          - HOME_ASSISTANT_BACKUP_B2_APPLICATION_KEY
          - GITLAB_BACKUP_B2_APPLICATION_KEY_ID
          - GITLAB_BACKUP_B2_APPLICATION_KEY
      telegram-infrastructure:
        provisioner: reconcile-services-telegram
        secretFile: deployments/homelab/cloud/undercloud/81-services-foundation/runtime.sops.yaml
        keys:
          - INFRA_TELEGRAM_CHAT_ID
      aws-mail-auth:
        provisioner: enroll-aws-mail-auth
        secretFile: deployments/homelab/cloud/undercloud/84-mail-aws/aws.sops.yaml
        keys:
          - AWS_ACCESS_KEY_ID
          - AWS_SECRET_ACCESS_KEY
      resend-mail-aws:
        provisioner: reconcile-services-resend
        secretFile: deployments/homelab/cloud/undercloud/84-mail-aws/resend.sops.yaml
        keys:
          - STALWART_RESEND_API_KEY
      resend-gitlab:
        provisioner: reconcile-services-resend
        secretFile: deployments/homelab/cloud/undercloud/86-gitlab/runtime.sops.yaml
        keys:
          - GITLAB_RESEND_API_KEY
    policy:
      secretTransport: isolated-sops-ciphertext-and-memory-backed-reconciliation
