apiVersion: v1
kind: ConfigMap
metadata:
  name: services-runtime-contract-v1
  namespace: openstack
data:
  required-keys.yaml: |
    schemaVersion: 8
    secret: services-runtime-bootstrap
    secretFile: deployments/homelab/cloud/undercloud/81-services-foundation/runtime.sops.yaml
    credentials:
      infrastructure:
        - INFRA_TELEGRAM_BOT_TOKEN
      media:
        - ND_LASTFM_APIKEY
        - ND_LASTFM_SECRET
      mailProvisioning:
        - HCLOUD_TOKEN
        - RESEND_ADMIN_API_KEY
    hostCredentials:
      hermes:
        secretFile: deployments/homelab/cloud/host-runtime/hermes.sops.yaml
        keys:
          - HERMES_TELEGRAM_BOT_TOKEN
          - OPENAI_API_KEY
    generatedSecrets:
      services-cluster:
        secretFile: deployments/homelab/cloud/undercloud/81-services-foundation/runtime.sops.yaml
        keys:
          - ND_PASSWORDENCRYPTIONKEY
          - SFTPGO_ADMIN_PASSWORD
      service-hosts:
        secretFile: deployments/homelab/cloud/host-runtime/generated.sops.yaml
        keys:
          - STALWART_ADMIN_SECRET
          - HERMES_BACKUP_RESTIC_PASSWORD
          - HOME_ASSISTANT_BACKUP_RESTIC_PASSWORD
          - MAIL_EDGE_BACKUP_RESTIC_PASSWORD
    provisionedSecrets:
      backblaze-services:
        provisioner: reconcile-services-backblaze
        secretFile: deployments/homelab/cloud/undercloud/81-services-foundation/runtime.sops.yaml
        keys:
          - B2_APPLICATION_KEY_ID
          - B2_APPLICATION_KEY
      backblaze-hosts:
        provisioner: reconcile-services-backblaze
        secretFile: deployments/homelab/cloud/host-runtime/backups.sops.yaml
        keys:
          - HERMES_BACKUP_B2_APPLICATION_KEY_ID
          - HERMES_BACKUP_B2_APPLICATION_KEY
          - HOME_ASSISTANT_BACKUP_B2_APPLICATION_KEY_ID
          - HOME_ASSISTANT_BACKUP_B2_APPLICATION_KEY
          - MAIL_EDGE_BACKUP_B2_APPLICATION_KEY_ID
          - MAIL_EDGE_BACKUP_B2_APPLICATION_KEY
      telegram-infrastructure:
        provisioner: reconcile-services-telegram
        secretFile: deployments/homelab/cloud/undercloud/81-services-foundation/runtime.sops.yaml
        keys:
          - INFRA_TELEGRAM_CHAT_ID
      telegram-hermes:
        provisioner: reconcile-services-telegram
        secretFile: deployments/homelab/cloud/host-runtime/hermes.sops.yaml
        keys:
          - HERMES_TELEGRAM_ALLOWED_USERS
          - HERMES_TELEGRAM_HOME_CHANNEL
      operator-network:
        provisioner: reconcile-services-operator-network
        secretFile: deployments/homelab/cloud/undercloud/81-services-foundation/runtime.sops.yaml
        keys:
          - MAIL_MANAGEMENT_CIDRS_JSON
      aws-mail-auth:
        provisioner: enroll-aws-mail-auth
        secretFile: deployments/homelab/cloud/undercloud/84-mail-aws/aws.sops.yaml
        keys:
          - AWS_ACCESS_KEY_ID
          - AWS_SECRET_ACCESS_KEY
      resend-mail-edge:
        provisioner: reconcile-services-resend
        secretFile: deployments/homelab/cloud/host-runtime/mail-edge.sops.yaml
        keys:
          - STALWART_RESEND_API_KEY
    policy:
      secretTransport: isolated-sops-ciphertext-and-memory-backed-reconciliation
