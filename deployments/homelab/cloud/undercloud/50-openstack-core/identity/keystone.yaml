apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: keystone
  namespace: openstack
spec:
  interval: 30m
  timeout: 30m
  releaseName: keystone
  chart:
    spec:
      chart: ./keystone
      interval: 24h
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: openstack-helm
      valuesFiles:
        - keystone/values.yaml
        - values_overrides/keystone/2026.1-ubuntu_noble.yaml
        - values_overrides/keystone/mariadb-tls.yaml
        - values_overrides/keystone/messaging-tls.yaml
  driftDetection:
    mode: enabled
  install:
    disableWait: true
    strategy:
      name: RetryOnFailure
      retryInterval: 1m
  upgrade:
    disableWait: true
    strategy:
      name: RetryOnFailure
      retryInterval: 1m
  test:
    enable: true
  valuesFrom:
    - kind: Secret
      name: keystone-values
      valuesKey: values.yaml
  values:
    annotations:
      pod:
        keystone_api:
          fahrican.com/oidc-config-generation: "5"
    images:
      tags:
        keystone_api: ghcr.io/rackerlabs/genestack-images/keystone@sha256:82a84b532a906160ae3d5d0ec371de6864a8ddda309e78f98a1b686f13ddfdaf
    endpoints:
      identity:
        scheme:
          public: https
        port:
          api:
            public: 443
        host_fqdn_override:
          public:
            host: identity.cloud.fahrican.com
      oslo_db:
        host_fqdn_override:
          default:
            tls:
              issuerRef:
                name: openstack-ca
                kind: Issuer
              usages:
                - client auth
    manifests:
      job_image_repo_sync: false
    conf:
      software:
        apache2:
          a2enmod:
            - auth_openidc
      keystone:
        auth:
          methods: password,token,openid,application_credential
        federation:
          trusted_dashboard:
            - https://dashboard.cloud.fahrican.com/api/openstack/skyline/api/v1/websso
        openid:
          remote_id_attribute: HTTP_OIDC_ISS
    pod:
      replicas:
        api: 3
      lifecycle:
        disruption_budget:
          api:
            min_available: 2
      resources:
        enabled: true
      mounts:
        keystone_api:
          keystone_api:
            volumes:
              - name: keystone-oidc
                secret:
                  secretName: keystone-oidc
              - name: keystone-apache-modules
                configMap:
                  name: keystone-apache-modules
            volumeMounts:
              - name: keystone-oidc
                mountPath: /etc/apache2/conf-enabled/oidc.conf
                subPath: oidc.conf
                readOnly: true
              - name: keystone-apache-modules
                mountPath: /etc/apache2/mods-available/shib.load
                subPath: shib.load
                readOnly: true
              - name: keystone-apache-modules
                mountPath: /etc/apache2/conf-available/shib.conf
                subPath: shib.conf
                readOnly: true
    extraObjects:
      - apiVersion: gateway.networking.k8s.io/v1
        kind: HTTPRoute
        metadata:
          name: keystone
          namespace: openstack
        spec:
          parentRefs:
            - name: private
              namespace: network-services
              sectionName: https
          hostnames:
            - identity.cloud.fahrican.com
          rules:
            - backendRefs:
                - name: keystone-api
                  port: 5000
