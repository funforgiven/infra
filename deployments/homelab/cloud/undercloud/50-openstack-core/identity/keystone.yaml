apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: keystone
  namespace: openstack
spec:
  interval: 30m
  timeout: 30m
  releaseName: keystone
  chart:
    spec:
      chart: ./keystone
      interval: 24h
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: openstack-helm
      valuesFiles:
        - keystone/values.yaml
        - values_overrides/keystone/2026.1-ubuntu_noble.yaml
        - values_overrides/keystone/mariadb-tls.yaml
        - values_overrides/keystone/messaging-tls.yaml
  driftDetection:
    mode: enabled
  install:
    disableWait: true
    strategy:
      name: RetryOnFailure
      retryInterval: 1m
  upgrade:
    disableWait: true
    strategy:
      name: RetryOnFailure
      retryInterval: 1m
  test:
    enable: true
  valuesFrom:
    - kind: Secret
      name: keystone-values
      valuesKey: values.yaml
  values:
    endpoints:
      identity:
        host_fqdn_override:
          public:
            host: identity.cloud.fahrican.com
      oslo_db:
        host_fqdn_override:
          default:
            tls:
              issuerRef:
                name: openstack-ca
                kind: Issuer
              usages:
                - client auth
    manifests:
      job_image_repo_sync: false
    pod:
      replicas:
        api: 3
      lifecycle:
        disruption_budget:
          api:
            min_available: 2
      resources:
        enabled: true
    extraObjects:
      - apiVersion: gateway.networking.k8s.io/v1
        kind: HTTPRoute
        metadata:
          name: keystone
          namespace: openstack
        spec:
          parentRefs:
            - name: private
              namespace: network-services
          hostnames:
            - identity.cloud.fahrican.com
          rules:
            - backendRefs:
                - name: keystone-api
                  port: 5000
