apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: glance
  namespace: openstack
spec:
  interval: 30m
  timeout: 30m
  releaseName: glance
  chart:
    spec:
      chart: ./glance
      interval: 24h
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: openstack-helm
      valuesFiles:
        - glance/values.yaml
        - values_overrides/glance/2026.1-ubuntu_noble.yaml
        - values_overrides/glance/mariadb-tls.yaml
        - values_overrides/glance/messaging-tls.yaml
  driftDetection:
    mode: enabled
  install:
    disableWait: true
    strategy:
      name: RetryOnFailure
      retryInterval: 1m
  upgrade:
    disableWait: true
    strategy:
      name: RetryOnFailure
      retryInterval: 1m
  test:
    enable: true
  valuesFrom:
    - kind: Secret
      name: glance-values
      valuesKey: values.yaml
  values:
    storage: rbd
    bootstrap:
      structured:
        images:
          ubuntu-noble-20260801:
            id: null
            name: Ubuntu 24.04 Noble 20260801 amd64
            source_url: https://cloud-images.ubuntu.com/releases/noble/release-20260801/
            image_file: ubuntu-24.04-server-cloudimg-amd64.img
            min_disk: 4
            image_type: qcow2
            container_format: bare
            private: false
            properties:
              architecture: x86_64
              canonical_sha256: 0533b0655c32e68b31d792ecd6ccfca95abdbc536c4446874fe0513bd4140ffe
              hw_disk_bus: virtio
              hw_vif_model: virtio
              os_distro: ubuntu
              os_version: "24.04"
      script: |
        name='Ubuntu 24.04 Noble 20260801 amd64'
        file='ubuntu-24.04-server-cloudimg-amd64.img'
        expected='0533b0655c32e68b31d792ecd6ccfca95abdbc536c4446874fe0513bd4140ffe'

        if [ -f "$file" ]; then
          actual="$(sha256sum "$file" | awk '{print $1}')"
          if [ "$actual" != "$expected" ]; then
            openstack image delete "$name"
            exit 1
          fi
        fi

        test "$(openstack image show "$name" -f value -c status)" = active
        test "$(openstack image show "$name" -f value -c visibility)" = public
        openstack image show "$name" -f value -c properties |
          grep -Fq "canonical_sha256='$expected'"
    conf:
      software:
        rbd:
          rbd_store_pool_app_name: rbd
    endpoints:
      image:
        host_fqdn_override:
          public:
            host: image.cloud.fahrican.com
      oslo_db:
        host_fqdn_override:
          default:
            tls:
              issuerRef:
                name: openstack-ca
                kind: Issuer
              usages:
                - client auth
    manifests:
      job_image_repo_sync: false
    pod:
      replicas:
        api: 3
      lifecycle:
        disruption_budget:
          api:
            min_available: 2
      resources:
        enabled: true
    extraObjects:
      - apiVersion: gateway.networking.k8s.io/v1
        kind: HTTPRoute
        metadata:
          name: glance
          namespace: openstack
        spec:
          parentRefs:
            - name: private
              namespace: network-services
          hostnames:
            - image.cloud.fahrican.com
          rules:
            - backendRefs:
                - name: glance-api
                  port: 9292
