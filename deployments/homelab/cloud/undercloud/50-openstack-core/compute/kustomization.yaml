apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - secrets.sops.yaml
  - compute-kit.yaml
patches:
  - target:
      group: helm.toolkit.fluxcd.io
      version: v2
      kind: HelmRelease
    patch: |-
      - op: add
        path: /spec/interval
        value: 30m
      - op: add
        path: /spec/timeout
        value: 30m
      - op: add
        path: /spec/chart/spec/interval
        value: 24h
      - op: add
        path: /spec/chart/spec/reconcileStrategy
        value: Revision
      - op: add
        path: /spec/chart/spec/sourceRef
        value:
          kind: GitRepository
          name: openstack-helm
      - op: add
        path: /spec/driftDetection
        value:
          mode: enabled
      - op: add
        path: /spec/install
        value:
          disableWait: true
          strategy:
            name: RetryOnFailure
            retryInterval: 1m
      - op: add
        path: /spec/upgrade
        value:
          disableWait: true
          strategy:
            name: RetryOnFailure
            retryInterval: 1m
  - target:
      group: helm.toolkit.fluxcd.io
      version: v2
      kind: HelmRelease
      name: ovn
    patch: |-
      - op: replace
        path: /spec/install/disableWait
        value: false
      - op: replace
        path: /spec/upgrade/disableWait
        value: false
