apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cinder
  namespace: openstack
spec:
  interval: 30m
  timeout: 30m
  releaseName: cinder
  chart:
    spec:
      chart: ./cinder
      interval: 24h
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: openstack-helm
      valuesFiles:
        - cinder/values.yaml
        - values_overrides/cinder/2026.1-ubuntu_noble.yaml
        - values_overrides/cinder/mariadb-tls.yaml
        - values_overrides/cinder/messaging-tls.yaml
  driftDetection:
    mode: enabled
  install:
    disableWait: true
    strategy:
      name: RetryOnFailure
      retryInterval: 1m
  upgrade:
    disableWait: true
    strategy:
      name: RetryOnFailure
      retryInterval: 1m
  test:
    enable: true
  valuesFrom:
    - kind: Secret
      name: cinder-values
      valuesKey: values.yaml
  values:
    conf:
      ceph:
        pools:
          backup:
            app_name: rbd
          cinder.volumes:
            app_name: rbd
      cinder:
        DEFAULT:
          backup_driver: cinder.backup.drivers.ceph.CephBackupDriver
      backends:
        rbd1:
          # The sealed Windows desktop disk is 240 GiB virtually. The chart's
          # 200 GiB bound prevents caching it and repeats conversion per job.
          image_volume_cache_max_size_gb: 512
    endpoints:
      volumev3:
        scheme:
          public: https
        port:
          api:
            public: 443
        host_fqdn_override:
          public:
            host: volume.cloud.fahrican.com
      oslo_db:
        host_fqdn_override:
          default:
            tls:
              issuerRef:
                name: openstack-ca
                kind: Issuer
              usages:
                - client auth
    manifests:
      job_image_repo_sync: false
    pod:
      replicas:
        api: 3
        scheduler: 3
        volume: 1
        backup: 1
      lifecycle:
        disruption_budget:
          api:
            min_available: 2
      resources:
        enabled: true
    extraObjects:
      - apiVersion: gateway.networking.k8s.io/v1
        kind: HTTPRoute
        metadata:
          name: cinder
          namespace: openstack
        spec:
          parentRefs:
            - name: private
              namespace: network-services
              sectionName: https
          hostnames:
            - volume.cloud.fahrican.com
          rules:
            - backendRefs:
                - name: cinder-api
                  port: 8776
