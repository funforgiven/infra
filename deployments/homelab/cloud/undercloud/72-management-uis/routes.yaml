apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: skyline
  namespace: openstack
spec:
  parentRefs:
    - name: management
      namespace: network-services
      sectionName: https
  hostnames:
    - dashboard.cloud.fahrican.com
  rules:
    - backendRefs:
        - name: skyline-api
          port: 9999
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: observability
spec:
  parentRefs:
    - name: management
      namespace: network-services
      sectionName: https
  hostnames:
    - grafana.cloud.fahrican.com
  rules:
    - backendRefs:
        - name: kube-prometheus-stack-grafana
          port: 80
