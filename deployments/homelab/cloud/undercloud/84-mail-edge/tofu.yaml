apiVersion: infra.contrib.fluxcd.io/v1alpha2
kind: Terraform
metadata:
  name: mail-edge
  namespace: openstack
spec:
  suspend: false
  interval: 10m
  retryInterval: 1m
  approvePlan: auto
  destroyResourcesOnDeletion: false
  path: ./components/cloud/services/mail-edge/tofu
  sourceRef:
    kind: GitRepository
    name: services-tofu-source
  runnerPodTemplate:
    spec:
      env:
        - name: HCLOUD_TOKEN
          valueFrom:
            secretKeyRef:
              name: services-runtime-bootstrap
              key: HCLOUD_TOKEN
        - name: TF_VAR_management_cidrs
          valueFrom:
            secretKeyRef:
              name: services-runtime-bootstrap
              key: MAIL_MANAGEMENT_CIDRS_JSON
  writeOutputsToSecret:
    name: mail-edge-outputs
    outputs:
      - ipv4_address
      - server_id
  remediation:
    retries: 3
