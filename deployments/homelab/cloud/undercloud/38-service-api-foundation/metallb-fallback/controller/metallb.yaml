apiVersion: v1
kind: Namespace
metadata:
  name: metallb-system
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/enforce-version: v1.35
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/audit-version: v1.35
    pod-security.kubernetes.io/warn: privileged
    pod-security.kubernetes.io/warn-version: v1.35
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: metallb-chart
  namespace: metallb-system
spec:
  interval: 24h
  url: https://github.com/metallb/metallb.git
  ref:
    commit: 791dfcc63ced7a6b3e869131eae75e645150fff0
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: metallb
  namespace: metallb-system
spec:
  interval: 30m
  timeout: 10m
  releaseName: metallb
  chart:
    spec:
      chart: ./charts/metallb
      interval: 24h
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: metallb-chart
  driftDetection:
    mode: enabled
  install:
    crds: Create
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    loadBalancerClass: metallb.io/metallb
    controller:
      image:
        repository: quay.io/metallb/controller
        tag: v0.16.1@sha256:f51ab515de9ccd20dc3dccb093e48df8adddac019326c456f449e55ba91b6420
        pullPolicy: IfNotPresent
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          memory: 256Mi
    speaker:
      ignoreExcludeLB: true
      memberlist:
        enabled: true
      image:
        repository: quay.io/metallb/speaker
        tag: v0.16.1@sha256:16561e96531e1852d5c229ad7fae6e994dcfa983ff7f4de6b6208b34a4e2ddbc
        pullPolicy: IfNotPresent
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          memory: 256Mi
      frr:
        enabled: false
    frrk8s:
      enabled: false
    prometheus:
      serviceMonitor:
        enabled: false
