apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../37-service-network
patches:
  - target:
      group: cilium.io
      version: v2
      kind: CiliumLoadBalancerIPPool
      name: internal-dns
    patch: |-
      - op: add
        path: /spec/disabled
        value: true
  - target:
      version: v1
      kind: Service
      name: internal-coredns
      namespace: network-services
    patch: |-
      - op: replace
        path: /metadata/labels/infra.fahrican.com~1l2-announcement
        value: cilium-withdrawn
