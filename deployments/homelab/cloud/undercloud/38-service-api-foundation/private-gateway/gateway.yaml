apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: private-envoy
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: private
    namespace: envoy-gateway-system
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: private
  namespace: network-services
spec:
  gatewayClassName: private-envoy
  addresses:
    - type: IPAddress
      value: 10.21.20.130
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              gateway.fahrican.com/private: allowed
