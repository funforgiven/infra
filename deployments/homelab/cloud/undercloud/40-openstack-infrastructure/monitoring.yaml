apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: mariadb
  namespace: observability
spec:
  jobLabel: application
  namespaceSelector:
    matchNames:
      - openstack
  selector:
    matchLabels:
      application: mariadb
      component: server
  podMetricsEndpoints:
    - port: metrics
      path: /metrics
      interval: 30s
      relabelings:
        - targetLabel: cluster
          replacement: undercloud
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: rabbitmq
  namespace: observability
spec:
  jobLabel: application
  namespaceSelector:
    matchNames:
      - openstack
  selector:
    matchLabels:
      application: rabbitmq
      component: server
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
      relabelings:
        - targetLabel: cluster
          replacement: undercloud
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: openstack-infrastructure
  namespace: observability
spec:
  groups:
    - name: openstack-infrastructure
      rules:
        - alert: MariaDBReplicaDown
          expr: count(up{job="mariadb"} == 1) < 3
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: Fewer than three MariaDB members are observable
        - alert: RabbitMQReplicaDown
          expr: count(up{job="rabbitmq"} == 1) < 3
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: Fewer than three RabbitMQ members are observable
