apiVersion: v1
kind: ConfigMap
metadata:
  name: aws-mail-credential-contract-v1
  namespace: openstack
data:
  contract.yaml: |
    schemaVersion: 1
    region: eu-central-1
    provisioning:
      secretName: aws-mail-provisioning
      encryptedManifest: aws.sops.yaml
      requiredKeys:
        - AWS_ACCESS_KEY_ID
        - AWS_SECRET_ACCESS_KEY
      bootstrapIntake:
        - secrets/AWS_BOOTSTRAP_ACCESS_KEY_ID.key
        - secrets/AWS_BOOTSTRAP_SECRET_ACCESS_KEY.key
      identity: fahrican-mail-gitops
      policy: components/cloud/services/mail-aws/bootstrap-iam-policy.json
      policyType: customer-managed
      statePolicy: temporary bootstrap authority creates and verifies one dedicated regional identity, encrypts only its access pair for the runner, revokes the bootstrap key, and never places provider credentials in OpenTofu variables, state, or outputs
    runtime:
      provider: AWS Secrets Manager
      generatedByInstance:
        - fahrican/stalwart/admin
        - fahrican/stalwart/mailbox
      externallyEnrolled:
        - fahrican/stalwart/resend
      databasePassword: RDS-managed master secret
      sourceControl: secret values and secret versions are forbidden from Git and OpenTofu state
