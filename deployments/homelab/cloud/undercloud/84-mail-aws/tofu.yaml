apiVersion: infra.contrib.fluxcd.io/v1alpha2
kind: Terraform
metadata:
  name: mail-aws
  namespace: openstack
spec:
  # This controller uses only the scoped SOPS-encrypted mail provisioning
  # identity. Temporary AWS bootstrap credentials are not deployed.
  suspend: false
  interval: 10m
  retryInterval: 1m
  approvePlan: auto
  destroyResourcesOnDeletion: false
  path: ./components/cloud/services/mail-aws/tofu
  sourceRef:
    kind: GitRepository
    name: services-tofu-source
  vars:
    - name: source_revision
      value: "342fa4dd586d572f5765a4c8cbdeed7c25d6cd1b"
    - name: nixos_ami_id
      value: "ami-019a83797574d9161"
    - name: enable_reverse_dns
      value: "true"
    - name: enable_restore_qualification
      value: "false"
    - name: enable_matrix_monitoring
      value: "true"
    - name: enable_matrix_delivery_alerts
      value: "true"
  runnerPodTemplate:
    spec:
      envFrom:
        - secretRef:
            name: aws-mail-provisioning
  writeOutputsToSecret:
    name: mail-aws-outputs
    outputs:
      - ipv4_address
      - instance_id
      - database_endpoint
      - blob_bucket
      - admin_secret_arn
      - mailbox_secret_arn
      - resend_secret_arn
      - alert_topic_arn
      - matrix_heartbeat_url
      - matrix_heartbeat_secret_arn
  remediation:
    retries: 3
