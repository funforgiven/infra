apiVersion: infra.contrib.fluxcd.io/v1alpha2
kind: Terraform
metadata:
  name: mail-aws
  namespace: openstack
spec:
  # Credentials are the final activation touch. This gate was enabled only
  # after the scoped provider pair was verified, encrypted, committed, and
  # accepted by the signed activation preflight.
  suspend: false
  interval: 10m
  retryInterval: 1m
  approvePlan: auto
  destroyResourcesOnDeletion: false
  path: ./components/cloud/services/mail-aws/tofu
  sourceRef:
    kind: GitRepository
    name: services-tofu-source
  vars:
    - name: source_revision
      value: "b43a4dd297a3928a19927b03281b170b2359cbb0"
    - name: enable_reverse_dns
      value: "false"
  runnerPodTemplate:
    spec:
      envFrom:
        - secretRef:
            name: aws-mail-provisioning
  writeOutputsToSecret:
    name: mail-aws-outputs
    outputs:
      - ipv4_address
      - instance_id
      - database_endpoint
      - blob_bucket
      - admin_secret_arn
      - mailbox_secret_arn
      - resend_secret_arn
      - alert_topic_arn
  remediation:
    retries: 3
