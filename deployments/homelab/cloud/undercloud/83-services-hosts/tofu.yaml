apiVersion: infra.contrib.fluxcd.io/v1alpha2
kind: Terraform
metadata:
  name: services-hosts
  namespace: openstack
spec:
  suspend: false
  interval: 10m
  retryInterval: 1m
  approvePlan: auto
  destroyResourcesOnDeletion: false
  path: ./components/cloud/services/hosts/tofu
  sourceRef:
    kind: GitRepository
    name: services-tofu-source
  runnerPodTemplate:
    spec:
      envFrom:
        - secretRef:
            name: magnum-keystone-admin
  writeOutputsToSecret:
    name: services-hosts-outputs
    outputs:
      - iot_network_id
  remediation:
    retries: 3
