apiVersion: infra.contrib.fluxcd.io/v1alpha2
kind: Terraform
metadata:
  name: services-hosts
  namespace: openstack
spec:
  suspend: false
  interval: 10m
  retryInterval: 1m
  approvePlan: auto
  destroyResourcesOnDeletion: false
  path: ./components/cloud/services/hosts/tofu
  sourceRef:
    kind: GitRepository
    name: services-tofu-source
  vars:
    # This is the revision of the protected active NixOS boot volumes. Image
    # promotion creates candidates but never advances this value implicitly:
    # doing so would request replacement of retained roots before their
    # runtime credentials and recovery path were staged.
    - name: image_revision
      value: "80ab8bcb18b757363d31317d61d8950b26271a6f"
    # Keep this on NixOS until the encrypted native-backup restore and HAOS
    # image-promotion gates have both passed.
    - name: home_assistant_platform
      value: nixos
  runnerPodTemplate:
    spec:
      envFrom:
        - secretRef:
            name: magnum-keystone-admin
  writeOutputsToSecret:
    name: services-hosts-outputs
    outputs:
      - hermes_private_address
      - hermes_provider_address
      - home_assistant_private_address
      - home_assistant_provider_address
  remediation:
    retries: 3
