version: 2
scope: switch-only

site: Hark

switch:
  name: 98-25-4A-CB-BF-BE
  mac: 98-25-4A-CB-BF-BE
  model: SG3210XHP-M2 v3.0
  profileTemplate: All

  # The controller UI owns this because the public OpenAPI does not expose it.
  management:
    vlan: 90
    addressMode: dhcp
    dhcpReservation: 10.21.90.5/24
    fallbackAddress: 192.168.90.5/24
    previousInterface: disabled

  networks:
    CLOUD-EXTERNAL: 40

  profiles:
    infra-ccr-trunk:
      nativeVlan: 1
      taggedVlans: [10, 20, 40, 50, 60, 90]
    infra-crs-trunk:
      nativeVlan: 1
      taggedVlans: [10, 20, 40, 50, 90]
    infra-trusted-access:
      nativeVlan: 10
      taggedVlans: []
      # Disable STP only for workstation port 2 to avoid its observed 33-second
      # link-up delay. Switch links retain STP.
      spanningTree:
        enabled: false
        # Omada clears these settings when spanning tree is disabled.
        edgePort: false
        bpduProtect: false
        bpduFilter: false
    infra-iot-access:
      nativeVlan: 50
      taggedVlans: []
    infra-management-access:
      nativeVlan: 90
      taggedVlans: []
    infra-ap-trunk:
      nativeVlan: 90
      taggedVlans: [10, 50]

  ports:
    1: infra-ccr-trunk
    2: infra-trusted-access
    3: infra-management-access
    4: infra-iot-access # Dongle-M Zigbee coordinator
    5: infra-iot-access # Dongle-M Thread RCP
    # Physical speed is temporarily 1 Gb/s full duplex; the reconciler preserves
    # it. See unifi-network.yaml and services/24-unifi/migration-validation.md.
    6: infra-ap-trunk
    8: infra-iot-access
    9: infra-crs-trunk
