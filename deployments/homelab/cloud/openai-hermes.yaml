schemaVersion: 1
project:
  name: fahrican-hermes-production
serviceAccount:
  name: fahrican-hermes-production-service-account
apiKey:
  name: fahrican-hermes-production-runtime
  scopes:
    - api.responses.write
administrationCredential: OPENAI_ADMIN_KEY
administrationKeyName: fahrican-infra-openai-control-plane
outputCredential: OPENAI_API_KEY
policy:
  modelIds:
    - gpt-5.6-luna
  hostedTools:
    - code_interpreter
    - file_search
    - image_generation
    - mcp
    - web_search
  hardSpendLimit:
    thresholdAmount: 5000
    currency: USD
    interval: month
