version: 1
exceptions:
  - id: telegram-botfather-bootstrap
    resource: Telegram bots for infrastructure alerts and Hermes
    owner: funforgiven
    rationale: Telegram exposes bot identity creation and token rotation only through BotFather; supported Bot API methods manage the remaining metadata and update discovery.
    procedure: Create the two Git-declared names and globally unique usernames in BotFather, ingest only their tokens with the no-echo SOPS bootstrap command, create the declared private alert group, and send one /activate message to each bot. The pinned reconciler applies descriptions, clears command menus, discovers numeric chat/user IDs, and encrypts them into their routed SOPS documents.
    secret_handling: Bot tokens go directly to workload-specific SOPS documents and are never printed, passed as arguments, or shared between bots. Numeric targets are selected from one exact update and written directly as SOPS ciphertext.
    backup: SOPS ciphertext is in Git; BotFather remains the recovery and revocation authority.
    drift_probe: Run the pinned Telegram check and verify the public usernames monthly without retrieving or displaying tokens or numeric targets.
    review_interval: monthly
    exit_criterion: Replace this exception when Telegram provides a supported declarative bot-management API.
  - id: openai-api-key-issuance
    resource: Project-scoped OpenAI API key used by Hermes
    owner: funforgiven
    rationale: Automating project, policy, and key lifecycle requires an organization Admin credential with far broader authority than the Hermes runtime. The operator deliberately keeps project permissions and the hard spend limit in OpenAI account controls and supplies only the independently revocable runtime key to this repository.
    procedure: Create or rotate the Hermes project key in the OpenAI dashboard, apply the operator-selected permissions and hard spend limit there, place the one-time value in the ignored mode-0600 OPENAI_API_KEY.key intake file, and enroll it with the generic no-echo SOPS command.
    secret_handling: The intake value is encrypted directly into the admin-recipient-only Hermes SOPS document and the intake file is truncated after success. It never enters OpenTofu, a command argument, logs, documentation, or a shared cluster Secret.
    backup: SOPS ciphertext preserves the active runtime value; OpenAI remains the revocation authority, and rotation uses a newly issued project key.
    drift_probe: Review non-secret project budget and permission settings in the OpenAI dashboard and run a minimal Hermes API health check monthly without retrieving or displaying the key.
    review_interval: monthly
    exit_criterion: Replace this exception when OpenAI offers a workload identity or narrow key-delivery mechanism that does not require organization-administrator authority.
  - id: resend-api-key-issuance
    resource: Resend administration and Stalwart SMTP credentials
    owner: funforgiven
    rationale: Resend returns API key material only once even though domain and key metadata are API-managed.
    procedure: Reconcile the sending domain through the pinned API client, issue a domain-scoped sending key, and stream the token directly into SOPS.
    secret_handling: The Stalwart workload receives only the sending-access key; the administration key remains confined to the management reconciler.
    backup: SOPS ciphertext preserves the active workload key; either key can be revoked and regenerated from the Resend account.
    drift_probe: Compare domain settings, verification status, DNS records, and non-secret key metadata through the API.
    review_interval: monthly
    exit_criterion: Remove when an approved provider can issue keys directly into the secret store without state exposure.
  - id: stalwart-directory-bootstrap
    resource: Stalwart mail domain, initial mailbox, aliases, and application passwords
    owner: funforgiven
    rationale: The pinned NixOS-compatible Stalwart 0.15 release lacks the safe declarative apply interface available in Stalwart 0.16, while destructive reconciliation through its legacy principal API can orphan existing mail state.
    procedure: After the encrypted backup has passed an isolated restore, create only the objects declared in components/cloud/services/mail-edge/directory-inventory.yaml through the private management interface; update that non-secret desired inventory before every additive change and take an immediate encrypted backup after every accepted change.
    secret_handling: Passwords and application-password values go directly from the password manager into Stalwart and never enter Nix, Git, shell history, command arguments, OpenTofu state, screenshots, or documentation.
    backup: The encrypted Stalwart state backup is the authoritative recovery copy; retain a verified pre-change snapshot before any rename or deletion.
    drift_probe: Compare the redacted domain, account, alias, and application-password metadata with components/cloud/services/mail-edge/directory-inventory.yaml monthly without retrieving hashes or secret values.
    review_interval: monthly
    exit_criterion: Migrate to the supported Stalwart declarative apply workflow when a compatible NixOS module is available, then remove this exception after a restore-tested migration.
  - id: hcloud-api-token-issuance
    resource: Hetzner Cloud token used by the mail-edge OpenTofu controller
    owner: funforgiven
    rationale: Hetzner Cloud API tokens must be issued through project account controls before the declarative provider can authenticate.
    procedure: Issue a dedicated read-write token in the mail-edge project and ingest it directly as HCLOUD_TOKEN in the controller's SOPS-managed runtime Secret.
    secret_handling: The token is never entered as an OpenTofu variable, committed as plaintext, printed, or placed in command arguments.
    backup: SOPS ciphertext preserves the active token; the Hetzner project remains the revocation and rotation authority.
    drift_probe: Verify the dedicated token inventory and last rotation date monthly without retrieving or displaying its value.
    review_interval: monthly
    exit_criterion: Remove when Hetzner supports a workload identity flow that the controller can use without a long-lived token.
  - id: aws-mail-bootstrap-credential-issuance
    resource: AWS provisioning credential and SNS email subscription for the independent mail platform
    owner: funforgiven
    rationale: The non-AWS GitOps controller needs one initial AWS identity before it can create the narrower EC2 runtime role, while AWS requires the recipient to confirm an email subscription interactively. Neither ceremony has a safe unauthenticated declarative interface.
    procedure: Place a temporary bootstrap access pair in the two ignored AWS_BOOTSTRAP mode-0600 intake files. Run the pinned enrollment tool, which reconciles the Git-declared customer-managed regional policy, creates and verifies the dedicated fahrican-mail-gitops identity and its only key, encrypts only that narrower pair into aws-mail-provisioning, revokes the exact temporary key, and clears the intake files. Confirm only the declared stalwart-mail-alerts SNS subscription from the provider email. Prefer short-lived federation if it becomes available to the undercloud controller.
    secret_handling: Both bootstrap values are held through fixed no-follow file descriptors and provider subprocess environment or standard input only. The generated GitOps secret is captured in memory, verified, encrypted directly to the workload-specific SOPS manifest, and rolled back at AWS if encryption fails; neither pair enters OpenTofu variables, state, plans, command arguments, logs, or documentation. Intake remains available and enrollment is resumable if revocation is interrupted. SNS confirmation contains no infrastructure credential.
    backup: SOPS ciphertext preserves only the dedicated active controller pair; AWS remains the revocation authority. The email subscription is recreated from OpenTofu metadata and reconfirmed if necessary.
    drift_probe: Review the provisioning identity's non-secret policy, last-used timestamp, access-key age, and the SNS subscription confirmation state monthly without retrieving key material.
    review_interval: monthly
    exit_criterion: Replace the access pair with workload federation once the undercloud can assume an AWS role without a long-lived bootstrap secret; retain email confirmation while SNS requires recipient consent.
  - id: smtp-inbound-monitoring-vantage
    resource: Continuous SMTP port 25 reachability from an independent Internet vantage
    owner: funforgiven
    rationale: The services-cluster network cannot establish outbound TCP port 25 to the mail edge even though its other mail probes pass, the live Hetzner and NixOS firewalls admit port 25, Stalwart listens on it, and an external Resend delivery through public MX reaches the mailbox. A credentialed mail-loop exporter or another custom monitoring service is not justified for this personal deployment.
    procedure: Retain the non-paging mail.fahrican.com:25 probe series for diagnosis. After mail-edge, DNS, or provider changes, send one idempotent acceptance message from Resend through the public MX, require Resend's delivered state, and verify the exact subject over authenticated IMAPS. Ports 465, 587, and 993 and every HTTP endpoint remain continuously paging from the services cluster.
    secret_handling: Resend administration and mailbox credentials are read only from their existing SOPS or mode-0600 runtime boundaries into process memory; they are never printed, committed, passed as command arguments, or copied into the monitoring cluster.
    backup: The encrypted Stalwart state backup remains the recovery artifact; the acceptance message contains no secret or operational state.
    drift_probe: Review the retained port 25 series and repeat the external MX-to-IMAP acceptance monthly without displaying message content or credentials. OpenTofu and NixOS independently detect server and firewall drift.
    review_interval: monthly
    exit_criterion: Remove this exception when a trustworthy external TCP vantage can feed the existing alert path without a new long-lived credential or custom service, or when the services-cluster source network can reach port 25 reliably.
  - id: offsite-backup-credential-issuance
    resource: Backblaze B2 master-key bootstrap for service backup writers
    owner: funforgiven
    rationale: Backblaze has no workload-identity path for these consumers, so a master credential must bootstrap independently scoped application keys; each new secret is returned only at issuance.
    procedure: Place the master key ID and key in the two fixed mode-0600 ignored intake files. The pinned reconciler retains the existing fahrican-cloud-recovery bucket, applies its reviewed private/encrypted lifecycle policy, creates one key restricted to each declared services prefix, writes returned material directly into the routed SOPS documents, and clears both master files only after the whole reconciliation succeeds.
    secret_handling: The master and derived credentials never enter Nix, OpenTofu variables, state, plans, logs, shell history, or command arguments. The master exists only in the ignored bootstrap files and process memory, while application keys persist only as SOPS ciphertext and root-only runtime files. Restic repository passwords are generated directly into SOPS.
    backup: Offline recovery readers and the personal age identity remain separate from workload writers; lost workload credentials are recovered by rotation, not retrieval.
    drift_probe: Compare non-secret key inventory, bucket scope, lifecycle policy, last successful backup, and restore evidence monthly without retrieving any credential value.
    review_interval: monthly
    exit_criterion: Replace the master bootstrap with a supported workload identity or secret-store delivery flow.
  - id: music-store-accounts-and-purchases
    resource: Bandcamp and OTOTOY accounts, payment, and checkout
    owner: funforgiven
    rationale: Storefront purchase and payment flows are human transactions without an appropriate unattended declarative interface.
    procedure: Choose a store, complete checkout manually, and upload the purchased files directly into the shared music library through the declared SFTPGo WebClient.
    secret_handling: Passwords and payment data remain in the personal password manager and are never supplied to Hermes or the media workloads.
    backup: Audio is protected by the declared media-volume backups; retain store receipts and redownload access outside the workload as a second recovery path.
    drift_probe: Review storefront availability and a representative restored album without authenticating an automated service.
    review_interval: monthly
    exit_criterion: Reassess only if a store publishes a supported purchase API with explicit unattended-use terms.
  - id: music-account-linking
    resource: Navidrome first administrator plus per-user Last.fm and ListenBrainz authorization
    owner: funforgiven
    rationale: Navidrome creates its first administrator through a one-time setup page, while Last.fm and ListenBrainz require each human user to approve an upstream account grant.
    procedure: Create the first admin from the routed-LAN endpoint after backups are qualified, then link each scrobbling account from that user's Navidrome profile without sharing credentials with Hermes.
    secret_handling: Navidrome passwords and upstream tokens remain in the encrypted Navidrome database and its backups; Last.fm application keys are delivered only through the media-runtime SOPS Secret.
    backup: Navidrome native database exports are included in Velero backups, and an isolated restore must prove that account and scrobble state survive.
    drift_probe: Compare the redacted user/link inventory and last successful scrobble monthly without retrieving tokens or passwords.
    review_interval: monthly
    exit_criterion: Remove the first-admin portion when Navidrome exposes a supported declarative bootstrap; retain per-user consent while the upstream services require interactive grants.
  - id: home-assistant-runtime-registry
    resource: Home Assistant OS onboarding, provider-LAN network, HTTP settings, backup location, and integrations stored only in appliance state
    owner: funforgiven
    rationale: HAOS intentionally owns its operating system and authenticated runtime registry. It has no cloud-init interface for the static non-DHCP provider NIC, and first-user, HTTP trial confirmation, native Backblaze backup enrollment, and many integrations expose no supported declarative API.
    procedure: Keep the Git cutover variable on nixos until a full encrypted native backup and emergency kit have passed an isolated HAOS restore. After the declared VM replacement, restore that backup during onboarding; configure 10.21.40.120/24 on the MAC-pinned provider NIC with route 10.21.10.0/24 through 10.21.40.1; trust only 192.168.80.0/24 for forwarded HTTP headers; and confirm the pending proxy configuration through https://home.fahrican.com. Enroll the native Backblaze B2 backup location with the existing prefix-scoped key and services/hosts/home-assistant/ prefix, then enable encrypted daily backups with retention of at least 14.
    secret_handling: The administrator password, MFA material, backup emergency kit, prefix-scoped B2 key, HTTP state, and integration credentials remain in Home Assistant state, the password manager, and encrypted backups; they never enter Git plaintext or command arguments.
    backup: Retain the protected NixOS Cinder root through migration. Require an encrypted native backup before cutover and after every accepted UI-only change, a daily encrypted native B2 backup, and an isolated restore before retiring the rollback volume or legacy Restic contract.
    drift_probe: Verify both fixed addresses, the public reverse-proxy path, last successful automatic backup, B2 prefix confinement, and the documented integration inventory monthly using redacted diagnostics without retrieving credentials.
    review_interval: monthly
    exit_criterion: Move each setting to Git if HAOS exposes a supported declarative interface; the appliance network and first-user portions remain until HAOS adds unattended provisioning.
