schemaVersion: 1
document: homelab-cloud-backup-destination
lastReviewed: "2026-08-15"

provider: backblaze-b2

bucket:
  name: fahrican-cloud-recovery
  s3Endpoint: https://s3.us-west-004.backblazeb2.com
  access: private
  defaultEncryption: SSE-B2
  objectLock: false
  lifecycleRules:
    - fileNamePrefix: undercloud/etcd/
      daysFromUploadingToHiding: null
      daysFromHidingToDeleting: 30
      daysFromStartingToCancelingUnfinishedLargeFiles: null
    - fileNamePrefix: management/etcd/
      daysFromUploadingToHiding: null
      daysFromHidingToDeleting: 30
      daysFromStartingToCancelingUnfinishedLargeFiles: null
    - fileNamePrefix: undercloud/openstack/
      daysFromUploadingToHiding: null
      daysFromHidingToDeleting: 30
      daysFromStartingToCancelingUnfinishedLargeFiles: null
    - fileNamePrefix: undercloud/zitadel/
      daysFromUploadingToHiding: null
      daysFromHidingToDeleting: 30
      daysFromStartingToCancelingUnfinishedLargeFiles: null
    - fileNamePrefix: services/kubernetes/
      daysFromUploadingToHiding: null
      daysFromHidingToDeleting: 30
      daysFromStartingToCancelingUnfinishedLargeFiles: null
    - fileNamePrefix: services/hosts/hermes/
      daysFromUploadingToHiding: null
      daysFromHidingToDeleting: 30
      daysFromStartingToCancelingUnfinishedLargeFiles: null
    - fileNamePrefix: services/hosts/home-assistant/
      daysFromUploadingToHiding: null
      daysFromHidingToDeleting: 30
      daysFromStartingToCancelingUnfinishedLargeFiles: null
    - fileNamePrefix: services/hosts/mail-edge/
      daysFromUploadingToHiding: null
      daysFromHidingToDeleting: 30
      daysFromStartingToCancelingUnfinishedLargeFiles: null

writer:
  keyName: infra-undercloud-backup-writer
  namePrefix: undercloud/
  capabilities:
    - writeFiles

etcd:
  schedule: "17 */6 * * *"
  timeZone: Etc/UTC
  objectKey: undercloud/etcd/snapshot.db.sops.json
  clientSideEncryption:
    implementation: sops-age
    recipient: age1z0l8kk9mnr8arupzn7j0tu4kznqnup96jymeey5xkzggzne4df0qjcym75
  retention:
    latest: retained until replaced
    replacedVersionsDays: 30

restoreReader:
  keyName: infra-undercloud-restore-reader
  namePrefix: undercloud/etcd/
  capabilities:
    - listFiles
    - readFiles

management:
  writer:
    keyName: infra-management-backup-writer
    namePrefix: management/
    capabilities:
      - writeFiles
  etcd:
    snapshotSchedule: "17 */6 * * *"
    uploadSchedule: "27 */6 * * *"
    timeZone: Etc/UTC
    objectKey: management/etcd/snapshot.zip.sops.json
    clientSideEncryption:
      implementation: sops-age
      recipient: age1rq6wyxcxyl9xysuy7n3lzx33n2gctk2wzqgx3dfysg3c8vckl4es3pk27d
    retention:
      localSnapshotsPerNode: 5
      latest: retained until replaced
      replacedVersionsDays: 30
  restoreReader:
    keyName: infra-management-restore-reader
    namePrefix: management/etcd/
    capabilities:
      - listFiles
      - readFiles

openstack:
  schedule: "17 1 * * *"
  timeZone: Etc/UTC
  objectKey: undercloud/openstack/authoritative.tar.sops.json
  payloads:
    - latest verified MariaDB logical backup
    - atomic OVN Northbound backup
    - atomic OVN Southbound backup
  clientSideEncryption:
    implementation: sops-age
    recipient: age1z0l8kk9mnr8arupzn7j0tu4kznqnup96jymeey5xkzggzne4df0qjcym75
  writer:
    keyName: infra-openstack-backup-writer
    namePrefix: undercloud/openstack/
    capabilities:
      - writeFiles
  restoreReader:
    keyName: infra-openstack-restore-reader
    namePrefix: undercloud/openstack/
    capabilities:
      - listFiles
      - readFiles
  retention:
    latest: retained until replaced
    replacedVersionsDays: 30

zitadel:
  destinationPath: s3://fahrican-cloud-recovery/undercloud/zitadel/
  endpoint: https://s3.us-west-004.backblazeb2.com
  continuousWalArchive: true
  baseBackupSchedule: "17 2 * * *"
  retentionDays: 30
  objectLock: false
  writer:
    keyName: infra-zitadel-backup-writer
    namePrefix: undercloud/zitadel/
    capabilities:
      - deleteFiles
      - listFiles
      - readFiles
      - writeFiles

services:
  kubernetes:
    keyName: infra-services-velero-writer
    namePrefix: services/kubernetes/
    capabilities:
      - deleteFiles
      - listFiles
      - readFiles
      - writeFiles
  hosts:
    - host: hermes
      keyName: infra-services-hermes-backup-writer
      namePrefix: services/hosts/hermes/
    - host: home-assistant
      keyName: infra-services-home-assistant-backup-writer
      namePrefix: services/hosts/home-assistant/
    - host: mail-edge
      keyName: infra-services-mail-edge-backup-writer
      namePrefix: services/hosts/mail-edge/
  hostCapabilities:
    - deleteFiles
    - listFiles
    - readFiles
    - writeFiles
