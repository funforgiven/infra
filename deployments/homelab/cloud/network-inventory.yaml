---
all:
  vars:
    ansible_connection: ansible.netcommon.network_cli
    ansible_network_os: fahrican.routeros.routeros
    ansible_user: admin
  children:
    core_switch:
      hosts:
        crs510:
          ansible_host: 10.21.90.2
          routeros_login_password_file: >-
            /run/secrets/homelab-routeros-crs510-login-password
          crs_cloud_fabric:
            schema_version: 1
            bridge: bridge
            bond_policy:
              mode: 802.3ad
              lacp_mode: active
              lacp_rate: 1sec
              minimum_links: 1
              mtu: 9000
              l2_mtu: 9216
              transmit_hash_policy: layer-3-and-4
            server_bonds:
              - name: bond-server1
                host: taleggio
                members:
                  - switch_port: sfp28-3
                    phy_policy:
                      auto_negotiation: false
                      speed: 25G-baseCR
                      fec_mode: fec91
                  - switch_port: sfp28-4
                    phy_policy:
                      auto_negotiation: false
                      speed: 25G-baseCR
                      fec_mode: fec91
              - name: bond-server2
                host: asiago
                members:
                  - switch_port: sfp28-5
                    phy_policy:
                      auto_negotiation: false
                      speed: 25G-baseCR
                      fec_mode: fec91
                  - switch_port: sfp28-6
                    phy_policy:
                      auto_negotiation: false
                      speed: 25G-baseCR
                      fec_mode: fec91
              - name: bond-server3
                host: pecorino
                members:
                  - switch_port: sfp28-7
                    phy_policy:
                      auto_negotiation: false
                      speed: 25G-baseCR
                      fec_mode: fec91
                  - switch_port: sfp28-8
                    phy_policy:
                      auto_negotiation: false
                      speed: 25G-baseCR
                      fec_mode: fec91
            bridge_vlans:
              - id: 20
                comment: "infra: SERVERS"
                additional_tagged_interfaces:
                  - sfp28-1
                  - sfp28-2
                scope: routed
              - id: 30
                comment: "infra: CEPH; switch-local only"
                additional_tagged_interfaces: []
                scope: switch-local
              - id: 31
                comment: "infra: NOVA-MIGRATION; switch-local only"
                additional_tagged_interfaces: []
                scope: switch-local
              - id: 32
                comment: "infra: OVN-GENEVE; switch-local only"
                additional_tagged_interfaces: []
                scope: switch-local
              - id: 33
                comment: "infra: MANILA-NFS; switch-local only"
                additional_tagged_interfaces: []
                scope: switch-local
              - id: 40
                comment: "infra: CLOUD-EXTERNAL"
                additional_tagged_interfaces:
                  - sfp28-1
                scope: routed
    core_router:
      hosts:
        ccr2004:
          ansible_host: 10.21.10.1
          routeros_login_password_file: >-
            /run/secrets/homelab-routeros-ccr2004-login-password
          routeros_management_dhcp:
            name: dhcp-management
            interface: vlan90-mgmt
            network: 10.21.90.0/24
            gateway: 10.21.90.1
            dns_server: 10.21.90.1
            lease_time: 1d
          routeros_private_dns_forward:
            name: cloud.fahrican.com
            type: FWD
            forward_to: 10.21.20.129
            match_subdomain: true
            comment: "infra: private cloud split DNS"
          routeros_wireguard:
            name: wg-admin
            address: 10.21.91.1/24
            network: 10.21.91.0/24
            listen_port: 51820
            mtu: 1420
            private_key_file: >-
              /run/secrets/homelab-routeros-ccr2004-wireguard-private-key
            public_key: 9dMB5tJh8vKmqyWREDjjOk7bg3YOGRjqMbbEIk9uSlI=
            wan_interface_list: INFRA-WAN
            input_chain: infra-input
            input_final_drop_comment: "infra: input final drop"
            forward_chain: infra-forward
            forward_final_drop_comment: "infra: forward final drop"
            peers:
              - name: parmigiano
                public_key: sD9I5RUu8cg9bwtLJK6IGG7Om+iT95Lg3I5bH3xeEDc=
                allowed_address: 10.21.91.2/32
                persistent_keepalive: 25s
                preshared_key_file: >-
                  /run/secrets/homelab-routeros-ccr2004-wireguard-parmigiano-preshared-key
          routeros_provider_network:
            name: CLOUD-EXTERNAL
            interface: vlan40-external
            vlan_id: 40
            bridge: bridge-lan
            trunk: ether15
            address: 10.21.40.1/24
            network: 10.21.40.0/24
            nat_address_list: INFRA-LAN-NAT
            wan_interface_list: INFRA-WAN
            trusted_interface: vlan10-trusted
            forward_chain: infra-forward
            final_drop_comment: "infra: forward final drop"
          routeros_access_rules:
            - comment: "infra: SERVERS to CAPI management API"
              chain: infra-forward
              final_drop_comment: "infra: forward final drop"
              source_interface: vlan20-servers
              destination: 10.21.40.0/24
              protocol: tcp
              destination_port: "6443"
            - comment: "infra: CLOUD-EXTERNAL DNS UDP"
              chain: infra-input
              final_drop_comment: "infra: input final drop"
              source_interface: vlan40-external
              protocol: udp
              destination_port: "53"
            - comment: "infra: CLOUD-EXTERNAL DNS TCP"
              chain: infra-input
              final_drop_comment: "infra: input final drop"
              source_interface: vlan40-external
              protocol: tcp
              destination_port: "53"
            - comment: "infra: CLOUD-EXTERNAL to private cloud APIs"
              chain: infra-forward
              final_drop_comment: "infra: forward final drop"
              source_interface: vlan40-external
              destination: 10.21.20.130
              protocol: tcp
              destination_port: "80,443"
            - comment: "infra: WireGuard DNS UDP"
              chain: infra-input
              final_drop_comment: "infra: input final drop"
              source_interface: wg-admin
              destination: 10.21.91.1
              protocol: udp
              destination_port: "53"
            - comment: "infra: WireGuard DNS TCP"
              chain: infra-input
              final_drop_comment: "infra: input final drop"
              source_interface: wg-admin
              destination: 10.21.91.1
              protocol: tcp
              destination_port: "53"
            - comment: "infra: WireGuard CCR management"
              chain: infra-input
              final_drop_comment: "infra: input final drop"
              source_interface: wg-admin
              destination: 10.21.91.1
              protocol: tcp
              destination_port: "22,8291"
            - comment: "infra: WireGuard pecorino SSH"
              chain: infra-forward
              final_drop_comment: "infra: forward final drop"
              source_interface: wg-admin
              destination: 10.21.20.10
              protocol: tcp
              destination_port: "22"
            - comment: "infra: WireGuard taleggio SSH"
              chain: infra-forward
              final_drop_comment: "infra: forward final drop"
              source_interface: wg-admin
              destination: 10.21.20.11
              protocol: tcp
              destination_port: "22"
            - comment: "infra: WireGuard asiago SSH"
              chain: infra-forward
              final_drop_comment: "infra: forward final drop"
              source_interface: wg-admin
              destination: 10.21.20.12
              protocol: tcp
              destination_port: "22"
            - comment: "infra: WireGuard undercloud API"
              chain: infra-forward
              final_drop_comment: "infra: forward final drop"
              source_interface: wg-admin
              destination: 10.21.20.128
              protocol: tcp
              destination_port: "6443"
            - comment: "infra: WireGuard private HTTPS"
              chain: infra-forward
              final_drop_comment: "infra: forward final drop"
              source_interface: wg-admin
              destination: 10.21.20.130/31
              protocol: tcp
              destination_port: "443"
            - comment: "infra: WireGuard CAPI management API"
              chain: infra-forward
              final_drop_comment: "infra: forward final drop"
              source_interface: wg-admin
              destination: 10.21.40.100
              protocol: tcp
              destination_port: "6443"
            - comment: "infra: WireGuard CRS management"
              chain: infra-forward
              final_drop_comment: "infra: forward final drop"
              source_interface: wg-admin
              destination: 10.21.90.2
              protocol: tcp
              destination_port: "22,8291"
            - comment: "infra: WireGuard PiKVM management"
              chain: infra-forward
              final_drop_comment: "infra: forward final drop"
              source_interface: wg-admin
              destination: 10.21.90.3
              protocol: tcp
              destination_port: "22,443"
            - comment: "infra: WireGuard Omada management"
              chain: infra-forward
              final_drop_comment: "infra: forward final drop"
              source_interface: wg-admin
              destination: 10.21.90.4/31
              protocol: tcp
              destination_port: "443"
          routeros_port_forwards:
            - comment: "infra: Syncthing parmigiano TCP"
              in_interface_list: INFRA-WAN
              protocol: tcp
              destination_port: "22000"
              to_address: 10.21.10.20
              to_port: "22000"
            - comment: "infra: Syncthing parmigiano QUIC"
              in_interface_list: INFRA-WAN
              protocol: udp
              destination_port: "22000"
              to_address: 10.21.10.20
              to_port: "22000"
          routeros_static_leases:
            - comment: "infra: primary admin workstation"
              mac_address: 60:CF:84:ED:E9:1E
              address: 10.21.10.20
              server: dhcp-trusted
            - comment: "infra: Hue Bridge"
              mac_address: EC:B5:FA:8E:DB:63
              address: 10.21.50.121
              server: dhcp-iot
            - comment: "infra: PiKVM ricotta"
              mac_address: 2C:CF:67:9D:A2:F7
              address: 10.21.90.3
              server: dhcp-management
            - comment: "infra: Omada switch"
              mac_address: 98:25:4A:CB:BF:BE
              address: 10.21.90.5
              server: dhcp-management
