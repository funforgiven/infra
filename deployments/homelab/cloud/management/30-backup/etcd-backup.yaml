apiVersion: v1
kind: Namespace
metadata:
  name: management-backup
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: management-etcd-backup
  namespace: management-backup
spec:
  schedule: "*/5 * * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  suspend: false
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 900
      backoffLimit: 2
      ttlSecondsAfterFinished: 604800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: management-etcd-backup
            app.kubernetes.io/part-of: management-recovery
        spec:
          automountServiceAccountToken: false
          restartPolicy: Never
          nodeSelector:
            node-role.kubernetes.io/etcd: "true"
          tolerations:
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
              effect: NoSchedule
          securityContext:
            fsGroup: 65532
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            - name: encrypt
              image: ghcr.io/getsops/sops@sha256:72c9964902e93643d7f52e86a854ce3c088e0c8aa0c37ad7b2b74f8d8d591429
              command:
                - /bin/sh
                - -ec
              args:
                - |
                  snapshot="$(ls -1t /snapshots/management-etcd-* | head -n 1)"
                  test -s "${snapshot}"
                  sops \
                    --config /dev/null \
                    encrypt \
                    --input-type binary \
                    --output-type binary \
                    --output /encrypted/snapshot.zip.sops.json \
                    "${snapshot}"
                  chmod 0444 /encrypted/snapshot.zip.sops.json
              env:
                - name: SOPS_AGE_RECIPIENTS
                  value: age1rq6wyxcxyl9xysuy7n3lzx33n2gctk2wzqgx3dfysg3c8vckl4es3pk27d
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                readOnlyRootFilesystem: true
                runAsGroup: 0
                runAsNonRoot: false
                runAsUser: 0
              volumeMounts:
                - name: snapshots
                  mountPath: /snapshots
                  readOnly: true
                - name: encrypted
                  mountPath: /encrypted
          containers:
            - name: upload
              image: public.ecr.aws/aws-cli/aws-cli@sha256:aaa7c2e17bace2c0cad977a85b64022248018148f7a936b44315afe2c61dfa91
              command:
                - /bin/sh
                - -ec
              args:
                - |
                  test -s /encrypted/snapshot.zip.sops.json
                  ciphertext_sha256="$(sha256sum /encrypted/snapshot.zip.sops.json | awk '{print $1}')"
                  exec aws s3api put-object \
                    --endpoint-url https://s3.us-west-004.backblazeb2.com \
                    --region us-west-004 \
                    --bucket fahrican-cloud-recovery \
                    --key management/etcd/snapshot.zip.sops.json \
                    --body /encrypted/snapshot.zip.sops.json \
                    --content-type application/json \
                    --server-side-encryption AES256 \
                    --metadata "ciphertext-sha256=${ciphertext_sha256}" \
                    --no-cli-pager >/dev/null
              env:
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: b2-management-backup-writer
                      key: AWS_ACCESS_KEY_ID
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: b2-management-backup-writer
                      key: AWS_SECRET_ACCESS_KEY
                - name: AWS_CONFIG_FILE
                  value: /dev/null
                - name: AWS_SHARED_CREDENTIALS_FILE
                  value: /dev/null
                - name: AWS_EC2_METADATA_DISABLED
                  value: "true"
                - name: AWS_REQUEST_CHECKSUM_CALCULATION
                  value: when_required
                - name: AWS_RETRY_MODE
                  value: standard
                - name: AWS_MAX_ATTEMPTS
                  value: "5"
                - name: HOME
                  value: /tmp
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                readOnlyRootFilesystem: true
                runAsGroup: 65532
                runAsNonRoot: true
                runAsUser: 65532
              volumeMounts:
                - name: encrypted
                  mountPath: /encrypted
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: snapshots
              hostPath:
                path: /var/lib/rancher/k3s/server/db/snapshots
                type: Directory
            - name: encrypted
              emptyDir:
                sizeLimit: 1Gi
            - name: tmp
              emptyDir:
                sizeLimit: 64Mi
