apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: wave30-management-backup
  namespace: flux-system
spec:
  suspend: true
  interval: 10m
  retryInterval: 1m
  timeout: 30m
  path: ./deployments/homelab/cloud/management/30-backup
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  healthChecks:
    - apiVersion: batch/v1
      kind: CronJob
      name: management-etcd-backup
      namespace: management-backup
  healthCheckExprs:
    - apiVersion: batch/v1
      kind: CronJob
      current: has(status.lastSuccessfulTime)
      failed: "false"
