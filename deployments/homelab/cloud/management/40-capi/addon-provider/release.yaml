apiVersion: v1
kind: Namespace
metadata:
  name: capi-addon-system
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cluster-api-addon-provider
  namespace: capi-addon-system
spec:
  interval: 30m
  timeout: 10m
  releaseName: cluster-api-addon-provider
  chart:
    spec:
      chart: ./chart
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: cluster-api-addon-provider
        namespace: flux-system
  driftDetection:
    mode: enabled
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    image:
      repository: ghcr.io/azimuth-cloud/cluster-api-addon-provider
      tag: 0.12.1@sha256:40f01c5252674335b16b22f97dd332d0d1c5c7a2ea25f62dcd51285c5439b3a8
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 256Mi
