apiVersion: v1
kind: Namespace
metadata:
  name: capi-qualification
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: capi-readiness
  namespace: capi-qualification
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: capi-readiness
rules:
  - apiGroups:
      - apiextensions.k8s.io
    resources:
      - customresourcedefinitions
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - ""
    resources:
      - endpoints
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: capi-readiness
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: capi-readiness
subjects:
  - kind: ServiceAccount
    name: capi-readiness
    namespace: capi-qualification
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: capi-admission-qualification
  namespace: capi-qualification
rules:
  - apiGroups:
      - cluster.x-k8s.io
    resources:
      - clusters
    verbs:
      - create
  - apiGroups:
      - bootstrap.cluster.x-k8s.io
    resources:
      - kubeadmconfigs
    verbs:
      - create
  - apiGroups:
      - infrastructure.cluster.x-k8s.io
    resources:
      - openstackclusters
    verbs:
      - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: capi-admission-qualification
  namespace: capi-qualification
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: capi-admission-qualification
subjects:
  - kind: ServiceAccount
    name: capi-readiness
    namespace: capi-qualification
---
apiVersion: batch/v1
kind: Job
metadata:
  name: capi-readiness-1-13-3-0-14-6
  namespace: capi-qualification
spec:
  activeDeadlineSeconds: 600
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: capi-readiness
    spec:
      serviceAccountName: capi-readiness
      automountServiceAccountToken: true
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: readiness
          image: registry.k8s.io/kubectl:v1.35.4@sha256:e8bc9c71a813d90d5f7689fa57516b2aacd7a02bb9d70d3ab6664ed6d202fc10
          command:
            - /bin/sh
            - -ec
          args:
            - |
              for crd in \
                clusters.cluster.x-k8s.io \
                kubeadmconfigs.bootstrap.cluster.x-k8s.io \
                kubeadmcontrolplanes.controlplane.cluster.x-k8s.io \
                openstackclusters.infrastructure.cluster.x-k8s.io \
                images.openstack.k-orc.cloud \
                helmreleases.addons.stackhpc.com \
                manifests.addons.stackhpc.com; do
                kubectl wait \
                  --for=condition=Established \
                  --timeout=300s \
                  "crd/${crd}"
              done

              for endpoint in \
                capi-system/capi-webhook-service \
                capi-kubeadm-bootstrap-system/capi-kubeadm-bootstrap-webhook-service \
                capi-kubeadm-control-plane-system/capi-kubeadm-control-plane-webhook-service \
                capo-system/capo-webhook-service; do
                namespace="${endpoint%/*}"
                name="${endpoint#*/}"
                test -n "$(kubectl get endpoints "$name" -n "$namespace" \
                  -o jsonpath='{.subsets[0].addresses[0].ip}')"
              done

              kubectl api-resources --api-group=cluster.x-k8s.io \
                | grep -q '^clusters'
              kubectl api-resources --api-group=infrastructure.cluster.x-k8s.io \
                | grep -q '^openstackclusters'
              kubectl api-resources --api-group=openstack.k-orc.cloud \
                | grep -q '^images'
              kubectl api-resources --api-group=addons.stackhpc.com \
                | grep -q '^helmreleases'

              kubectl create --dry-run=server -o name -f - >/dev/null <<'EOF'
              apiVersion: cluster.x-k8s.io/v1beta1
              kind: Cluster
              metadata:
                name: qualification
                namespace: capi-qualification
              spec: {}
              ---
              apiVersion: bootstrap.cluster.x-k8s.io/v1beta1
              kind: KubeadmConfig
              metadata:
                name: qualification
                namespace: capi-qualification
              spec: {}
              ---
              apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
              kind: OpenStackCluster
              metadata:
                name: qualification
                namespace: capi-qualification
              spec:
                identityRef:
                  cloudName: qualification
                  name: qualification
              EOF
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 65532
            runAsUser: 65532
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
