apiVersion: v1
kind: Namespace
metadata:
  name: capi-qualification
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: capi-readiness
  namespace: capi-qualification
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: capi-readiness
rules:
  - apiGroups:
      - apiextensions.k8s.io
    resources:
      - customresourcedefinitions
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: capi-readiness
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: capi-readiness
subjects:
  - kind: ServiceAccount
    name: capi-readiness
    namespace: capi-qualification
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: capi-admission-qualification
  namespace: capi-qualification
rules:
  - apiGroups:
      - cluster.x-k8s.io
    resources:
      - clusters
    verbs:
      - create
  - apiGroups:
      - bootstrap.cluster.x-k8s.io
    resources:
      - kubeadmconfigs
    verbs:
      - create
  - apiGroups:
      - controlplane.cluster.x-k8s.io
    resources:
      - kubeadmcontrolplanes
    verbs:
      - create
  - apiGroups:
      - infrastructure.cluster.x-k8s.io
    resources:
      - openstackclusters
    verbs:
      - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: capi-admission-qualification
  namespace: capi-qualification
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: capi-admission-qualification
subjects:
  - kind: ServiceAccount
    name: capi-readiness
    namespace: capi-qualification
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: capi-admission-qualification
  namespace: capi-qualification
data:
  resources.yaml: |
    apiVersion: cluster.x-k8s.io/v1beta1
    kind: Cluster
    metadata:
      name: qualification
      namespace: capi-qualification
    spec: {}
    ---
    apiVersion: bootstrap.cluster.x-k8s.io/v1beta1
    kind: KubeadmConfig
    metadata:
      name: qualification
      namespace: capi-qualification
    spec: {}
    ---
    apiVersion: controlplane.cluster.x-k8s.io/v1beta1
    kind: KubeadmControlPlane
    metadata:
      name: qualification
      namespace: capi-qualification
    spec:
      version: v1.35.4
      machineTemplate:
        infrastructureRef:
          apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
          kind: OpenStackMachineTemplate
          name: qualification
      kubeadmConfigSpec: {}
    ---
    apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
    kind: OpenStackCluster
    metadata:
      name: qualification
      namespace: capi-qualification
    spec:
      identityRef:
        cloudName: qualification
        name: qualification
---
apiVersion: batch/v1
kind: Job
metadata:
  name: capi-readiness-1-13-3-0-14-6-r2
  namespace: capi-qualification
spec:
  activeDeadlineSeconds: 600
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: capi-readiness
    spec:
      serviceAccountName: capi-readiness
      automountServiceAccountToken: true
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsGroup: 65532
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-crds
          image: registry.k8s.io/kubectl:v1.35.4@sha256:e8bc9c71a813d90d5f7689fa57516b2aacd7a02bb9d70d3ab6664ed6d202fc10
          args:
            - wait
            - --for=condition=Established
            - --timeout=300s
            - crd/clusters.cluster.x-k8s.io
            - crd/kubeadmconfigs.bootstrap.cluster.x-k8s.io
            - crd/kubeadmcontrolplanes.controlplane.cluster.x-k8s.io
            - crd/openstackclusters.infrastructure.cluster.x-k8s.io
            - crd/images.openstack.k-orc.cloud
            - crd/helmreleases.addons.stackhpc.com
            - crd/manifests.addons.stackhpc.com
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
        - name: discover-orc-api
          image: registry.k8s.io/kubectl:v1.35.4@sha256:e8bc9c71a813d90d5f7689fa57516b2aacd7a02bb9d70d3ab6664ed6d202fc10
          args:
            - get
            - --raw=/apis/openstack.k-orc.cloud/v1alpha1
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
        - name: discover-addon-api
          image: registry.k8s.io/kubectl:v1.35.4@sha256:e8bc9c71a813d90d5f7689fa57516b2aacd7a02bb9d70d3ab6664ed6d202fc10
          args:
            - get
            - --raw=/apis/addons.stackhpc.com/v1alpha1
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
      containers:
        - name: admission
          image: registry.k8s.io/kubectl:v1.35.4@sha256:e8bc9c71a813d90d5f7689fa57516b2aacd7a02bb9d70d3ab6664ed6d202fc10
          args:
            - create
            - --dry-run=server
            - --output=name
            - --filename=/qualification/resources.yaml
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: qualification
              mountPath: /qualification
              readOnly: true
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
        - name: qualification
          configMap:
            name: capi-admission-qualification
