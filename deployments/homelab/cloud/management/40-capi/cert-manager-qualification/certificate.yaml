apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: cert-manager-qualification
  namespace: cert-manager
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: cert-manager-qualification
  namespace: cert-manager
spec:
  secretName: cert-manager-qualification-tls
  commonName: cert-manager-qualification.internal
  dnsNames:
    - cert-manager-qualification.internal
  duration: 24h
  renewBefore: 8h
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    kind: Issuer
    name: cert-manager-qualification
