apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns-custom
  namespace: kube-system
data:
  cloud.server: |
    cloud.fahrican.com:53 {
        errors
        cache 30
        forward . 10.21.40.1
    }
---
apiVersion: batch/v1
kind: Job
metadata:
  name: management-private-dns-v1
  namespace: kube-system
spec:
  activeDeadlineSeconds: 600
  backoffLimit: 2
  template:
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      containers:
        - name: qualify
          image: docker.io/library/busybox:1.38.0@sha256:dc2d74b28e4cf8984fa52af1f39bc7d3c73760b41a74d629f5d11b1ab28616
          command:
            - /bin/sh
            - -ec
            - |
              for attempt in $(seq 1 120); do
                address="$(
                  nslookup identity.cloud.fahrican.com 10.243.0.10 |
                    awk '/^Address: / { value=$2 } END { print value }'
                )"
                if [ "$address" = 10.21.20.130 ] &&
                   nc -z -w 3 identity.cloud.fahrican.com 80; then
                  exit 0
                fi
                test "$attempt" -lt 120
                sleep 5
              done
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 65534
            runAsNonRoot: true
            runAsUser: 65534
            seccompProfile:
              type: RuntimeDefault
