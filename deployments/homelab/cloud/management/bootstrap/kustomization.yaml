apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../undercloud/20-gitops/flux-system
patches:
  - target:
      group: kustomize.toolkit.fluxcd.io
      version: v1
      kind: Kustomization
      name: flux-system
    patch: |-
      - op: replace
        path: /spec/path
        value: ./deployments/homelab/cloud/management
