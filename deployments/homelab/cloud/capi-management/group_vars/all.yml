---
ansible_user: ubuntu
ansible_python_interpreter: /usr/bin/python3
ansible_ssh_private_key_file: /run/secrets/github-ssh-key
ansible_ssh_common_args: >-
  -o BatchMode=yes
  -o IdentitiesOnly=yes
  -o IdentityAgent=none
  -o StrictHostKeyChecking=yes
  -o GlobalKnownHostsFile=/dev/null
  -o UserKnownHostsFile={{ inventory_dir }}/ssh_known_hosts

k3s_api_dns_name: capi-management.cloud.fahrican.com
k3s_api_floating_ip: 10.21.40.100
k3s_api_vip: 192.168.70.10
k3s_bootstrap_address: 192.168.70.11
k3s_cluster_cidr: 10.242.0.0/16
k3s_service_cidr: 10.243.0.0/16
k3s_token_file: /run/secrets/management-k3s-token
zitadel_issuer: https://auth.cloud.fahrican.com
zitadel_kubernetes_client_id: "385436919296901136"
zitadel_role_claim: urn:zitadel:iam:org:project:385436919212818448:roles
