apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - valheim.yaml
  - network-policy.yaml
  - monitoring.yaml
configMapGenerator:
  - name: valheim-bootstrap
    namespace: games
    files:
      - install.sh
      - prepare-identity.sh
      - start.sh
      - start-game.sh
      - ready.py
      - backup.sh
      - verify-backup.sh
      - supervisord.conf
