apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: wallos
  namespace: finance
spec:
  parentRefs:
    - name: services
      namespace: services-network
      sectionName: https
  hostnames:
    - wallos.fahrican.com
  rules:
    - filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Strict-Transport-Security
                value: max-age=31536000
      backendRefs:
        - name: wallos
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: wallos-database
  namespace: finance
spec:
  parentRefs:
    - name: services
      namespace: services-network
      sectionName: https
  hostnames:
    - wallos.fahrican.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /db
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Strict-Transport-Security
                value: max-age=31536000
      backendRefs:
        - name: wallos
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: wallos-health
  namespace: finance
spec:
  parentRefs:
    - name: services
      namespace: services-network
      sectionName: https
  hostnames:
    - wallos.fahrican.com
  rules:
    - matches:
        - path:
            type: Exact
            value: /health.php
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Strict-Transport-Security
                value: max-age=31536000
      backendRefs:
        - name: wallos
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: wallos-admin-auth
  namespace: finance
spec:
  parentRefs:
    - name: services
      namespace: services-network
      sectionName: https
  hostnames:
    - wallos.fahrican.com
  rules:
    - matches:
        - path:
            type: Exact
            value: /registration.php
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Strict-Transport-Security
                value: max-age=31536000
      backendRefs:
        - name: wallos
          port: 80
    - matches:
        - method: POST
          path:
            type: Exact
            value: /login.php
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Strict-Transport-Security
                value: max-age=31536000
      backendRefs:
        - name: wallos
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: wallos-http
  namespace: finance
spec:
  parentRefs:
    - name: services
      namespace: services-network
      sectionName: http
  hostnames:
    - wallos.fahrican.com
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: wallos-database-deny
  namespace: finance
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: wallos-database
  authorization:
    defaultAction: Deny
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: wallos-private
  namespace: finance
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: wallos
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: wallos-http
  authorization:
    defaultAction: Deny
    rules:
      - action: Allow
        principal:
          clientCIDRs:
            - 10.21.10.0/24
            - 10.21.91.0/24
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: wallos-admin-auth
  namespace: finance
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: wallos-admin-auth
  authorization:
    defaultAction: Deny
    rules:
      - action: Allow
        principal:
          clientCIDRs:
            - 10.21.91.0/24
