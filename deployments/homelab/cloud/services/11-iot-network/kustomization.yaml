apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- vendor/multus.yaml
- node-network.yaml
images:
- name: ghcr.io/k8snetworkplumbingwg/multus-cni
  newTag: v4.3.1-thick
  digest: sha256:a357a79359b80ddd5f4699117946cacf3b54f5baecf7944535594863e875fc25
patches:
- target:
    kind: DaemonSet
    name: kube-multus-ds
  patch: |
    apiVersion: apps/v1
    kind: DaemonSet
    metadata:
      name: kube-multus-ds
      namespace: kube-system
    spec:
      template:
        spec:
          containers:
          - name: kube-multus
            resources:
              limits:
                cpu: 500m
                memory: 256Mi
              requests:
                cpu: 20m
                memory: 64Mi
- target:
    kind: ClusterRole
    name: multus
  patch: '[{"op": "replace", "path": "/rules/0", "value": {"apiGroups": ["k8s.cni.cncf.io"], "resources":
    ["network-attachment-definitions"], "verbs": ["get", "list", "watch"]}}]'
