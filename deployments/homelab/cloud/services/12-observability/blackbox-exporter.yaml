apiVersion: v1
kind: ConfigMap
metadata:
  name: blackbox-exporter
  namespace: services-observability
data:
  config.yaml: |
    modules:
      gitlab_registry:
        prober: http
        timeout: 15s
        http:
          preferred_ip_protocol: ip4
          follow_redirects: false
          valid_status_codes: [401]
          fail_if_header_not_matches:
            - header: Docker-Distribution-Api-Version
              regexp: registry/2.0
      http_2xx:
        prober: http
        timeout: 15s
        http:
          follow_redirects: true
          preferred_ip_protocol: ip4
      tcp_connect:
        prober: tcp
        timeout: 10s
        tcp:
          preferred_ip_protocol: ip4
---
apiVersion: v1
kind: Service
metadata:
  name: blackbox-exporter
  namespace: services-observability
  labels:
    app.kubernetes.io/name: blackbox-exporter
spec:
  selector:
    app.kubernetes.io/name: blackbox-exporter
  ports:
    - name: http
      port: 9115
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: blackbox-exporter
  namespace: services-observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: blackbox-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: blackbox-exporter
        app.kubernetes.io/part-of: self-hosted-platform
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsGroup: 65534
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: blackbox-exporter
          image: quay.io/prometheus/blackbox-exporter:v0.28.0@sha256:e753ff9f3fc458d02cca5eddab5a77e1c175eee484a8925ac7d524f04366c2fc
          args:
            - --config.file=/etc/blackbox/config.yaml
            - --config.enable-auto-reload
            - --web.listen-address=:9115
          ports:
            - name: http
              containerPort: 9115
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: config
              mountPath: /etc/blackbox
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: blackbox-exporter
