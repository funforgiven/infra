apiVersion: v1
kind: Service
metadata:
  name: matrix-postgres
  namespace: matrix
  labels:
    app.kubernetes.io/name: matrix-postgres
spec:
  selector:
    app.kubernetes.io/name: matrix-postgres
  ports:
  - name: postgres
    port: 5432
    targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: matrix-postgres
  namespace: matrix
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: matrix-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: matrix-postgres
        app.kubernetes.io/part-of: matrix
      annotations:
        backup.velero.io/backup-volumes-excludes: data
        backup.velero.io/backup-volumes: dumps
        pre.hook.backup.velero.io/container: dumps
        pre.hook.backup.velero.io/command: '["python", "/scripts/backup.py"]'
        pre.hook.backup.velero.io/on-error: Fail
        pre.hook.backup.velero.io/timeout: 10m
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
      - name: matrix-registry
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: DoesNotExist
      containers:
      - name: postgres
        image: git.fahrican.com/forge-runner/matrix-runtime:1.0.0
        command:
        - python
        - /scripts/postgres.py
        ports:
        - name: postgres
          containerPort: 5432
        securityContext: &id001
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            memory: 2Gi
        volumeMounts:
        - name: tmp
          mountPath: /tmp
          readOnly: false
        - name: runtime
          mountPath: /run/matrix
          readOnly: true
        - name: scripts
          mountPath: /scripts
          readOnly: true
        - name: data
          mountPath: /var/lib/matrix/postgres
          readOnly: false
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -h
            - 127.0.0.1
            - -U
            - postgres
          periodSeconds: 10
        startupProbe:
          exec:
            command:
            - pg_isready
            - -h
            - 127.0.0.1
            - -U
            - postgres
          failureThreshold: 60
          periodSeconds: 10
      - name: dumps
        image: git.fahrican.com/forge-runner/matrix-runtime:1.0.0
        command:
        - bash
        - -c
        - while true; do sleep 3600; done
        ports: []
        securityContext: *id001
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 2Gi
        volumeMounts:
        - name: tmp
          mountPath: /tmp
          readOnly: false
        - name: runtime
          mountPath: /run/matrix
          readOnly: true
        - name: scripts
          mountPath: /scripts
          readOnly: true
        - name: dumps
          mountPath: /var/lib/matrix/dumps
          readOnly: false
      volumes:
      - name: tmp
        emptyDir: {}
      - name: runtime
        secret:
          secretName: matrix-runtime
          items:
          - key: postgres-password
            path: postgres-password
          - key: synapse-password
            path: synapse-password
          - key: mas-password
            path: mas-password
          defaultMode: 416
      - name: scripts
        configMap:
          name: matrix-scripts
      - name: data
        persistentVolumeClaim:
          claimName: matrix-postgres
      - name: dumps
        persistentVolumeClaim:
          claimName: matrix-dumps
  serviceName: matrix-postgres
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
---
apiVersion: v1
kind: Service
metadata:
  name: matrix-synapse
  namespace: matrix
  labels:
    app.kubernetes.io/name: matrix-synapse
spec:
  selector:
    app.kubernetes.io/name: matrix-synapse
  ports:
  - name: http
    port: 8008
    targetPort: http
  - name: metrics
    port: 9000
    targetPort: metrics
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: matrix-synapse
  namespace: matrix
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: matrix-synapse
  template:
    metadata:
      labels:
        app.kubernetes.io/name: matrix-synapse
        app.kubernetes.io/part-of: matrix
      annotations:
        backup.velero.io/backup-volumes: media
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
      - name: matrix-registry
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: DoesNotExist
      containers:
      - name: synapse
        image: git.fahrican.com/forge-runner/matrix-runtime:1.0.0
        command:
        - synapse_homeserver
        - --config-path
        - /run/matrix/synapse.yaml
        ports:
        - name: http
          containerPort: 8008
        - name: metrics
          containerPort: 9000
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            memory: 2Gi
        volumeMounts:
        - name: tmp
          mountPath: /tmp
          readOnly: false
        - name: runtime
          mountPath: /run/matrix
          readOnly: true
        - name: scripts
          mountPath: /scripts
          readOnly: true
        - name: media
          mountPath: /var/lib/matrix/media
          readOnly: false
        readinessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 60
          periodSeconds: 30
        startupProbe:
          httpGet:
            path: /health
            port: http
          failureThreshold: 60
          periodSeconds: 10
      volumes:
      - name: tmp
        emptyDir: {}
      - name: runtime
        secret:
          secretName: matrix-runtime
          items:
          - key: synapse.yaml
            path: synapse.yaml
          - key: signing.key
            path: signing.key
          defaultMode: 416
      - name: scripts
        configMap:
          name: matrix-scripts
      - name: media
        persistentVolumeClaim:
          claimName: matrix-media
  serviceName: matrix-synapse
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
---
