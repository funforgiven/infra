apiVersion: batch/v1
kind: CronJob
metadata:
  name: matrix-database-backup
  namespace: matrix
spec:
  schedule: 15 1 * * *
  timeZone: Europe/Istanbul
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 900
      template:
        metadata:
          labels:
            app.kubernetes.io/name: matrix-backup
            app.kubernetes.io/part-of: matrix
          annotations: {}
        spec:
          automountServiceAccountToken: false
          imagePullSecrets:
          - name: matrix-registry
          securityContext:
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
              - topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: matrix-postgres
          containers:
          - name: backup
            image: git.fahrican.com/forge-runner/matrix-runtime:1.0.0
            command:
            - python
            - /scripts/backup.py
            ports: []
            securityContext:
              allowPrivilegeEscalation: false
              runAsNonRoot: true
              runAsUser: 1000
              runAsGroup: 1000
              capabilities:
                drop:
                - ALL
              readOnlyRootFilesystem: true
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 2Gi
            volumeMounts:
            - name: tmp
              mountPath: /tmp
              readOnly: false
            - name: runtime
              mountPath: /run/matrix
              readOnly: true
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: dumps
              mountPath: /var/lib/matrix/dumps
              readOnly: false
          volumes:
          - name: tmp
            emptyDir: {}
          - name: runtime
            secret:
              secretName: matrix-runtime
              items:
              - key: synapse-password
                path: synapse-password
              - key: mas-password
                path: mas-password
              defaultMode: 416
          - name: scripts
            configMap:
              name: matrix-scripts
          - name: dumps
            persistentVolumeClaim:
              claimName: matrix-dumps
          restartPolicy: OnFailure
