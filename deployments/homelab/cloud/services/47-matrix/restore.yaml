apiVersion: v1
kind: ConfigMap
metadata:
  name: matrix-restore-modifiers
  namespace: velero
data:
  resource-modifiers.yaml: |
    version: v1
    resourceModifierRules:
    - conditions:
        groupResource: persistentvolumeclaims
        namespaces:
        - matrix
      patches:
      - operation: remove
        path: /spec/volumeName
    - conditions:
        groupResource: pods
        resourceNameRegex: ^matrix-postgres-0$
        namespaces:
        - matrix
      patches:
      - operation: test
        path: /spec/initContainers/0/name
        value: restore-wait
      - operation: move
        from: /spec/initContainers/0
        path: /matrixRestoreHelper
      - operation: replace
        path: /spec
        value: |-
          {
            "automountServiceAccountToken": false,
            "restartPolicy": "Never",
            "imagePullSecrets": [
              {
                "name": "matrix-registry"
              }
            ],
            "affinity": {
              "podAffinity": {
                "requiredDuringSchedulingIgnoredDuringExecution": [
                  {
                    "topologyKey": "kubernetes.io/hostname",
                    "labelSelector": {
                      "matchLabels": {
                        "matrix.fahrican.com/restore-cohort": "matrix"
                      }
                    }
                  }
                ]
              }
            },
            "securityContext": {
              "fsGroup": 1000,
              "seccompProfile": {
                "type": "RuntimeDefault"
              }
            },
            "containers": [
              {
                "name": "restore-sleeper",
                "image": "git.fahrican.com/forge-runner/matrix-runtime:1.0.0@sha256:e2ffcf80e22d306b0fa2868fa40d661e6f7409a9eb8915d355c41a1f612085bd",
                "command": [
                  "sleep",
                  "infinity"
                ],
                "securityContext": {
                  "runAsNonRoot": true,
                  "runAsUser": 1000,
                  "runAsGroup": 1000,
                  "allowPrivilegeEscalation": false,
                  "readOnlyRootFilesystem": true,
                  "capabilities": {
                    "drop": [
                      "ALL"
                    ]
                  }
                },
                "resources": {
                  "requests": {
                    "cpu": "10m",
                    "memory": "32Mi"
                  },
                  "limits": {
                    "memory": "128Mi"
                  }
                },
                "volumeMounts": [
                  {
                    "name": "dumps",
                    "mountPath": "/recovery"
                  }
                ]
              }
            ],
            "volumes": [
              {
                "name": "dumps",
                "persistentVolumeClaim": {
                  "claimName": "matrix-dumps"
                }
              }
            ],
            "initContainers": []
          }
      - operation: move
        from: /matrixRestoreHelper
        path: /spec/initContainers/0
      - operation: add
        path: /metadata/labels/matrix.fahrican.com~1restore-cohort
        value: '"matrix"'
      - operation: add
        path: /metadata/annotations
        value: '{}'
      - operation: add
        path: /metadata/ownerReferences
        value: '[]'
      - operation: add
        path: /spec/initContainers/0/securityContext
        value: '{"runAsNonRoot": true, "runAsUser": 1000, "runAsGroup": 1000, "allowPrivilegeEscalation":
          false, "readOnlyRootFilesystem": true, "capabilities": {"drop": ["ALL"]}}'
    - conditions:
        groupResource: pods
        resourceNameRegex: ^matrix-synapse-0$
        namespaces:
        - matrix
      patches:
      - operation: test
        path: /spec/initContainers/0/name
        value: restore-wait
      - operation: move
        from: /spec/initContainers/0
        path: /matrixRestoreHelper
      - operation: replace
        path: /spec
        value: |-
          {
            "automountServiceAccountToken": false,
            "restartPolicy": "Never",
            "imagePullSecrets": [
              {
                "name": "matrix-registry"
              }
            ],
            "affinity": {
              "podAffinity": {
                "requiredDuringSchedulingIgnoredDuringExecution": [
                  {
                    "topologyKey": "kubernetes.io/hostname",
                    "labelSelector": {
                      "matchLabels": {
                        "matrix.fahrican.com/restore-cohort": "matrix"
                      }
                    }
                  }
                ]
              }
            },
            "securityContext": {
              "fsGroup": 1000,
              "seccompProfile": {
                "type": "RuntimeDefault"
              }
            },
            "containers": [
              {
                "name": "restore-sleeper",
                "image": "git.fahrican.com/forge-runner/matrix-runtime:1.0.0@sha256:e2ffcf80e22d306b0fa2868fa40d661e6f7409a9eb8915d355c41a1f612085bd",
                "command": [
                  "sleep",
                  "infinity"
                ],
                "securityContext": {
                  "runAsNonRoot": true,
                  "runAsUser": 1000,
                  "runAsGroup": 1000,
                  "allowPrivilegeEscalation": false,
                  "readOnlyRootFilesystem": true,
                  "capabilities": {
                    "drop": [
                      "ALL"
                    ]
                  }
                },
                "resources": {
                  "requests": {
                    "cpu": "10m",
                    "memory": "32Mi"
                  },
                  "limits": {
                    "memory": "128Mi"
                  }
                },
                "volumeMounts": [
                  {
                    "name": "media",
                    "mountPath": "/recovery"
                  }
                ]
              }
            ],
            "volumes": [
              {
                "name": "media",
                "persistentVolumeClaim": {
                  "claimName": "matrix-media"
                }
              }
            ],
            "initContainers": []
          }
      - operation: move
        from: /matrixRestoreHelper
        path: /spec/initContainers/0
      - operation: add
        path: /metadata/labels/matrix.fahrican.com~1restore-cohort
        value: '"matrix"'
      - operation: add
