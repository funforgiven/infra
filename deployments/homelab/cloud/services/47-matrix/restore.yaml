            "affinity": {
              "podAffinity": {
                "requiredDuringSchedulingIgnoredDuringExecution": [
                  {
                    "topologyKey": "kubernetes.io/hostname",
                    "labelSelector": {
                      "matchLabels": {
                        "matrix.fahrican.com/restore-cohort": "matrix"
                      }
                    }
                  }
                ]
              }
            },
            "securityContext": {
              "fsGroup": 1000,
              "seccompProfile": {
                "type": "RuntimeDefault"
              }
            },
            "containers": [
              {
                "name": "restore-sleeper",
                "image": "git.fahrican.com/forge-runner/matrix-runtime:1.0.0@sha256:e2ffcf80e22d306b0fa2868fa40d661e6f7409a9eb8915d355c41a1f612085bd",
                "command": [
                  "sleep",
                  "infinity"
                ],
                "securityContext": {
