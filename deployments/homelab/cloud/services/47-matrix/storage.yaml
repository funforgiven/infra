apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: matrix-postgres
  namespace: matrix
  labels:
    app.kubernetes.io/name: matrix-postgres
    app.kubernetes.io/part-of: matrix
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: rbd1
  resources:
    requests:
      storage: 20Gi
---
