apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: matrix-postgres
  namespace: matrix
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: matrix-postgres
  policyTypes:
  - Ingress
  - Egress
  egress:
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: matrix-postgres
    ports:
    - protocol: TCP
      port: 5432
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: matrix-synapse
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: matrix-mas
    - podSelector:
        matchLabels:
