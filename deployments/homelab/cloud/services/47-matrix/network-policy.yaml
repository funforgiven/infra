apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: matrix-default-deny
  namespace: matrix
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: matrix-dns
  namespace: matrix
spec:
  podSelector: {}
  policyTypes:
  - Egress
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: matrix-client
  namespace: matrix
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: matrix-client
  policyTypes:
  - Ingress
  - Egress
  egress:
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: matrix-synapse
    ports:
    - protocol: TCP
      port: 8008
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: matrix-mas
    ports:
    - protocol: TCP
      port: 8080
  - to:
    - ipBlock:
        cidr: 10.21.20.131/32
    ports:
    - protocol: TCP
      port: 443
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: envoy-gateway-system
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: matrix-relay
    ports:
    - protocol: TCP
      port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: matrix-synapse
  namespace: matrix
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: matrix-synapse
  policyTypes:
  - Ingress
  - Egress
  egress:
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: matrix-postgres
    ports:
    - protocol: TCP
      port: 5432
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: matrix-mas
    ports:
    - protocol: TCP
      port: 8080
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: matrix-egress
    ports:
    - protocol: TCP
      port: 3128
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: matrix-client
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: matrix-mas
    ports:
    - protocol: TCP
      port: 8008
---
