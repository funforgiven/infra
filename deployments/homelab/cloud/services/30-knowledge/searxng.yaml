apiVersion: v1
kind: ConfigMap
metadata:
  name: searxng
  namespace: knowledge
data:
  settings.yml: |
    use_default_settings: true
    general:
      debug: false
      instance_name: Fahrican Search
      enable_metrics: false
    search:
      safe_search: 1
      autocomplete: duckduckgo
      default_lang: all
      formats:
        - html
        - json
    server:
      secret_key: ultrasecretkey
      limiter: false
      image_proxy: true
    outgoing:
      request_timeout: 5.0
      max_request_timeout: 15.0
---
apiVersion: v1
kind: Service
metadata:
  name: searxng
  namespace: knowledge
spec:
  selector:
    app.kubernetes.io/name: searxng
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: searxng
  namespace: knowledge
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: searxng
  template:
    metadata:
      labels:
        app.kubernetes.io/name: searxng
        app.kubernetes.io/part-of: knowledge
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 977
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: searxng
          image: ghcr.io/searxng/searxng:2026.7.28-c01178d03@sha256:80622959f0f3512e6623d6bdbcea9f13c8d22c8d9715c498d0ae2be1c8535930
          env:
            - name: FORCE_OWNERSHIP
              value: "false"
            - name: SEARXNG_BASE_URL
              value: https://search.fahrican.com/
            - name: SEARXNG_SECRET
              valueFrom:
                secretKeyRef:
                  name: searxng-runtime
                  key: SEARXNG_SECRET
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 977
            runAsNonRoot: true
            runAsUser: 977
          volumeMounts:
            - name: cache
              mountPath: /var/cache/searxng
            - name: config
              mountPath: /etc/searxng
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: cache
          emptyDir:
            sizeLimit: 2Gi
        - name: config
          configMap:
            name: searxng
            defaultMode: 0444
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: searxng
  namespace: knowledge
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: searxng
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: searxng
  namespace: knowledge
spec:
  parentRefs:
    - name: services
      namespace: services-network
      sectionName: https
  hostnames:
    - search.fahrican.com
  rules:
    - backendRefs:
        - name: searxng
          port: 8080
