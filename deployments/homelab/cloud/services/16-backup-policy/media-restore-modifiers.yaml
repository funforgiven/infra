apiVersion: v1
kind: ConfigMap
metadata:
  name: media-restore-modifiers
  namespace: velero
data:
  resource-modifiers.yaml: |
    version: v1
    resourceModifierRules:
      - conditions:
          groupResource: persistentvolumeclaims
          namespaces:
            - media
        patches:
          - operation: remove
            path: /spec/volumeName
