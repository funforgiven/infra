apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backup-canary
  namespace: backup-qualification
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: rbd1
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backup-canary
  namespace: backup-qualification
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: backup-canary
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backup-canary
        app.kubernetes.io/part-of: backup-qualification
      annotations:
        backup.velero.io/backup-volumes: data
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: canary
          image: docker.io/library/busybox:1.38.0@sha256:dc2d74b28e4cf8984fa52af1f39bc7c3d9c73760b41a74d629f5d11b1ab28616
          command:
            - /bin/sh
            - -ec
            - |
              expected=8eae9bfd58377faaf8c96501d130bfae5e3fedb725cd31d8c717f500cddc3c70
              if [ "$POD_NAMESPACE" = backup-qualification ]; then
                printf '%s\n' services-backup-canary-v1 > /data/canary
              fi
              printf '%s  %s\n' "$expected" /data/canary | sha256sum -c -
              while true; do sleep 3600; done
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - >-
                  printf '%s  %s\n'
                  8eae9bfd58377faaf8c96501d130bfae5e3fedb725cd31d8c717f500cddc3c70
                  /data/canary | sha256sum -c -
            periodSeconds: 30
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - >-
                  printf '%s  %s\n'
                  8eae9bfd58377faaf8c96501d130bfae5e3fedb725cd31d8c717f500cddc3c70
                  /data/canary | sha256sum -c -
            initialDelaySeconds: 30
            periodSeconds: 60
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 250m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 65532
            runAsNonRoot: true
            runAsUser: 65532
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: backup-canary
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: restore-qualification-modifiers
  namespace: velero
data:
  resource-modifiers.yaml: |
    version: v1
    resourceModifierRules:
      - conditions:
          groupResource: persistentvolumeclaims
          namespaces:
            - backup-qualification
        patches:
          - operation: remove
            path: /spec/volumeName
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: restore-qualification
  namespace: backup-qualification
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: services-restore-qualification
rules:
  - apiGroups:
      - velero.io
    resources:
      - backups
    verbs:
      - get
      - list
  - apiGroups:
      - velero.io
    resources:
      - restores
    verbs:
      - create
      - get
  - apiGroups:
      - ""
    resources:
      - namespaces
    resourceNames:
      - backup-qualification-restore
    verbs:
      - delete
      - get
  - apiGroups:
      - apps
    resources:
      - deployments
    resourceNames:
      - backup-canary
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: services-restore-qualification
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: services-restore-qualification
subjects:
  - kind: ServiceAccount
    name: restore-qualification
    namespace: backup-qualification
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: restore-qualification
  namespace: backup-qualification
data:
  qualify.sh: |
    #!/bin/sh
    set -eu

    kubectl=/tmp/kubectl
    curl -fsSL -o "$kubectl" \
      https://dl.k8s.io/release/v1.36.2/bin/linux/amd64/kubectl
    printf '%s  %s\n' \
      1e9045ec32bea85da43de85f0065358529ea7c7a152eca78154fba5b58c27d82 \
      "$kubectl" | sha256sum -c -
    chmod 0500 "$kubectl"

    backup="$($kubectl -n velero get backups.velero.io \
      -l velero.io/schedule-name=services-daily \
      --sort-by=.metadata.creationTimestamp \
      -o jsonpath='{.items[-1:].metadata.name}')"
    case "$backup" in
      services-daily-[a-z0-9-]*) ;;
      *)
        echo "No valid completed services-daily backup was found." >&2
        exit 1
        ;;
    esac
    test "$($kubectl -n velero get backup "$backup" \
      -o jsonpath='{.status.phase}')" = Completed

    target=backup-qualification-restore
    "$kubectl" delete namespace "$target" --ignore-not-found --wait=false
    while "$kubectl" get namespace "$target" >/dev/null 2>&1; do
      sleep 5
    done

    suffix="${backup#services-daily-}"
    restore="qualification-$suffix"
    sed "s/BACKUP_NAME/$backup/; s/RESTORE_NAME/$restore/" \
      /config/restore.yaml | "$kubectl" create -f -

    attempt=0
    while [ "$attempt" -lt 360 ]; do
      phase="$($kubectl -n velero get restore "$restore" \
        -o jsonpath='{.status.phase}' 2>/dev/null || true)"
      case "$phase" in
        Completed) break ;;
        Failed|PartiallyFailed)
          echo "Restore qualification entered phase $phase." >&2
          exit 1
          ;;
      esac
      attempt=$((attempt + 1))
      sleep 10
    done
    test "$phase" = Completed
    "$kubectl" -n "$target" rollout status deployment/backup-canary \
      --timeout=10m
    echo "Restore qualification completed for backup $backup."
  restore.yaml: |
    apiVersion: velero.io/v1
    kind: Restore
    metadata:
      name: RESTORE_NAME
      namespace: velero
      labels:
        backup.fahrican.com/qualification: "true"
    spec:
      backupName: BACKUP_NAME
      includedNamespaces:
        - backup-qualification
      excludedResources:
        - cronjobs.batch
        - jobs.batch
        - rolebindings.rbac.authorization.k8s.io
        - roles.rbac.authorization.k8s.io
        - serviceaccounts
      includeClusterResources: false
      namespaceMapping:
        backup-qualification: backup-qualification-restore
      restorePVs: true
      resourceModifier:
        kind: ConfigMap
        name: restore-qualification-modifiers
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: restore-qualification
  namespace: backup-qualification
spec:
  schedule: "0 5 1 * *"
  timeZone: Europe/Istanbul
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 5400
      backoffLimit: 1
      ttlSecondsAfterFinished: 7776000
      template:
        metadata:
          labels:
            app.kubernetes.io/name: restore-qualification
            app.kubernetes.io/part-of: backup-qualification
        spec:
          automountServiceAccountToken: true
          serviceAccountName: restore-qualification
          restartPolicy: Never
          securityContext:
            runAsGroup: 65532
            runAsNonRoot: true
            runAsUser: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: qualify
              image: quay.io/airshipit/openstack-client:2026.1-ubuntu_noble@sha256:f38785f22b3b2c42ed28beacd927e194f4e14c2a721debe8d43e4752b7270676
              command:
                - /config/qualify.sh
              resources:
                requests:
                  cpu: 25m
                  memory: 64Mi
                limits:
                  cpu: 250m
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                readOnlyRootFilesystem: true
              volumeMounts:
                - name: config
                  mountPath: /config
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: config
              configMap:
                name: restore-qualification
                defaultMode: 0555
            - name: tmp
              emptyDir:
                medium: Memory
                sizeLimit: 128Mi
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: restore-qualification
  namespace: backup-qualification
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: services-restore-qualification
      rules:
        - alert: ServicesRestoreQualificationFailed
          expr: >-
            kube_job_status_failed{namespace="backup-qualification",
            job_name=~"restore-qualification-.*"} > 0
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: The automated services restore qualification failed.
        - alert: ServicesRestoreQualificationStale
          expr: >-
            (time() - kube_cronjob_status_last_successful_time{
            namespace="backup-qualification",cronjob="restore-qualification"}
            > 3456000) or absent(kube_cronjob_status_last_successful_time{
            namespace="backup-qualification",cronjob="restore-qualification"})
          for: 1h
          labels:
            severity: critical
          annotations:
            summary: No successful services restore qualification exists within 40 days.
