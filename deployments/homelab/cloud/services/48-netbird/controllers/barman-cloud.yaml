apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: barman-cloud-charts
  namespace: cnpg-system
spec:
  interval: 24h
  url: https://github.com/cloudnative-pg/charts.git
  ref:
    commit: b111f4a8eddc6c66bd61524e3bf0ec06387b78ab
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: barman-cloud
  namespace: cnpg-system
spec:
  interval: 30m
  timeout: 10m
  releaseName: barman-cloud
  chart:
    spec:
      chart: ./charts/plugin-barman-cloud
      interval: 24h
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: barman-cloud-charts
  dependsOn:
    - name: cloudnative-pg
  driftDetection:
    mode: enabled
  install:
    crds: Create
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    replicaCount: 2
    image:
      registry: ghcr.io
      repository: cloudnative-pg/plugin-barman-cloud
      tag: v0.14.0@sha256:823a8893690980ba5830bbbb11196a35f695b0488db7d846abc33baebf32417c
    sidecarImage:
      registry: ghcr.io
      repository: cloudnative-pg/plugin-barman-cloud-sidecar
      tag: v0.14.0@sha256:9880817c285c7afa4d195da2145064d21907405489ed6ec39abe59b1feb558a4
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        memory: 256Mi
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: plugin-barman-cloud
