apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: netbird-stun
  namespace: netbird
spec:
  # OVN's UDP-CONNECT monitor cannot test Kubernetes' HTTP readiness port.
  # Every load-balancer worker therefore runs its own stateless STUN responder.
  updateStrategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels: {app.kubernetes.io/name: netbird-stun}
  template:
    metadata:
      labels: {app.kubernetes.io/name: netbird-stun}
    spec:
      automountServiceAccountToken: false
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: stun
          image: coturn/coturn:4.18.0@sha256:bbefd3e1fdfdc0d58770fe01b581fd8b00d9f3a5580d00acb77cf719a6bc78e3
          command: [turnserver]
          args:
            - -n
            - --stun-only
            - --no-auth
            - --no-tls
            - --no-tcp
            - --listening-ip=0.0.0.0
            - --listening-port=3478
            - --relay-threads=1
            - --log-file=stdout
            - --pidfile=/tmp/turnserver.pid
            - --userdb=/tmp/turn.sqlite
          ports:
            - {name: stun, containerPort: 3478, protocol: UDP}
          readinessProbe:
            exec:
              command: [sh, -ec, "grep -q ':0D96 ' /proc/net/udp"]
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            # The official binary carries this file capability even for 3478.
            capabilities: {drop: [ALL], add: [NET_BIND_SERVICE]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 16Mi}
