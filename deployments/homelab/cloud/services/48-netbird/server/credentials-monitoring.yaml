apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: netbird-credentials
  namespace: netbird
  labels:
    release: kube-prometheus-stack
spec:
  groups:
  - name: netbird-credentials
    rules:
    - alert: NetBirdAutomationCredentialExpiring
      expr: vector(1822588341) - time() < 2592000
      for: 1h
      labels:
        severity: warning
        credential: tofu-netbird
      annotations:
        summary: NetBird automation credential expires within 30 days
        description: Run netbird-admin rotate-credentials and reconcile the encrypted
          Git inputs.
    - alert: NetBirdAutomationCredentialExpiring
      expr: vector(1822588341) - time() < 2592000
      for: 1h
      labels:
        severity: warning
        credential: kubernetes-netbird
      annotations:
        summary: NetBird automation credential expires within 30 days
        description: Run netbird-admin rotate-credentials and reconcile the encrypted
          Git inputs.
