apiVersion: v1
kind: Service
metadata:
  name: forge-macos-host
  namespace: services-observability
  labels:
    app.kubernetes.io/name: forge-macos-host
    monitoring-target: forge-macos-host
spec:
  ports:
  - name: metrics
    port: 9100
    targetPort: 9100
---
apiVersion: v1
kind: Endpoints
metadata:
  name: forge-macos-host
  namespace: services-observability
subsets:
- addresses:
  - hostname: forge-macos
    ip: 10.21.40.126
  ports:
  - name: metrics
    port: 9100
    protocol: TCP
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: forge-macos-host
  namespace: services-observability
spec:
  jobLabel: monitoring-target
  selector:
    matchLabels:
      app.kubernetes.io/name: forge-macos-host
  endpoints:
  - port: metrics
    interval: 60s
    scrapeTimeout: 15s
---
