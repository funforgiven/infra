APP_NAME = Fahrican Git
RUN_USER = git
RUN_MODE = prod
WORK_PATH = /var/lib/gitea

[server]
DOMAIN = git.fahrican.com
ROOT_URL = https://git.fahrican.com/
HTTP_ADDR = 0.0.0.0
HTTP_PORT = 3000
START_SSH_SERVER = true
SSH_DOMAIN = git.fahrican.com
SSH_PORT = 2222
SSH_LISTEN_PORT = 2222
LFS_START_SERVER = true
OFFLINE_MODE = true

[database]
DB_TYPE = sqlite3
PATH = /var/lib/gitea/data/forgejo.db
SQLITE_JOURNAL_MODE = WAL

[repository]
ROOT = /var/lib/gitea/git/repositories
DEFAULT_PRIVATE = private
FORCE_PRIVATE = true
DEFAULT_BRANCH = main
ENABLE_PUSH_CREATE_USER = false
ENABLE_PUSH_CREATE_ORG = false

[security]
INSTALL_LOCK = true
PASSWORD_HASH_ALGO = argon2
REVERSE_PROXY_LIMIT = 1
REVERSE_PROXY_TRUSTED_PROXIES = 172.16.0.0/13

[service]
DISABLE_REGISTRATION = false
ALLOW_ONLY_EXTERNAL_REGISTRATION = true
REQUIRE_SIGNIN_VIEW = true
DEFAULT_KEEP_EMAIL_PRIVATE = true
DEFAULT_USER_VISIBILITY = private
ENABLE_REVERSE_PROXY_AUTHENTICATION = false

[openid]
ENABLE_OPENID_SIGNIN = false
ENABLE_OPENID_SIGNUP = false

[oauth2_client]
ENABLE_AUTO_REGISTRATION = true
ACCOUNT_LINKING = login
USERNAME = nickname

[actions]
ENABLED = true
DEFAULT_ACTIONS_URL = https://data.forgejo.org

[packages]
ENABLED = true

[session]
PROVIDER = file
COOKIE_SECURE = true
SAME_SITE = lax

[metrics]
ENABLED = true

[log]
MODE = console
LEVEL = Info

[mailer]
ENABLED = true
PROTOCOL = smtp+starttls
SMTP_ADDR = smtp.resend.com
SMTP_PORT = 587
USER = resend
FROM = Fahrican Git <git@fahrican.com>
HELO_HOSTNAME = git.fahrican.com
