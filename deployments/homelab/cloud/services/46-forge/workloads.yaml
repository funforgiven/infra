apiVersion: v1
kind: Service
metadata:
  name: forgejo
  namespace: forge
  labels:
    app.kubernetes.io/name: forgejo
    app.kubernetes.io/part-of: forge
spec:
  selector:
    app.kubernetes.io/name: forgejo
  ports:
  - name: http
    port: 3000
    targetPort: http
  - name: backup-metrics
    port: 9900
    targetPort: backup-metrics
  - name: ssh
    port: 2222
    targetPort: ssh
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: forgejo
  namespace: forge
spec:
  serviceName: forgejo
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: forgejo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: forgejo
        app.kubernetes.io/part-of: forge
      annotations:
        backup.velero.io/backup-volumes: backups
        pre.hook.backup.velero.io/command: '["python", "/bootstrap/backup.py", "--once"]'
        pre.hook.backup.velero.io/container: backup
        pre.hook.backup.velero.io/on-error: Fail
        pre.hook.backup.velero.io/timeout: 15m
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: forgejo-data
      - name: backups
        persistentVolumeClaim:
          claimName: forgejo-backups
      - name: bootstrap
        configMap:
          name: forge-bootstrap
      - name: tmp
        emptyDir:
          sizeLimit: 1Gi
      - name: control
        emptyDir:
          medium: Memory
          sizeLimit: 1Mi
      - name: secrets
        secret:
          secretName: forge-runtime
          defaultMode: 288
      initContainers:
      - name: configure
        image: docker.io/python:3.14.6-alpine3.23@sha256:b165067c5afc37fa5608a3c05609cc3d51aafd808a30fbfd822ee594fef55ad4
        command:
        - python
        - /bootstrap/render-forgejo.py
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
        volumeMounts:
        - name: data
          mountPath: /var/lib/gitea
        - name: bootstrap
          mountPath: /bootstrap
          readOnly: true
        - name: secrets
          mountPath: /run/forge-secrets
          readOnly: true
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 250m
            memory: 128Mi
      - name: bootstrap
        image: codeberg.org/forgejo/forgejo:15.0.7-rootless@sha256:1131f4c646d6115577b7cb9ccfe8cd2c289bb54a1e1ed42400be0e22916af924
        command:
        - /bin/sh
        - /bootstrap/bootstrap-forgejo.sh
        env: &id001
        - name: HOME
          value: /var/lib/gitea/git
        - name: GITEA_WORK_DIR
          value: /var/lib/gitea
        - name: GITEA_CUSTOM
          value: /var/lib/gitea/custom
        - name: GITEA_TEMP
          value: /tmp/gitea
        - name: USER
          value: git
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
        volumeMounts:
        - name: data
          mountPath: /var/lib/gitea
        - name: bootstrap
          mountPath: /bootstrap
          readOnly: true
        - name: secrets
          mountPath: /run/forge-secrets
          readOnly: true
        - name: tmp
          mountPath: /tmp
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: '1'
            memory: 512Mi
      containers:
      - name: forgejo
        image: codeberg.org/forgejo/forgejo:15.0.7-rootless@sha256:1131f4c646d6115577b7cb9ccfe8cd2c289bb54a1e1ed42400be0e22916af924
        command:
        - /bin/sh
        - /bootstrap/run-service.sh
        - /app/gitea/gitea
        - --config
        - /var/lib/gitea/custom/conf/app.ini
        - web
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
        ports:
        - name: http
          containerPort: 3000
        - name: ssh
          containerPort: 2222
        volumeMounts:
        - name: data
          mountPath: /var/lib/gitea
        - name: bootstrap
          mountPath: /bootstrap
          readOnly: true
        - name: tmp
          mountPath: /tmp
        - name: control
          mountPath: /control
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: '2'
            memory: 1536Mi
        startupProbe:
          httpGet:
            path: /api/healthz
            port: http
          periodSeconds: 5
          failureThreshold: 60
        readinessProbe:
          httpGet:
            path: /api/healthz
            port: http
          periodSeconds: 5
          failureThreshold: 2
        livenessProbe:
          exec:
            command:
            - /bin/sh
            - -ec
            - if test -s /control/request; then read -r deadline nonce < /control/request;
              test "$(date +%s)" -lt "$deadline" && exit 0; fi; curl --max-time 3
              -fsS http://127.0.0.1:3000/api/healthz >/dev/null
          periodSeconds: 30
          failureThreshold: 3
          timeoutSeconds: 5
        env: *id001
      - name: backup
        image: docker.io/python:3.14.6-alpine3.23@sha256:b165067c5afc37fa5608a3c05609cc3d51aafd808a30fbfd822ee594fef55ad4
        command:
        - python
        - /bootstrap/backup.py
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
        env:
        - name: BACKUP_DATA
          value: /data
        - name: BACKUP_DATABASE
          value: data/forgejo.db
        - name: BACKUP_SERVICE
          value: forgejo
        ports:
        - name: backup-metrics
          containerPort: 9900
        volumeMounts:
        - name: data
          mountPath: /data
          readOnly: true
        - name: backups
          mountPath: /backups
        - name: control
          mountPath: /control
        - name: bootstrap
          mountPath: /bootstrap
          readOnly: true
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 500m
            memory: 256Mi
