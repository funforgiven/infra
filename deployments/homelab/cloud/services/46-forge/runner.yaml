log:
  level: info
  job_level: info
runner:
  file: /run/runner/unused-registration
  capacity: 1
  timeout: 2h
  shutdown_timeout: 30s
  insecure: false
  fetch_timeout: 30s
  fetch_interval: 5s
  env_file: ""
cache:
  enabled: false
container:
  privileged: false
  valid_volumes: []
  docker_host: "-"
host:
  workdir_parent: /workspace
