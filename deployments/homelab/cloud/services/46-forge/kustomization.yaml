apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- storage.yaml
- snapshot-backups.yaml
- workloads.yaml
- routes.yaml
- network-policy.yaml
- monitoring.yaml
- runtime.sops.yaml
- signing.sops.yaml
- runners.yaml
- runner-qualification.sops.yaml
- runner-registry.sops.yaml
- restore-qualification.yaml
- native-monitoring.yaml
- ../../../../../components/cloud/services/forge
- native-brokers.yaml
- native-windows-qualification.sops.yaml
- native-macos-qualification.sops.yaml
- native-registry.sops.yaml
- atollion-runners.yaml
- runner-atollion.sops.yaml
- atollion-launcher.sops.yaml
- cache.yaml
- cache-runtime.sops.yaml
- cache-registry.sops.yaml
- cache-brokers.sops.yaml
- cache-descriptors.sops.yaml
configMapGenerator:
- name: forge-cache
  namespace: forge-cache
  files:
  - cache-config.json
  - cache-runner.yaml
  - cache-gateway.py=../../../../../components/cloud/services/forge/cache-gateway.py
- name: forge-bootstrap
  namespace: forge
  files:
  - run-service.sh
  - backup.py
  - legacy-backup-bridge.py
  - recovery_archive.py
  - native-status.json
  - render-forgejo.py
  - forgejo.ini
  - bootstrap-forgejo.sh
  - cache-descriptors.py=../../../../../components/cloud/services/forge/cache-descriptors.py
- name: forge-runner-bootstrap
  namespace: forge-ci
  files:
  - register-job.py
  - run-job.sh
  - run-one-job.py=../../../../../components/cloud/services/forge/run-one-job.py
  - runner.yaml
- name: forge-restore-tools
  namespace: forge-restore
  options:
    disableNameSuffixHash: true
  files:
  - verify-restore.py
  - recovery_archive.py
  - verify_atollion.py
  - atollion-agent-policy.json
  - verify-git.sh
  - native_backup.py
- name: forge-restore-controller
  namespace: backup-qualification
  files:
  - qualify-restore.py
- name: forge-native-configuration
  namespace: forge-control
  files:
  - windows.json
  - macos.json
  - native-known-hosts
- name: forge-linux-launcher
  namespace: forge-control
  files:
  - linux-launcher.py=../../../../../components/cloud/services/forge/linux-launcher.py
  - broker_cache.py=../../../../../components/cloud/services/forge/broker_cache.py
- name: forge-snapshot-tools
  namespace: forge
  files:
  - snapshot-backup.py
  - recovery_archive.py
  - export-job.json
