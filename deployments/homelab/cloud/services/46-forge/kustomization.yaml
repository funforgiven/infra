apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- storage.yaml
- workloads.yaml
- routes.yaml
- network-policy.yaml
- monitoring.yaml
- runtime.sops.yaml
- runners.yaml
- runner-qualification.sops.yaml
- runner-registry.sops.yaml
- restore-qualification.yaml
configMapGenerator:
- name: forge-bootstrap
  namespace: forge
  files:
  - run-service.sh
  - backup.py
  - render-forgejo.py
  - forgejo.ini
  - bootstrap-forgejo.sh
- name: forge-runner-bootstrap
  namespace: forge-ci
  files:
  - register-job.py
  - run-job.sh
  - runner.yaml
- name: forge-restore-tools
  namespace: forge-restore
  options:
    disableNameSuffixHash: true
  files:
  - verify-restore.py
  - verify-git.sh
- name: forge-restore-controller
  namespace: backup-qualification
  files:
  - qualify-restore.py
