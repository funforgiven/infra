apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: velero
  namespace: velero
spec:
  interval: 24h
  url: https://vmware-tanzu.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: velero
  namespace: velero
spec:
  interval: 30m
  timeout: 15m
  releaseName: velero
  chart:
    spec:
      chart: velero
      version: 12.1.0
      sourceRef:
        kind: HelmRepository
        name: velero
  valuesFrom:
    - kind: ConfigMap
      name: velero-runtime-values
      valuesKey: values.yaml
  driftDetection:
    mode: enabled
  install:
    crds: Create
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    image:
      repository: docker.io/velero/velero
      tag: v1.18.2
      digest: sha256:37396519f399536e5f01427d723565ae69294ec3fb5625cf1c87c09eaa9de16b
    initContainers:
      - name: velero-plugin-for-aws
        image: docker.io/velero/velero-plugin-for-aws:main@sha256:0f442cf9263b3a579d9b22417501dfef75e83b300b8180b9394c86d0127ec220
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
        volumeMounts:
          - name: plugins
            mountPath: /target
    configuration:
      defaultBackupStorageLocation: default
      defaultVolumesToFsBackup: true
      defaultRepoMaintainFrequency: 24h
    credentials:
      useSecret: true
      existingSecret: velero-object-storage
    backupsEnabled: true
    snapshotsEnabled: false
    deployNodeAgent: true
    uploaderType: kopia
    upgradeCRDs: false
    cleanUpCRDs: false
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 1Gi
    nodeAgent:
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: "2"
          memory: 2Gi
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
        additionalLabels:
          release: kube-prometheus-stack
      nodeAgentPodMonitor:
        enabled: true
        additionalLabels:
          release: kube-prometheus-stack
      prometheusRule:
        enabled: true
        additionalLabels:
          release: kube-prometheus-stack
        spec:
          - alert: VeleroBackupFailed
            annotations:
              summary: A services-cluster backup has failed.
            expr: velero_backup_last_status{schedule!=""} != 1
            for: 15m
            labels:
              severity: critical
          - alert: VeleroNoRecentBackup
            annotations:
              summary: No successful daily services-cluster backup exists within 26 hours.
            expr: >-
              ((time() - velero_backup_last_successful_timestamp{
              schedule="services-daily"})
              > (26 * 3600))
              or absent(velero_backup_last_successful_timestamp{
              schedule="services-daily"})
            for: 1h
            labels:
              severity: critical
