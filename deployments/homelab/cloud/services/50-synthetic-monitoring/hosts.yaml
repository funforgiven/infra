apiVersion: v1
kind: Service
metadata:
  name: services-host-node-exporters
  namespace: services-observability
  labels:
    app.kubernetes.io/name: services-host-node-exporters
    monitoring-target: services-hosts
spec:
  ports:
    - name: metrics
      port: 9100
      targetPort: 9100
---
apiVersion: v1
kind: Endpoints
metadata:
  name: services-host-node-exporters
  namespace: services-observability
subsets:
  - addresses:
      - hostname: home-assistant
        ip: 192.168.80.10
      - hostname: gitlab
        ip: 10.21.40.128
    ports:
      - name: metrics
        port: 9100
        protocol: TCP
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: services-host-node-exporters
  namespace: services-observability
spec:
  jobLabel: monitoring-target
  selector:
    matchLabels:
      app.kubernetes.io/name: services-host-node-exporters
  namespaceSelector:
    matchNames:
      - services-observability
  endpoints:
    - port: metrics
      interval: 60s
      scrapeTimeout: 15s
