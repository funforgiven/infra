apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: services-external-alerts
  namespace: services-observability
spec:
  groups:
    - name: services.external
      rules:
        - alert: ServicesEndpointDown
          expr: >-
            (probe_success{job="services-http"} == 0)
            or (probe_success{job="mail-tcp",
            instance!="mail.fahrican.com:25"} == 0)
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "Synthetic probe failed for {{ $labels.instance }}"
        - alert: ServicesHostExporterDown
          expr: up{job="services-hosts"} == 0
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "Host metrics are unavailable for {{ $labels.instance }}"
        - alert: ServicesHostBackupStale
          expr: >-
            (time() - services_restic_last_success_unixtime) > (26 * 3600)
            or absent(services_restic_last_success_unixtime)
          for: 1h
          labels:
            severity: critical
          annotations:
            summary: A standalone service host has no successful Restic backup within 26 hours.
