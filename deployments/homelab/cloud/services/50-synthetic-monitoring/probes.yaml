apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: services-http-endpoints
  namespace: services-observability
spec:
  interval: 60s
  scrapeTimeout: 20s
  jobName: services-http
  module: http_2xx
  prober:
    url: blackbox-exporter.services-observability.svc.cluster.local:9115
  targets:
    staticConfig:
      static:
        - https://home.fahrican.com
        - https://upload.fahrican.com/web/client/
        - https://mail.fahrican.com
        - https://music.fahrican.com/ping
        - https://wallos.fahrican.com/health.php
---
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: mail-smtps-endpoint
  namespace: services-observability
spec:
  interval: 60s
  scrapeTimeout: 15s
  jobName: mail-smtps
  module: mail_smtps
  prober:
    url: blackbox-exporter.services-observability.svc.cluster.local:9115
  targets:
    staticConfig:
      static:
        - mail.fahrican.com:465
---
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: mail-imaps-endpoint
  namespace: services-observability
spec:
  interval: 60s
  scrapeTimeout: 15s
  jobName: mail-imaps
  module: mail_imaps
  prober:
    url: blackbox-exporter.services-observability.svc.cluster.local:9115
  targets:
    staticConfig:
      static:
        - mail.fahrican.com:993
---
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: mail-submission-endpoint
  namespace: services-observability
spec:
  interval: 60s
  scrapeTimeout: 15s
  jobName: mail-submission
  module: mail_submission
  prober:
    url: blackbox-exporter.services-observability.svc.cluster.local:9115
  targets:
    staticConfig:
      static:
        - mail.fahrican.com:587
# Inbound port 25 is tested by the AWS mail canary through Resend, which can
# reach public MX servers. The homelab ISP blocks outbound port 25.
