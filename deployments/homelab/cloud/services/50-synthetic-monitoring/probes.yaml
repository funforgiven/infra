apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: services-http-endpoints
  namespace: services-observability
spec:
  interval: 60s
  scrapeTimeout: 20s
  jobName: services-http
  module: http_2xx
  prober:
    url: blackbox-exporter.services-observability.svc.cluster.local:9115
  targets:
    staticConfig:
      static:
        - https://home.fahrican.com
        - https://upload.fahrican.com/web/client/
        - https://mail.fahrican.com
        - https://music.fahrican.com/ping
        - https://wallos.fahrican.com/health.php
---
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: mail-jmap-endpoint
  namespace: services-observability
spec:
  interval: 60s
  scrapeTimeout: 15s
  jobName: mail-jmap
  module: mail_jmap
  prober:
    url: blackbox-exporter.services-observability.svc.cluster.local:9115
  targets:
    staticConfig:
      static:
        - https://mail.fahrican.com/.well-known/jmap
# Authenticated JMAP and inbound delivery are verified by the AWS mail canary.
# The homelab ISP blocks outbound port 25.
