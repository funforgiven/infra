apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: automation-lan
  namespace: home-automation
spec:
  config: |-
    {
      "cniVersion": "0.3.1",
      "name": "automation-lan",
      "plugins": [
        {
          "type": "ipvlan",
          "master": "iot0",
          "mode": "l2",
          "ipam": {
            "type": "static",
            "addresses": [
              {
                "address": "10.21.50.10/24"
              }
            ]
          }
        },
        {
          "type": "tuning",
          "sysctl": {
            "net.ipv6.conf.all.disable_ipv6": "0",
            "net.ipv6.conf.IFNAME.disable_ipv6": "0",
            "net.ipv6.conf.all.forwarding": "0",
            "net.ipv6.conf.IFNAME.accept_ra": "1",
            "net.ipv6.conf.IFNAME.accept_ra_rt_info_max_plen": "64"
          }
        }
      ]
    }
