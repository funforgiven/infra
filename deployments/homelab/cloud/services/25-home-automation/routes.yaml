apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: home-assistant
  namespace: home-automation
spec:
  parentRefs:
    - name: services
      namespace: services-network
      sectionName: https
  hostnames:
    - home.fahrican.com
  rules:
    - backendRefs:
        - name: home-assistant
          port: 8123
      timeouts:
        request: 0s
        backendRequest: 0s
---
# Restrict every onboarding endpoint, including the first owner creation API.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: home-assistant-onboarding
  namespace: home-automation
spec:
  parentRefs:
    - name: services
      namespace: services-network
      sectionName: https
  hostnames:
    - home.fahrican.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api/onboarding
        - path:
            type: PathPrefix
            value: /onboarding.html
      backendRefs:
        - name: home-assistant
          port: 8123
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: zigbee2mqtt
  namespace: home-automation
spec:
  parentRefs:
    - name: services
      namespace: services-network
      sectionName: https
  hostnames:
    - home.fahrican.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /zigbee2mqtt
      backendRefs:
        - name: home-assistant
          port: 8080
      timeouts:
        request: 0s
        backendRequest: 0s
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: automation-administration
  namespace: home-automation
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: home-assistant-onboarding
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: zigbee2mqtt
  authorization:
    defaultAction: Deny
    rules:
      - name: operators
        action: Allow
        principal:
          clientCIDRs:
            - 10.21.10.0/24
            - 10.21.91.0/24
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: automation-websockets
  namespace: home-automation
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: home-assistant
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: zigbee2mqtt
  timeout:
    http:
      connectionIdleTimeout: 3600s
