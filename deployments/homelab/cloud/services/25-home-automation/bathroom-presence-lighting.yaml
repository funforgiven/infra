# Recovery copy: install through HA's automation config API.
# FP300 uses both sensors, fixed high sensitivity, PIR interval 30 seconds,
# and a 30-second radar absence delay. HA adds no absence delay.
id: fahrican_bathroom_presence_lighting
alias: Fahrican Bathroom presence lighting
description: >-
  FP300 motion or radar presence turns on the bathroom relay. Radar presence
  keeps it on for a stationary occupant. Turn off when both readings are clear,
  with the sensor's 30-second absence delay providing confirmation. HA adds no
  further delay. Unknown/unavailable is never vacant.
triggers:
- trigger: state
  entity_id:
  - binary_sensor.0x54ef441001724e3e_presence
  - binary_sensor.0x54ef441001724e3e_pir_detection
  to: null
- trigger: homeassistant
  event: start
- trigger: event
  event_type: automation_reloaded
- trigger: state
  entity_id: switch.0xe456acfffe5cd047
  from:
  - unavailable
  - unknown
  to:
  - "on"
  - "off"
conditions: []
actions:
- choose:
  - conditions:
    - condition: or
      conditions:
      - condition: state
        entity_id: binary_sensor.0x54ef441001724e3e_presence
        state: "on"
      - condition: state
        entity_id: binary_sensor.0x54ef441001724e3e_pir_detection
        state: "on"
    sequence:
    - condition: state
      entity_id: switch.0xe456acfffe5cd047
      state: "off"
    - action: switch.turn_on
      target:
        entity_id: switch.0xe456acfffe5cd047
  - conditions:
    - condition: state
      entity_id:
      - binary_sensor.0x54ef441001724e3e_presence
      - binary_sensor.0x54ef441001724e3e_pir_detection
      state: "off"
    sequence:
    - condition: state
      entity_id: switch.0xe456acfffe5cd047
      state: "on"
    - action: switch.turn_off
      target:
        entity_id: switch.0xe456acfffe5cd047
mode: restart
initial_state: true
trace:
  stored_traces: 10
