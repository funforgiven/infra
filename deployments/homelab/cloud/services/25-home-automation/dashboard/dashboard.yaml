# Rooftrollen dashboard. Recovery source; Home Assistant owns the live UI configuration.
title: Rooftrollen
views:
- title: Home
  path: home
  show_icon_and_title: true
  type: sections
  max_columns: 3
  theme: Rooftrollen
  dense_section_placement: false
  sections:
  - type: grid
