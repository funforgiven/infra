    - type: custom:mushroom-chips-card
      alignment: start
      chips:
      - type: template
        icon: mdi:lightbulb-group-outline
        content: '{{ expand([''light.0x001788011015148f'', ''light.0x0017880110151bb9'', ''switch.0xe456acfffe5cd047'',
          ''light.0x001788010c012f69'', ''light.0x001788010c0179eb'', ''light.0x001788010c0b1125'']) | selectattr(''state'',
          ''eq'', ''on'') | list | count }} lights on'
        icon_color: amber
        tap_action:
          action: navigate
          navigation_path: /dashboard-rooftrollen/lights
      - type: template
        icon: mdi:weather-partly-cloudy
        content: '{{ (state_attr(entity, ''temperature'') | string) + ''° · '' + (states(entity) | replace(''-'',
          '' '') | capitalize) if has_value(entity) and is_number(state_attr(entity, ''temperature'')) else ''Weather
          unavailable'' }}'
        icon_color: blue
        tap_action:
          action: more-info
        entity: weather.forecast_home
      - type: template
        icon: mdi:account-circle-outline
        content: '{{ ''Fahrican is home'' if is_state(entity, ''home'') else ''Fahrican is away'' if is_state(entity,
          ''not_home'') else states(entity) | capitalize }}'
        icon_color: green
        tap_action:
          action: more-info
        entity: person.funforgiven
      grid_options:
        columns: full
        rows: auto
      card_mod:
        style: 'ha-card { --chip-border-width: 0; --chip-background: var(--secondary-background-color); --chip-height:
          40px; --chip-border-radius: 14px; }'
    column_span: 3
  - type: grid
    cards:
    - type: custom:mushroom-template-card
      primary: Fahrican Loft
      secondary: 6th floor · {{ 'At desk' if is_state('binary_sensor.0x54ef4410017220eb_presence', 'on') else 'Desk
        clear' if is_state('binary_sensor.0x54ef4410017220eb_presence', 'off') else 'Desk presence unavailable'
        }}
      icon: mdi:sofa-outline
      color: rgb(135, 156, 242)
      tap_action:
        action: navigate
        navigation_path: /dashboard-rooftrollen/loft
      icon_tap_action:
        action: navigate
        navigation_path: /dashboard-rooftrollen/loft
      grid_options:
        columns: 12
        rows: auto
      card_mod:
        style: 'ha-card { border-radius: 24px; box-shadow: none; border: 1px solid var(--divider-color); background:
          linear-gradient(125deg, rgba(135, 156, 242, .13), rgba(135, 156, 242, .035)), var(--ha-card-background);
          padding: 8px 4px; }'
    - type: custom:mushroom-light-card
