# Listener-specific authentication keeps application credentials off the IoT listener.
plugin_load local_passwords /usr/lib/mosquitto_password_file.so
plugin_opt_password_file /runtime/mosquitto-passwords
plugin_load local_acl /usr/lib/mosquitto_acl_file.so
plugin_opt_acl_file /runtime/mosquitto.acl
plugin_load nuki_passwords /usr/lib/mosquitto_password_file.so
plugin_opt_password_file /runtime/nuki-passwords
plugin_load nuki_acl /usr/lib/mosquitto_acl_file.so
plugin_opt_acl_file /runtime/mosquitto-nuki.acl

allow_anonymous false
listener 1883 127.0.0.1
plugin_use local_passwords
plugin_use local_acl

# Only the Thread border router's NAT64 source may reach this listener.
listener 1883 10.21.50.10
plugin_use nuki_passwords
plugin_use nuki_acl

persistence true
persistence_location /mosquitto/data/
autosave_interval 300
log_dest stdout
log_type error
log_type warning
connection_messages true
max_queued_messages 10000
max_packet_size 1048576
memory_limit 67108864
