apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: services-platform-controllers
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 15m
  path: ./deployments/homelab/cloud/services/10-platform-controllers
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: cert-manager
      namespace: cert-manager
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: envoy-gateway
      namespace: envoy-gateway-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: services-observability
  namespace: flux-system
spec:
  suspend: false
  interval: 10m
  retryInterval: 1m
  timeout: 20m
  path: ./deployments/homelab/cloud/services/12-observability
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: services-platform-controllers
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: kube-prometheus-stack
      namespace: services-observability
    - apiVersion: apps/v1
      kind: Deployment
      name: blackbox-exporter
      namespace: services-observability
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: services-backup-controller
  namespace: flux-system
spec:
  suspend: false
  interval: 10m
  retryInterval: 1m
  timeout: 20m
  path: ./deployments/homelab/cloud/services/15-backup-controller
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: services-observability
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: velero
      namespace: velero
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: services-backup-policy
  namespace: flux-system
spec:
  suspend: false
  interval: 10m
  retryInterval: 1m
  timeout: 10m
  path: ./deployments/homelab/cloud/services/16-backup-policy
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: services-backup-controller
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: backup-canary
      namespace: backup-qualification
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: services-platform-gateway
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 20m
  path: ./deployments/homelab/cloud/services/20-platform-gateway
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: services-platform-controllers
  healthChecks:
    - apiVersion: gateway.networking.k8s.io/v1
      kind: Gateway
      name: services
      namespace: services-network
    - apiVersion: cert-manager.io/v1
      kind: Certificate
      name: services
      namespace: services-network
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: services-synthetic-monitoring
  namespace: flux-system
spec:
  suspend: false
  interval: 10m
  retryInterval: 1m
  timeout: 10m
  path: ./deployments/homelab/cloud/services/50-synthetic-monitoring
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: services-home-automation
    - name: services-media
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: services-media
  namespace: flux-system
spec:
  suspend: false
  interval: 10m
  retryInterval: 1m
  timeout: 20m
  path: ./deployments/homelab/cloud/services/40-media
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: services-platform-gateway
    - name: services-backup-policy
  healthChecks:
    - apiVersion: apps/v1
      kind: StatefulSet
      name: navidrome
      namespace: media
    - apiVersion: apps/v1
      kind: StatefulSet
      name: sftpgo
      namespace: media
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: services-home-automation
  namespace: flux-system
spec:
  suspend: false
  interval: 10m
