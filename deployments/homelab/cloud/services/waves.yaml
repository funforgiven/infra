apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: services-netbird-controllers
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 15m
  path: ./deployments/homelab/cloud/services/48-netbird/controllers
  prune: true
  sourceRef: {kind: GitRepository, name: flux-system}
  dependsOn:
    - name: services-platform-controllers
    - name: services-observability
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: cloudnative-pg
      namespace: cnpg-system
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: barman-cloud
      namespace: cnpg-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: services-netbird-server
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 20m
  path: ./deployments/homelab/cloud/services/48-netbird/server
  prune: true
  sourceRef: {kind: GitRepository, name: flux-system}
  decryption:
    provider: sops
    secretRef: {name: sops-age}
  dependsOn:
    - name: services-netbird-controllers
    - name: services-platform-gateway
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: netbird-server
      namespace: netbird
    - apiVersion: apps/v1
      kind: DaemonSet
      name: netbird-stun
      namespace: netbird
    - apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      name: netbird-postgres
      namespace: netbird
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: services-netbird-operator
  namespace: flux-system
spec:
  # The default mesh policy is disabled and the API credential is enrolled.
  suspend: false
  interval: 10m
  retryInterval: 1m
  timeout: 15m
  path: ./deployments/homelab/cloud/services/48-netbird/operator
  prune: true
  sourceRef: {kind: GitRepository, name: flux-system}
  decryption:
    provider: sops
    secretRef: {name: sops-age}
  dependsOn:
    - name: services-netbird-server
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: netbird-operator
      namespace: netbird-routing
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: services-netbird-access
  namespace: flux-system
spec:
  # The policy controller has created the DNS zones and explicit HTTPS policy.
  suspend: false
  interval: 10m
  retryInterval: 1m
  timeout: 15m
  path: ./deployments/homelab/cloud/services/48-netbird/access
  prune: true
  sourceRef: {kind: GitRepository, name: flux-system}
  dependsOn:
    - name: services-netbird-operator
    - name: services-platform-gateway
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: networkrouter-services
      namespace: netbird-routing
    - apiVersion: netbird.io/v1alpha1
      kind: NetworkRouter
      name: services
      namespace: netbird-routing
    - apiVersion: netbird.io/v1alpha1
      kind: NetworkResource
      name: services
      namespace: envoy-gateway-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: services-matrix
  namespace: flux-system
spec:
  # Enrollment must publish the image and import ZITADEL credentials first.
  suspend: false
  interval: 10m
  retryInterval: 1m
  timeout: 20m
  path: ./deployments/homelab/cloud/services/47-matrix
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  dependsOn:
    - name: services-platform-gateway
    - name: services-backup-policy
  healthChecks:
    - apiVersion: apps/v1
      kind: StatefulSet
      name: matrix-synapse
      namespace: matrix
    - apiVersion: apps/v1
      kind: Deployment
      name: matrix-mas
      namespace: matrix
    - apiVersion: gateway.networking.k8s.io/v1
      kind: Gateway
      name: matrix-public
      namespace: services-network
---
