apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: gitlab-http
  namespace: services-observability
spec:
  interval: 60s
  scrapeTimeout: 20s
  jobName: gitlab-http
  module: http_2xx
  prober:
    url: blackbox-exporter.services-observability.svc.cluster.local:9115
  targets:
    staticConfig:
      static:
        - https://gitlab.fahrican.com/-/health
        - https://gitlab.fahrican.com/-/readiness
---
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: gitlab-registry
  namespace: services-observability
spec:
  interval: 60s
  scrapeTimeout: 20s
  jobName: gitlab-registry
  module: gitlab_registry
  prober:
    url: blackbox-exporter.services-observability.svc.cluster.local:9115
  targets:
    staticConfig:
      static: [https://registry.fahrican.com/v2/]
---
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: gitlab-ssh
  namespace: services-observability
spec:
  interval: 60s
  scrapeTimeout: 15s
  jobName: gitlab-ssh
  module: tcp_connect
  prober:
    url: blackbox-exporter.services-observability.svc.cluster.local:9115
  targets:
    staticConfig:
      static: [gitlab.fahrican.com:2222]
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: gitlab
  namespace: services-observability
spec:
  groups:
    - name: gitlab
      rules:
        - alert: GitLabEndpointDown
          expr: probe_success{job=~"gitlab-http|gitlab-registry|gitlab-ssh"} == 0
          for: 20m
          labels:
            severity: critical
          annotations:
            summary: "GitLab endpoint {{ $labels.instance }} is unavailable"
        - alert: GitLabBackupStale
          expr: >-
            time() - services_restic_last_success_unixtime{host="gitlab"} > 93600
            or absent(services_restic_last_success_unixtime{host="gitlab"})
          for: 1h
          labels:
            severity: critical
          annotations:
            summary: GitLab has no successful off-site backup within 26 hours
        - alert: GitLabRestoreQualificationStale
          expr: >-
            time() - gitlab_restore_last_success_unixtime > 3024000
            or absent(gitlab_restore_last_success_unixtime)
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: GitLab restore has not been qualified within 35 days
        - alert: GitLabMacOSGuestDown
          expr: >-
            node_systemd_unit_state{name="quickemu-macos.service",state="active"} == 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: The macOS Quickemu guest is unavailable
