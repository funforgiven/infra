apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: navidrome
  namespace: media
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: navidrome
  endpoints:
    - port: native
      path: /metrics
      interval: 30s
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: media
  namespace: media
spec:
  groups:
    - name: media
      rules:
        - alert: NavidromeUnavailable
          expr: up{namespace="media",service="navidrome"} == 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: Navidrome metrics are unavailable
            description: Navidrome has not been scrapeable for ten minutes.
        - alert: BeetsImporterStalled
          expr: >-
            (time() - kube_cronjob_status_last_successful_time{
              namespace="media",cronjob="beets-import"
            } > 1800) or ((time() - kube_cronjob_created{
              namespace="media",cronjob="beets-import"
            } > 1800) unless on(namespace,cronjob)
            kube_cronjob_status_last_successful_time{
              namespace="media",cronjob="beets-import"
            })
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: Beets has not completed an import check recently
            description: >-
              The one-minute Beets importer has not completed successfully
              for at least thirty minutes.
        - alert: AudioMuseUnavailable
          expr: >-
            kube_deployment_status_replicas_available{
              namespace="media",deployment="audiomuse"
            } < 1
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: AudioMuse web is unavailable
            description: AudioMuse has had no available web replica for ten minutes.
        - alert: AudioMuseWorkerUnavailable
          expr: >-
            kube_deployment_status_replicas_available{
              namespace="media",deployment="audiomuse-worker"
            } < 1
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: AudioMuse analysis worker is unavailable
            description: AudioMuse has had no available analysis worker for fifteen minutes.
        - alert: AudioMusePostgresUnavailable
          expr: >-
            kube_statefulset_status_replicas_ready{
              namespace="media",statefulset="audiomuse-postgres"
            } < 1
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: AudioMuse PostgreSQL is unavailable
            description: AudioMuse PostgreSQL has had no ready replica for ten minutes.
        - alert: AudioMuseReconcileStalled
          expr: >-
            (time() - kube_cronjob_status_last_successful_time{
              namespace="media",cronjob="audiomuse-reconcile"
            } > 3600) or ((time() - kube_cronjob_created{
              namespace="media",cronjob="audiomuse-reconcile"
            } > 3600) unless on(namespace,cronjob)
            kube_cronjob_status_last_successful_time{
              namespace="media",cronjob="audiomuse-reconcile"
            })
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: AudioMuse policy reconciliation is stale
            description: AudioMuse cron policy has not reconciled successfully for an hour.
        - alert: AudioMusePostgresBackupStalled
          expr: >-
            (time() - kube_cronjob_status_last_successful_time{
              namespace="media",cronjob="audiomuse-postgres-backup"
            } > 129600) or ((time() - kube_cronjob_created{
              namespace="media",cronjob="audiomuse-postgres-backup"
            } > 129600) unless on(namespace,cronjob)
            kube_cronjob_status_last_successful_time{
              namespace="media",cronjob="audiomuse-postgres-backup"
            })
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: AudioMuse PostgreSQL logical backup is stale
            description: No AudioMuse PostgreSQL logical backup completed in the last 36 hours.
        - alert: DiscordMusicUnavailable
          expr: >-
            kube_deployment_status_replicas_available{
              namespace="media",deployment="discord-music"
            } < 1
            or absent(kube_deployment_status_replicas_available{
              namespace="media",deployment="discord-music"
            })
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: The Discord music bot is unavailable
            description: Muse has had no available replica for ten minutes.
