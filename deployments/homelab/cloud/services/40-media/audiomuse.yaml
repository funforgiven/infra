apiVersion: v1
kind: Service
metadata:
  name: audiomuse-postgres
  namespace: media
  labels:
    app.kubernetes.io/name: audiomuse-postgres
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: audiomuse-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: audiomuse-postgres
  namespace: media
spec:
  serviceName: audiomuse-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: audiomuse-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: audiomuse-postgres
        app.kubernetes.io/part-of: media
      annotations:
        backup.velero.io/backup-volumes-excludes: data
    spec:
      automountServiceAccountToken: false
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: audiomuse-worker
      securityContext:
        fsGroup: 70
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: docker.io/library/postgres:15.19-alpine@sha256:a2c20749c564b4eb73a77bfda626f8a3cde1bbfae020fb97c616a00cdc1a2181
          env:
            - name: POSTGRES_DB
              value: audiomusedb
            - name: POSTGRES_USER
              value: audiomuse
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: media-runtime
                  key: AUDIOMUSE_POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: TZ
              value: Europe/Istanbul
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: [pg_isready, -U, audiomuse, -d, audiomusedb]
            periodSeconds: 10
          livenessProbe:
            exec:
              command: [pg_isready, -U, audiomuse, -d, audiomusedb]
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsGroup: 70
            runAsNonRoot: true
            runAsUser: 70
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: audiomuse-postgres
---
apiVersion: v1
kind: Service
metadata:
  name: audiomuse
  namespace: media
  labels:
    app.kubernetes.io/name: audiomuse
spec:
  selector:
    app.kubernetes.io/name: audiomuse
  ports:
    - name: web
      port: 4180
      targetPort: web
---
apiVersion: v1
kind: Service
metadata:
  name: audiomuse-api
  namespace: media
  labels:
    app.kubernetes.io/name: audiomuse
spec:
  selector:
    app.kubernetes.io/name: audiomuse
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: audiomuse
  namespace: media
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: audiomuse
  template:
    metadata:
      labels:
        app.kubernetes.io/name: audiomuse
        app.kubernetes.io/part-of: media
    spec:
      automountServiceAccountToken: false
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: audiomuse-worker
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-navidrome
          image: ghcr.io/neptunehub/audiomuse-ai:3.4.0@sha256:5c2c3710d0a0990258946b2d268c955d29b675afc9588bcfe3f70fd3d1f11ff6
          command: [/usr/bin/python3, -c]
          args:
            - |
              import time
              import urllib.request

              for attempt in range(120):
                  try:
                      urllib.request.urlopen(
                          "http://navidrome.media.svc.cluster.local:4533/ping",
                          timeout=2,
                      ).close()
                      break
                  except OSError:
                      if attempt == 119:
                          raise
                      time.sleep(2)
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 1000
            runAsNonRoot: true
            runAsUser: 1000
      containers:
        - name: audiomuse
          image: ghcr.io/neptunehub/audiomuse-ai:3.4.0@sha256:5c2c3710d0a0990258946b2d268c955d29b675afc9588bcfe3f70fd3d1f11ff6
          envFrom:
            - configMapRef:
                name: audiomuse-config
          env:
            - name: SERVICE_TYPE
              value: flask
            - name: NAVIDROME_USER
              value: audiomuse
            - name: NAVIDROME_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: media-runtime
                  key: AUDIOMUSE_NAVIDROME_PASSWORD
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: media-runtime
                  key: AUDIOMUSE_POSTGRES_PASSWORD
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
          securityContext: &audiomuseSecurityContext
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 1000
            runAsNonRoot: true
            runAsUser: 1000
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: temp-audio
              mountPath: /app/temp_audio
            - name: plugins
              mountPath: /app/plugin/installed
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.4@sha256:b1b2021fe8f4004573e8d690dec6c7bb29cc44364572cf8510a05bf3a0ae2ded
          args:
            - --provider=oidc
            - --oidc-issuer-url=https://auth.cloud.fahrican.com
            - --redirect-url=https://audiomuse.fahrican.com/oauth2/callback
            - --upstream=http://127.0.0.1:8000
            - --http-address=0.0.0.0:4180
            - --email-domain=*
            - --scope=openid profile email
            - --reverse-proxy=true
            - --trusted-proxy-ip=172.16.0.0/13
            - --cookie-secure=true
            - --cookie-samesite=lax
            - --cookie-refresh=1h
            - --cookie-expire=12h
            - --skip-provider-button=true
          env:
            - name: OAUTH2_PROXY_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: media-runtime
                  key: AUDIOMUSE_OIDC_CLIENT_ID
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: media-runtime
                  key: AUDIOMUSE_OIDC_CLIENT_SECRET
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: media-runtime
                  key: AUDIOMUSE_OAUTH2_COOKIE_SECRET
          ports:
            - name: web
              containerPort: 4180
          readinessProbe:
            httpGet:
              path: /ping
              port: web
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ping
              port: web
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
        - name: temp-audio
          emptyDir: {}
        - name: plugins
          emptyDir: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: audiomuse-worker
  namespace: media
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: audiomuse-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: audiomuse-worker
        app.kubernetes.io/part-of: media
    spec:
      automountServiceAccountToken: false
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/name
                      operator: In
                      values:
                        - audiomuse
                        - audiomuse-postgres
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-navidrome
          image: ghcr.io/neptunehub/audiomuse-ai:3.4.0@sha256:5c2c3710d0a0990258946b2d268c955d29b675afc9588bcfe3f70fd3d1f11ff6
          command: [/usr/bin/python3, -c]
          args:
            - |
              import time
              import urllib.request

              for attempt in range(120):
                  try:
                      urllib.request.urlopen(
                          "http://navidrome.media.svc.cluster.local:4533/ping",
                          timeout=2,
                      ).close()
                      break
                  except OSError:
                      if attempt == 119:
                          raise
                      time.sleep(2)
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 1000
            runAsNonRoot: true
            runAsUser: 1000
      containers:
        - name: worker
          image: ghcr.io/neptunehub/audiomuse-ai:3.4.0@sha256:5c2c3710d0a0990258946b2d268c955d29b675afc9588bcfe3f70fd3d1f11ff6
          envFrom:
            - configMapRef:
                name: audiomuse-config
          env:
            - name: SERVICE_TYPE
              value: worker
            - name: NAVIDROME_USER
              value: audiomuse
            - name: NAVIDROME_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: media-runtime
                  key: AUDIOMUSE_NAVIDROME_PASSWORD
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: media-runtime
                  key: AUDIOMUSE_POSTGRES_PASSWORD
          resources:
            requests:
              cpu: "1"
              memory: 3Gi
            limits:
              cpu: "3"
              memory: 7Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 1000
            runAsNonRoot: true
            runAsUser: 1000
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: temp-audio
              mountPath: /app/temp_audio
            - name: plugins
              mountPath: /app/plugin/installed
      volumes:
        - name: tmp
          emptyDir: {}
        - name: temp-audio
          emptyDir:
            sizeLimit: 10Gi
        - name: plugins
          emptyDir: {}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: audiomuse-reconcile
  namespace: media
spec:
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 1800
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: audiomuse-reconcile
            app.kubernetes.io/part-of: media
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: reconcile
              image: ghcr.io/neptunehub/audiomuse-ai:3.4.0@sha256:5c2c3710d0a0990258946b2d268c955d29b675afc9588bcfe3f70fd3d1f11ff6
              command: [/usr/bin/python3, /config/reconcile-audiomuse.py]
              resources:
                requests:
                  cpu: 25m
                  memory: 64Mi
                limits:
                  cpu: 200m
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                readOnlyRootFilesystem: true
                runAsGroup: 1000
                runAsNonRoot: true
                runAsUser: 1000
              volumeMounts:
                - name: config
                  mountPath: /config
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: config
              configMap:
                name: audiomuse-bootstrap
                defaultMode: 0555
            - name: tmp
              emptyDir: {}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: audiomuse-postgres-backup
  namespace: media
spec:
  schedule: "45 1 * * *"
  timeZone: Europe/Istanbul
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 1800
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 1800
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: audiomuse-postgres-backup
            app.kubernetes.io/part-of: media
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            fsGroup: 70
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: pg-dump
              image: docker.io/library/postgres:15.19-alpine@sha256:a2c20749c564b4eb73a77bfda626f8a3cde1bbfae020fb97c616a00cdc1a2181
              command: [/bin/sh, /config/postgres-backup.sh]
              env:
                - name: POSTGRES_DB
                  value: audiomusedb
                - name: POSTGRES_HOST
                  value: audiomuse-postgres.media.svc.cluster.local
                - name: POSTGRES_USER
                  value: audiomuse
                - name: PGCONNECT_TIMEOUT
                  value: "30"
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: media-runtime
                      key: AUDIOMUSE_POSTGRES_PASSWORD
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: "1"
                  memory: 1Gi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                readOnlyRootFilesystem: true
                runAsGroup: 70
                runAsNonRoot: true
                runAsUser: 70
              volumeMounts:
                - name: backups
                  mountPath: /backups
                - name: config
                  mountPath: /config
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: backups
              persistentVolumeClaim:
                claimName: audiomuse-postgres-dumps
            - name: config
              configMap:
                name: audiomuse-bootstrap
                defaultMode: 0555
            - name: tmp
              emptyDir: {}
