directory: /media/library
library: /state/library.db
statefile: /state/import-state.pickle
create_backup_before_migrations: yes

plugins:
  - musicbrainz
  - deezer
  - chroma
  - fetchart
  - embedart
  - mbsync
  - replaygain
  - lastgenre
  - badfiles

threaded: yes
art_filename: cover

import:
  write: yes
  copy: no
  move: yes
  resume: no
  incremental: no
  quiet: yes
  quiet_fallback: skip
  autotag: yes
  duplicate_keys:
    # Beets 2.13.1 does not map chosen AlbumInfo IDs to mb_* fields when
    # checking duplicates. Its native name keys work for tagged and as-is
    # imports; retain rejected copies for any edition/quality review.
    album: albumartist album
    item: artist title
  duplicate_action: skip
  log: /state/import.log

paths:
  default: $albumartist/$album%aunique{}/$track $title
  singleton: Non-Album/$artist/$title
  comp: Compilations/$album%aunique{}/$track $title

fetchart:
  auto: yes
  cautious: yes

embedart:
  auto: yes
  # Fill missing pictures without replacing a source's better embedded cover.
  ifempty: yes
  remove_art_file: no

musicbrainz:
  # A metadata-provider change is expected when enriching source-tagged files.
  data_source_mismatch_penalty: 0.0
  genres: yes
  extra_tags: [barcode, tracks]
  external_ids:
    deezer: yes
    spotify: yes

deezer:
  data_source_mismatch_penalty: 0.0

chroma:
  auto: yes

replaygain:
  auto: yes
  backend: ffmpeg
  overwrite: no
  parallel_on_import: no
  threads: 2

# Normalize existing genre aliases without fetching genres from Last.fm.
lastgenre:
  auto: no
  force: no
  cleanup_existing: yes
  aliases: yes
  # Hierarchy expansion would replace specific genres with broad parents.
  canonical: no
  # Preserve genres which are absent from Beets' bundled list.
  whitelist: no
  keep_existing: no
  count: 3
  fallback: null
  min_weight: 10
  # prefer_specific still drops genres missing from the bundled tree.
  prefer_specific: no
  source: album
  title_case: yes
  ignorelist: no

badfiles:
  check_on_import: yes
  import_action_on_error: skip
  import_action_on_warning: continue
  commands:
    flac: flac --test --warnings-as-errors --silent
