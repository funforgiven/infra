apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: media
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: media-web-ingress
  namespace: media
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values:
          - navidrome
          - sftpgo
          - audiomuse
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: envoy-gateway-system
      ports:
        - protocol: TCP
          port: 4533
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 4180
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: navidrome-audiomuse-ingress
  namespace: media
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: navidrome
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - audiomuse
                  - audiomuse-worker
      ports:
        - protocol: TCP
          port: 4533
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: navidrome-monitoring-ingress
  namespace: media
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: navidrome
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: services-observability
      ports:
        - protocol: TCP
          port: 4533
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: audiomuse-api-ingress
  namespace: media
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: audiomuse
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: navidrome
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: audiomuse-reconcile
      ports:
        - protocol: TCP
          port: 8000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: audiomuse-postgres-ingress
  namespace: media
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: audiomuse-postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - audiomuse
                  - audiomuse-worker
                  - audiomuse-postgres-backup
      ports:
        - protocol: TCP
          port: 5432
