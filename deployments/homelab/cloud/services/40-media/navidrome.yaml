apiVersion: v1
kind: Service
metadata:
  name: navidrome
  namespace: media
  labels:
    app.kubernetes.io/name: navidrome
spec:
  selector:
    app.kubernetes.io/name: navidrome
  ports:
    - name: http
      port: 4533
      targetPort: http
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: navidrome
  namespace: media
spec:
  serviceName: navidrome
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: navidrome
  template:
    metadata:
      labels:
        app.kubernetes.io/name: navidrome
        app.kubernetes.io/part-of: media
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: navidrome
          image: docker.io/deluan/navidrome:0.61.2@sha256:9fa40b3d8dec43ceb2213d1fa551da3dcfef6ac6d19c2e534efb92527c2bafd2
          env:
            - name: ND_AGENTS
              value: lastfm,listenbrainz,deezer
            - name: ND_BACKUP_COUNT
              value: "7"
            - name: ND_BACKUP_PATH
              value: /data/backups
            - name: ND_BACKUP_SCHEDULE
              value: "0 3 * * *"
            - name: ND_DEFAULTLANGUAGE
              value: en
            - name: ND_ENABLEINSIGHTSCOLLECTOR
              value: "false"
            - name: ND_ENABLELOGREDACTING
              value: "true"
            - name: ND_ENABLESHARING
              value: "false"
            - name: ND_LASTFM_APIKEY
              valueFrom:
                secretKeyRef:
                  name: media-runtime
                  key: ND_LASTFM_APIKEY
            - name: ND_LASTFM_LANGUAGE
              value: en
            - name: ND_LASTFM_SECRET
              valueFrom:
                secretKeyRef:
                  name: media-runtime
                  key: ND_LASTFM_SECRET
            - name: ND_LOGLEVEL
              value: info
            - name: ND_MUSICFOLDER
              value: /music
            - name: ND_PASSWORDENCRYPTIONKEY
              valueFrom:
                secretKeyRef:
                  name: media-runtime
                  key: ND_PASSWORDENCRYPTIONKEY
            - name: ND_PROMETHEUS_ENABLED
              value: "true"
            - name: ND_SCANNER_SCHEDULE
              value: "@every 1m"
            - name: ND_SEARCH_BACKEND
              value: fts
          ports:
            - name: http
              containerPort: 4533
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsGroup: 1000
            runAsNonRoot: true
            runAsUser: 1000
          volumeMounts:
            - name: data
              mountPath: /data
            - name: media
              mountPath: /music
              subPath: library
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: navidrome-data
        - name: media
          persistentVolumeClaim:
            claimName: media-library
