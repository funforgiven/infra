apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: navidrome
  namespace: media
spec:
  parentRefs:
    - name: services
      namespace: services-network
      sectionName: https
  hostnames:
    - music.fahrican.com
  rules:
    - backendRefs:
        - name: navidrome
          port: 4533
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: music-upload
  namespace: media
spec:
  parentRefs:
    - name: services
      namespace: services-network
      sectionName: https
  hostnames:
    - upload.fahrican.com
  rules:
    - backendRefs:
        - name: sftpgo
          port: 8080
