apiVersion: v1
kind: ServiceAccount
metadata:
  name: gitlab-job
  namespace: gitlab-ci
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gitlab-runner-manager
  namespace: gitlab-ci
rules:
  - apiGroups:
      - ''
    resources:
      - pods
    verbs:
      - create
      - delete
      - get
      - list
      - watch
  - apiGroups:
      - ''
    resources:
      - pods/attach
      - pods/exec
    verbs:
      - create
      - delete
      - get
      - patch
  - apiGroups:
      - ''
    resources:
      - pods/log
    verbs:
      - get
      - list
  - apiGroups:
      - ''
    resources:
      - secrets
    verbs:
      - create
      - delete
      - get
      - update
  - apiGroups:
      - ''
    resources:
      - services
    verbs:
      - create
      - get
  - apiGroups:
      - ''
    resources:
      - serviceaccounts
    resourceNames:
      - gitlab-job
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gitlab-runner-manager
  namespace: gitlab-ci
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: gitlab-runner-manager
subjects:
  - kind: ServiceAccount
    name: gitlab-runner-manager
    namespace: gitlab-runners
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: gitlab-ci
  namespace: gitlab-ci
spec:
  hard:
    pods: '2'
    requests.cpu: '2'
    limits.cpu: '4'
    requests.memory: 4Gi
    limits.memory: 4Gi
    requests.ephemeral-storage: 10Gi
    limits.ephemeral-storage: 16Gi
    persistentvolumeclaims: '0'
    services.loadbalancers: '0'
    services.nodeports: '0'
---
apiVersion: v1
kind: LimitRange
metadata:
  name: gitlab-ci
  namespace: gitlab-ci
spec:
  limits:
    - type: Container
      default:
        cpu: 500m
        memory: 256Mi
        ephemeral-storage: 1Gi
      defaultRequest:
        cpu: 100m
        memory: 128Mi
        ephemeral-storage: 128Mi
      max:
        cpu: '2'
        memory: 2Gi
        ephemeral-storage: 8Gi
