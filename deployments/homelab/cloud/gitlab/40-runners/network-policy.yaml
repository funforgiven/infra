# Ordered before CAPI's global egress Allow (20). Explicit final Deny is
# required because that provider policy otherwise bypasses namespace isolation.
apiVersion: projectcalico.org/v3
kind: NetworkPolicy
metadata:
  name: gitlab-ci
  namespace: gitlab-ci
spec:
  order: 16
  selector: all()
  types:
  - Ingress
  - Egress
  ingress:
  - action: Deny
  egress:
  - action: Allow
    destination:
      namespaceSelector: kubernetes.io/metadata.name == 'envoy-gateway-system'
      selector: gateway.envoyproxy.io/owning-gateway-name == 'gitlab' && gateway.envoyproxy.io/owning-gateway-namespace
        == 'gitlab-network'
      ports:
      - 10443
      - 2222
    protocol: TCP
  - action: Allow
    destination:
      namespaceSelector: kubernetes.io/metadata.name == 'kube-system'
      selector: k8s-app == 'kube-dns'
      ports:
      - 53
    protocol: UDP
  - action: Allow
    destination:
      namespaceSelector: kubernetes.io/metadata.name == 'kube-system'
      selector: k8s-app == 'kube-dns'
      ports:
      - 53
    protocol: TCP
  - action: Allow
    destination:
      nets:
      - 10.21.40.127/32
      ports:
      - 443
      - 2222
    protocol: TCP
  - action: Allow
    destination:
      nets:
      - 0.0.0.0/0
      notNets:
      - 0.0.0.0/8
      - 10.0.0.0/8
      - 100.64.0.0/10
      - 127.0.0.0/8
      - 169.254.0.0/16
      - 172.16.0.0/12
      - 192.0.0.0/24
      - 192.0.2.0/24
      - 192.168.0.0/16
      - 198.18.0.0/15
      - 198.51.100.0/24
      - 203.0.113.0/24
      - 224.0.0.0/4
      - 240.0.0.0/4
      ports:
      - 80
      - 443
    protocol: TCP
  - action: Deny
---
apiVersion: projectcalico.org/v3
kind: NetworkPolicy
metadata:
  name: gitlab-runner-manager
  namespace: gitlab-runners
spec:
  order: 16
  selector: all()
  types:
  - Ingress
  - Egress
  ingress:
  - action: Deny
  egress:
  - action: Allow
    destination:
      namespaceSelector: kubernetes.io/metadata.name == 'envoy-gateway-system'
      selector: gateway.envoyproxy.io/owning-gateway-name == 'gitlab' && gateway.envoyproxy.io/owning-gateway-namespace
        == 'gitlab-network'
      ports:
      - 10443
      - 2222
    protocol: TCP
  - action: Allow
    destination:
      namespaceSelector: kubernetes.io/metadata.name == 'kube-system'
      selector: k8s-app == 'kube-dns'
      ports:
      - 53
    protocol: UDP
  - action: Allow
    destination:
      namespaceSelector: kubernetes.io/metadata.name == 'kube-system'
      selector: k8s-app == 'kube-dns'
      ports:
      - 53
    protocol: TCP
  - action: Allow
    destination:
      nets:
      - 10.21.40.127/32
      ports:
      - 443
      - 2222
    protocol: TCP
  - action: Allow
    destination:
      nets:
      - 192.168.82.0/24
      ports:
      - 6443
      - 443
    protocol: TCP
  - action: Allow
    destination:
      nets:
      - 10.21.40.0/24
      ports:
      - 6443
    protocol: TCP
  - action: Deny
