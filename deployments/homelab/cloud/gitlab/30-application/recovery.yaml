apiVersion: v1
kind: ServiceAccount
metadata:
  name: gitlab-recovery
  namespace: gitlab
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gitlab-recovery
  namespace: gitlab
rules:
  - apiGroups:
      - ''
    resources:
      - secrets
    verbs:
      - get
      - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gitlab-recovery
  namespace: gitlab
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: gitlab-recovery
subjects:
  - kind: ServiceAccount
    name: gitlab-recovery
    namespace: gitlab
