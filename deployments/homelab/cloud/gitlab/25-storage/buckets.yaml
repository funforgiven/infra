apiVersion: batch/v1
kind: Job
metadata:
  name: gitlab-create-buckets-v2
  namespace: gitlab
spec:
  backoffLimit: 4
  activeDeadlineSeconds: 900
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: create
          image: registry.gitlab.com/gitlab-org/build/cng/gitlab-toolbox-ee:v19.3.1@sha256:9bff4b6d337d6782289d9cc4aa02f6a0a230dc44a2e071f731c99eda3f768338
          command:
            - /bin/bash
            - -ec
            - |
              set -eu
              export HOME=/tmp
              for bucket in gitlab-lfs gitlab-artifacts gitlab-uploads gitlab-packages gitlab-mr-diffs gitlab-terraform-state gitlab-ci-secure-files gitlab-dependency-proxy gitlab-registry gitlab-pages gitlab-agent-plan-content gitlab-backups gitlab-tmp; do
                s3cmd -c /s3/s3cfg info "s3://$bucket" >/dev/null 2>&1 || s3cmd -c /s3/s3cfg mb "s3://$bucket"
                s3cmd -c /s3/s3cfg info "s3://$bucket" >/dev/null
              done
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: s3
              mountPath: /s3
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: s3
          secret:
            secretName: gitlab-object-storage
            items:
              - key: s3cmd
                path: s3cfg
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
