---
cloud_storage_devices:
  os:
    - /dev/disk/by-path/pci-0000:0f:00.0-ata-2.0
    - /dev/disk/by-path/pci-0000:0f:00.0-ata-3.0
  ceph:
    - /dev/disk/by-path/pci-0000:02:00.0-nvme-1
    - /dev/disk/by-path/pci-0000:10:00.0-nvme-1

cloud_vlan_addresses:
  20: 10.21.20.12
  30: 10.21.30.12
  31: 10.21.31.12
  32: 10.21.32.12

cloud_iommu_kernel_parameters:
  - amd_iommu=on
  - iommu=pt
cloud_cpu_virtualization_module: kvm_amd

cloud_console_password_file: /run/secrets/cloud-host-asiago-ubuntu-console-password
cloud_console_password_salt: asiago.ubuntu
ansible_become_password: >-
  {{ lookup('ansible.builtin.file', cloud_console_password_file) }}
