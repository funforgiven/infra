---
cloud_storage_devices:
  os:
    - /dev/disk/by-path/pci-0000:00:17.0-ata-8.0
    - /dev/disk/by-path/pci-0000:07:00.0-ata-2.0
  ceph:
    - /dev/disk/by-path/pci-0000:02:00.0-nvme-1
    - /dev/disk/by-path/pci-0000:04:00.0-nvme-1

cloud_vlan_addresses:
  20: 10.21.20.10
  30: 10.21.30.10
  31: 10.21.31.10
  32: 10.21.32.10

cloud_iommu_kernel_parameters:
  - intel_iommu=on
  - iommu=pt
cloud_cpu_virtualization_module: kvm_intel

cloud_console_password_file: /run/secrets/cloud-host-pecorino-ubuntu-console-password
cloud_console_password_salt: pecorino.ubuntu
ansible_become_password: >-
  {{ lookup('ansible.builtin.file', cloud_console_password_file) }}
