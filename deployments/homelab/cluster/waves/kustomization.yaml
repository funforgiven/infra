apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- stages.yaml
patches:
- target:
    group: kustomize.toolkit.fluxcd.io
    kind: Kustomization
  patch: |
    apiVersion: kustomize.toolkit.fluxcd.io/v1
    kind: Kustomization
    metadata:
      name: all
    spec:
      interval: 10m
      retryInterval: 1m
      timeout: 20m
      prune: true
      sourceRef:
        kind: GitRepository
        name: flux-system
      decryption:
        provider: sops
        secretRef:
          name: sops-age
      # HelmReleases wait with the same one-node-lost rules for their workloads;
      # validate.py keeps these copies identical to the stage expressions.
      patches:
      - target:
          group: helm.toolkit.fluxcd.io
          kind: HelmRelease
        patch: |
          - op: add
            path: /spec/healthCheckExprs
            value:
            - apiVersion: apps/v1
              kind: Deployment
              current: >-
                has(status.observedGeneration) && status.observedGeneration == metadata.generation &&
                (spec.replicas == 0 || (has(status.replicas) && has(status.updatedReplicas) && has(status.availableReplicas) &&
                status.updatedReplicas == spec.replicas && status.replicas == status.updatedReplicas &&
                status.availableReplicas >= (spec.replicas > 1 ? spec.replicas - 1 : 1)))
            - apiVersion: apps/v1
              kind: StatefulSet
              current: >-
                has(status.observedGeneration) && status.observedGeneration == metadata.generation &&
                (spec.replicas == 0 || (has(status.availableReplicas) &&
                status.availableReplicas >= (spec.replicas > 1 ? spec.replicas - 1 : 1) &&
                (spec.updateStrategy.type == 'OnDelete' || (has(status.updatedReplicas) &&
                has(status.currentRevision) && has(status.updateRevision) &&
                status.updatedReplicas == spec.replicas && status.currentRevision == status.updateRevision))))
            - apiVersion: apps/v1
              kind: DaemonSet
              current: >-
                has(status.observedGeneration) && status.observedGeneration == metadata.generation &&
                (status.desiredNumberScheduled == 0 || (has(status.numberAvailable) && has(status.updatedNumberScheduled) &&
                status.updatedNumberScheduled >= status.desiredNumberScheduled &&
                status.numberAvailable >= (status.desiredNumberScheduled > 1 ? status.desiredNumberScheduled - 1 : 1)))
      # Health means serving with one node lost: replicated workloads may run one
      # replica short, Ceph may warn, and single-replica workloads must be up.
      healthCheckExprs:
      # Stages only label nodes; a node being down is not a deployment failure.
      - apiVersion: v1
        kind: Node
        current: 'true'
      # Rollouts must finish (every replica on the new template, no old pods
      # left); only availability may run one replica short.
      - apiVersion: apps/v1
        kind: Deployment
        current: >-
          has(status.observedGeneration) && status.observedGeneration == metadata.generation &&
          (spec.replicas == 0 || (has(status.replicas) && has(status.updatedReplicas) && has(status.availableReplicas) &&
          status.updatedReplicas == spec.replicas && status.replicas == status.updatedReplicas &&
          status.availableReplicas >= (spec.replicas > 1 ? spec.replicas - 1 : 1)))
      # OnDelete StatefulSets (Forgejo) roll only when an operator deletes the pod.
      - apiVersion: apps/v1
        kind: StatefulSet
        current: >-
          has(status.observedGeneration) && status.observedGeneration == metadata.generation &&
          (spec.replicas == 0 || (has(status.availableReplicas) &&
          status.availableReplicas >= (spec.replicas > 1 ? spec.replicas - 1 : 1) &&
          (spec.updateStrategy.type == 'OnDelete' || (has(status.updatedReplicas) &&
          has(status.currentRevision) && has(status.updateRevision) &&
          status.updatedReplicas == spec.replicas && status.currentRevision == status.updateRevision))))
      - apiVersion: apps/v1
        kind: DaemonSet
        current: >-
          has(status.observedGeneration) && status.observedGeneration == metadata.generation &&
          (status.desiredNumberScheduled == 0 || (has(status.numberAvailable) && has(status.updatedNumberScheduled) &&
          status.updatedNumberScheduled >= status.desiredNumberScheduled &&
          status.numberAvailable >= (status.desiredNumberScheduled > 1 ? status.desiredNumberScheduled - 1 : 1)))
      - apiVersion: postgresql.cnpg.io/v1
        kind: Cluster
        current: 'has(status.readyInstances) && status.readyInstances >= (spec.instances > 1 ? spec.instances - 1 : 1)'
      - apiVersion: ceph.rook.io/v1
        kind: CephCluster
        failed: has(status.ceph.health) && status.ceph.health == 'HEALTH_ERR'
        current: has(status.ceph.health) && status.ceph.health in ['HEALTH_OK', 'HEALTH_WARN']
      - apiVersion: ceph.rook.io/v1
        kind: CephBlockPool
        failed: has(status.phase) && status.phase == 'Failure'
        current: has(status.phase) && status.phase == 'Ready'
      - apiVersion: ceph.rook.io/v1
        kind: CephFilesystem
        failed: has(status.phase) && status.phase == 'Failure'
        current: has(status.phase) && status.phase == 'Ready'
      - apiVersion: kubevirt.io/v1
        kind: KubeVirt
        failed: has(status.phase) && status.phase == 'Deleted'
        current: has(status.phase) && status.phase == 'Deployed'
