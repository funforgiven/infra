apiVersion: v1
kind: ConfigMap
metadata:
  name: velero-runtime-values
  namespace: velero
data:
  values.yaml: |
    configuration:
      backupStorageLocation:
      - name: default
        provider: aws
        bucket: fahrican-cloud-recovery
        prefix: services/kubernetes
        default: true
        accessMode: ReadWrite
        credential:
          name: velero-object-storage
          key: cloud
        config:
          region: us-west-004
          checksumAlgorithm: ''
          s3ForcePathStyle: 'true'
          s3Url: https://s3.us-west-004.backblazeb2.com
