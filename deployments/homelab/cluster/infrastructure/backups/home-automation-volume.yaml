apiVersion: velero.io/v1
kind: Schedule
metadata:
  name: home-automation-volume
  namespace: velero
  annotations:
    velero.io/csi-volumesnapshot-class_rook-ceph.rbd.csi.ceph.com: observability-history
spec:
  paused: false
  schedule: 30 5 * * *
  useOwnerReferencesInBackup: false
  template:
    storageLocation: default
    ttl: 720h
    includedNamespaces:
    - home-automation
    includedResources:
    - persistentvolumeclaims
    - persistentvolumes
    labelSelector:
      matchLabels:
        backup.fahrican.com/automation-volume: "true"
    snapshotVolumes: true
    snapshotMoveData: true
    defaultVolumesToFsBackup: false
    itemOperationTimeout: 4h
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: home-automation-volume-backup
  namespace: services-observability
spec:
  groups:
  - name: home-automation-volume-backup
    rules:
    - alert: HomeAutomationVolumeBackupStale
      expr: (time() - velero_backup_last_successful_timestamp{schedule="home-automation-volume"} > 93600) or absent(velero_backup_last_successful_timestamp{schedule="home-automation-volume"})
      for: 1h
      labels:
        severity: critical
      annotations:
        summary: No successful offsite home automation volume backup within 26 hours.
