# Canary: a fixed file whose checksum the drill verifies after every restore.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backup-canary
  namespace: backup-qualification
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: ceph-block
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backup-canary
  namespace: backup-qualification
spec:
  replicas: 1
  strategy:
    type: Recreate
    rollingUpdate: null
  selector:
    matchLabels:
      app.kubernetes.io/name: backup-canary
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backup-canary
        app.kubernetes.io/part-of: backup-qualification
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: canary
        image: docker.io/library/busybox:1.38.0@sha256:dc2d74b28e4cf8984fa52af1f39bc7c3d9c73760b41a74d629f5d11b1ab28616
        command:
        - /bin/sh
        - -ec
        - |
          printf '%s\n' services-backup-canary-v1 > /data/canary
          while true; do sleep 3600; done
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -ec
            - printf '%s  %s\n' 8eae9bfd58377faaf8c96501d130bfae5e3fedb725cd31d8c717f500cddc3c70 /data/canary
              | sha256sum -c -
          periodSeconds: 30
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 250m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsGroup: 65532
          runAsNonRoot: true
          runAsUser: 65532
        volumeMounts:
        - name: data
          mountPath: /data
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: backup-canary
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-all
  namespace: backup-qualification
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
---
# The drill reaches only the Kubernetes API.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: restore-drill
  namespace: backup-qualification
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: restore-drill
  ingressDeny:
  - {}
  egress:
  - toEntities:
    - kube-apiserver
    toPorts:
    - ports:
      - port: '6443'
        protocol: TCP
---
# Drill restores only: every claim lands on the disposable Delete-reclaim class
# without its production volume binding (the add makes the remove safe for
# claims that were never bound).
apiVersion: v1
kind: ConfigMap
metadata:
  name: restore-drill-modifiers
  namespace: velero
data:
  resource-modifiers.yaml: |
    version: v1
    resourceModifierRules:
    - conditions:
        groupResource: persistentvolumeclaims
      patches:
      - operation: add
        path: /spec/volumeName
        value: ''
      - operation: remove
        path: /spec/volumeName
      - operation: add
        path: /spec/storageClassName
        value: ceph-block-restore
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: restore-drill
  namespace: backup-qualification
automountServiceAccountToken: false
---
# Creating a Restore lets Velero (cluster-admin) recreate backed-up objects;
# the drill script only ever requests PVCs into the *-restore namespaces.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: restore-drill
  namespace: velero
rules:
- apiGroups:
  - velero.io
  resources:
  - backups
  verbs:
  - get
  - list
- apiGroups:
  - velero.io
  resources:
  - restores
  verbs:
  - create
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: restore-drill
  namespace: velero
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: restore-drill
subjects:
- kind: ServiceAccount
  name: restore-drill
  namespace: backup-qualification
---
# Read-only: detects restored volumes that would outlive their claims.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: restore-drill-volumes
rules:
- apiGroups:
  - ''
  resources:
  - persistentvolumes
  verbs:
  - get
  - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: restore-drill-volumes
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: restore-drill-volumes
subjects:
- kind: ServiceAccount
  name: restore-drill
  namespace: backup-qualification
---
# Bound only inside the *-restore namespaces (restore-namespaces.yaml).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: restore-drill-target
rules:
- apiGroups:
  - ''
  resources:
  - persistentvolumeclaims
  verbs:
  - get
  - list
  - watch
  - delete
- apiGroups:
  - ''
  resources:
  - pods
  verbs:
  - get
  - list
- apiGroups:
  - ''
  resources:
  - pods/log
  verbs:
  - get
- apiGroups:
  - batch
  resources:
  - cronjobs
  verbs:
  - get
  - list
- apiGroups:
  - batch
  resources:
  - jobs
  verbs:
  - get
  - list
  - watch
  - create
  - delete
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: restore-drill
  namespace: backup-qualification
  labels:
    monitoring.fahrican.com/dedicated-job-alerts: "true"
spec:
  # After the 02:30 UTC daily backup.
  schedule: 0 7 1 * *
  timeZone: Europe/Istanbul
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      activeDeadlineSeconds: 25200
      backoffLimit: 0
      template:
        metadata:
          labels:
            app.kubernetes.io/name: restore-drill
            app.kubernetes.io/part-of: backup-qualification
        spec:
          automountServiceAccountToken: true
          serviceAccountName: restore-drill
          restartPolicy: Never
          securityContext:
            runAsGroup: 65532
            runAsNonRoot: true
            runAsUser: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
          - name: drill
            image: docker.io/alpine/k8s:1.35.4@sha256:d9aeef2665287b9918bc57c539ba95382ba4c8d52c8b1310df5666a89d9a3d04
            command:
            - python3
            - /scripts/restore-drill.py
            env:
            - name: HOME
              value: /tmp
            resources:
              requests:
                cpu: 25m
                memory: 64Mi
              limits:
                cpu: 250m
                memory: 256Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
              readOnlyRootFilesystem: true
            volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: tmp
              mountPath: /tmp
          volumes:
          - name: scripts
            configMap:
              name: restore-drill
          - name: tmp
            emptyDir:
              medium: Memory
              sizeLimit: 64Mi
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: restore-drill
  namespace: backup-qualification
  labels:
    release: kube-prometheus-stack
spec:
  groups:
  - name: restore-drill
    rules:
    - alert: RestoreDrillFailed
      expr: services_cronjob_unrecovered_failure{namespace="backup-qualification",cronjob="restore-drill"}
      for: 15m
      labels:
        severity: critical
      annotations:
        summary: The monthly restore drill failed.
        description: Read the restore-drill Job log; it names the failed Velero restore or verifier.
    - alert: RestoreDrillStale
      expr: time() - (kube_cronjob_status_last_successful_time{namespace="backup-qualification",cronjob="restore-drill"}
        or kube_cronjob_created{namespace="backup-qualification",cronjob="restore-drill"}) > 3456000
      for: 1h
      labels:
        severity: critical
      annotations:
        summary: No restore drill has succeeded within 40 days.
