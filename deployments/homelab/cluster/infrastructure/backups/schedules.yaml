# Keep both namespace lists identical; restore-drill.py restores the same set.
# Volumes are crash-consistent CSI snapshots moved to B2 by the data mover.
# PVCs labelled velero.io/exclude-from-backup=true (CloudNativePG data, caches)
# are skipped.
apiVersion: velero.io/v1
kind: Schedule
metadata:
  name: daily
  namespace: velero
spec:
  paused: false
  # A new Schedule (e.g. on a rebuilt cluster) must not back up empty volumes
  # before the restore.
  skipImmediately: true
  schedule: 30 2 * * *
  useOwnerReferencesInBackup: false
  template:
    storageLocation: default
    ttl: 720h
    includedNamespaces:
    - backup-qualification
    - forge
    - games
    - home-automation
    - matrix
    - media
    - services-observability
    snapshotVolumes: true
    snapshotMoveData: true
    defaultVolumesToFsBackup: false
    itemOperationTimeout: 4h
---
apiVersion: velero.io/v1
kind: Schedule
metadata:
  name: weekly
  namespace: velero
spec:
  paused: false
  # A new Schedule (e.g. on a rebuilt cluster) must not back up empty volumes
  # before the restore.
  skipImmediately: true
  schedule: 15 3 * * 0
  useOwnerReferencesInBackup: false
  template:
    storageLocation: default
    ttl: 2160h
    includedNamespaces:
    - backup-qualification
    - forge
    - games
    - home-automation
    - matrix
    - media
    - services-observability
    snapshotVolumes: true
    snapshotMoveData: true
    defaultVolumesToFsBackup: false
    itemOperationTimeout: 4h
