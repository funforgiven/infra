apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backup-canary
  namespace: backup-qualification
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: ceph-block
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backup-canary
  namespace: backup-qualification
spec:
  replicas: 1
  strategy:
    type: Recreate
    rollingUpdate: null
  selector:
    matchLabels:
      app.kubernetes.io/name: backup-canary
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backup-canary
        app.kubernetes.io/part-of: backup-qualification
      annotations:
        backup.velero.io/backup-volumes: data
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: canary
        image: docker.io/library/busybox:1.38.0@sha256:dc2d74b28e4cf8984fa52af1f39bc7c3d9c73760b41a74d629f5d11b1ab28616
        command:
        - /bin/sh
        - -ec
        - "expected=8eae9bfd58377faaf8c96501d130bfae5e3fedb725cd31d8c717f500cddc3c70\nif [ \"$POD_NAMESPACE\"\
          \ = backup-qualification ]; then\n  printf '%s\\n' services-backup-canary-v1 > /data/canary\n\
          fi\nprintf '%s  %s\\n' \"$expected\" /data/canary | sha256sum -c -\nwhile true; do sleep 3600;\
          \ done\n"
        env:
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -ec
            - printf '%s  %s\n' 8eae9bfd58377faaf8c96501d130bfae5e3fedb725cd31d8c717f500cddc3c70 /data/canary
              | sha256sum -c -
          periodSeconds: 30
        livenessProbe:
          exec:
            command:
            - /bin/sh
            - -ec
            - printf '%s  %s\n' 8eae9bfd58377faaf8c96501d130bfae5e3fedb725cd31d8c717f500cddc3c70 /data/canary
              | sha256sum -c -
          initialDelaySeconds: 30
          periodSeconds: 60
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 250m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsGroup: 65532
          runAsNonRoot: true
          runAsUser: 65532
        volumeMounts:
        - name: data
          mountPath: /data
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: backup-canary
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: restore-qualification-modifiers
  namespace: velero
data:
  resource-modifiers.yaml: "version: v1\nresourceModifierRules:\n  - conditions:\n      groupResource:\
    \ persistentvolumeclaims\n      namespaces:\n        - backup-qualification\n        - games\n   \
    \ patches:\n      - operation: remove\n        path: /spec/volumeName\n  - conditions:\n      groupResource:\
    \ deployments.apps\n      resourceNameRegex: ^backup-canary$\n      namespaces:\n        - backup-qualification\n\
    \    patches:\n      - operation: replace\n        path: /spec/template/spec/containers/0/resources/requests/cpu\n\
    \        value: 10m\n      - operation: replace\n        path: /spec/template/spec/containers/0/resources/requests/memory\n\
    \        value: 16Mi\n  - conditions:\n      groupResource: statefulsets.apps\n      resourceNameRegex:\
    \ ^(factorio|valheim)$\n      namespaces:\n        - games\n    patches:\n      - operation: replace\n\
    \        path: /spec/template/spec/containers/0/resources/requests/cpu\n        value: 10m\n     \
    \ - operation: replace\n        path: /spec/template/spec/containers/0/resources/requests/memory\n\
    \        value: 64Mi\n"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: restore-qualification
  namespace: backup-qualification
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: services-restore-qualification
rules:
- apiGroups:
  - velero.io
  resources:
  - backups
  verbs:
  - get
  - list
- apiGroups:
  - velero.io
  resources:
  - restores
  verbs:
  - create
  - get
- apiGroups:
  - ''
  resources:
  - namespaces
  resourceNames:
  - backup-qualification-restore
  - games-restore
  verbs:
  - delete
  - get
- apiGroups:
  - apps
  resources:
  - deployments
  resourceNames:
  - backup-canary
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - apps
  resources:
  - statefulsets
  resourceNames:
  - factorio
  - valheim
  verbs:
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: services-restore-qualification
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: services-restore-qualification
subjects:
- kind: ServiceAccount
  name: restore-qualification
  namespace: backup-qualification
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: restore-qualification
  namespace: backup-qualification
data:
  qualify.sh: "#!/bin/sh\nset -eu\n\nkubectl=/tmp/kubectl\ncurl --retry 3 -fsSL -o \"$kubectl\" \\\n \
    \ https://dl.k8s.io/release/v1.36.2/bin/linux/amd64/kubectl\nprintf '%s  %s\\n' \\\n  1e9045ec32bea85da43de85f0065358529ea7c7a152eca78154fba5b58c27d82\
    \ \\\n  \"$kubectl\" | sha256sum -c -\nchmod 0500 \"$kubectl\"\n\nbackup=\"$($kubectl -n velero get\
    \ backups.velero.io \\\n  -l velero.io/schedule-name=services-daily \\\n  -o json | python3 -c '\n\
    import datetime, json, sys\nnow = datetime.datetime.now(datetime.UTC)\neligible = [b for b in json.load(sys.stdin)[\"\
    items\"]\n            if b.get(\"status\", {}).get(\"phase\") == \"Completed\"\n            and 0\
    \ <= (now - datetime.datetime.fromisoformat(\n                b[\"status\"][\"completionTimestamp\"\
    ])).total_seconds() < 93600]\nif eligible:\n    print(max(eligible, key=lambda b: b[\"metadata\"][\"\
    creationTimestamp\"])[\"metadata\"][\"name\"])\n')\"\ncase \"$backup\" in\n  services-daily-[a-z0-9-]*)\
    \ ;;\n  *)\n    echo \"No valid completed services-daily backup was found.\" >&2\n    exit 1\n   \
    \ ;;\nesac\ntest \"$($kubectl -n velero get backups.velero.io \"$backup\" \\\n  -o jsonpath='{.status.phase}')\"\
    \ = Completed\n\nfor target in backup-qualification-restore games-restore; do\n  \"$kubectl\" delete\
    \ namespace \"$target\" --ignore-not-found --wait=false\ndone\nfor target in backup-qualification-restore\
    \ games-restore; do\n  while \"$kubectl\" get namespace \"$target\" >/dev/null 2>&1; do\n    sleep\
    \ 5\n  done\ndone\n\nsuffix=\"${backup#services-daily-}\"\nrestore=\"qualification-$suffix-$(date\
    \ -u +%Y%m%d%H%M%S)\"\nsed \"s/BACKUP_NAME/$backup/; s/RESTORE_NAME/$restore/\" \\\n  /config/restore.yaml\
    \ | \"$kubectl\" create -f -\n\nattempt=0\nwhile [ \"$attempt\" -lt 360 ]; do\n  phase=\"$($kubectl\
    \ -n velero get restores.velero.io \"$restore\" \\\n    -o jsonpath='{.status.phase}' 2>/dev/null || true)\"\n\
    \  case \"$phase\" in\n    Completed) break ;;\n    Failed|PartiallyFailed|FailedValidation)\n   \
    \   echo \"Restore qualification entered phase $phase.\" >&2\n      exit 1\n      ;;\n  esac\n  attempt=$((attempt\
    \ + 1))\n  sleep 10\ndone\ntest \"$phase\" = Completed\n\"$kubectl\" -n backup-qualification-restore\
    \ \\\n  rollout status deployment/backup-canary \\\n  --timeout=10m\n\"$kubectl\" -n games-restore\
    \ rollout status statefulset/factorio \\\n  --timeout=10m\n\"$kubectl\" -n games-restore rollout status\
    \ statefulset/valheim \\\n  --timeout=10m\ntest \"$($kubectl -n backup-qualification-restore get deployment\
    \ backup-canary \\\n  -o jsonpath='{.spec.template.spec.containers[0].resources.requests.cpu}')\"\
    \ = 10m\ntest \"$($kubectl -n backup-qualification-restore get deployment backup-canary \\\n  -o jsonpath='{.spec.template.spec.containers[0].resources.requests.memory}')\"\
    \ = 16Mi\ntest \"$($kubectl -n games-restore get statefulset factorio \\\n  -o jsonpath='{.spec.template.spec.containers[0].resources.requests.cpu}')\"\
    \ = 10m\ntest \"$($kubectl -n games-restore get statefulset factorio \\\n  -o jsonpath='{.spec.template.spec.containers[0].resources.requests.memory}')\"\
    \ = 64Mi\ntest \"$($kubectl -n games-restore get statefulset valheim \\\n  -o jsonpath='{.spec.template.spec.containers[0].resources.requests.cpu}')\"\
    \ = 10m\ntest \"$($kubectl -n games-restore get statefulset valheim \\\n  -o jsonpath='{.spec.template.spec.containers[0].resources.requests.memory}')\"\
    \ = 64Mi\necho \"Restore qualification completed for application data in backup $backup.\"\n"
  restore.yaml: "apiVersion: velero.io/v1\nkind: Restore\nmetadata:\n  name: RESTORE_NAME\n  namespace:\
    \ velero\n  labels:\n    backup.fahrican.com/qualification: \"true\"\nspec:\n  backupName: BACKUP_NAME\n\
    \  includedNamespaces:\n    - backup-qualification\n    - games\n  excludedResources:\n    - cronjobs.batch\n\
    \    - jobs.batch\n    - rolebindings.rbac.authorization.k8s.io\n    - roles.rbac.authorization.k8s.io\n\
    \    - serviceaccounts\n    - services\n    - servicemonitors.monitoring.coreos.com\n    - prometheusrules.monitoring.coreos.com\n\
    \  includeClusterResources: false\n  namespaceMapping:\n    backup-qualification: backup-qualification-restore\n\
    \    games: games-restore\n  restorePVs: true\n  resourceModifier:\n    kind: ConfigMap\n    name:\
    \ restore-qualification-modifiers\n"
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: restore-qualification
  namespace: backup-qualification
  labels:
    monitoring.fahrican.com/dedicated-job-alerts: "true"
spec:
  schedule: 0 7 1 * *
  timeZone: Europe/Istanbul
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 5400
      backoffLimit: 1
      ttlSecondsAfterFinished: 7776000
      template:
        metadata:
          labels:
            app.kubernetes.io/name: restore-qualification
            app.kubernetes.io/part-of: backup-qualification
        spec:
          automountServiceAccountToken: true
          serviceAccountName: restore-qualification
          restartPolicy: Never
          securityContext:
            runAsGroup: 65532
            runAsNonRoot: true
            runAsUser: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
          - name: qualify
            image: docker.io/alpine/k8s:1.35.4@sha256:d9aeef2665287b9918bc57c539ba95382ba4c8d52c8b1310df5666a89d9a3d04
            command:
            - /config/qualify.sh
            resources:
              requests:
                cpu: 25m
                memory: 64Mi
              limits:
                cpu: 250m
                memory: 256Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
              readOnlyRootFilesystem: true
            volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: tmp
              mountPath: /tmp
          volumes:
          - name: config
            configMap:
              name: restore-qualification
              defaultMode: 365
          - name: tmp
            emptyDir:
              medium: Memory
              sizeLimit: 128Mi
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: restore-qualification
  namespace: backup-qualification
  labels:
    release: kube-prometheus-stack
spec:
  groups:
  - name: services-restore-qualification
    rules:
    - alert: ServicesRestoreQualificationFailed
      expr: services_cronjob_unrecovered_failure{namespace="backup-qualification", cronjob="restore-qualification"}
      for: 15m
      labels:
        severity: critical
      annotations:
        summary: The automated services restore qualification failed.
    - alert: ServicesRestoreQualificationStale
      expr: (time() - kube_cronjob_status_last_successful_time{ namespace="backup-qualification",cronjob="restore-qualification"}
        > 3456000) or absent(kube_cronjob_status_last_successful_time{ namespace="backup-qualification",cronjob="restore-qualification"})
      for: 1h
      labels:
        severity: critical
      annotations:
        summary: No successful services restore qualification exists within 40 days.
