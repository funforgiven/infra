# Daily CSI snapshots exported to B2 by Velero's data mover. Velero picks the
# labelled ceph-block-snapshot class; the generic VeleroScheduleBackupStale rule
# in ../velero/velero.yaml watches every schedule.
apiVersion: velero.io/v1
kind: Schedule
metadata:
  name: observability-history
  namespace: velero
spec:
  paused: false
  schedule: 45 3 * * *
  useOwnerReferencesInBackup: false
  template:
    storageLocation: default
    ttl: 720h
    includedNamespaces:
    - services-observability
    snapshotVolumes: true
    snapshotMoveData: true
    defaultVolumesToFsBackup: false
    itemOperationTimeout: 4h
---
# Volumes opt in with backup.fahrican.com/volume-snapshot=true.
apiVersion: velero.io/v1
kind: Schedule
metadata:
  name: volume-snapshots
  namespace: velero
spec:
  paused: false
  schedule: 15 4 * * *
  useOwnerReferencesInBackup: false
  template:
    storageLocation: default
    ttl: 720h
    includedNamespaces:
    - forge
    - home-automation
    - media
    includedResources:
    - persistentvolumeclaims
    - persistentvolumes
    labelSelector:
      matchLabels:
        backup.fahrican.com/volume-snapshot: "true"
    snapshotVolumes: true
    snapshotMoveData: true
    defaultVolumesToFsBackup: false
    itemOperationTimeout: 4h
