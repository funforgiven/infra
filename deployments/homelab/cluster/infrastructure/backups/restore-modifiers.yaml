# Isolated namespace-mapped restores: drop each PVC's production volume binding
# so direct Ceph CSI provisions a fresh volume. The add makes the remove safe for
# claims that were never bound.
apiVersion: v1
kind: ConfigMap
metadata:
  name: isolated-restore-modifiers
  namespace: velero
data:
  resource-modifiers.yaml: |
    version: v1
    resourceModifierRules:
    - conditions:
        groupResource: persistentvolumeclaims
      patches:
      - operation: add
        path: /spec/volumeName
        value: ''
      - operation: remove
        path: /spec/volumeName
