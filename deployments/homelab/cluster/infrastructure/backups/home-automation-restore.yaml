apiVersion: v1
kind: ConfigMap
metadata:
  name: automation-restore-modifiers
  namespace: velero
data:
  resource-modifiers.yaml: "version: v1\nresourceModifierRules:\n- conditions:\n    groupResource: pods\n\
    \    resourceNameRegex: ^home-assistant-0$\n    namespaces:\n    - home-automation\n  patches:\n \
    \ - operation: test\n    path: /spec/initContainers/0/name\n    value: restore-wait\n  - operation:\
    \ move\n    from: /spec/initContainers/0\n    path: /automationRestoreHelper\n  - operation: replace\n\
    \    path: /spec\n    value: |-\n      {\n        \"automountServiceAccountToken\": false,\n     \
    \   \"restartPolicy\": \"Never\",\n        \"securityContext\": {\n          \"fsGroup\": 1000,\n\
    \          \"seccompProfile\": {\n            \"type\": \"RuntimeDefault\"\n          }\n        },\n\
    \        \"containers\": [\n          {\n            \"name\": \"backup\",\n            \"image\"\
    : \"docker.io/python:3.14.6-alpine3.23@sha256:b165067c5afc37fa5608a3c05609cc3d51aafd808a30fbfd822ee594fef55ad4\"\
    ,\n            \"command\": [\n              \"python\",\n              \"/bootstrap/backup.py\",\n\
    \              \"--verify\",\n              \"/backups/home-automation.tar.gz\"\n            ],\n\
    \            \"securityContext\": {\n              \"runAsNonRoot\": true,\n              \"runAsUser\"\
    : 1000,\n              \"runAsGroup\": 1000,\n              \"allowPrivilegeEscalation\": false,\n\
    \              \"readOnlyRootFilesystem\": true,\n              \"capabilities\": {\n            \
    \    \"drop\": [\n                  \"ALL\"\n                ]\n              }\n            },\n\
    \            \"resources\": {\n              \"requests\": {\n                \"cpu\": \"25m\",\n\
    \                \"memory\": \"64Mi\"\n              },\n              \"limits\": {\n           \
    \     \"cpu\": \"1\",\n                \"memory\": \"512Mi\"\n              }\n            },\n  \
    \          \"volumeMounts\": [\n              {\n                \"name\": \"backups\",\n        \
    \        \"mountPath\": \"/backups\",\n                \"readOnly\": true\n              },\n    \
    \          {\n                \"name\": \"bootstrap\",\n                \"mountPath\": \"/bootstrap\"\
    ,\n                \"readOnly\": true\n              },\n              {\n                \"name\"\
    : \"tmp\",\n                \"mountPath\": \"/tmp\"\n              }\n            ]\n          }\n\
    \        ],\n        \"volumes\": [\n          {\n            \"name\": \"backups\",\n           \
    \ \"persistentVolumeClaim\": {\n              \"claimName\": \"automation-backups\"\n            }\n\
    \          },\n          {\n            \"name\": \"bootstrap\",\n            \"configMap\": {\n \
    \             \"name\": \"automation-recovery-tools\"\n            }\n          },\n          {\n\
    \            \"name\": \"tmp\",\n            \"emptyDir\": {\n              \"sizeLimit\": \"20Gi\"\
    \n            }\n          }\n        ],\n        \"initContainers\": []\n      }\n  - operation:\
    \ move\n    from: /automationRestoreHelper\n    path: /spec/initContainers/0\n  # Velero inherits\
    \ the source container's security context, including\n  # OTBR's privilege. The filesystem restore\
    \ helper needs none of it.\n  - operation: add\n    path: /spec/initContainers/0/securityContext\n\
    \    value: |-\n      {\n        \"runAsNonRoot\": true,\n        \"runAsUser\": 1000,\n        \"\
    runAsGroup\": 1000,\n        \"allowPrivilegeEscalation\": false,\n        \"readOnlyRootFilesystem\"\
    : true,\n        \"capabilities\": {\"drop\": [\"ALL\"]}\n      }\n  - operation: add\n    path: /metadata/annotations\n\
    \    value: '{}'\n  - operation: add\n    path: /metadata/ownerReferences\n    value: '[]'\n- conditions:\n\
    \    groupResource: pods\n    resourceNameRegex: ^openthread-border-router-0$\n    namespaces:\n \
    \   - home-automation\n  patches:\n  - operation: test\n    path: /spec/initContainers/0/name\n  \
    \  value: restore-wait\n  - operation: move\n    from: /spec/initContainers/0\n    path: /automationRestoreHelper\n\
    \  - operation: replace\n    path: /spec\n    value: |-\n      {\n        \"automountServiceAccountToken\"\
    : false,\n        \"restartPolicy\": \"Never\",\n        \"securityContext\": {\n          \"fsGroup\"\
    : 1000,\n          \"seccompProfile\": {\n            \"type\": \"RuntimeDefault\"\n          }\n\
    \        },\n        \"containers\": [\n          {\n            \"name\": \"backup\",\n         \
    \   \"image\": \"docker.io/python:3.14.6-alpine3.23@sha256:b165067c5afc37fa5608a3c05609cc3d51aafd808a30fbfd822ee594fef55ad4\"\
    ,\n            \"command\": [\n              \"python\",\n              \"/bootstrap/thread-recovery.py\"\
    ,\n              \"--verify\",\n              \"/backups/thread-recovery.tar.gz\"\n            ],\n\
    \            \"securityContext\": {\n              \"runAsNonRoot\": true,\n              \"runAsUser\"\
    : 1000,\n              \"runAsGroup\": 1000,\n              \"allowPrivilegeEscalation\": false,\n\
    \              \"readOnlyRootFilesystem\": true,\n              \"capabilities\": {\n            \
    \    \"drop\": [\n                  \"ALL\"\n                ]\n              }\n            },\n\
    \            \"resources\": {\n              \"requests\": {\n                \"cpu\": \"25m\",\n\
    \                \"memory\": \"64Mi\"\n              },\n              \"limits\": {\n           \
    \     \"cpu\": \"1\",\n                \"memory\": \"512Mi\"\n              }\n            },\n  \
    \          \"volumeMounts\": [\n              {\n                \"name\": \"backups\",\n        \
    \        \"mountPath\": \"/backups\",\n                \"readOnly\": true\n              },\n    \
    \          {\n                \"name\": \"bootstrap\",\n                \"mountPath\": \"/bootstrap\"\
    ,\n                \"readOnly\": true\n              },\n              {\n                \"name\"\
    : \"tmp\",\n                \"mountPath\": \"/tmp\"\n              }\n            ]\n          }\n\
    \        ],\n        \"volumes\": [\n          {\n            \"name\": \"backups\",\n           \
    \ \"persistentVolumeClaim\": {\n              \"claimName\": \"thread-backups\"\n            }\n \
    \         },\n          {\n            \"name\": \"bootstrap\",\n            \"configMap\": {\n  \
    \            \"name\": \"automation-recovery-tools\"\n            }\n          },\n          {\n \
    \           \"name\": \"tmp\",\n            \"emptyDir\": {\n              \"sizeLimit\": \"20Gi\"\
    \n            }\n          }\n        ],\n        \"initContainers\": []\n      }\n  - operation:\
    \ move\n    from: /automationRestoreHelper\n    path: /spec/initContainers/0\n  # Velero inherits\
    \ the source container's security context, including\n  # OTBR's privilege. The filesystem restore\
    \ helper needs none of it.\n  - operation: add\n    path: /spec/initContainers/0/securityContext\n\
    \    value: |-\n      {\n        \"runAsNonRoot\": true,\n        \"runAsUser\": 1000,\n        \"\
    runAsGroup\": 1000,\n        \"allowPrivilegeEscalation\": false,\n        \"readOnlyRootFilesystem\"\
    : true,\n        \"capabilities\": {\"drop\": [\"ALL\"]}\n      }\n  - operation: add\n    path: /metadata/annotations\n\
    \    value: '{}'\n  - operation: add\n    path: /metadata/ownerReferences\n    value: '[]'\n- conditions:\n\
    \    groupResource: persistentvolumeclaims\n    resourceNameRegex: ^(automation|thread)-(state|backups)$\n\
    \    namespaces:\n    - home-automation\n  patches:\n  - operation: add\n    path: /spec/volumeName\n\
    \    value: ''\n  - operation: remove\n    path: /spec/volumeName\n  - operation: add\n    path: /spec/storageClassName\n\
    \    value: automation-restore\n  - operation: add\n    path: /metadata/annotations\n    value: '{}'\n"
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: automation-restore
provisioner: rook-ceph.rbd.csi.ceph.com
parameters:
  clusterID: rook-ceph
  pool: services
  imageFormat: '2'
  imageFeatures: layering
  csi.storage.k8s.io/provisioner-secret-name: rook-csi-rbd-provisioner
  csi.storage.k8s.io/provisioner-secret-namespace: rook-ceph
  csi.storage.k8s.io/controller-expand-secret-name: rook-csi-rbd-provisioner
  csi.storage.k8s.io/controller-expand-secret-namespace: rook-ceph
  csi.storage.k8s.io/node-stage-secret-name: rook-csi-rbd-node
  csi.storage.k8s.io/node-stage-secret-namespace: rook-ceph
  csi.storage.k8s.io/fstype: ext4
allowVolumeExpansion: false
reclaimPolicy: Delete
volumeBindingMode: WaitForFirstConsumer
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-all
  namespace: home-automation-restore
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: home-automation-restore
  namespace: backup-qualification
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: home-automation-restore
  namespace: velero
rules:
- apiGroups:
  - velero.io
  resources:
  - backups
  verbs:
  - get
  - list
- apiGroups:
  - velero.io
  resources:
  - restores
  verbs:
  - get
  - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: home-automation-restore
  namespace: velero
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: home-automation-restore
subjects:
- kind: ServiceAccount
  name: home-automation-restore
  namespace: backup-qualification
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: home-automation-restore
  namespace: home-automation-restore
rules:
- apiGroups:
  - ''
  resources:
  - pods
  resourceNames:
  - home-assistant-0
  - openthread-border-router-0
  verbs:
  - get
  - delete
- apiGroups:
  - ''
  resources:
  - persistentvolumeclaims
  resourceNames:
  - automation-backups
  - automation-state
  - thread-backups
  - thread-state
  verbs:
  - get
  - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: home-automation-restore
  namespace: home-automation-restore
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: home-automation-restore
subjects:
- kind: ServiceAccount
  name: home-automation-restore
  namespace: backup-qualification
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: home-automation-restore
  namespace: backup-qualification
spec:
  schedule: 30 5 2 * *
  timeZone: Europe/Istanbul
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 4500
      ttlSecondsAfterFinished: 604800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: home-automation-restore
        spec:
          serviceAccountName: home-automation-restore
          automountServiceAccountToken: true
          restartPolicy: Never
          securityContext:
            seccompProfile:
              type: RuntimeDefault
          containers:
          - name: qualify
            image: docker.io/python:3.14.6-alpine3.23@sha256:b165067c5afc37fa5608a3c05609cc3d51aafd808a30fbfd822ee594fef55ad4
            command:
            - python
            - /bootstrap/qualify-home-automation.py
            env:
            - name: JOB_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['batch.kubernetes.io/job-name']
            securityContext:
              runAsNonRoot: true
              runAsUser: 1000
              runAsGroup: 1000
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                - ALL
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                cpu: 250m
                memory: 128Mi
            volumeMounts:
            - name: bootstrap
              mountPath: /bootstrap
              readOnly: true
          volumes:
          - name: bootstrap
            configMap:
              name: automation-restore-controller
---
apiVersion: projectcalico.org/v3
kind: NetworkPolicy
metadata:
  name: home-automation-restore
  namespace: backup-qualification
spec:
  order: 15
  selector: app.kubernetes.io/name == 'home-automation-restore'
  types:
  - Ingress
  - Egress
  ingress:
  - action: Deny
  egress:
  - action: Allow
    destination:
      services:
        name: kubernetes
        namespace: default
  - action: Deny
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: home-automation-restore
  namespace: backup-qualification
spec:
  groups:
  - name: home-automation-restore
    rules:
    - alert: HomeAutomationRestoreStale
      expr: time() - kube_cronjob_status_last_successful_time{namespace="backup-qualification",cronjob="home-automation-restore"}
        > 3456000 or absent(kube_cronjob_status_last_successful_time{namespace="backup-qualification",cronjob="home-automation-restore"})
      for: 1h
      labels:
        severity: critical
      annotations:
        summary: No isolated home automation restore has succeeded within 40 days.
    - alert: HomeAutomationRestoreFailed
      expr: kube_job_status_failed{namespace="backup-qualification",job_name=~"home-automation-restore-.*"}
        > 0
      for: 15m
      labels:
        severity: critical
      annotations:
        summary: The automation restore qualification failed.
