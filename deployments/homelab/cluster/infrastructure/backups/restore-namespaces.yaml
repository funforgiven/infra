# The drill's permissions inside each restore namespace. Every *-restore
# namespace denies all traffic (matrix-restore's policy lives with its
# CloudNativePG restore test).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-all
  namespace: backup-qualification-restore
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: restore-drill
  namespace: backup-qualification-restore
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: restore-drill-target
subjects:
- kind: ServiceAccount
  name: restore-drill
  namespace: backup-qualification
---
