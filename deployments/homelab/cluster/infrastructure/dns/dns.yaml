apiVersion: v1
kind: ServiceAccount
metadata:
  name: internal-coredns
  namespace: network-services
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: internal-coredns
  namespace: network-services
data:
  Corefile: "cloud.fahrican.com:53 {\n    errors\n    health :8080\n    ready :8181\n    prometheus :9153\n\
    \    cache 30\n    file /etc/coredns/cloud.fahrican.com.zone {\n        reload 30s\n    }\n}\n"
  cloud.fahrican.com.zone: "$ORIGIN cloud.fahrican.com.\n$TTL 60\n@ IN SOA ns1.cloud.fahrican.com. hostmaster.cloud.fahrican.com.\
    \ (\n    2026090501 3600 600 86400 60\n)\n@   IN NS ns1.cloud.fahrican.com.\nns1 IN A  10.21.20.129\n\
    grafana IN A 10.21.20.131\nauth IN A 10.21.20.131\npecorino.mgmt IN A 10.21.20.10\ntaleggio.mgmt IN\
    \ A 10.21.20.11\nasiago.mgmt IN A 10.21.20.12\nundercloud-api.mgmt IN A 10.21.20.128\nccr2004.mgmt\
    \ IN A 10.21.90.1\ncrs510.mgmt IN A 10.21.90.2\nricotta.mgmt IN A 10.21.90.3\neap670.mgmt IN A 10.21.90.4\n\
    sg3210.mgmt IN A 10.21.90.5\ncluster-api.mgmt IN A 10.21.20.128\n"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: internal-coredns
  namespace: network-services
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: internal-coredns
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: internal-coredns
    spec:
      serviceAccountName: internal-coredns
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: internal-coredns
      containers:
      - name: coredns
        image: registry.k8s.io/coredns/coredns:v1.12.4@sha256:986f04c2e15e147d00bdd51e8c51bcef3644b13ff806be7d2ff1b261d6dfbae1
        args:
        - -conf
        - /etc/coredns/Corefile
        ports:
        - name: dns
          containerPort: 53
          protocol: UDP
        - name: dns-tcp
          containerPort: 53
          protocol: TCP
        - name: metrics
          containerPort: 9153
          protocol: TCP
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            add:
            - NET_BIND_SERVICE
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 65532
          runAsGroup: 65532
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
        readinessProbe:
          httpGet:
            path: /ready
            port: 8181
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          periodSeconds: 10
        volumeMounts:
        - name: configuration
          mountPath: /etc/coredns
          readOnly: true
      volumes:
      - name: configuration
        configMap:
          name: internal-coredns
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: internal-coredns
  namespace: network-services
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: internal-coredns
---
apiVersion: v1
kind: Service
metadata:
  name: internal-coredns
  namespace: network-services
  labels:
    app.kubernetes.io/name: internal-coredns
    infra.fahrican.com/l2-announcement: vlan20
    infra.fahrican.com/vip-purpose: internal-dns
  annotations:
    metallb.io/address-pool: management
    metallb.io/loadBalancerIPs: 10.21.20.129
spec:
  type: LoadBalancer
  loadBalancerClass: metallb.io/metallb
  externalTrafficPolicy: Cluster
  selector:
    app.kubernetes.io/name: internal-coredns
  ports:
  - name: dns
    port: 53
    targetPort: dns
    protocol: UDP
  - name: dns-tcp
    port: 53
    targetPort: dns-tcp
    protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: internal-coredns-metrics
  namespace: network-services
  labels:
    app.kubernetes.io/name: internal-coredns
    monitoring.fahrican.com/target: internal-coredns
spec:
  selector:
    app.kubernetes.io/name: internal-coredns
  ports:
  - name: metrics
    port: 9153
    targetPort: metrics
    protocol: TCP
