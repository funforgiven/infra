# Moving to ../../namespaces.yaml, which already declares identical copies.
# Both copies stay unprunable; delete this file in a release after this one
# reaches the cluster (removing it in the same change could let either
# Kustomization garbage-collect the namespace first).
apiVersion: v1
kind: Namespace
metadata:
  name: cnpg-system
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
  labels:
    pod-security.kubernetes.io/enforce: baseline
---
apiVersion: v1
kind: Namespace
metadata:
  name: netbird
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
  labels:
    gateway.fahrican.com/services: allowed
    gateway.fahrican.com/matrix: allowed
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: netbird-routing
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
  labels:
    pod-security.kubernetes.io/enforce: privileged
