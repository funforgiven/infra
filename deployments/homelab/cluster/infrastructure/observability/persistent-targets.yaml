apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: persistent-targets
  namespace: services-observability
spec:
  groups:
  - name: persistent-targets
    rules:
    - alert: TargetDown
      expr: "100 * (count by (cluster, job, namespace, service) (\n  (up{job!=\"forge-windows-host\"}\
        \ unless up{namespace=\"unifi\",endpoint=\"ap-metrics\"}) == 0\n) / count by (cluster, job, namespace,\
        \ service) (\n  up{job!=\"forge-windows-host\"} unless up{namespace=\"unifi\",endpoint=\"ap-metrics\"\
        }\n)) > 10"
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: One or more targets are unreachable.
        description: '{{ printf "%.4g" $value }}% of the {{ $labels.job }}/{{ $labels.service }} targets
          in {{ $labels.namespace }} namespace are down.'
        runbook_url: https://runbooks.prometheus-operator.dev/runbooks/general/targetdown
  - name: services-statefulset-updates
    rules:
    - alert: KubePodNotReady
      expr: "(sum by (namespace, pod, job, cluster) (\n  max by (namespace, pod, job, cluster) (\n   \
        \ kube_pod_status_phase{job=\"kube-state-metrics\",phase=~\"Pending|Unknown\"}\n    or (kube_pod_status_phase{job=\"\
        kube-state-metrics\",phase=\"Running\"} == 1\n        and on (namespace, pod, cluster)\n     \
        \   kube_pod_status_ready{condition=\"true\",job=\"kube-state-metrics\"} == 0)\n  ) * on (namespace,\
        \ pod, cluster) group_left ()\n  topk by (namespace, pod, cluster) (1,\n    max by (namespace,\
        \ pod, owner_kind, cluster) (kube_pod_owner{owner_kind!=\"Job\"}))\n) > 0 unless on (namespace,\
        \ pod, cluster) kube_pod_status_reason{job=\"kube-state-metrics\",reason=\"SchedulingGated\"}\
        \ == 1)"
      for: 15m
      labels:
        severity: warning
      annotations:
        summary: Pod has been in a non-ready state for more than 15 minutes.
        description: Pod {{ $labels.namespace }}/{{ $labels.pod }} has been in a non-ready state for longer
          than 15 minutes.
        runbook_url: https://runbooks.prometheus-operator.dev/runbooks/kubernetes/kubepodnotready
    - alert: KubeStatefulSetUpdateNotRolledOut
      expr: "(\n  (max by (namespace, statefulset, job, cluster) (\n    kube_statefulset_status_current_revision{job=\"\
        kube-state-metrics\"}\n    unless kube_statefulset_status_update_revision{job=\"kube-state-metrics\"\
        }\n  ) * on (namespace, statefulset, job, cluster) (\n    kube_statefulset_replicas{job=\"kube-state-metrics\"\
        }\n    != kube_statefulset_status_replicas_updated{job=\"kube-state-metrics\"}\n  ))\n  and on\
        \ (namespace, statefulset, job, cluster)\n  (changes(kube_statefulset_status_replicas_updated{job=\"\
        kube-state-metrics\"}[5m]) == 0)\n) unless on (namespace, statefulset) kube_statefulset_replicas{namespace=\"\
        forge\",statefulset=\"forgejo\"}"
      for: 15m
      labels:
        severity: warning
      annotations:
        summary: StatefulSet update has not been rolled out.
        description: StatefulSet {{ $labels.namespace }}/{{ $labels.statefulset }} update has not been
          rolled out.
        runbook_url: https://runbooks.prometheus-operator.dev/runbooks/kubernetes/kubestatefulsetupdatenotrolledout
