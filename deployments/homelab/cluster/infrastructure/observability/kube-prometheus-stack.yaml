apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: kube-prometheus-stack-chart
  namespace: services-observability
spec:
  interval: 24h
  url: oci://ghcr.io/prometheus-community/charts/kube-prometheus-stack
  ref:
    digest: sha256:db4805aa51d6566e6b628d71a6445be8a81ecd49701b99928c1a4cffc4132c1a
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: services-observability
spec:
  interval: 30m
  timeout: 15m
  releaseName: kube-prometheus-stack
  chartRef:
    kind: OCIRepository
    name: kube-prometheus-stack-chart
  valuesFrom:
  - kind: Secret
    name: alertmanager-runtime-values
    valuesKey: values.yaml
  - kind: Secret
    name: matrix-alertmanager-values
    valuesKey: values.yaml
    optional: true
  driftDetection:
    mode: enabled
    ignore:
    - paths:
      - /webhooks/0/clientConfig/caBundle
      target:
        group: admissionregistration.k8s.io
        version: v1
        kind: MutatingWebhookConfiguration
        name: kube-prometheus-stack-admission
    - paths:
      - /webhooks/0/clientConfig/caBundle
      - /webhooks/1/clientConfig/caBundle
      target:
        group: admissionregistration.k8s.io
        version: v1
        kind: ValidatingWebhookConfiguration
        name: kube-prometheus-stack-admission
  install:
    crds: Create
    strategy:
      name: RetryOnFailure
      retryInterval: 1m
  upgrade:
    crds: CreateReplace
    strategy:
      name: RetryOnFailure
      retryInterval: 1m
  values:
    defaultRules:
      disabled:
        TargetDown: true
        KubeJobFailed: true
        KubeStatefulSetUpdateNotRolledOut: true
        KubePodNotReady: true
    prometheus-node-exporter:
      image:
        digest: sha256:8c9bac11973b94b59be88d6e11fee4429aa743c8846cdc75d65b18db33f6a106
      extraArgs:
      - --collector.textfile.directory=/host/textfile
      extraHostVolumeMounts:
      - name: textfile
        hostPath: /var/lib/node_exporter/textfile
        mountPath: /host/textfile
        readOnly: true
    kube-state-metrics:
      image:
        sha: sha256:85108987d044b18a098126732f98602df408888c0f7d456241f5abefb9744bc1
      metricLabelsAllowlist:
      - cronjobs=[monitoring.fahrican.com/dedicated-job-alerts]
    crds:
      enabled: true
      upgradeJob:
        enabled: false
    kubeControllerManager:
      enabled: false
    kubeEtcd:
      enabled: false
    kubeProxy:
      enabled: false
    kubeScheduler:
      enabled: false
    prometheusOperator:
      kubeletEndpointsEnabled: true
      kubeletEndpointSliceEnabled: false
      image:
        sha: a001ed10a3823bbf2410ea347796d0e35ff8decd24fb98acbe7ab9e98d431c39
      prometheusConfigReloader:
        image:
          sha: 0ccb22ca9f3f6fd9f76ce95585d18bd2e363d421c534dde710be4bd13caa551d
      admissionWebhooks:
        enabled: true
        failurePolicy: Fail
        certManager:
          enabled: true
        patch:
          enabled: false
    prometheus:
      prometheusSpec:
        replicas: 1
        retention: 15d
        retentionSize: 16GiB
        image:
          sha: 64f71bb84e03c855948418b0fc5dea53e9543d8e3fc9931598f583805507f05e
        externalLabels:
          cluster: homelab
        serviceDiscoveryRole: Endpoints
        persistentVolumeClaimRetentionPolicy:
          whenDeleted: Retain
          whenScaled: Retain
        podMonitorSelectorNilUsesHelmValues: false
        podMonitorSelector: {}
        podMonitorNamespaceSelector: {}
        probeSelectorNilUsesHelmValues: false
        probeSelector: {}
        probeNamespaceSelector: {}
        ruleSelectorNilUsesHelmValues: false
        ruleSelector: {}
        ruleNamespaceSelector: {}
        serviceMonitorSelectorNilUsesHelmValues: false
        serviceMonitorSelector: {}
        serviceMonitorNamespaceSelector: {}
        resources:
          requests:
            cpu: 250m
            memory: 1Gi
          limits:
            memory: 4Gi
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: ceph-block
              accessModes:
              - ReadWriteOnce
              resources:
                requests:
                  storage: 20Gi
    alertmanager:
      alertmanagerSpec:
        replicas: 1
        image:
          sha: 9e082985f56f4c8c9f724e18f2288c6708f472e56a5286b8863d080434ea065d
        secrets:
        - matrix-alerting
        - infrastructure-telegram
        persistentVolumeClaimRetentionPolicy:
          whenDeleted: Retain
          whenScaled: Retain
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 512Mi
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: ceph-block
              accessModes:
              - ReadWriteOnce
              resources:
                requests:
                  storage: 2Gi
    grafana:
      replicas: 1
      deploymentStrategy:
        type: Recreate
        rollingUpdate: null
      defaultDashboardsEditable: false
      envFromSecret: grafana-oidc
      grafana.ini:
        analytics:
          reporting_enabled: false
          check_for_updates: false
          check_for_plugin_updates: false
        server:
          domain: grafana.cloud.fahrican.com
          root_url: https://grafana.cloud.fahrican.com
        security:
          cookie_secure: true
          strict_transport_security: true
        users:
          allow_sign_up: false
        auth.anonymous:
          enabled: false
        auth.generic_oauth:
          enabled: true
          name: ZITADEL
          allow_sign_up: true
          auto_login: false
          scopes: openid profile email offline_access
          auth_url: https://auth.cloud.fahrican.com/oauth/v2/authorize
          token_url: https://auth.cloud.fahrican.com/oauth/v2/token
          api_url: https://auth.cloud.fahrican.com/oidc/v1/userinfo
          use_refresh_token: true
          groups_attribute_path: keys("urn:zitadel:iam:org:project:385436919212818448:roles")
          allowed_groups: infra-admin infra-viewer
          role_attribute_path: contains(keys("urn:zitadel:iam:org:project:385436919212818448:roles"),
            'infra-admin') && 'GrafanaAdmin' || 'Viewer'
          allow_assign_grafana_admin: true
          role_attribute_strict: true
        plugins:
          preinstall_disabled: true
          preinstall_auto_update: false
      image:
        sha: 7cb8c64c4d57a57e734073f3cc94620adb24a0acb929bd80ba9f14017e3a975b
      initChownData:
        image:
          sha: dc2d74b28e4cf8984fa52af1f39bc7c3d9c73760b41a74d629f5d11b1ab28616
      admin:
        existingSecret: grafana-admin-credentials
        userKey: admin-user
        passwordKey: admin-password
      rbac:
        namespaced: true
      persistence:
        enabled: true
        type: pvc
        storageClassName: ceph-block
        accessModes:
        - ReadWriteOnce
        size: 10Gi
        annotations:
          helm.sh/resource-policy: keep
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 1Gi
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app.kubernetes.io/instance: kube-prometheus-stack
                app.kubernetes.io/name: grafana
            topologyKey: kubernetes.io/hostname
      sidecar:
        image:
          sha: 21b9fe7bb29d65caf2445ccbf96ff6eda5e589a92bd8f5188f957fe75b551d72
        dashboards:
          enabled: true
          label: grafana_dashboard
          labelValue: '1'
          searchNamespace: services-observability
          resource: configmap
          watchMethod: WATCH
          provider:
            allowUiUpdates: false
            disableDelete: false
        datasources:
          enabled: true
          env:
            HEALTH_PORT: '8081'
          label: grafana_datasource
          labelValue: '1'
          searchNamespace: services-observability
          resource: configmap
      additionalDataSources:
      - name: Loki
        uid: loki
        type: loki
        access: proxy
        url: http://loki.services-observability.svc.cluster.local:3100
        editable: false
        jsonData:
          maxLines: 1000
