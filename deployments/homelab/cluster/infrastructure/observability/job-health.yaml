apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: job-health
  namespace: services-observability
spec:
  groups:
  - name: homelab-job-health
    rules:
    - record: homelab_cronjob_last_failed_start_timestamp_seconds
      expr: "max by (namespace, cronjob) (\n  label_replace(\n    (kube_job_status_start_time\n     and\
        \ on (namespace, job_name) (kube_job_failed{condition=\"true\"} == 1))\n    * on (namespace, job_name)\
        \ group_left (owner_name)\n    max by (namespace, job_name, owner_name) (kube_job_owner{owner_kind=\"\
        CronJob\"}),\n    \"cronjob\", \"$1\", \"owner_name\", \"(.+)\"\n  )\n)"
    - record: homelab_cronjob_unrecovered_failure
      expr: "(\n  (homelab_cronjob_last_failed_start_timestamp_seconds\n   > on (namespace, cronjob)\n\
        \   max by (namespace, cronjob) (kube_cronjob_status_last_successful_time))\n  or\n  (homelab_cronjob_last_failed_start_timestamp_seconds\n\
        \   unless on (namespace, cronjob)\n   max by (namespace, cronjob) (kube_cronjob_status_last_successful_time))\n\
        ) and on (namespace, cronjob) (max by (namespace, cronjob) (kube_cronjob_spec_suspend) == 0)"
    - alert: KubeJobFailed
      expr: homelab_cronjob_unrecovered_failure
      for: 15m
      labels:
        severity: warning
      annotations:
        summary: Scheduled job has not recovered.
        description: CronJob {{ $labels.namespace }}/{{ $labels.cronjob }} has no successful completion
          since its latest failed run.
        runbook_url: https://runbooks.prometheus-operator.dev/runbooks/kubernetes/kubejobfailed
    - alert: KubeJobFailed
      expr: max by (namespace, job_name) (kube_job_failed{condition="true"} == 1) unless on (namespace,
        job_name) kube_job_owner{owner_kind="CronJob"}
      for: 15m
      labels:
        severity: warning
      annotations:
        summary: Job failed to complete.
        description: Job {{ $labels.namespace }}/{{ $labels.job_name }} failed to complete. Inspect its
          logs before removing it.
        runbook_url: https://runbooks.prometheus-operator.dev/runbooks/kubernetes/kubejobfailed
