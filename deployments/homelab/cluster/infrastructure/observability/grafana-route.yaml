apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: services-observability
spec:
  parentRefs:
  - name: management
    namespace: network-services
    sectionName: https
  hostnames:
  - grafana.cloud.fahrican.com
  rules:
  - backendRefs:
    - name: kube-prometheus-stack-grafana
      port: 80
