apiVersion: operator.tigera.io/v1
kind: Installation
metadata:
  name: default
spec:
  variant: Calico
  controlPlaneReplicas: 2
  cni:
    type: Calico
    binDir: /opt/cni/bin
    confDir: /etc/cni/net.d
    ipam:
      type: Calico
  calicoNetwork:
    bgp: Disabled
    mtu: 1450
    nodeAddressAutodetectionV4:
      interface: ^bond0\.20$
    ipPools:
    - cidr: 10.100.0.0/16
      blockSize: 26
      encapsulation: VXLAN
      natOutgoing: Enabled
      nodeSelector: all()
---
apiVersion: operator.tigera.io/v1
kind: APIServer
metadata:
  name: default
spec: {}
