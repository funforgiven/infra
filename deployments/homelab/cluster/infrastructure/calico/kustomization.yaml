apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- vendor/native-v3.yaml
- vendor/operator.yaml
- config.yaml
patches:
- target:
    kind: Deployment
    name: tigera-operator
    namespace: tigera-operator
  patch: '[{"op": "replace", "path": "/spec/template/spec/containers/0/args/0", "value":
    "-manage-crds=false"}, {"op": "add", "path": "/spec/template/spec/containers/0/resources",
    "value": {"requests": {"cpu": "50m", "memory": "128Mi"}, "limits": {"memory":
    "512Mi"}}}]'
