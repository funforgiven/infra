apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ceph
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 20m
  path: ./deployments/homelab/cluster/infrastructure/ceph
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  dependsOn:
  - name: rook
  healthCheckExprs:
  - apiVersion: ceph.rook.io/v1
    kind: CephCluster
    inProgress: '!has(status) || !has(status.phase) || status.phase != ''Ready'''
    failed: has(status) && has(status.phase) && status.phase == 'Failure'
    current: has(status) && has(status.phase) && status.phase == 'Ready'
  - apiVersion: ceph.rook.io/v1
    kind: CephBlockPool
    inProgress: '!has(status) || !has(status.phase) || status.phase != ''Ready'''
    failed: has(status) && has(status.phase) && status.phase == 'Failure'
    current: has(status) && has(status.phase) && status.phase == 'Ready'
  - apiVersion: ceph.rook.io/v1
    kind: CephFilesystem
    inProgress: '!has(status) || !has(status.phase) || status.phase != ''Ready'''
    failed: has(status) && has(status.phase) && status.phase == 'Failure'
    current: has(status) && has(status.phase) && status.phase == 'Ready'
---
