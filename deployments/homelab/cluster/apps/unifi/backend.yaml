apiVersion: v1
kind: Service
metadata:
  name: unifi
  namespace: unifi
  labels:
    app.kubernetes.io/name: unifi
spec:
  ports:
  - name: https
    port: 8443
    targetPort: 8443
  - name: node-metrics
    port: 9100
    targetPort: 9100
  - name: ap-metrics
    port: 9130
    targetPort: 9130
---
# The VM's services-LAN address. Prometheus discovers Endpoints; the
# EndpointSlice mirroring controller derives the slice Envoy Gateway routes to.
apiVersion: v1
kind: Endpoints
metadata:
  name: unifi
  namespace: unifi
subsets:
- addresses:
  - ip: 10.21.40.127
  ports:
  - name: https
    port: 8443
  - name: node-metrics
    port: 9100
  - name: ap-metrics
    port: 9130
---
apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: unifi
  namespace: unifi
spec:
  targetRefs:
  - group: ''
    kind: Service
    name: unifi
    sectionName: https
  validation:
    hostname: unifi-origin.internal
    caCertificateRefs:
    - group: ''
      kind: ConfigMap
      name: unifi-origin-ca
---
# Only the gateways and monitoring may open connections to the VM's origin
# and exporters; the guest firewall can only see the whole pod network.
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: unifi-origin-clients
spec:
  endpointSelector:
    matchExpressions:
    - key: k8s:io.kubernetes.pod.namespace
      operator: NotIn
      values:
      - envoy-gateway-system
      - services-observability
  enableDefaultDeny:
    egress: false
    ingress: false
  egressDeny:
  - toCIDR:
    - 10.21.40.127/32
    toPorts:
    - ports:
      - port: '8443'
        protocol: TCP
      - port: '9100'
        protocol: TCP
      - port: '9130'
        protocol: TCP
