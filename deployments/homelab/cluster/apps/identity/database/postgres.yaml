apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: zitadel-postgres
  namespace: identity
spec:
  instances: 3
  imageName: ghcr.io/cloudnative-pg/postgresql:18.4-standard-trixie@sha256:f0cc49632b5cc1e51f65ba03658c89bd31d64ea2672b14843a808a8d281417e1
  primaryUpdateStrategy: unsupervised
  bootstrap:
    recovery:
      source: backup
      database: zitadel
      owner: zitadel
      secret:
        name: zitadel-secrets
  storage:
    storageClass: ceph-block
    size: 32Gi
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 1536Mi
  affinity:
    enablePodAntiAffinity: true
    podAntiAffinityType: required
    topologyKey: kubernetes.io/hostname
  postgresql:
    synchronous:
      method: any
      number: 1
      dataDurability: required
      failoverQuorum: true
    parameters:
      max_connections: '200'
      archive_timeout: 60s
      # Leave disk headroom when an offline replica retains WAL.
      max_slot_wal_keep_size: 16GB
  monitoring:
    enablePodMonitor: true
  plugins:
  - name: barman-cloud.cloudnative-pg.io
    enabled: true
    isWALArchiver: true
    parameters:
      barmanObjectName: zitadel-postgres-backup
      # A rebuilt cluster cannot archive into a non-empty folder: bump this name
      # and point the backup cluster below at the previous one.
      serverName: zitadel-postgres
  externalClusters:
  - name: backup
    plugin:
      name: barman-cloud.cloudnative-pg.io
      parameters:
        barmanObjectName: zitadel-postgres-backup
        serverName: zitadel-postgres
