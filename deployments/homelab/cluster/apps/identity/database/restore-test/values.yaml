apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-restore-test-values
  annotations:
    config.kubernetes.io/local-config: "true"
data:
  namespace: identity-restore
  sourceNamespace: identity
  sourceSecret: zitadel-b2-backup
  destinationPath: s3://fahrican-cloud-recovery/undercloud/zitadel/nixos-v1/
  serverName: zitadel-postgres
  storageSize: 32Gi
  schedule: 17 4 * * 0
