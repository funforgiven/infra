apiVersion: v1
kind: ServiceAccount
metadata:
  name: zitadel-restore-test
  namespace: identity
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: zitadel-restore-test
  namespace: identity
rules:
- apiGroups:
  - postgresql.cnpg.io
  resources:
  - clusters
  verbs:
  - create
  - delete
  - get
  - list
  - watch
- apiGroups:
  - ''
  resources:
  - pods
  - persistentvolumeclaims
  - secrets
  verbs:
  - create
  - delete
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: zitadel-restore-test
  namespace: identity
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: zitadel-restore-test
subjects:
- kind: ServiceAccount
  name: zitadel-restore-test
  namespace: identity
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: zitadel-restore-test
  namespace: identity
data:
  run: "#!/bin/sh\nset -eu\n\nname=zitadel-postgres-restore-verification\n\ncleanup() {\n  kubectl delete\
    \ pod zitadel-restore-validation --ignore-not-found --wait=false\n  kubectl delete secret zitadel-restore-validation\
    \ --ignore-not-found --wait=false\n  kubectl delete cluster.postgresql.cnpg.io \"$name\" --ignore-not-found\
    \ --wait=false\n}\ntrap cleanup EXIT\n\ncleanup\nkubectl wait --for=delete \"cluster.postgresql.cnpg.io/$name\"\
    \ --timeout=5m 2>/dev/null || true\nkubectl delete persistentvolumeclaim --selector=\"cnpg.io/cluster=$name\"\
    \ --ignore-not-found\n\nkubectl apply -f /opt/test/cluster.yaml\nkubectl wait --for=condition=Ready\
    \ \"cluster.postgresql.cnpg.io/$name\" --timeout=30m\n\nkubectl get secret zitadel-secrets -o json\
    \ | jq \\\n  'del(.metadata.annotations,.metadata.creationTimestamp,.metadata.resourceVersion,.metadata.uid,.metadata.managedFields)\
    \ |\n   .metadata.name = \"zitadel-restore-validation\" |\n   .data.dsn = (.data.dsn | @base64d |\n\
    \     gsub(\"zitadel-postgres-rw\"; \"zitadel-postgres-restore-verification-rw\") |\n     @base64)'\
    \ | kubectl apply -f -\n\nkubectl apply -f /opt/test/pod.yaml\nfor attempt in $(seq 1 180); do\n \
    \ exit_code=\"$(kubectl get pod zitadel-restore-validation \\\n    -o jsonpath='{.status.containerStatuses[?(@.name==\"\
    verify\")].state.terminated.exitCode}')\"\n  case \"$exit_code\" in\n    0) echo \"ZITADEL backup\
    \ restore verified\"; exit 0 ;;\n    '' ) sleep 5 ;;\n    *  ) exit \"$exit_code\" ;;\n  esac\ndone\n\
    exit 1\n"
  cluster.yaml: "apiVersion: postgresql.cnpg.io/v1\nkind: Cluster\nmetadata:\n  name: zitadel-postgres-restore-verification\n\
    \  namespace: identity\nspec:\n  instances: 1\n  imageName: ghcr.io/cloudnative-pg/postgresql:18.4-standard-trixie@sha256:f0cc49632b5cc1e51f65ba03658c89bd31d64ea2672b14843a808a8d281417e1\n\
    \  bootstrap:\n    recovery:\n      source: source\n  externalClusters:\n    - name: source\n    \
    \  plugin:\n        name: barman-cloud.cloudnative-pg.io\n        parameters:\n          barmanObjectName:\
    \ zitadel-postgres-backup\n          serverName: zitadel-postgres\n  storage:\n    storageClass: ceph-block\n\
    \    size: 10Gi\n  resources:\n    requests:\n      cpu: 100m\n      memory: 256Mi\n    limits:\n\
    \      memory: 1Gi\n  monitoring:\n    enablePodMonitor: false\n"
  pod.yaml: "apiVersion: v1\nkind: Pod\nmetadata:\n  name: zitadel-restore-validation\n  namespace: identity\n\
    spec:\n  automountServiceAccountToken: false\n  enableServiceLinks: false\n  restartPolicy: Never\n\
    \  securityContext:\n    fsGroup: 1000\n    runAsNonRoot: true\n    runAsUser: 1000\n    seccompProfile:\n\
    \      type: RuntimeDefault\n  containers:\n    - name: zitadel\n      image: ghcr.io/zitadel/zitadel:v4.16.3@sha256:f3738fd984131d3f02e386d37fa480d1a30e42b7d4202e2b322f12f7cf556b64\n\
    \      args: [start, --config, /config/zitadel-config-yaml, --config, /zitadel-secret-config-yaml/config-yaml,\
    \ --masterkeyFromEnv]\n      env:\n        - name: POD_IP\n          valueFrom:\n            fieldRef:\n\
    \              fieldPath: status.podIP\n        - name: ZITADEL_MASTERKEY\n          valueFrom:\n\
    \            secretKeyRef:\n              name: zitadel-restore-validation\n              key: masterkey\n\
    \        - name: ZITADEL_DATABASE_POSTGRES_AWAITINITIALCONN\n          value: 5m\n        - name:\
    \ ZITADEL_DATABASE_POSTGRES_DSN\n          valueFrom:\n            secretKeyRef:\n              name:\
    \ zitadel-restore-validation\n              key: dsn\n      volumeMounts:\n        - {name: config,\
    \ mountPath: /config}\n        - {name: secrets, mountPath: /zitadel-secret-config-yaml}\n       \
    \ - {name: login-service-key, mountPath: /secrets/login-client}\n        - {name: tmp, mountPath:\
    \ /tmp}\n      securityContext:\n        allowPrivilegeEscalation: false\n        capabilities: {drop:\
    \ [ALL]}\n        readOnlyRootFilesystem: true\n        runAsNonRoot: true\n        runAsUser: 1000\n\
    \      resources:\n        requests: {cpu: 100m, memory: 256Mi}\n        limits: {memory: 1Gi}\n \
    \   - name: verify\n      image: docker.io/alpine/k8s:1.35.4@sha256:d9aeef2665287b9918bc57c539ba95382ba4c8d52c8b1310df5666a89d9a3d04\n\
    \      command: [/bin/sh, -ec]\n      args:\n        - |\n          for attempt in $(seq 1 120); do\n\
    \            if discovery=\"$(curl --fail --silent --show-error --header 'Host: auth.cloud.fahrican.com'\
    \ http://127.0.0.1:8080/.well-known/openid-configuration 2>/dev/null)\"; then\n              test\
    \ \"$(printf '%s' \"$discovery\" | jq --raw-output .issuer)\" = \"https://auth.cloud.fahrican.com\"\
    \n              curl --fail --silent --show-error --header 'Host: auth.cloud.fahrican.com' http://127.0.0.1:8080/oauth/v2/keys\
    \ | jq --exit-status '.keys | length > 0' >/dev/null\n              exit 0\n            fi\n     \
    \       sleep 5\n          done\n          exit 1\n      securityContext:\n        allowPrivilegeEscalation:\
    \ false\n        capabilities: {drop: [ALL]}\n        readOnlyRootFilesystem: true\n        runAsNonRoot:\
    \ true\n        runAsUser: 1000\n      resources:\n        requests: {cpu: 10m, memory: 32Mi}\n  \
    \      limits: {memory: 128Mi}\n  volumes:\n    - name: config\n      configMap: {name: zitadel-config-yaml}\n\
    \    - name: secrets\n      secret: {secretName: zitadel-restore-validation}\n    - name: login-service-key\n\
    \      secret: {secretName: zitadel-login-service-key}\n    - name: tmp\n      emptyDir: {}\n"
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: zitadel-restore-test
  namespace: identity
spec:
  schedule: 17 4 * * 0
  timeZone: Europe/Istanbul
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 2700
      template:
        spec:
          serviceAccountName: zitadel-restore-test
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
          - name: restore
            image: docker.io/alpine/k8s:1.35.4@sha256:d9aeef2665287b9918bc57c539ba95382ba4c8d52c8b1310df5666a89d9a3d04
            command:
            - /opt/test/run
            env:
            - name: HOME
              value: /tmp
            volumeMounts:
            - name: test
              mountPath: /opt/test
            - name: tmp
              mountPath: /tmp
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
              readOnlyRootFilesystem: true
            resources:
              requests:
                cpu: 25m
                memory: 64Mi
              limits:
                memory: 256Mi
          volumes:
          - name: test
            configMap:
              name: zitadel-restore-test
              defaultMode: 365
          - name: tmp
            emptyDir: {}
