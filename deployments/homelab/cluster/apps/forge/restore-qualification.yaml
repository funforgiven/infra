apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: forge-restore
provisioner: rook-ceph.rbd.csi.ceph.com
parameters:
  clusterID: rook-ceph
  pool: services
  imageFormat: '2'
  imageFeatures: layering
  csi.storage.k8s.io/provisioner-secret-name: rook-csi-rbd-provisioner
  csi.storage.k8s.io/provisioner-secret-namespace: rook-ceph
  csi.storage.k8s.io/controller-expand-secret-name: rook-csi-rbd-provisioner
  csi.storage.k8s.io/controller-expand-secret-namespace: rook-ceph
  csi.storage.k8s.io/node-stage-secret-name: rook-csi-rbd-node
  csi.storage.k8s.io/node-stage-secret-namespace: rook-ceph
  csi.storage.k8s.io/fstype: ext4
allowVolumeExpansion: true
reclaimPolicy: Delete
volumeBindingMode: WaitForFirstConsumer
---
apiVersion: projectcalico.org/v3
kind: NetworkPolicy
metadata:
  name: isolate-recovery
  namespace: forge-restore
spec:
  order: 16
  selector: all()
  types:
  - Ingress
  - Egress
  ingress:
  - action: Deny
  egress:
  - action: Deny
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: forge-restore-modifiers
  namespace: velero
data:
  resource-modifiers.yaml: "version: v1\nresourceModifierRules:\n- conditions:\n    groupResource: persistentvolumeclaims\n\
    \    namespaces:\n    - forge\n  mergePatches:\n  - patchData: |\n      spec:\n        storageClassName:\
    \ forge-restore\n        volumeName: null\n- conditions:\n    groupResource: pods\n    resourceNameRegex:\
    \ ^forgejo-0$\n    namespaces:\n    - forge\n  strategicPatches:\n  - patchData: |\n      metadata:\n\
    \        ownerReferences: null\n        labels:\n          app.kubernetes.io/name: forge-restore\n\
    \          app.kubernetes.io/part-of: backup-qualification\n      spec:\n        nodeName: null\n\
    \        initContainers:\n        - name: configure\n          $patch: delete\n        - name: bootstrap\n\
    \          $patch: delete\n        containers:\n        - $patch: replace\n        - image: docker.io/python:3.14.6-alpine3.23@sha256:b165067c5afc37fa5608a3c05609cc3d51aafd808a30fbfd822ee594fef55ad4\n\
    \          securityContext:\n            allowPrivilegeEscalation: false\n            readOnlyRootFilesystem:\
    \ true\n            capabilities:\n              drop:\n              - ALL\n            runAsNonRoot:\
    \ true\n            runAsUser: 1000\n            runAsGroup: 1000\n          name: database\n    \
    \      command:\n          - python\n          - /bootstrap/verify-restore.py\n          resources:\n\
    \            requests:\n              cpu: 25m\n              memory: 64Mi\n            limits:\n\
    \              cpu: '1'\n              memory: 512Mi\n          volumeMounts:\n          - name: data\n\
    \            mountPath: /restore\n          - name: backups\n            mountPath: /backups\n   \
    \         readOnly: true\n          - name: bootstrap\n            mountPath: /bootstrap\n       \
    \     readOnly: true\n          readinessProbe:\n            exec:\n              command:\n     \
    \         - /bin/sh\n              - -ec\n              - test -s /restore/.qualified\n          \
    \  periodSeconds: 10\n        - image: codeberg.org/forgejo/forgejo:15.0.7-rootless@sha256:1131f4c646d6115577b7cb9ccfe8cd2c289bb54a1e1ed42400be0e22916af924\n\
    \          securityContext:\n            allowPrivilegeEscalation: false\n            readOnlyRootFilesystem:\
    \ true\n            capabilities:\n              drop:\n              - ALL\n            runAsNonRoot:\
    \ true\n            runAsUser: 1000\n            runAsGroup: 1000\n          name: git\n         \
    \ command:\n          - /bin/sh\n          - /bootstrap/verify-git.sh\n          resources:\n    \
    \        requests:\n              cpu: 25m\n              memory: 64Mi\n            limits:\n    \
    \          cpu: '1'\n              memory: 512Mi\n          volumeMounts:\n          - name: data\n\
    \            mountPath: /restore\n          - name: backups\n            mountPath: /backups\n   \
    \         readOnly: true\n          - name: bootstrap\n            mountPath: /bootstrap\n       \
    \     readOnly: true\n          readinessProbe:\n            exec:\n              command:\n     \
    \         - /bin/sh\n              - -ec\n              - test -s /restore/.qualified\n          \
    \  periodSeconds: 10\n        volumes:\n        - name: secrets\n          $patch: delete\n      \
    \  - name: bootstrap\n          configMap:\n            name: forge-restore-tools\n"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: forge-restore-qualification
  namespace: backup-qualification
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: forge-restore-qualification
  namespace: velero
rules:
- apiGroups:
  - velero.io
  resources:
  - backups
  verbs:
  - get
  - list
- apiGroups:
  - velero.io
  resources:
  - restores
  verbs:
  - create
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: forge-restore-qualification
  namespace: velero
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: forge-restore-qualification
subjects:
- kind: ServiceAccount
  name: forge-restore-qualification
  namespace: backup-qualification
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: forge-restore-qualification
  namespace: forge-restore
rules:
- apiGroups:
  - ''
  resources:
  - pods
  resourceNames:
  - forgejo-0
  verbs:
  - delete
  - get
- apiGroups:
  - ''
  resources:
  - persistentvolumeclaims
  resourceNames:
  - forgejo-data
  - forgejo-backups
  verbs:
  - delete
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: forge-restore-qualification
  namespace: forge-restore
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: forge-restore-qualification
subjects:
- kind: ServiceAccount
  name: forge-restore-qualification
  namespace: backup-qualification
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: forge-restore-volume-cleanup
rules:
- apiGroups:
  - ''
  resources:
  - persistentvolumes
  verbs:
  - get
  - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: forge-restore-volume-cleanup
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: forge-restore-volume-cleanup
subjects:
- kind: ServiceAccount
  name: forge-restore-qualification
  namespace: backup-qualification
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: forge-restore-qualification
  namespace: backup-qualification
spec:
  schedule: 0 6 1 * *
  timeZone: Europe/Istanbul
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 18000
      backoffLimit: 0
      ttlSecondsAfterFinished: 7776000
      template:
        metadata:
          labels:
            app.kubernetes.io/name: forge-restore-qualification
        spec:
          automountServiceAccountToken: true
          serviceAccountName: forge-restore-qualification
          restartPolicy: Never
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
          - name: qualify
            image: docker.io/python:3.14.6-alpine3.23@sha256:b165067c5afc37fa5608a3c05609cc3d51aafd808a30fbfd822ee594fef55ad4
            command:
            - python
            - /bootstrap/qualify-restore.py
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                - ALL
              runAsNonRoot: true
              runAsUser: 1000
              runAsGroup: 1000
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                cpu: 250m
                memory: 128Mi
            volumeMounts:
            - name: bootstrap
              mountPath: /bootstrap
              readOnly: true
          volumes:
          - name: bootstrap
            configMap:
              name: forge-restore-controller
