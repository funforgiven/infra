apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: forgejo
  namespace: forge
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: forgejo
  endpoints:
  - port: http
    path: /metrics
    authorization:
      type: Bearer
      credentials:
        name: forge-runtime
        key: forgejo-metrics-token
    interval: 30s
  - port: actions-metrics
    path: /metrics
    interval: 60s
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: forge
  namespace: forge
spec:
  groups:
  - name: forge
    rules:
    - alert: ForgejoUnavailable
      expr: kube_statefulset_replicas{namespace="forge",statefulset="forgejo"} > 0 and kube_statefulset_status_replicas_ready{namespace="forge",statefulset="forgejo"}
        < 1
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: forgejo is unavailable
        description: The private development service has had no ready replica for five minutes.
    - alert: ForgejoActionsLauncherFailing
      expr: services_cronjob_unrecovered_failure{namespace="forge-ci",cronjob="forge-linux-qualification"}
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: The Linux qualification launcher has not recovered
        description: No successful launcher completion since its latest failed attempt for five minutes.
    - alert: ForgejoLinuxRunnerFailed
      expr: max by (namespace) (kube_job_status_failed{namespace="forge-ci",job_name=~"forge-linux-atollion-[0-9].*"})
        > 0
      for: 5m
      labels:
        severity: warning
        repository: atollion
      annotations:
        summary: An Atollion disposable Linux runner failed to finish
        description: Inspect failed runner Jobs and their logs; concurrent failures share one incident.
    - alert: ForgejoLinuxControllerFailed
      expr: services_cronjob_unrecovered_failure{namespace="forge-control",cronjob="forge-linux-atollion-launcher"}
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: The Atollion Linux queue launcher failed
        description: No successful launcher completion since its latest failed attempt for five minutes.
          Inspect launcher logs, job quota and disposable volume provisioning.
    - alert: ForgejoActionsQueueStalled
      expr: (time() - forge_actions_oldest_waiting_timestamp_seconds > 900) and ignoring(status) (forge_actions_jobs{status="waiting"}
        > 0)
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: A Forgejo Actions job has waited over 15 minutes
        description: Check runner launchers, platform labels and image pulls.
    - alert: ForgejoActionsMetricsUnavailable
      expr: (forge_actions_metrics_up == 0) or absent(forge_actions_metrics_up)
      for: 15m
      labels:
        severity: warning
      annotations:
        summary: Forgejo Actions queue monitoring is unavailable
