apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- storage.yaml
- workloads.yaml
- routes.yaml
- network-policy.yaml
- monitoring.yaml
- runtime.sops.yaml
- signing.sops.yaml
- runners.yaml
- runner-qualification.sops.yaml
- runner-registry.sops.yaml
- native-registry.sops.yaml
- atollion-runners.yaml
- runner-atollion.sops.yaml
- atollion-launcher.sops.yaml
- cache.yaml
- cache-runtime.sops.yaml
- cache-registry.sops.yaml
- cache-brokers.sops.yaml
- cache-descriptors.sops.yaml
configMapGenerator:
- name: forge-cache
  namespace: forge-cache
  files:
  - cache-config.json
  - cache-runner.yaml
  - cache-gateway.py=../../../../../components/homelab/services/forge/cache-gateway.py
  - bounded_http.py=../../../../../components/homelab/services/forge/bounded_http.py
- name: forge-bootstrap
  namespace: forge
  files:
  - actions-metrics.py
  - forgejo.ini
  - bootstrap-forgejo.sh
  - cache-descriptors.py=../../../../../components/homelab/services/forge/cache-descriptors.py
  - bounded_http.py=../../../../../components/homelab/services/forge/bounded_http.py
- name: forge-runner-bootstrap
  namespace: forge-ci
  files:
  - register-job.py
  - cluster_http.py=../../../../../components/homelab/services/forge/cluster_http.py
  - run-job.sh
  - run-one-job.py=../../../../../components/homelab/services/forge/run-one-job.py
  - runner.yaml
- name: forge-linux-launcher
  namespace: forge-control
  files:
  - linux-launcher.py=../../../../../components/homelab/services/forge/linux-launcher.py
  - broker_cache.py=../../../../../components/homelab/services/forge/broker_cache.py
  - cluster_http.py=../../../../../components/homelab/services/forge/cluster_http.py
