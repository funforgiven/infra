apiVersion: v1
kind: Service
metadata:
  name: factorio
  namespace: games
  labels:
    app.kubernetes.io/name: factorio
  annotations:
    metallb.io/address-pool: services
    metallb.io/loadBalancerIPs: 10.21.40.123
spec:
  type: LoadBalancer
  externalTrafficPolicy: Cluster
  selector:
    app.kubernetes.io/name: factorio
  ports:
  - name: game
    protocol: UDP
    port: 34197
    targetPort: game
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: factorio
  namespace: games
spec:
  serviceName: factorio
  replicas: 1
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app.kubernetes.io/name: factorio
  template:
    metadata:
      labels:
        app.kubernetes.io/name: factorio
        app.kubernetes.io/part-of: game-servers
      annotations:
        pre.hook.backup.velero.io/command: '["/bootstrap/factorio-save.sh", "velero"]'
        pre.hook.backup.velero.io/container: factorio
        pre.hook.backup.velero.io/on-error: Fail
        pre.hook.backup.velero.io/timeout: 5m
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 180
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
      - name: render-config
        image: docker.io/factoriotools/factorio:2.0.77-rootless@sha256:f27130ce39c472fc8a9bf447c117a8b806568ee3ed172207825d5e952c71e282
        command:
        - /bootstrap/render-config.sh
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - name: bootstrap
          mountPath: /bootstrap
          readOnly: true
        - name: credentials
          mountPath: /credentials
          readOnly: true
        - name: data
          mountPath: /factorio
        - name: engine-config
          mountPath: /engine-config
        - name: runtime-config
          mountPath: /runtime-config
      containers:
      - name: factorio
        image: docker.io/factoriotools/factorio:2.0.77-rootless@sha256:f27130ce39c472fc8a9bf447c117a8b806568ee3ed172207825d5e952c71e282
        command:
        - /bootstrap/start.sh
        env:
        - name: CONFIG
          value: /runtime-config
        - name: RCON_PORT
          value: '27015'
        ports:
        - name: game
          protocol: UDP
          containerPort: 34197
        startupProbe:
          exec:
            command:
            - /bootstrap/factorio-ready.sh
          periodSeconds: 5
          failureThreshold: 60
        readinessProbe:
          exec:
            command:
            - /bootstrap/factorio-ready.sh
          periodSeconds: 10
          failureThreshold: 3
        livenessProbe:
          exec:
            command:
            - /bootstrap/factorio-ready.sh
          initialDelaySeconds: 30
          periodSeconds: 30
          failureThreshold: 6
        lifecycle:
          preStop:
            exec:
              command:
              - /bootstrap/factorio-save.sh
              - shutdown
        resources:
          requests:
            cpu: '2'
            memory: 4Gi
          limits:
            memory: 8Gi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - name: bootstrap
          mountPath: /bootstrap
          readOnly: true
        - name: data
          mountPath: /factorio
        - name: engine-config
          mountPath: /engine-config
        - name: runtime-config
          mountPath: /runtime-config
          readOnly: true
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: bootstrap
        configMap:
          name: factorio-bootstrap
          defaultMode: 365
      - name: credentials
        secret:
          secretName: factorio-runtime
          defaultMode: 288
      - name: engine-config
        emptyDir:
          medium: Memory
          sizeLimit: 1Mi
      - name: runtime-config
        emptyDir:
          medium: Memory
          sizeLimit: 8Mi
      - name: tmp
        emptyDir:
          medium: Memory
          sizeLimit: 256Mi
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      storageClassName: ceph-block
      resources:
        requests:
          storage: 20Gi
