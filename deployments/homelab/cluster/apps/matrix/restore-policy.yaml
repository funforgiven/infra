# The drill's verifier reads the restored relay crypto store: it never gets
# network access, whatever NetworkPolicy allows. Only the CloudNativePG restore
# test is exempt; it has its own allowlist in components/homelab/cnpg-restore-test.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: matrix-restore-isolation
  namespace: matrix-restore
spec:
  endpointSelector:
    matchExpressions:
    - key: cnpg.io/cluster
      operator: DoesNotExist
    - key: app.kubernetes.io/name
      operator: NotIn
      values:
      - postgres-restore-test
  ingressDeny:
  - {}
  egressDeny:
  - {}
