apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: matrix-postgres
  namespace: matrix
  # PostgreSQL 17 data from before the CNPG move; delete once nothing needs it.
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
  labels:
    app.kubernetes.io/name: matrix-postgres
    app.kubernetes.io/part-of: matrix
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: ceph-block
  resources:
    requests:
      storage: 20Gi
---
