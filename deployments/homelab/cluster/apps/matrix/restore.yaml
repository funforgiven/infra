---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: matrix-restore-controller
  namespace: backup-qualification
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: matrix-restore-controller
  namespace: velero
rules:
- apiGroups:
  - velero.io
  resources:
  - backups
  verbs:
  - get
  - list
- apiGroups:
  - velero.io
  resources:
  - restores
  verbs:
  - create
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: matrix-restore-controller
  namespace: velero
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: matrix-restore-controller
subjects:
- kind: ServiceAccount
  name: matrix-restore-controller
  namespace: backup-qualification
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: matrix-restore-controller
  namespace: matrix
rules:
- apiGroups:
  - ''
  resources:
  - secrets
  resourceNames:
  - matrix-registry
  verbs:
  - get
- apiGroups:
  - ''
  resources:
  - pods
  resourceNames:
  - matrix-synapse-0
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: matrix-restore-controller
  namespace: matrix
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: matrix-restore-controller
subjects:
- kind: ServiceAccount
  name: matrix-restore-controller
  namespace: backup-qualification
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: matrix-restore-controller
  namespace: matrix-restore
rules:
- apiGroups:
  - ''
  resources:
  - pods
  - persistentvolumeclaims
  - secrets
  - configmaps
  verbs:
  - get
  - list
  - watch
  - create
  - patch
  - delete
- apiGroups:
  - batch
  resources:
  - jobs
  verbs:
  - get
  - list
  - watch
  - create
  - delete
- apiGroups:
  - networking.k8s.io
  resources:
  - networkpolicies
  verbs:
  - get
  - create
  - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: matrix-restore-controller
  namespace: matrix-restore
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: matrix-restore-controller
subjects:
- kind: ServiceAccount
  name: matrix-restore-controller
  namespace: backup-qualification
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: matrix-restore-qualification
  namespace: backup-qualification
spec:
  schedule: 0 7 1 * *
  timeZone: Europe/Istanbul
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 6600
      template:
        spec:
          serviceAccountName: matrix-restore-controller
          restartPolicy: Never
          securityContext:
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          imagePullSecrets:
          - name: matrix-registry
          containers:
          - name: controller
            image: git.fahrican.com/forge-runner/matrix-runtime:1.0.0
            command:
            - python
            - /scripts/restore_controller.py
            securityContext:
              runAsNonRoot: true
              runAsUser: 1000
              runAsGroup: 1000
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                - ALL
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 512Mi
            volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: tmp
              mountPath: /tmp
          volumes:
          - name: scripts
            configMap:
              name: matrix-restore-controller
          - name: tmp
            emptyDir: {}
