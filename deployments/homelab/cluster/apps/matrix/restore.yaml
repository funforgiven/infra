# Verifier template run by backup-qualification/restore-drill against the
# media and relay volumes it restores into matrix-restore. Suspended: it never
# runs on its own. It decrypts the relay's recovery canary with the restored
# crypto store, so it has no token and no network (restore-policy.yaml).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: restore-verify
  namespace: matrix-restore
  labels:
    backup.fahrican.com/restore-verifier: "true"
spec:
  suspend: true
  schedule: 0 0 31 2 *
  jobTemplate:
    metadata:
      labels:
        backup.fahrican.com/restore-drill: "true"
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 1800
      ttlSecondsAfterFinished: 604800
      template:
        spec:
          automountServiceAccountToken: false
          restartPolicy: Never
          imagePullSecrets:
          - name: matrix-registry
          securityContext:
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
          - name: verify
            image: git.fahrican.com/forge-runner/matrix-runtime
            command:
            - python
            - /scripts/restore.py
            securityContext:
              runAsNonRoot: true
              runAsUser: 1000
              runAsGroup: 1000
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                - ALL
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                cpu: '1'
                memory: 1Gi
            volumeMounts:
            - name: media
              mountPath: /var/lib/matrix/media
              readOnly: true
            - name: relay
              mountPath: /var/lib/matrix/relay
              readOnly: true
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: tmp
              mountPath: /tmp
          volumes:
          - name: media
            persistentVolumeClaim:
              claimName: matrix-media
              readOnly: true
          - name: relay
            persistentVolumeClaim:
              claimName: matrix-relay
              readOnly: true
          - name: scripts
            configMap:
              name: matrix-restore-verifier
          - name: tmp
            emptyDir:
              sizeLimit: 1Gi
