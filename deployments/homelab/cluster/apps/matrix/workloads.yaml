  name: matrix-client
  namespace: matrix
  labels:
    app.kubernetes.io/name: matrix-client
spec:
  selector:
    app.kubernetes.io/name: matrix-client
  ports:
  - name: http
    port: 8080
    targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: matrix-client
  namespace: matrix
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: matrix-client
  template:
    metadata:
      labels:
        app.kubernetes.io/name: matrix-client
        app.kubernetes.io/part-of: matrix
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
      - name: matrix-registry
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: proxy
        image: git.fahrican.com/forge-runner/matrix-runtime
        command:
        - nginx
        - -c
        - /etc/matrix-nginx.conf
        - -g
        - daemon off;
        ports:
        - name: http
          containerPort: 8080
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 2Gi
        volumeMounts:
        - name: tmp
          mountPath: /tmp
          readOnly: false
        - name: element
          mountPath: /run/matrix
          readOnly: true
        readinessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 60
          periodSeconds: 30
        startupProbe:
          httpGet:
            path: /health
            port: http
          failureThreshold: 60
          periodSeconds: 10
      volumes:
      - name: tmp
        emptyDir: {}
      - name: element
        configMap:
          name: matrix-element
  strategy:
    type: Recreate
---
apiVersion: v1
kind: Service
metadata:
  name: matrix-relay
  namespace: matrix
  labels:
    app.kubernetes.io/name: matrix-relay
spec:
  selector:
    app.kubernetes.io/name: matrix-relay
  ports:
  - name: http
    port: 8080
    targetPort: http
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: matrix-relay
  namespace: matrix
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: matrix-relay
  template:
    metadata:
      labels:
        app.kubernetes.io/name: matrix-relay
        app.kubernetes.io/part-of: matrix
      annotations:
        pre.hook.backup.velero.io/container: relay
        pre.hook.backup.velero.io/command: '["curl", "--fail", "--silent", "--request", "POST", "http://127.0.0.1:8081/snapshot"]'
        pre.hook.backup.velero.io/on-error: Fail
        pre.hook.backup.velero.io/timeout: 2m
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
      - name: matrix-registry
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: relay
        image: git.fahrican.com/forge-runner/matrix-runtime
        command:
        - python
        - /scripts/relay.py
        ports:
        - name: http
          containerPort: 8080
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 2Gi
        volumeMounts:
        - name: tmp
          mountPath: /tmp
          readOnly: false
        - name: runtime
          mountPath: /run/matrix
          readOnly: true
        - name: scripts
          mountPath: /scripts
          readOnly: true
        - name: state
          mountPath: /var/lib/matrix/relay
          readOnly: false
        readinessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 60
          periodSeconds: 30
        startupProbe:
          httpGet:
            path: /health
            port: http
          failureThreshold: 60
          periodSeconds: 10
      volumes:
      - name: tmp
        emptyDir: {}
      - name: runtime
        secret:
          secretName: matrix-runtime
          items:
          - key: relay.json
            path: relay.json
          defaultMode: 416
      - name: scripts
        configMap:
          name: matrix-scripts
      - name: state
        persistentVolumeClaim:
          claimName: matrix-relay
  serviceName: matrix-relay
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
---
