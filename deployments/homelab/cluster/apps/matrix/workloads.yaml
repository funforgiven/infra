        emptyDir: {}
      - name: runtime
        secret:
          secretName: matrix-runtime
          items:
          - key: mas.yaml
            path: mas.yaml
          defaultMode: 416
      - name: scripts
        configMap:
          name: matrix-scripts
  strategy:
    type: Recreate
---
apiVersion: v1
