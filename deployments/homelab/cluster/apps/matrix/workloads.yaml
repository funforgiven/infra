  labels:
    app.kubernetes.io/name: matrix-egress
spec:
  selector:
    app.kubernetes.io/name: matrix-egress
  ports:
  - name: proxy
    port: 3128
    targetPort: proxy
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: matrix-egress
  namespace: matrix
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: matrix-egress
  template:
    metadata:
      labels:
        app.kubernetes.io/name: matrix-egress
        app.kubernetes.io/part-of: matrix
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
      - name: matrix-registry
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: egress
        image: git.fahrican.com/forge-runner/matrix-runtime
        command:
        - squid
