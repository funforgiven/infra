apiVersion: v1
kind: Service
metadata:
  name: matrix-synapse
  namespace: matrix
  labels:
    app.kubernetes.io/name: matrix-synapse
spec:
  selector:
    app.kubernetes.io/name: matrix-synapse
  ports:
  - name: http
    port: 8008
    targetPort: http
  - name: metrics
    port: 9000
    targetPort: metrics
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: matrix-synapse
  namespace: matrix
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: matrix-synapse
  template:
    metadata:
      labels:
        app.kubernetes.io/name: matrix-synapse
        app.kubernetes.io/part-of: matrix
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
      - name: matrix-registry
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: synapse
        image: git.fahrican.com/forge-runner/matrix-runtime
        command:
        - synapse_homeserver
        - --config-path
        - /run/matrix/synapse.yaml
        ports:
        - name: http
          containerPort: 8008
        - name: metrics
          containerPort: 9000
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            memory: 2Gi
        volumeMounts:
        - name: tmp
          mountPath: /tmp
          readOnly: false
        - name: runtime
          mountPath: /run/matrix
          readOnly: true
        - name: scripts
          mountPath: /scripts
          readOnly: true
        - name: media
          mountPath: /var/lib/matrix/media
          readOnly: false
        readinessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 60
          periodSeconds: 30
        startupProbe:
          httpGet:
            path: /health
            port: http
          failureThreshold: 60
          periodSeconds: 10
      volumes:
      - name: tmp
        emptyDir: {}
      - name: runtime
        secret:
          secretName: matrix-runtime
          items:
          - key: synapse.yaml
            path: synapse.yaml
          - key: signing.key
            path: signing.key
          defaultMode: 416
      - name: scripts
        configMap:
          name: matrix-scripts
      - name: media
        persistentVolumeClaim:
          claimName: matrix-media
  serviceName: matrix-synapse
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
---
