apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: netbird-postgres
  namespace: netbird
spec:
  instances: 3
  imageName: ghcr.io/cloudnative-pg/postgresql:18.4-standard-trixie@sha256:f0cc49632b5cc1e51f65ba03658c89bd31d64ea2672b14843a808a8d281417e1
  primaryUpdateStrategy: unsupervised
  bootstrap:
    recovery:
      source: backup
      database: netbird
      owner: netbird
      secret:
        name: netbird-runtime
  storage:
    storageClass: ceph-block
    size: 16Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi
  affinity:
    enablePodAntiAffinity: true
    podAntiAffinityType: required
    topologyKey: kubernetes.io/hostname
  postgresql:
    synchronous:
      method: any
      number: 1
      dataDurability: required
      failoverQuorum: true
    parameters:
      max_connections: '100'
      archive_timeout: 60s
      # Bound the backlog for an offline replica and leave recovery headroom.
      max_slot_wal_keep_size: 2GB
  monitoring:
    enablePodMonitor: true
  plugins:
  - name: barman-cloud.cloudnative-pg.io
    enabled: true
    isWALArchiver: true
    parameters:
      barmanObjectName: netbird-postgres-backup
      # A rebuilt cluster cannot archive into a non-empty folder: bump this name
      # and point the backup cluster below at the previous one.
      serverName: netbird-postgres
  externalClusters:
  - name: backup
    plugin:
      name: barman-cloud.cloudnative-pg.io
      parameters:
        barmanObjectName: netbird-postgres-backup
        serverName: netbird-postgres
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: netbird-events
  namespace: netbird
spec:
  name: netbird_events
  owner: netbird
  cluster:
    name: netbird-postgres
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: netbird-auth
  namespace: netbird
spec:
  name: netbird_auth
  owner: netbird
  cluster:
    name: netbird-postgres
