apiVersion: v1
kind: Service
metadata:
  name: navidrome
  namespace: media
  labels:
    app.kubernetes.io/name: navidrome
spec:
  selector:
    app.kubernetes.io/name: navidrome
  ports:
  - name: native
    port: 4533
    targetPort: native
  - name: web
    port: 4180
    targetPort: web
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: navidrome
  namespace: media
spec:
  serviceName: navidrome
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: navidrome
  template:
    metadata:
      labels:
        app.kubernetes.io/name: navidrome
        app.kubernetes.io/part-of: media
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
      - name: install-cli
        image: docker.io/deluan/navidrome:0.63.2@sha256:9012939114fbb1bb641b81cf96dec5ded15f0aafefe8d47a511d7cb919658e40
        command:
        - install
        - -m
        - '0555'
        - /app/navidrome
        - /bootstrap-bin/navidrome
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsGroup: 1000
          runAsNonRoot: true
          runAsUser: 1000
        volumeMounts:
        - name: bootstrap-bin
          mountPath: /bootstrap-bin
      - name: reconcile-service-account
        image: lscr.io/linuxserver/beets:2.13.1-ls348@sha256:90b1404e962dfc09c1926f4d8dca8920fc90d71369df5398340a12eb8ce7328c
        command:
        - /lsiopy/bin/python3
        - /config/reconcile-navidrome-service-account.py
        envFrom:
        - configMapRef:
            name: navidrome-env
        env:
        - name: AUDIOMUSE_NAVIDROME_PASSWORD
          valueFrom:
            secretKeyRef:
              name: media-runtime
              key: AUDIOMUSE_NAVIDROME_PASSWORD
        - name: HOME
          value: /tmp
        - name: PYTHONDONTWRITEBYTECODE
          value: '1'
        - name: ND_LOGLEVEL
          value: error
        - name: ND_PLUGINS_ENABLED
          value: 'false'
        - name: ND_LASTFM_APIKEY
          valueFrom:
            secretKeyRef:
              name: media-runtime
              key: ND_LASTFM_APIKEY
        - name: ND_LASTFM_SECRET
          valueFrom:
            secretKeyRef:
              name: media-runtime
              key: ND_LASTFM_SECRET
        - name: ND_PASSWORDENCRYPTIONKEY
          valueFrom:
            secretKeyRef:
              name: media-runtime
              key: ND_PASSWORDENCRYPTIONKEY
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsGroup: 1000
          runAsNonRoot: true
          runAsUser: 1000
        volumeMounts:
        - name: bootstrap-bin
          mountPath: /bootstrap-bin
          readOnly: true
        - name: data
          mountPath: /data
        - name: media
          mountPath: /music
          subPath: library
          readOnly: true
        - name: config
          mountPath: /config
          readOnly: true
        - name: tmp
          mountPath: /tmp
      - name: plugins
        image: docker.io/deluan/navidrome:0.63.2@sha256:9012939114fbb1bb641b81cf96dec5ded15f0aafefe8d47a511d7cb919658e40
        command:
        - /bin/sh
        - /config/navidrome-plugins.sh
        envFrom:
        - configMapRef:
            name: navidrome-env
        env:
        - name: ND_LASTFM_APIKEY
          valueFrom:
            secretKeyRef:
              name: media-runtime
              key: ND_LASTFM_APIKEY
        - name: ND_LASTFM_SECRET
          valueFrom:
            secretKeyRef:
              name: media-runtime
              key: ND_LASTFM_SECRET
        - name: ND_PASSWORDENCRYPTIONKEY
          valueFrom:
            secretKeyRef:
              name: media-runtime
              key: ND_PASSWORDENCRYPTIONKEY
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsGroup: 1000
          runAsNonRoot: true
          runAsUser: 1000
        volumeMounts:
        - name: data
          mountPath: /data
        - name: media
          mountPath: /music
          subPath: library
          readOnly: true
        - name: config
          mountPath: /config
          readOnly: true
        - name: tmp
          mountPath: /tmp
      containers:
      - name: navidrome
        image: docker.io/deluan/navidrome:0.63.2@sha256:9012939114fbb1bb641b81cf96dec5ded15f0aafefe8d47a511d7cb919658e40
        envFrom:
        - configMapRef:
            name: navidrome-env
        env:
        - name: ND_LASTFM_APIKEY
          valueFrom:
            secretKeyRef:
              name: media-runtime
              key: ND_LASTFM_APIKEY
        - name: ND_LASTFM_SECRET
          valueFrom:
            secretKeyRef:
              name: media-runtime
              key: ND_LASTFM_SECRET
        - name: ND_PASSWORDENCRYPTIONKEY
          valueFrom:
            secretKeyRef:
              name: media-runtime
              key: ND_PASSWORDENCRYPTIONKEY
        ports:
        - name: native
          containerPort: 4533
        readinessProbe:
          httpGet:
            path: /ping
            port: native
          initialDelaySeconds: 10
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /ping
            port: native
          initialDelaySeconds: 30
          periodSeconds: 30
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: '2'
            memory: 2Gi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsGroup: 1000
          runAsNonRoot: true
          runAsUser: 1000
        volumeMounts:
        - name: data
          mountPath: /data
        - name: media
          mountPath: /music
          subPath: library
          readOnly: true
      - name: oauth2-proxy
        image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.4@sha256:b1b2021fe8f4004573e8d690dec6c7bb29cc44364572cf8510a05bf3a0ae2ded
        args:
        - --provider=oidc
        - --oidc-issuer-url=https://auth.cloud.fahrican.com
        - --redirect-url=https://music.fahrican.com/oauth2/callback
        - --upstream=http://127.0.0.1:4533
        - --http-address=0.0.0.0:4180
        - --email-domain=*
        - --scope=openid profile email offline_access
        - --pass-user-headers=true
        - --set-xauthrequest=true
        - --reverse-proxy=true
        - --trusted-proxy-ip=10.100.0.0/16
        - --cookie-secure=true
        - --cookie-samesite=lax
        - --cookie-refresh=1h
        - --cookie-expire=720h
        - --skip-provider-button=true
        env:
        - name: OAUTH2_PROXY_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: media-runtime
              key: NAVIDROME_OIDC_CLIENT_ID
        - name: OAUTH2_PROXY_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: media-runtime
              key: NAVIDROME_OIDC_CLIENT_SECRET
        - name: OAUTH2_PROXY_COOKIE_SECRET
          valueFrom:
            secretKeyRef:
              name: media-runtime
              key: NAVIDROME_OAUTH2_COOKIE_SECRET
        ports:
        - name: web
          containerPort: 4180
        readinessProbe:
          httpGet:
            path: /ping
            port: web
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /ping
            port: web
          initialDelaySeconds: 10
          periodSeconds: 30
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: true
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: bootstrap-bin
        emptyDir: {}
      - name: data
        persistentVolumeClaim:
          claimName: navidrome-data
      - name: media
        persistentVolumeClaim:
          claimName: media-library
      - name: config
        configMap:
          name: navidrome-bootstrap
          defaultMode: 365
      - name: tmp
        emptyDir: {}
