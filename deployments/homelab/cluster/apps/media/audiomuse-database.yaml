apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: audiomuse-db
  namespace: media
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.4-standard-trixie@sha256:f0cc49632b5cc1e51f65ba03658c89bd31d64ea2672b14843a808a8d281417e1
  primaryUpdateStrategy: unsupervised
  inheritedMetadata:
    labels:
      app.kubernetes.io/name: audiomuse-db
      app.kubernetes.io/part-of: media
      # AudioMuse data is recomputable: CNPG copies this label onto its PVCs,
      # which opts them into the daily crash-consistent volume snapshots.
      backup.fahrican.com/volume-snapshot: "true"
  bootstrap:
    # One-time logical import from the legacy PostgreSQL 15 StatefulSet. CNPG
    # generates the audiomuse-db-app owner Secret that AudioMuse now uses.
    initdb:
      database: audiomusedb
      owner: audiomuse
      import:
        type: microservice
        databases:
        - audiomusedb
        source:
          externalCluster: legacy
  storage:
    storageClass: ceph-block
    size: 20Gi
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 2Gi
  affinity:
    additionalPodAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          topologyKey: kubernetes.io/hostname
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: audiomuse-worker
  monitoring:
    enablePodMonitor: true
  externalClusters:
  - name: legacy
    connectionParameters:
      host: audiomuse-postgres.media.svc.cluster.local
      user: audiomuse
      dbname: audiomusedb
    password:
      name: media-runtime
      key: AUDIOMUSE_POSTGRES_PASSWORD
