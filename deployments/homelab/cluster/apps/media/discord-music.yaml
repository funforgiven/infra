apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: discord-music-data
  namespace: media
  labels:
    app.kubernetes.io/name: discord-music
    app.kubernetes.io/part-of: media
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: ceph-block
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: discord-music
  namespace: media
  labels:
    app.kubernetes.io/name: discord-music
    app.kubernetes.io/part-of: media
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: discord-music
  template:
    metadata:
      labels:
        app.kubernetes.io/name: discord-music
        app.kubernetes.io/part-of: media
      annotations:
        pre.hook.backup.velero.io/command: '["/usr/bin/python3", "/backup/sqlite-backup.py"]'
        pre.hook.backup.velero.io/container: muse
        pre.hook.backup.velero.io/on-error: Fail
        pre.hook.backup.velero.io/timeout: 1m
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: muse
        image: ghcr.io/museofficial/muse:2.11.7-yt-dlp-2026.8.19@sha256:ffe4274041ff82d1ed0893bc299da4ec3afb82df1aee9c4e5e10eb980a4f38f7
        env:
        - name: DISCORD_TOKEN
          valueFrom:
            secretKeyRef:
              name: discord-music-runtime
              key: DISCORD_TOKEN
        - name: YOUTUBE_API_KEY
          valueFrom:
            secretKeyRef:
              name: discord-music-runtime
              key: YOUTUBE_API_KEY
        - name: CACHE_LIMIT
          value: 2GB
        - name: DATA_DIR
          value: /data
        - name: HOME
          value: /tmp
        - name: TMPDIR
          value: /tmp
        - name: YT_DLP_AUTO_UPDATE
          value: 'false'
        startupProbe:
          exec:
            command:
            - /bin/sh
            - -ec
            - test -s /data/db.sqlite
          periodSeconds: 2
          failureThreshold: 60
        readinessProbe:
          exec:
            command:
            - node
            - -e
            - |
              const token = process.env.DISCORD_TOKEN?.trim();
              if (!token) process.exit(1);
              const headers = {
                Authorization: "Bot " + token,
              };
              fetch("https://discord.com/api/v10/users/@me", {
                headers,
                signal: AbortSignal.timeout(5000),
              })
                .then((response) => process.exit(response.ok ? 0 : 1))
                .catch(() => process.exit(1));
          periodSeconds: 60
          timeoutSeconds: 10
          failureThreshold: 3
        resources:
          requests:
            cpu: 25m
            memory: 512Mi
          limits:
            cpu: '2'
            memory: 2Gi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsGroup: 1000
          runAsNonRoot: true
          runAsUser: 1000
        volumeMounts:
        - name: backup
          mountPath: /backup
          readOnly: true
        - name: data
          mountPath: /data
        - name: cache
          mountPath: /data/cache
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: backup
        configMap:
          name: discord-music-backup
          defaultMode: 365
      - name: data
        persistentVolumeClaim:
          claimName: discord-music-data
      - name: cache
        emptyDir:
          sizeLimit: 3Gi
      - name: tmp
        emptyDir:
          sizeLimit: 1Gi
