# audiomuse-postgres (Service, StatefulSet and its PVC in storage.yaml) is the
# legacy PostgreSQL 15 database. It stays only as the import source for the
# audiomuse-db CloudNativePG cluster; remove it after the cutover is verified.
apiVersion: v1
kind: Service
metadata:
  name: audiomuse-postgres
  namespace: media
  labels:
    app.kubernetes.io/name: audiomuse-postgres
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: audiomuse-postgres
  ports:
  - name: postgres
    port: 5432
    targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: audiomuse-postgres
  namespace: media
spec:
  serviceName: audiomuse-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: audiomuse-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: audiomuse-postgres
        app.kubernetes.io/part-of: media
      annotations:
        backup.velero.io/backup-volumes-excludes: data
    spec:
      automountServiceAccountToken: false
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: audiomuse-worker
      securityContext:
        fsGroup: 70
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: postgres
        image: docker.io/library/postgres
        env:
        - name: POSTGRES_DB
          value: audiomusedb
        - name: POSTGRES_USER
          value: audiomuse
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: media-runtime
              key: AUDIOMUSE_POSTGRES_PASSWORD
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        - name: TZ
          value: Europe/Istanbul
        ports:
        - name: postgres
          containerPort: 5432
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - audiomuse
            - -d
            - audiomusedb
          periodSeconds: 10
        livenessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - audiomuse
            - -d
            - audiomusedb
          initialDelaySeconds: 30
          periodSeconds: 30
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: '1'
            memory: 2Gi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsGroup: 70
          runAsNonRoot: true
          runAsUser: 70
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: audiomuse-postgres
---
apiVersion: v1
kind: Service
metadata:
  name: audiomuse
  namespace: media
  labels:
    app.kubernetes.io/name: audiomuse
spec:
  selector:
    app.kubernetes.io/name: audiomuse
  ports:
  - name: web
    port: 4180
    targetPort: web
---
apiVersion: v1
kind: Service
metadata:
  name: audiomuse-api
  namespace: media
  labels:
    app.kubernetes.io/name: audiomuse
spec:
  selector:
    app.kubernetes.io/name: audiomuse
  ports:
  - name: http
    port: 8000
    targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: audiomuse
  namespace: media
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: audiomuse
  template:
    metadata:
      labels:
        app.kubernetes.io/name: audiomuse
        app.kubernetes.io/part-of: media
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: audiomuse-worker
      containers:
      - name: audiomuse
        env:
        - name: SERVICE_TYPE
          value: flask
        ports:
        - name: http
          containerPort: 8000
        readinessProbe:
          httpGet:
            path: /api/health
            port: http
          initialDelaySeconds: 20
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /api/health
            port: http
          initialDelaySeconds: 60
          periodSeconds: 30
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: '1'
            memory: 2Gi
      - name: oauth2-proxy
        image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.4@sha256:b1b2021fe8f4004573e8d690dec6c7bb29cc44364572cf8510a05bf3a0ae2ded
        args:
        - --provider=oidc
        - --oidc-issuer-url=https://auth.cloud.fahrican.com
        - --redirect-url=https://audiomuse.fahrican.com/oauth2/callback
        - --upstream=http://127.0.0.1:8000
        - --http-address=0.0.0.0:4180
        - --email-domain=*
        - --scope=openid profile email offline_access
        - --reverse-proxy=true
        - --trusted-proxy-ip=10.100.0.0/16
        - --cookie-secure=true
        - --cookie-samesite=lax
        - --cookie-refresh=1h
        - --cookie-expire=720h
        - --skip-provider-button=true
        env:
        - name: OAUTH2_PROXY_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: media-runtime
              key: AUDIOMUSE_OIDC_CLIENT_ID
        - name: OAUTH2_PROXY_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: media-runtime
              key: AUDIOMUSE_OIDC_CLIENT_SECRET
        - name: OAUTH2_PROXY_COOKIE_SECRET
          valueFrom:
            secretKeyRef:
              name: media-runtime
              key: AUDIOMUSE_OAUTH2_COOKIE_SECRET
        ports:
        - name: web
          containerPort: 4180
        readinessProbe:
          httpGet:
            path: /ping
            port: web
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /ping
            port: web
          initialDelaySeconds: 10
          periodSeconds: 30
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: true
        volumeMounts:
        - name: tmp
          mountPath: /tmp
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: audiomuse-worker
  namespace: media
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: audiomuse-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: audiomuse-worker
        app.kubernetes.io/part-of: media
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              topologyKey: kubernetes.io/hostname
              labelSelector:
                matchExpressions:
                - key: app.kubernetes.io/name
                  operator: In
                  values:
                  - audiomuse
                  - audiomuse-db
      containers:
      - name: audiomuse
        env:
        - name: SERVICE_TYPE
          value: worker
        resources:
          requests:
            cpu: '1'
            memory: 3Gi
          limits:
            cpu: '3'
            memory: 7Gi
      volumes:
      - name: temp-audio
        emptyDir:
          sizeLimit: 10Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: audiomuse-reconcile
  namespace: media
spec:
  schedule: '*/15 * * * *'
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 1800
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: audiomuse-reconcile
            velero.io/exclude-from-backup: "true"
            app.kubernetes.io/part-of: media
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            seccompProfile:
              type: RuntimeDefault
          containers:
          - name: reconcile
            image: ghcr.io/neptunehub/audiomuse-ai
            command:
            - /usr/bin/python3
            - /config/reconcile-audiomuse.py
            resources:
              requests:
                cpu: 25m
                memory: 64Mi
              limits:
                cpu: 200m
                memory: 256Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
              readOnlyRootFilesystem: true
              runAsGroup: 1000
              runAsNonRoot: true
              runAsUser: 1000
            volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: tmp
              mountPath: /tmp
          volumes:
          - name: config
            configMap:
              name: audiomuse-bootstrap
              defaultMode: 365
          - name: tmp
            emptyDir: {}
