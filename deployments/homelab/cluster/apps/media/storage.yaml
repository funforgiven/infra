apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: media-library
  namespace: media
  labels:
    # Backed up by Kopia from the Navidrome pod, not by snapshot: a CephFS
    # snapshot is exported through a full clone. A PVC-only restore cannot
    # recover it, so the restore drill skips it.
    backup.fahrican.com/restore-drill: skip
spec:
  accessModes:
  - ReadWriteMany
  storageClassName: ceph-filesystem
  resources:
    requests:
      storage: 1Ti
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: navidrome-data
  namespace: media
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: ceph-block
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: beets-data
  namespace: media
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: ceph-block
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sftpgo-data
  namespace: media
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: ceph-block
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: audiomuse-postgres
  namespace: media
  labels:
    # Legacy import source for audiomuse-db; recomputable and not backed up.
    velero.io/exclude-from-backup: "true"
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: ceph-block
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: audiomuse-postgres-dumps
  namespace: media
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: ceph-block
  resources:
    requests:
      storage: 5Gi
