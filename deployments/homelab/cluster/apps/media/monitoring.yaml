apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: navidrome
  namespace: media
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: navidrome
  endpoints:
  - port: native
    path: /metrics
    interval: 30s
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: media
  namespace: media
spec:
  groups:
  - name: media
    rules:
    - alert: NavidromeUnavailable
      expr: up{namespace="media",service="navidrome"} == 0
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: Navidrome metrics are unavailable
        description: Navidrome has not been scrapeable for ten minutes.
    - alert: BeetsImporterStalled
      expr: "(time() - kube_cronjob_status_last_successful_time{\n  namespace=\"media\",cronjob=\"beets-import\"\
        \n} > 1800) or ((time() - kube_cronjob_created{\n  namespace=\"media\",cronjob=\"beets-import\"\
        \n} > 1800) unless on(namespace,cronjob) kube_cronjob_status_last_successful_time{\n  namespace=\"\
        media\",cronjob=\"beets-import\"\n})"
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: Beets has not completed an import check recently
        description: The one-minute Beets importer has not completed successfully for at least thirty
          minutes.
    - alert: AudioMuseUnavailable
      expr: "kube_deployment_status_replicas_available{\n  namespace=\"media\",deployment=\"audiomuse\"\
        \n} < 1"
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: AudioMuse web is unavailable
        description: AudioMuse has had no available web replica for ten minutes.
    - alert: AudioMuseWorkerUnavailable
      expr: "kube_deployment_status_replicas_available{\n  namespace=\"media\",deployment=\"audiomuse-worker\"\
        \n} < 1"
      for: 15m
      labels:
        severity: warning
      annotations:
        summary: AudioMuse analysis worker is unavailable
        description: AudioMuse has had no available analysis worker for fifteen minutes.
    - alert: AudioMusePostgresUnavailable
      expr: "sum(kube_pod_status_ready{\n  namespace=\"media\",pod=~\"audiomuse-db-[0-9]+\",condition=\"true\"\n}) < 1\
        \ or absent(kube_pod_status_ready{\n  namespace=\"media\",pod=~\"audiomuse-db-[0-9]+\",condition=\"true\"\n})"
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: AudioMuse PostgreSQL is unavailable
        description: The audiomuse-db CloudNativePG instance has not been ready for ten minutes.
    - alert: AudioMuseReconcileStalled
      expr: "(time() - kube_cronjob_status_last_successful_time{\n  namespace=\"media\",cronjob=\"audiomuse-reconcile\"\
        \n} > 3600) or ((time() - kube_cronjob_created{\n  namespace=\"media\",cronjob=\"audiomuse-reconcile\"\
        \n} > 3600) unless on(namespace,cronjob) kube_cronjob_status_last_successful_time{\n  namespace=\"\
        media\",cronjob=\"audiomuse-reconcile\"\n})"
      for: 15m
      labels:
        severity: warning
      annotations:
        summary: AudioMuse policy reconciliation is stale
        description: AudioMuse cron policy has not reconciled successfully for an hour.
    - alert: DiscordMusicUnavailable
      expr: "kube_deployment_status_replicas_available{\n  namespace=\"media\",deployment=\"discord-music\"\
        \n} < 1 or absent(kube_deployment_status_replicas_available{\n  namespace=\"media\",deployment=\"\
        discord-music\"\n})"
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: The Discord music bot is unavailable
        description: Muse has had no available replica for ten minutes.
