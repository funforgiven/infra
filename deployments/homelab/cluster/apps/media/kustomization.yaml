apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- storage.yaml
- sftpgo.yaml
- beets.yaml
- navidrome.yaml
- audiomuse-config.yaml
- audiomuse.yaml
- discord-music.yaml
- routes.yaml
- monitoring.yaml
- network-policy.yaml
- runtime.sops.yaml
patches:
- path: audiomuse-pod.yaml
  target:
    kind: Deployment
    name: ^audiomuse(-worker)?$
images:
- name: ghcr.io/neptunehub/audiomuse-ai
  newTag: 3.4.0
  digest: sha256:5c2c3710d0a0990258946b2d268c955d29b675afc9588bcfe3f70fd3d1f11ff6
- name: docker.io/library/postgres
  newTag: 15.19-alpine
  digest: sha256:a2c20749c564b4eb73a77bfda626f8a3cde1bbfae020fb97c616a00cdc1a2181
configMapGenerator:
- name: sftpgo-bootstrap
  namespace: media
  files:
  - render.sh=render-initial-data.sh
- name: beets-config
  namespace: media
  files:
  - config.yaml=beets-config.yaml
  - import.sh=import.sh
  - verify-lastgenre-offline.py=verify-lastgenre-offline.py
  - normalize-provider-ids.py=normalize-provider-ids.py
  - quarantine-live.py=quarantine-live.py
- name: navidrome-bootstrap
  namespace: media
  files:
  - reconcile-navidrome-service-account.py=reconcile-navidrome-service-account.py
  - install-navidrome-plugins.sh=install-navidrome-plugins.sh
  - configure-navidrome-plugins.sh=configure-navidrome-plugins.sh
- name: audiomuse-bootstrap
  namespace: media
  files:
  - reconcile-audiomuse.py=reconcile-audiomuse.py
  - postgres-backup.sh=postgres-backup.sh
