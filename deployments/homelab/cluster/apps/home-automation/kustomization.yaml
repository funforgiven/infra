apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- credentials.sops.yaml
- storage.yaml
- network-attachment.yaml
- workload.yaml
- routes.yaml
- network-policy.yaml
- monitoring.yaml
- thread.yaml
configMapGenerator:
- name: automation-bootstrap
  namespace: home-automation
  files:
  - bootstrap.py
  - install-pinned.py
  - onecta-application-credentials.py
  - health.py
  - configuration.yaml
  - zigbee-configuration.yaml
  - mosquitto.conf
  - mosquitto.acl
  - mosquitto-nuki.acl
  - iot-firewall.nft
  - thread-firewall.nft
  - thread-metrics.py
  - thread-ready.sh
# Git-owned Home Assistant configuration, mounted read-only at /config/managed.
- name: home-assistant-config
  namespace: home-automation
  files:
  - automation-hue-dimmers.yaml=automations/hue-dimmers.yaml
  - automation-nuki-keypad-lighting.yaml=automations/nuki-keypad-lighting.yaml
  - automation-bathroom-presence-lighting.yaml=automations/bathroom-presence-lighting.yaml
  - package-nuki-mqtt.yaml=packages/nuki-mqtt.yaml
  - dashboard-rooftrollen.yaml=dashboard/dashboard.yaml
  - theme-rooftrollen.yaml=dashboard/theme.yaml
- name: automation-thread
  namespace: home-automation
  envs:
  - thread.env
