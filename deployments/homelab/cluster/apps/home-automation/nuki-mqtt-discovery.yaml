homeassistant/event/nuki_4e988f8f/action/config:
  name: Action requested
  unique_id: nuki_4e988f8f_action
  default_entity_id: event.nuki_ultra_action
  device:
    identifiers:
    - nuki_4e988f8f_activity
    manufacturer: Nuki
    model: Smart Lock Ultra MQTT
    name: Nuki Ultra activity
    serial_number: 4E988F8F
  availability_topic: nuki/4E988F8F/connected
  payload_available: 'true'
  payload_not_available: 'false'
  state_topic: nuki/4E988F8F/lockActionEvent
  event_types:
  - unlock
  - lock
  - unlatch
  - lock_n_go
  - lock_n_go_unlatch
  - full_lock
  - fob
  - button
  - unknown
  icon: mdi:lock-clock
  value_template: "{% set p = value.split(',') %} {% if p | length == 5 and p | select('match', '^\\d+$')\
    \ | list | length == 5 %}\n  {% set actions = {'1': 'unlock', '2': 'lock', '3': 'unlatch', '4': 'lock_n_go',\n\
    \                    '5': 'lock_n_go_unlatch', '6': 'full_lock', '80': 'fob', '90': 'button'} %}\n\
    \  {% set triggers = {'0': 'system_or_bluetooth', '2': 'button', '3': 'automatic',\n             \
    \        '6': 'auto_lock', '171': 'matter', '172': 'mqtt'} %}\n  {% set keypad = {'0': 'back_button',\
    \ '1': 'code', '2': 'fingerprint'} %}\n  {{ {'event_type': actions.get(p[0], 'unknown'),\n      'action_id':\
    \ p[0] | int, 'trigger_id': p[1] | int,\n      'source': 'keypad' if p[3] | int > 0 else triggers.get(p[1],\
    \ 'unknown'),\n      'authorization_id': p[2] | int if p[2] | int > 0 else none,\n      'code_id':\
    \ p[3] | int if p[3] | int > 0 else none,\n      'keypad_source': keypad.get(p[4], 'unknown') if p[3]\
    \ | int > 0 else none,\n      'context_value': p[4] | int} | to_json }}\n{% else %}\n  {{ {} | to_json\
    \ }}\n{% endif %}"
