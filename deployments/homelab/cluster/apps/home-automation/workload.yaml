apiVersion: v1
kind: Service
metadata:
  name: home-assistant
  namespace: home-automation
  labels:
    app.kubernetes.io/name: home-assistant
    app.kubernetes.io/part-of: home-automation
spec:
  selector:
    app.kubernetes.io/name: home-assistant
  ports:
  - name: http
    port: 8123
    targetPort: http
  - name: zigbee-ui
    port: 8080
    targetPort: zigbee-ui
  - name: metrics
    port: 9000
    targetPort: metrics
---
apiVersion: v1
kind: Service
metadata:
  name: home-assistant-lan
  namespace: home-automation
  annotations:
    metallb.io/address-pool: services
    metallb.io/loadBalancerIPs: 10.21.40.120
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  allocateLoadBalancerNodePorts: false
  selector:
    app.kubernetes.io/name: home-assistant
  ports:
  - name: http
    port: 8123
    targetPort: http
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: home-assistant
  namespace: home-automation
spec:
  replicas: 1
  serviceName: home-assistant
  selector:
    matchLabels:
      app.kubernetes.io/name: home-assistant
  template:
    metadata:
      labels:
        app.kubernetes.io/name: home-assistant
        app.kubernetes.io/part-of: home-automation
      annotations:
        k8s.v1.cni.cncf.io/networks: '[{"name":"automation-lan","interface":"net1"}]'
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        fahrican.com.node-restriction.kubernetes.io/iot: 'true'
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 120
      initContainers:
      - name: iot-firewall
        image: docker.io/nicolaka/netshoot:v0.14@sha256:7f08c4aff13ff61a35d30e30c5c1ea8396eac6ab4ce19fd02d5a4b3b5d0d09a2
        command:
        - /bin/sh
        - -ec
        - 'nft list table inet automation >/dev/null 2>&1 && nft delete table inet
          automation || true

          nft -f /bootstrap/iot-firewall.nft'
        securityContext:
          runAsUser: 0
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
            add:
            - NET_ADMIN
          readOnlyRootFilesystem: true
        volumeMounts:
        - name: bootstrap
          mountPath: /bootstrap
          readOnly: true
      - name: seed-config
        image: docker.io/python:3.14.6-alpine3.23@sha256:b165067c5afc37fa5608a3c05609cc3d51aafd808a30fbfd822ee594fef55ad4
        command:
        - python
        - /bootstrap/bootstrap.py
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: bootstrap
          mountPath: /bootstrap
          readOnly: true
        - name: state
          mountPath: /state
        - name: runtime
          mountPath: /runtime
        - name: credentials
          mountPath: /credentials
          readOnly: true
      - name: install-pinned
        image: docker.io/python:3.14.6-alpine3.23@sha256:b165067c5afc37fa5608a3c05609cc3d51aafd808a30fbfd822ee594fef55ad4
        command:
        - python
        - /bootstrap/install-pinned.py
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: bootstrap
          mountPath: /bootstrap
          readOnly: true
        - name: state
          mountPath: /state
      - name: hash-mqtt-passwords
        image: docker.io/eclipse-mosquitto:2.1.2-alpine@sha256:6f8d8a947c506f8a2290ec65cd4bd2bc7cb4d43fb5f6271f861cb013e2ef9797
        command:
        - /bin/sh
        - -ec
        - 'mosquitto_passwd -U /runtime/mosquitto-passwords

          mosquitto_passwd -U /runtime/nuki-passwords'
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: runtime
          mountPath: /runtime
        - name: runtime
          mountPath: /tmp
      containers:
      - name: home-assistant
        image: ghcr.io/home-assistant/home-assistant:2026.9.2@sha256:a1bc133af84ee6505fe2c266d9805b7c75b780dfdc188edfee3b11e8f3cd8efe
        command:
        - python
        - -m
        - homeassistant
        - --config
        - /config
        env:
        - name: TZ
          value: Europe/Istanbul
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: '2'
            memory: 2Gi
        volumeMounts:
        - name: bootstrap
          mountPath: /bootstrap
          readOnly: true
        - name: state
          mountPath: /config
          subPath: home-assistant
        - name: home-assistant-config
          mountPath: /config/managed
          readOnly: true
        - name: ha-tmp
          mountPath: /tmp
        ports:
        - name: http
          containerPort: 8123
        - name: zigbee-ui
          containerPort: 8080
        startupProbe:
          httpGet:
            path: /manifest.json
            port: http
          periodSeconds: 10
          failureThreshold: 90
        readinessProbe:
          httpGet:
            path: /manifest.json
            port: http
          periodSeconds: 10
          failureThreshold: 3
      - name: matter
        image: ghcr.io/matter-js/matterjs-server:1.4.0@sha256:54232d0d3e7dff5a54759469d2753399270412b4c30c55b31750a4595e4cb236
        command:
        - node
        - --enable-source-maps
        - /app/node_modules/matter-server/dist/esm/MatterServer.js
        env:
        - name: TZ
          value: Europe/Istanbul
        - name: STORAGE_PATH
          value: /data
        - name: LISTEN_ADDRESS
          value: 127.0.0.1
        - name: PRIMARY_INTERFACE
          value: net1
        - name: LOG_LEVEL
          value: info
        - name: ENABLE_TIME_SYNC
          value: 'true'
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: '1'
            memory: 512Mi
        volumeMounts:
        - name: bootstrap
          mountPath: /bootstrap
          readOnly: true
        - name: state
          mountPath: /data
          subPath: matter
        - name: matter-tmp
          mountPath: /tmp
      - name: mosquitto
        image: docker.io/eclipse-mosquitto:2.1.2-alpine@sha256:6f8d8a947c506f8a2290ec65cd4bd2bc7cb4d43fb5f6271f861cb013e2ef9797
        command:
        - /usr/sbin/mosquitto
        - -c
        - /bootstrap/mosquitto.conf
        env:
        - name: TZ
          value: Europe/Istanbul
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 25m
            memory: 32Mi
          limits:
            cpu: 250m
            memory: 128Mi
        volumeMounts:
        - name: bootstrap
          mountPath: /bootstrap
          readOnly: true
        - name: state
          mountPath: /mosquitto/data
          subPath: mosquitto
        - name: runtime
          mountPath: /runtime
          readOnly: true
      - name: zigbee2mqtt
        image: ghcr.io/koenkk/zigbee2mqtt:2.14.1@sha256:fef0de769dcd04c27b3a6d277b61046eb96284bdd4198dcb1687c3a01b3020f3
        command:
        - node
        - /app/index.js
        env:
        - name: TZ
          value: Europe/Istanbul
        - name: ZIGBEE2MQTT_CONFIG_SERIAL_PORT
          value: tcp://10.21.50.20:6638
        - name: ZIGBEE2MQTT_CONFIG_MQTT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: automation-credentials
              key: zigbee2mqtt-password
        - name: ZIGBEE2MQTT_CONFIG_FRONTEND_AUTH_TOKEN
          valueFrom:
            secretKeyRef:
              name: automation-credentials
              key: zigbee-ui-token
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 384Mi
        volumeMounts:
        - name: bootstrap
          mountPath: /bootstrap
          readOnly: true
        - name: state
          mountPath: /app/data
          subPath: zigbee2mqtt
        - name: zigbee-tmp
          mountPath: /tmp
      - name: health
        image: docker.io/python:3.14.6-alpine3.23@sha256:b165067c5afc37fa5608a3c05609cc3d51aafd808a30fbfd822ee594fef55ad4
        command:
        - python
        - /bootstrap/health.py
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        ports:
        - name: metrics
          containerPort: 9000
        readinessProbe:
          httpGet:
            path: /healthz
            port: metrics
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: metrics
          periodSeconds: 30
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 250m
            memory: 128Mi
        volumeMounts:
        - name: bootstrap
          mountPath: /bootstrap
          readOnly: true
        - name: credentials
          mountPath: /credentials
          readOnly: true
      volumes:
      - name: bootstrap
        configMap:
          name: automation-bootstrap
          defaultMode: 365
      - name: credentials
        secret:
          secretName: automation-credentials
          defaultMode: 288
      - name: home-assistant-config
        configMap:
          name: home-assistant-config
          items:
          - key: automation-hue-dimmers.yaml
            path: automations/hue-dimmers.yaml
          - key: automation-nuki-keypad-lighting.yaml
            path: automations/nuki-keypad-lighting.yaml
          - key: automation-bathroom-presence-lighting.yaml
            path: automations/bathroom-presence-lighting.yaml
          - key: package-nuki-mqtt.yaml
            path: packages/nuki-mqtt.yaml
          - key: dashboard-rooftrollen.yaml
            path: dashboards/rooftrollen.yaml
          - key: theme-rooftrollen.yaml
            path: themes/rooftrollen.yaml
      - name: state
        persistentVolumeClaim:
          claimName: automation-state
      - name: runtime
        emptyDir:
          medium: Memory
          sizeLimit: 128Mi
      - name: ha-tmp
        emptyDir:
          medium: Memory
          sizeLimit: 128Mi
      - name: matter-tmp
        emptyDir:
          medium: Memory
          sizeLimit: 128Mi
      - name: zigbee-tmp
        emptyDir:
          medium: Memory
          sizeLimit: 128Mi
