schemaVersion: 1
document: homelab-backup-destination
lastReviewed: '2026-10-12'
provider: backblaze-b2
bucket:
  name: fahrican-cloud-recovery
  s3Endpoint: https://s3.us-west-004.backblazeb2.com
  region: us-west-004
  access: private
  defaultEncryption: SSE-B2
  objectLock: false
  operatorBootstrap:
    applicationKeyIdFile: secrets/B2_MASTER_APPLICATION_KEY_ID.key
    applicationKeyFile: secrets/B2_MASTER_APPLICATION_KEY.key
    clearAfterSuccess: true
  lifecycleRules:
  - fileNamePrefix: undercloud/etcd/
    daysFromUploadingToHiding: null
    daysFromHidingToDeleting: 30
  - fileNamePrefix: management/etcd/
    daysFromUploadingToHiding: null
    daysFromHidingToDeleting: 30
  - fileNamePrefix: undercloud/openstack/
    daysFromUploadingToHiding: null
    daysFromHidingToDeleting: 30
  - fileNamePrefix: undercloud/zitadel/
    daysFromUploadingToHiding: null
    daysFromHidingToDeleting: 30
  - fileNamePrefix: services/kubernetes/
    daysFromUploadingToHiding: null
    daysFromHidingToDeleting: 30
  - fileNamePrefix: services/hosts/home-assistant/
    daysFromUploadingToHiding: null
    daysFromHidingToDeleting: 30
  - fileNamePrefix: services/hosts/hermes/
    daysFromUploadingToHiding: null
    daysFromHidingToDeleting: 30
  - fileNamePrefix: services/hosts/mail-edge/
    daysFromUploadingToHiding: null
    daysFromHidingToDeleting: 30
  - fileNamePrefix: services/hosts/gitlab/
    daysFromUploadingToHiding: null
    daysFromHidingToDeleting: 30
  - fileNamePrefix: services/hosts/unifi/
    daysFromUploadingToHiding: null
    daysFromHidingToDeleting: 30
  - fileNamePrefix: services/hosts/mail-aws/
    daysFromUploadingToHiding: null
    daysFromHidingToDeleting: 30
zitadel:
  destinationPath: s3://fahrican-cloud-recovery/undercloud/zitadel/nixos-v1/
  endpoint: https://s3.us-west-004.backblazeb2.com
  continuousWalArchive: true
  baseBackupSchedule: 17 2 * * *
  retentionDays: 30
  objectLock: false
  writer:
    keyName: infra-zitadel-backup-writer
    namePrefix: undercloud/zitadel/
    capabilities:
    - deleteFiles
    - listFiles
    - readFiles
    - writeFiles
  migrationSource: s3://fahrican-cloud-recovery/undercloud/zitadel/
services:
  kubernetes:
    keyName: infra-services-velero-writer
    namePrefix: services/kubernetes/
    secretFile: secrets/service-runtime.sops.yaml
    idField: B2_APPLICATION_KEY_ID
    valueField: B2_APPLICATION_KEY
    capabilities:
    - deleteFiles
    - listAllBucketNames
    - listBuckets
    - listFiles
    - readBuckets
    - readFiles
    - writeFiles
  hosts:
  - host: mail-aws
    keyName: infra-services-mail-aws-backup-writer
    namePrefix: services/hosts/mail-aws/
    secretFile: deployments/homelab/credentials/host-runtime/backups.sops.yaml
    idField: MAIL_AWS_BACKUP_B2_APPLICATION_KEY_ID
    valueField: MAIL_AWS_BACKUP_B2_APPLICATION_KEY
    resticPasswordField: MAIL_AWS_BACKUP_RESTIC_PASSWORD
  - host: unifi
    keyName: infra-services-unifi-backup-writer
    namePrefix: services/hosts/unifi/
    secretFile: deployments/homelab/credentials/host-runtime/backups.sops.yaml
    idField: UNIFI_BACKUP_B2_APPLICATION_KEY_ID
    valueField: UNIFI_BACKUP_B2_APPLICATION_KEY
    resticPasswordField: UNIFI_BACKUP_RESTIC_PASSWORD
  hostCapabilities:
  - deleteFiles
  - listAllBucketNames
  - listBuckets
  - listFiles
  - readBuckets
  - readFiles
  - writeFiles
legacyArchives:
  sourceCommit: 8d5f130
  keepUntil: Migration qualification and owner-approved rollback retirement
  prefixes:
  - undercloud/etcd/
  - management/etcd/
  - undercloud/openstack/
  - services/hosts/home-assistant/
  - services/hosts/hermes/
  - services/hosts/mail-edge/
  - services/hosts/gitlab/
clusterEtcd:
  repository: s3:s3.us-west-004.backblazeb2.com/fahrican-cloud-recovery/services/kubernetes/nixos-etcd
  secretFile: deployments/homelab/hosts/secrets.sops.yaml
  passwordField: etcd_restic_password
  environmentField: etcd_backup_environment
  snapshotSchedule: 0 */6 * * *
  uploadMinutes:
    pecorino: 30
    taleggio: 40
    asiago: 50
  timeZone: UTC
  localSnapshotsPerNode: 20
  retention:
    daily: 14
    weekly: 8
    monthly: 12
    yearly: 3
  payloads:
  - latest snapshot
  - K3s token and TLS/credential bootstrap material
  - host age identity
  - SSH host identity
