---
- name: Validate the controller-side RouterOS login secret contract
  ansible.builtin.assert:
    that:
      - ansible_user == 'admin'
      - >-
        routeros_login_password_file ==
        '/run/secrets/homelab-routeros-' ~ inventory_hostname ~
        '-login-password'
    fail_msg: >-
      Refusing RouterOS access: this host must use its device-scoped sops-nix
      login-password file. SSH identity is enforced by the standard pinned
      known-hosts entry.
  delegate_to: localhost

- name: Load the RouterOS login password from its sops-nix runtime file
  ansible.builtin.set_fact:
    ansible_password: >-
      {{ lookup('ansible.builtin.file', routeros_login_password_file) }}
  no_log: true

- name: Validate the redacted RouterOS login password shape
  ansible.builtin.assert:
    that:
      - ansible_password is match('^[A-Za-z0-9_-]{43}$')
    fail_msg: >-
      The device-scoped RouterOS login secret is absent or violates the
      32-byte URL-safe password contract.
  no_log: true
