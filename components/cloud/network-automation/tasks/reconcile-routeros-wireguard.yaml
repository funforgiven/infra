---
- name: Validate the WireGuard admin inventory
  ansible.builtin.assert:
    that:
      - routeros_wireguard.name | length > 0
      - routeros_wireguard.address | length > 0
      - routeros_wireguard.network | length > 0
      - routeros_wireguard.listen_port | int > 0
      - routeros_wireguard.mtu | int >= 1280
      - routeros_wireguard.private_key_file | length > 0
      - routeros_wireguard.public_key | length == 44
      - routeros_wireguard.wan_interface_list | length > 0
      - routeros_wireguard.input_chain | length > 0
      - routeros_wireguard.input_final_drop_comment | length > 0
      - routeros_wireguard.forward_chain | length > 0
      - routeros_wireguard.forward_final_drop_comment | length > 0
      - >-
        routeros_wireguard.peers | map(attribute='public_key') | list | unique |
        length == routeros_wireguard.peers | length
      - >-
        routeros_wireguard.peers | map(attribute='allowed_address') | list |
        unique | length == routeros_wireguard.peers | length
    fail_msg: "The WireGuard interface, firewall, and peers must be complete and unique."
  tags: [always, inventory-contract]

- name: Validate WireGuard admin peers
  ansible.builtin.assert:
    that:
      - item.name | length > 0
      - item.public_key | length == 44
      - item.allowed_address | length > 0
      - item.preshared_key_file | length > 0
  loop: "{{ routeros_wireguard.peers }}"
  loop_control:
    label: "{{ item.name | default('unnamed') }}"
  tags: [always, inventory-contract]

- name: Read current WireGuard admin state
  community.routeros.command:
    commands:
      - /interface wireguard print detail without-paging
      - /interface wireguard peers print detail without-paging
      - /ip address print detail without-paging where comment~"WireGuard"
      - /ip firewall filter print detail without-paging where comment~"WireGuard"
  register: routeros_wireguard_preflight
  changed_when: false
  tags: [always]

- name: Show the WireGuard preflight without credentials
  ansible.builtin.debug:
    var: routeros_wireguard_preflight.stdout_lines
  tags: [always]

- name: Load the WireGuard server private key
  ansible.builtin.set_fact:
    routeros_wireguard_private_key: >-
      {{ lookup('ansible.builtin.file', routeros_wireguard.private_key_file) | trim }}
  no_log: true
  tags: [never, apply]

- name: Validate the WireGuard server private key
  ansible.builtin.assert:
    that:
      - routeros_wireguard_private_key is match('^[A-Za-z0-9+/]{43}=$')
  no_log: true
  tags: [never, apply]

- name: Validate WireGuard admin peer preshared keys
  ansible.builtin.assert:
    that:
      - >-
        lookup('ansible.builtin.file', item.preshared_key_file) | trim is
        match('^[A-Za-z0-9+/]{43}=$')
  loop: "{{ routeros_wireguard.peers }}"
  no_log: true
  tags: [never, apply]

- name: Create the WireGuard admin interface when absent
  community.routeros.command:
    commands:
      - >-
        /interface wireguard add name="{{ routeros_wireguard.name }}"
        listen-port={{ routeros_wireguard.listen_port }} mtu={{ routeros_wireguard.mtu }}
        private-key="{{ routeros_wireguard_private_key }}"
        comment="infra: WireGuard admin" disabled=no
  when: "'infra: WireGuard admin' not in routeros_wireguard_preflight.stdout[0]"
  no_log: true
  tags: [never, apply]

- name: Reconcile the WireGuard admin interface
  community.routeros.command:
    commands:
      - >-
        /interface wireguard set [find where name="{{ routeros_wireguard.name }}"]
        listen-port={{ routeros_wireguard.listen_port }} mtu={{ routeros_wireguard.mtu }}
        private-key="{{ routeros_wireguard_private_key }}"
        comment="infra: WireGuard admin" disabled=no
  changed_when: false
  no_log: true
  tags: [never, apply]

- name: Create the WireGuard admin address when absent
  community.routeros.command:
    commands:
      - >-
        /ip address add address={{ routeros_wireguard.address }}
        interface="{{ routeros_wireguard.name }}"
        comment="infra: WireGuard admin address" disabled=no
  when: "'infra: WireGuard admin address' not in routeros_wireguard_preflight.stdout[2]"
  tags: [never, apply]

- name: Reconcile the WireGuard admin address
  community.routeros.command:
    commands:
      - >-
        /ip address set [find where comment="infra: WireGuard admin address"]
        address={{ routeros_wireguard.address }} interface="{{ routeros_wireguard.name }}"
        disabled=no
  changed_when: false
  tags: [never, apply]

- name: Create the WireGuard WAN endpoint rule when absent
  community.routeros.command:
    commands:
      - >-
        /ip firewall filter add action=accept chain={{ routeros_wireguard.input_chain }}
        protocol=udp dst-port={{ routeros_wireguard.listen_port }}
        in-interface-list={{ routeros_wireguard.wan_interface_list }}
        comment="infra: WireGuard admin endpoint" disabled=no
        place-before=[find where comment="{{ routeros_wireguard.input_final_drop_comment }}"]
  when: "'infra: WireGuard admin endpoint' not in routeros_wireguard_preflight.stdout[3]"
  tags: [never, apply]

- name: Reconcile the WireGuard WAN endpoint rule
  community.routeros.command:
    commands:
      - >-
        /ip firewall filter set [find where comment="infra: WireGuard admin endpoint"]
        action=accept chain={{ routeros_wireguard.input_chain }} protocol=udp
        dst-port={{ routeros_wireguard.listen_port }}
        in-interface-list={{ routeros_wireguard.wan_interface_list }} disabled=no
      - >-
        /ip firewall filter move [find where comment="infra: WireGuard admin endpoint"]
        destination=[find where comment="{{ routeros_wireguard.input_final_drop_comment }}"]
  changed_when: false
  tags: [never, apply]

- name: Create WireGuard admin peers when absent
  community.routeros.command:
    commands:
      - >-
        /interface wireguard peers add interface="{{ routeros_wireguard.name }}"
        public-key="{{ item.public_key }}"
        preshared-key="{{ lookup('ansible.builtin.file', item.preshared_key_file) | trim }}"
        allowed-address={{ item.allowed_address }}
        persistent-keepalive={{ item.persistent_keepalive | default('25s') }}
        comment="infra: WireGuard peer {{ item.name }}" disabled=no
  when: "('infra: WireGuard peer ' ~ item.name) not in routeros_wireguard_preflight.stdout[1]"
  loop: "{{ routeros_wireguard.peers }}"
  loop_control:
    label: "{{ item.name }}"
  no_log: true
  tags: [never, apply]

- name: Reconcile WireGuard admin peers
  community.routeros.command:
    commands:
      - >-
        /interface wireguard peers set
        [find where comment="infra: WireGuard peer {{ item.name }}"]
        interface="{{ routeros_wireguard.name }}" public-key="{{ item.public_key }}"
        preshared-key="{{ lookup('ansible.builtin.file', item.preshared_key_file) | trim }}"
        allowed-address={{ item.allowed_address }}
        persistent-keepalive={{ item.persistent_keepalive | default('25s') }} disabled=no
  loop: "{{ routeros_wireguard.peers }}"
  loop_control:
    label: "{{ item.name }}"
  changed_when: false
  no_log: true
  tags: [never, apply]

- name: Read reconciled WireGuard admin state
  community.routeros.command:
    commands:
      - /interface wireguard print detail without-paging
      - /interface wireguard peers print detail without-paging
      - /ip address print detail without-paging where comment~"WireGuard"
      - /ip firewall filter print detail without-paging where comment~"WireGuard"
  register: routeros_wireguard_postflight
  changed_when: false
  tags: [never, apply]

- name: Prove the WireGuard admin interface, address, and WAN endpoint
  ansible.builtin.assert:
    that:
      - >-
        routeros_wireguard_postflight.stdout[0].count('infra: WireGuard admin') == 1
      - >-
        ('name="' ~ routeros_wireguard.name ~ '"') in
        (routeros_wireguard_postflight.stdout[0] | regex_replace('\\s+', ' '))
      - >-
        ('mtu=' ~ routeros_wireguard.mtu) in
        (routeros_wireguard_postflight.stdout[0] | regex_replace('\\s+', ' '))
      - >-
        ('listen-port=' ~ routeros_wireguard.listen_port) in
        (routeros_wireguard_postflight.stdout[0] | regex_replace('\\s+', ' '))
      - >-
        ('public-key="' ~ routeros_wireguard.public_key ~ '"') in
        (routeros_wireguard_postflight.stdout[0] | regex_replace('\\s+', ' '))
      - >-
        routeros_wireguard_postflight.stdout[2].count('infra: WireGuard admin address') == 1
      - routeros_wireguard.address in routeros_wireguard_postflight.stdout[2]
      - >-
        ('interface=' ~ routeros_wireguard.name) in routeros_wireguard_postflight.stdout[2]
      - >-
        routeros_wireguard_postflight.stdout[3].count('infra: WireGuard admin endpoint') == 1
      - >-
        ('chain=' ~ routeros_wireguard.input_chain) in routeros_wireguard_postflight.stdout[3]
      - >-
        ('dst-port=' ~ routeros_wireguard.listen_port) in routeros_wireguard_postflight.stdout[3]
      - >-
        ('in-interface-list=' ~ routeros_wireguard.wan_interface_list) in
        routeros_wireguard_postflight.stdout[3]
    fail_msg: "The WireGuard interface, address, or WAN endpoint did not reconcile."
  tags: [never, apply]

- name: Prove WireGuard admin peers
  ansible.builtin.assert:
    that:
      - >-
        routeros_wireguard_postflight.stdout[1].count('infra: WireGuard peer ' ~ item.name) == 1
      - >-
        ('interface=' ~ routeros_wireguard.name) in routeros_wireguard_postflight.stdout[1]
      - >-
        ('public-key="' ~ item.public_key ~ '"') in routeros_wireguard_postflight.stdout[1]
      - item.allowed_address in routeros_wireguard_postflight.stdout[1]
      - >-
        ('persistent-keepalive=' ~ (item.persistent_keepalive | default('25s'))) in
        routeros_wireguard_postflight.stdout[1]
    fail_msg: "WireGuard peer {{ item.name }} did not reconcile."
  loop: "{{ routeros_wireguard.peers }}"
  loop_control:
    label: "{{ item.name }}"
  no_log: true
  tags: [never, apply]
