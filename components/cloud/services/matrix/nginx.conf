pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    access_log off;
    client_body_temp_path /tmp/client-body;
    proxy_temp_path /tmp/proxy;
    client_max_body_size 25m;
    # Client-supplied forwarding headers never determine Synapse's source IP.
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_http_version 1.1;
    proxy_read_timeout 180s;
    add_header Strict-Transport-Security "max-age=31536000" always;
    upstream synapse_backend { server matrix-synapse:8008; }
    upstream mas_backend { server matrix-mas:8080; }
    # Decide from the original URI and preserve its escaping upstream. Matrix
    # identifiers can contain escaped characters; normalized nginx locations
    # must not decide which APIs a raw request is allowed to reach.
    map $request_uri $matrix_target {
        default "";
        ~^/_matrix/client/versions(?:\?|$) synapse_backend;
        ~^/_matrix/client/(v3|r0|unstable)/(login|logout|refresh)(?:/|\?|$) mas_backend;
        ~^/_matrix/(media/(r0|v3)|client/v1/media)/(download|thumbnail)/matrix\.fahrican\.com/ synapse_backend;
        ~^/_matrix/(media/(r0|v3)|client/v1/media)/(download|thumbnail)/ deny;
        ~^/_matrix/(media/(r0|v3)|client/v1/media)/(config|upload)(?:/|\?|$) synapse_backend;
        ~^/_matrix/client/(v1|v3|r0|unstable)/ synapse_backend;
    }
    map $request_uri $login_limit_key {
        default "";
        ~^/_matrix/client/(v3|r0|unstable)/(login|logout|refresh)(?:/|\?|$) $binary_remote_addr;
        ~^/(oauth/|upstream/|api/login|ui/v2/login) $binary_remote_addr;
    }
    limit_req_zone $login_limit_key zone=login:10m rate=5r/s;
    map $request_uri $zitadel_login_path {
        default 0;
        ~^/\.well-known/openid-configuration(?:\?|$) 1;
        ~^/(oauth/v2/|oidc/v1/|ui/v2/login(?:/|\?|$)|assets/v1/) 1;
    }
    map $request_uri $ambiguous_path {
        default 0;
        ~*^[^?]*(?:/|%2f)(?:\.|%2e)(?:\.|%2e)?(?:/|%2f|\?|$) 1;
    }
    server {
        listen 8080 default_server;
        server_name matrix.fahrican.com;
        if ($ambiguous_path) { return 404; }
        location = /health { return 200 'ok'; }
        location = /.well-known/matrix/client {
            default_type application/json;
            add_header Access-Control-Allow-Origin '*';
            return 200 '{"m.homeserver":{"base_url":"https://matrix.fahrican.com"}}';
        }
        location / {
            if ($matrix_target = "") { return 404; }
            if ($matrix_target = deny) { return 403; }
            limit_req zone=login burst=20 nodelay;
            proxy_pass http://$matrix_target$request_uri;
        }
    }
    server {
        listen 8080;
        server_name matrix-auth.fahrican.com;
        if ($ambiguous_path) { return 404; }
        location = /health { return 200 'ok'; }
        location ^~ /api/admin/ { return 404; }
        location / {
            limit_req zone=login burst=30 nodelay;
            proxy_pass http://mas_backend;
        }
    }
    server {
        listen 8080;
        server_name chat.fahrican.com;
        root @elementRoot@;
        location = /config.json { alias /run/matrix/element.json; }
        location / { try_files $uri $uri/ /index.html; }
    }
    server {
        listen 8080;
        server_name auth.cloud.fahrican.com;
        if ($ambiguous_path) { return 404; }
        proxy_ssl_server_name on;
        proxy_ssl_name auth.cloud.fahrican.com;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-bundle.crt;
        location / {
            if ($zitadel_login_path = 0) { return 404; }
            limit_req zone=login burst=30 nodelay;
            proxy_pass https://10.21.20.131;
        }
    }
}
