apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tenant-tofu-controller
spec:
  interval: 30m
  timeout: 10m
  releaseName: tenant-tofu-controller
  chart:
    spec:
      chart: ./charts/tofu-controller
      interval: 24h
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: tenant-tofu-controller
  driftDetection:
    mode: enabled
  install:
    crds: Skip
    remediation:
      retries: 3
  upgrade:
    crds: Skip
    remediation:
      retries: 3
  values:
    fullnameOverride: tenant-tofu-controller
    watchAllNamespaces: false
    rbac:
      create: false
    awsPackage:
      install: false
    image:
      repository: ghcr.io/flux-iac/tofu-controller
      tag: v0.16.5@sha256:1d6ee0e34ee56a22827541b1ef44e5a3d65ff21bdb870f79103c4c5d5e6d4cba
    runner:
      image:
        repository: ghcr.io/flux-iac/tf-runner
        tag: v0.16.5@sha256:7209171093907ec1d0559c682949fcee4b625205a6a058c16fe0ce0017af5f41
      serviceAccount:
        allowedNamespaces: []
    resources:
      requests:
        cpu: 50m
        memory: 96Mi
      limits:
        memory: 384Mi
    metrics:
      enabled: true
