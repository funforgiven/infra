# USB 1 Input = Expanded. PCM 0 is Chat; PCM 1 has ten playback channels.
# Mapping: https://github.com/alsa-project/alsa-ucm-conf/pull/742
Comment "RØDECaster Duo USB 1 Expanded"

SectionUseCase."HiFi" {
    Comment "System, Game, Chat and Music"
    Config {
        Include.pcm_split.File "/common/pcm/split.conf"

        Macro.playback.SplitPCM {
            Name "rodecaster_duo_expanded"
            Direction Playback
            Format S32_LE
            Channels 2
            HWChannels 10
        }

        SectionDevice."Speaker" {
            Comment "System"
            Value.PlaybackPriority 1000
            Macro.pcm.SplitPCMDevice {
                Name "rodecaster_duo_expanded"
                Direction Playback
                Device 1
                HWChannels 10
                Channels 2
                Channel0 0
                Channel1 1
                ChannelPos0 FL
                ChannelPos1 FR
            }
        }

        SectionDevice."Line1" {
            Comment "Game"
            Value.PlaybackPriority 900
            Macro.pcm.SplitPCMDevice {
                Name "rodecaster_duo_expanded"
                Direction Playback
                Device 1
                HWChannels 10
                Channels 2
                Channel0 2
                Channel1 3
                ChannelPos0 FL
                ChannelPos1 FR
            }
        }

        SectionDevice."Line2" {
            Comment "Music"
            Value.PlaybackPriority 800
            Macro.pcm.SplitPCMDevice {
                Name "rodecaster_duo_expanded"
                Direction Playback
                Device 1
                HWChannels 10
                Channels 2
                Channel0 4
                Channel1 5
                ChannelPos0 FL
                ChannelPos1 FR
            }
        }

        SectionDevice."Line3" {
            Comment "Chat"
            Value {
                PlaybackPCM "hw:${CardId},0"
                PlaybackChannels 2
                PlaybackPriority 700
            }
        }

        SectionDevice."Mic" {
            Comment "Chat Capture"
            Value {
                CapturePCM "hw:${CardId},0"
                CaptureChannels 2
                CapturePriority 1000
            }
        }

        # Preserve the full capture stream for DAWs; its width depends on USB mode.
        SectionDevice."Line4" {
            Comment "Main Capture"
            Value {
                CapturePCM "hw:${CardId},1"
                CaptureChannels "${var:DuoCaptureChannels}"
                CapturePriority 900
            }
        }
    }
}
