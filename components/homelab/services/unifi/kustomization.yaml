apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Guest files, attached to the VM as a read-only disk and installed on every boot.
configMapGenerator:
  - name: unifi-guest
    namespace: unifi
    options:
      disableNameSuffixHash: true
    files:
      - bootstrap.sh
      - backup.sh
      - health.sh
      - renew-tls.sh
      - inputs.json
      - nftables.conf
