#!/usr/sbin/nft -f
flush ruleset
table inet unifi {
  chain input {
    type filter hook input priority 0; policy drop;
    iifname "lo" accept
    ct state established,related accept
    ip protocol icmp accept
    ip saddr { 10.21.10.20, 10.21.91.0/24 } tcp dport { 22, 11443 } accept
    # Pods reach the origin and exporters only through the cluster-side
    # unifi-origin-clients policy (gateways and monitoring).
    ip saddr { 10.100.0.0/16, 10.21.20.0/24 } tcp dport { 8443, 9100, 9130 } accept
    ip saddr { 10.21.90.6, 10.21.90.7 } tcp dport 8080 accept
    ip saddr { 10.21.90.6, 10.21.90.7 } udp dport 3478 accept
    udp sport 67 udp dport 68 accept
  }
  chain forward { type filter hook forward priority 0; policy drop; }
  chain output { type filter hook output priority 0; policy accept; }
}
