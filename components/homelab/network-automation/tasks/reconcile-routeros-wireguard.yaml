---
- name: Validate the WireGuard admin inventory
  ansible.builtin.assert:
    that:
      - routeros_wireguard.name | length > 0
      - routeros_wireguard.address | length > 0
      - routeros_wireguard.network | length > 0
      - routeros_wireguard.listen_port | int > 0
      - routeros_wireguard.mtu | int >= 1280
      - routeros_wireguard.private_key_file | length > 0
      - routeros_wireguard.public_key | length == 44
      - routeros_wireguard.wan_interface_list | length > 0
      - routeros_wireguard.input_chain | length > 0
      - routeros_wireguard.input_final_drop_comment | length > 0
      - routeros_wireguard.forward_chain | length > 0
      - routeros_wireguard.forward_final_drop_comment | length > 0
      - >-
        routeros_wireguard.peers | map(attribute='public_key') | list | unique |
        length == routeros_wireguard.peers | length
      - >-
        routeros_wireguard.peers | map(attribute='allowed_address') | list |
        unique | length == routeros_wireguard.peers | length
    fail_msg: "The WireGuard interface, firewall, and peers must be complete and unique."
  tags: [always, inventory-contract]

- name: Validate WireGuard admin peers
  ansible.builtin.assert:
    that:
      - item.name | length > 0
      - item.public_key | length == 44
      - item.allowed_address | length > 0
      - item.preshared_key_file | length > 0
  loop: "{{ routeros_wireguard.peers }}"
  loop_control:
    label: "{{ item.name | default('unnamed') }}"
  tags: [always, inventory-contract]

- name: Read current WireGuard admin state
  community.routeros.command:
    commands:
      - /interface wireguard print detail without-paging
      - /interface wireguard peers print detail without-paging
      - /ip address print detail without-paging where comment~"WireGuard"
      - /ip firewall filter print detail without-paging where comment~"WireGuard"
  register: routeros_wireguard_preflight
  changed_when: false
  no_log: true
  tags: [always]

- name: Show the WireGuard preflight without credentials
  ansible.builtin.debug:
    msg: "WireGuard state read; credential-bearing interface and peer fields are suppressed."
  tags: [always]

- name: Load the WireGuard server private key
  ansible.builtin.set_fact:
    routeros_wireguard_private_key: >-
      {{ lookup('ansible.builtin.file', routeros_wireguard.private_key_file) | trim }}
  no_log: true
  tags: [never, apply]

- name: Validate the WireGuard server private key
  ansible.builtin.assert:
    that:
      - routeros_wireguard_private_key is match('^[A-Za-z0-9+/]{43}=$')
  no_log: true
  tags: [never, apply]

- name: Validate WireGuard admin peer preshared keys
  ansible.builtin.assert:
    that:
      - >-
        lookup('ansible.builtin.file', item.preshared_key_file) | trim is
        match('^[A-Za-z0-9+/]{43}=$')
  loop: "{{ routeros_wireguard.peers }}"
  no_log: true
  tags: [never, apply]

# Each mutation prints its row before and after the script so the task reports
# a change only when RouterOS state differs. The printed rows carry keys, so
# these tasks stay no_log.
- name: Reconcile the WireGuard admin interface
  community.routeros.command:
    commands:
      - &wireguard_interface >-
        /interface wireguard print detail without-paging where
        name="{{ routeros_wireguard.name }}"
      - >-
        :local row [/interface wireguard find where
        name="{{ routeros_wireguard.name }}"];
        :if ([:len $row] > 1) do={ :error "duplicate WireGuard admin interface" };
        :if ([:len $row] = 0) do={
        /interface wireguard add name="{{ routeros_wireguard.name }}"
        listen-port={{ routeros_wireguard.listen_port }} mtu={{ routeros_wireguard.mtu }}
        private-key="{{ routeros_wireguard_private_key }}"
        comment="infra: WireGuard admin" disabled=no } else={
        /interface wireguard set $row
        listen-port={{ routeros_wireguard.listen_port }} mtu={{ routeros_wireguard.mtu }}
        private-key="{{ routeros_wireguard_private_key }}"
        comment="infra: WireGuard admin" disabled=no };
        :put ("__infra_" . "ok__")
      - *wireguard_interface
    wait_for: &wireguard_completed
      - result[1] contains "__infra_ok__"
    retries: 1
  register: routeros_wireguard_result
  changed_when: &wireguard_changed >-
    routeros_wireguard_result.stdout[0] != routeros_wireguard_result.stdout[2]
  no_log: true
  tags: [never, apply]

- name: Reconcile the WireGuard admin address
  community.routeros.command:
    commands:
      - &wireguard_address >-
        /ip address print detail without-paging where
        comment="infra: WireGuard admin address"
      - >-
        :local row [/ip address find where
        comment="infra: WireGuard admin address"];
        :if ([:len $row] > 1) do={ :error "duplicate WireGuard admin address" };
        :if ([:len $row] = 0) do={
        /ip address add address={{ routeros_wireguard.address }}
        interface="{{ routeros_wireguard.name }}"
        comment="infra: WireGuard admin address" disabled=no } else={
        /ip address set $row address={{ routeros_wireguard.address }}
        interface="{{ routeros_wireguard.name }}" disabled=no };
        :put ("__infra_" . "ok__")
      - *wireguard_address
    wait_for: *wireguard_completed
    retries: 1
  register: routeros_wireguard_result
  changed_when: *wireguard_changed
  tags: [never, apply]

- name: Reconcile the WireGuard WAN endpoint rule
  community.routeros.command:
    commands:
      - &wireguard_endpoint >-
        /ip firewall filter print detail without-paging where
        comment="infra: WireGuard admin endpoint"
      - >-
        :local drop [/ip firewall filter find where
        comment="{{ routeros_wireguard.input_final_drop_comment }}"];
        :if ([:len $drop] != 1) do={ :error "input final drop missing" };
        :local row [/ip firewall filter find where
        comment="infra: WireGuard admin endpoint"];
        :if ([:len $row] > 1) do={ :error "duplicate WireGuard endpoint rule" };
        :if ([:len $row] = 0) do={
        /ip firewall filter add action=accept chain={{ routeros_wireguard.input_chain }}
        protocol=udp dst-port={{ routeros_wireguard.listen_port }}
        in-interface-list={{ routeros_wireguard.wan_interface_list }}
        comment="infra: WireGuard admin endpoint" disabled=no
        place-before=$drop } else={
        /ip firewall filter set $row
        action=accept chain={{ routeros_wireguard.input_chain }} protocol=udp
        dst-port={{ routeros_wireguard.listen_port }}
        in-interface-list={{ routeros_wireguard.wan_interface_list }} disabled=no };
        /ip firewall filter move [find where comment="infra: WireGuard admin endpoint"]
        destination=$drop; :put ("__infra_" . "ok__")
      - *wireguard_endpoint
    wait_for: *wireguard_completed
    retries: 1
  register: routeros_wireguard_result
  changed_when: *wireguard_changed
  tags: [never, apply]

# Handshake and traffic counters change on their own, so compare only the
# configured peer properties.
- name: Reconcile WireGuard admin peers
  community.routeros.command:
    commands:
      - &wireguard_peer >-
        /interface wireguard peers print detail without-paging
        proplist=comment,interface,public-key,preshared-key,allowed-address,persistent-keepalive,disabled
        where comment="infra: WireGuard peer {{ item.name }}"
      - >-
        :local row [/interface wireguard peers find where
        comment="infra: WireGuard peer {{ item.name }}"];
        :if ([:len $row] > 1) do={ :error "duplicate WireGuard peer" };
        :if ([:len $row] = 0) do={
        /interface wireguard peers add interface="{{ routeros_wireguard.name }}"
        public-key="{{ item.public_key }}"
        preshared-key="{{ lookup('ansible.builtin.file', item.preshared_key_file) | trim }}"
        allowed-address={{ item.allowed_address }}
        persistent-keepalive={{ item.persistent_keepalive | default('25s') }}
        comment="infra: WireGuard peer {{ item.name }}" disabled=no } else={
        /interface wireguard peers set $row
        interface="{{ routeros_wireguard.name }}" public-key="{{ item.public_key }}"
        preshared-key="{{ lookup('ansible.builtin.file', item.preshared_key_file) | trim }}"
        allowed-address={{ item.allowed_address }}
        persistent-keepalive={{ item.persistent_keepalive | default('25s') }}
        disabled=no }; :put ("__infra_" . "ok__")
      - *wireguard_peer
    wait_for: *wireguard_completed
    retries: 1
  loop: "{{ routeros_wireguard.peers }}"
  loop_control:
    label: "{{ item.name }}"
  register: routeros_wireguard_result
  changed_when: *wireguard_changed
  no_log: true
  tags: [never, apply]

# The mail relay is reachable from the homelab but must never open connections
# into it, so its new connections are dropped ahead of every other rule.
- name: Isolate backend peers from initiating router or homelab connections
  community.routeros.command:
    commands:
      - &wireguard_isolation >-
        /ip firewall filter print detail without-paging where
        comment~"^infra: isolate WireGuard {{ item.name }} "
      - >-
        :foreach chain in={"{{ routeros_wireguard.input_chain }}";"{{ routeros_wireguard.forward_chain }}"} do={
        :local comment ("infra: isolate WireGuard {{ item.name }} " . $chain);
        :local row [/ip firewall filter find where comment=$comment];
        :if ([:len $row] > 1) do={ :error "duplicate WireGuard isolation rule" };
        :if ([:len $row] = 0) do={
        /ip firewall filter add chain=$chain action=drop
        in-interface="{{ routeros_wireguard.name }}" src-address={{ item.allowed_address }}
        connection-state=new comment=$comment disabled=no place-before=0
        } else={
        /ip firewall filter set $row chain=$chain action=drop
        in-interface="{{ routeros_wireguard.name }}" src-address={{ item.allowed_address }}
        connection-state=new disabled=no;
        /ip firewall filter move $row destination=0 } };
        :put ("__infra_" . "ok__")
      - *wireguard_isolation
    wait_for: *wireguard_completed
    retries: 1
  loop: "{{ routeros_wireguard.peers | selectattr('isolated_backend', 'defined') | selectattr('isolated_backend') | list }}"
  loop_control:
    label: "{{ item.name }}"
  register: routeros_wireguard_result
  changed_when: *wireguard_changed
  tags: [never, apply]
