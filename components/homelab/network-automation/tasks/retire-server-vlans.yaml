---
- name: Require verified independent exports before legacy network retirement
  ansible.builtin.assert:
    that:
      - migration_exports_verified | default(false) | bool
    fail_msg: >-
      Legacy retirement requires the final independent data exports and
      source recovery archives described in docs/migration/DATA-MIGRATION.md.
      Run this separate phase only after verifying those exports.

- name: Retire only the exact inventoried legacy bridge VLAN rows
  community.routeros.command:
    commands:
      - >-
        :local rows [/interface bridge vlan find where
        bridge="{{ crs_cloud_fabric.bridge }}" and vlan-ids={{ item.id }}];
        :local owned [/interface bridge vlan find where
        bridge="{{ crs_cloud_fabric.bridge }}" and vlan-ids={{ item.id }} and
        comment="{{ item.comment }}"];
        :if (([:len $rows] > 1) or ([:len $rows] != [:len $owned])) do={
        :error "legacy VLAN identity does not match the captured inventory" };
        :if ([:len $owned] = 1) do={ /interface bridge vlan remove $owned };
        :if ([:len [/interface bridge vlan find where
        bridge="{{ crs_cloud_fabric.bridge }}" and vlan-ids={{ item.id }}]] != 0)
        do={ :error "legacy VLAN remains" }; :put "__infra_legacy_vlan_retired__"
    wait_for:
      - result[0] contains "__infra_legacy_vlan_retired__"
    retries: 1
  loop: "{{ crs_cloud_fabric.retired_bridge_vlans }}"
  loop_control:
    label: "VLAN {{ item.id }}"
