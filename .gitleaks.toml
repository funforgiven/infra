[extend]
useDefault = true

[[allowlists]]
description = "ZITADEL password lifetime is a non-secret duration policy"
paths = ['''components/cloud/identity/tofu/main\.tf''']
regexTarget = "line"
regexes = ['''password_check_lifetime\s*=\s*"[0-9]+h[0-9]+m[0-9]+s"''']

[[allowlists]]
description = "Nix verified-fetches requires the repository's public SSH signing key"
paths = ['''components/cloud/services/mail-aws/tofu/user-data\.sh\.tftpl''']
regexTarget = "line"
regexes = ['''key\s*=\s*"AAAAC3NzaC1lZDI1NTE5AAAAI[A-Za-z0-9+/]+"''']

[[rules]]
id = "backblaze-application-key-assignment"
description = "Backblaze B2 application key assigned as plaintext"
regex = '''(?i)(?:B2_(?:MASTER_)?APPLICATION_KEY|AWS_SECRET_ACCESS_KEY)\s*[:=]\s*["']?([A-Za-z0-9]{20,})'''
secretGroup = 1
keywords = ["b2_application_key", "aws_secret_access_key"]

[[rules]]
id = "generated-service-secret-assignment"
description = "Locally generated service secret assigned as plaintext"
regex = '''(?i)(?:STALWART_ADMIN_SECRET|ND_PASSWORDENCRYPTIONKEY|SFTPGO_(?:ADMIN|USER)_PASSWORD|BACKUP_RESTIC_PASSWORD)\s*[:=]\s*["']?([A-Za-z0-9]{32,})'''
secretGroup = 1
keywords = ["stalwart_admin_secret", "passwordencryptionkey", "backup_restic_password"]
